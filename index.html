hora de la ingesta (inicio y fin si fueron varias tomas), dosis total máxima posible, peso**, factores de riesgo, coingestas, carbón ya administrado.", "Analítica: glucosa, perfil hepático, función renal, iones, hemograma, coagulación (INR), gasometría, lactato, fósforo. Cada 6–12 h si está en tratamiento.", "Paracetamolemia ≥4 h tras la ingesta (antes de las 4 h puede engañar). – Toma única con hora conocida (4–24 h): nomograma de Rumack-Matthew. – Línea 150 (sin factores de riesgo): 4 h >150; 6 h >100; 8 h >75; 10 h >52; 12 h >38; 16 h >19; 20 h >9; 24 h >4,5 µg/mL. – Línea 100 (con factores de riesgo): 4 h >100; 6 h >70; 8 h >50; 12 h >26; 16 h >14; 24 h >3,5. – Hora desconocida o tomas repetidas: 2 niveles separados ≥2 h → semivida. Si T0/T2h >1,4, la t½ es <4 h (bajo riesgo). Si es ≤1,4, la t½ es >4 h → NAC. – Nivel por debajo de la línea con coingesta de opioides o anticolinérgicos, o en el anciano: repetirlo a las 4 h."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Carbón activado"}, {"type": "list", "items": ["50 g v.o. (niño: 1 g/kg) si han pasado <2 h. Hasta 6 h si es de liberación retardada o hay coingesta de opioides o anticolinérgicos."]}, {"type": "h", "text": "NAC inmediata, sin esperar los niveles"}, {"type": "list", "items": ["Indicaciones: – Ingesta ≥125 mg/kg (≥100 mg/kg con factores de riesgo). – Paracetamol IV >60 mg/kg. – Anamnesis poco fiable. – Dosis tóxica con >6 h de evolución, o nivel no disponible antes de las 8 h. – Nivel por encima de la línea, o cerca de ella con coingesta que enlentece el vaciado gástrico. – t½ >4 h. – Citólisis sin otra causa, clínica de toxicidad o diagnóstico tardío (fase 3).", "Si hay dudas, dar NAC (y retirarla si después no hace falta)."]}, {"type": "h", "text": "Pauta SNAP de 12 h (Hidonac antídoto®)"}, {"type": "list", "items": ["Bolsa 1: 100 mg/kg en 500 mL de SG 5 % en 2 h.", "Bolsa 2: 200 mg/kg en 500 mL de SG 5 % en 10 h.", "Analítica 2 h antes de terminar la bolsa 2. Suspender si se cumple TODO: – INR ≤1,3. Un INR alargado de forma aislada, sin subida de ALT, se debe a la NAC. – Paracetamol <10 µg/mL. – ALT normal y menor del doble de la del ingreso. – Asintomático.", "Si no se cumple: otra bolsa de 200 mg/kg en 10 h y repetir los controles. Si tampoco, otra más y comentar con Hepatología.", "No suspenderla por un 2.º nivel bajo la línea ni por la caída del TP atribuida a la NAC.", "Reacción anafilactoide: parar, dexclorfeniramina 5 mg IV (± corticoide) y reanudar a los 15–30 min más despacio. Más frecuente en atópicos y asmáticos."]}, {"type": "h", "text": "Soporte"}, {"type": "list", "items": ["Hidratación IV, vitamina K 10 mg IV en dosis única. Tratar la hipoglucemia, la encefalopatía y el edema cerebral.", "Psiquiatría (la mayoría son voluntarias)."]}, {"type": "h", "text": "Hemodiálisis (complementaria a la NAC; avisar a Nefrología)"}, {"type": "list", "items": ["Nivel >1.000 µg/mL sin poder dar NAC.", "Alteración de la conciencia + acidosis láctica con nivel >700 µg/mL sin NAC, o >900 µg/mL aunque se dé NAC.", "Durante la HD, doblar el ritmo de la NAC."]}, {"type": "h", "text": "Trasplante (King's College; valoración por Digestivo)"}, {"type": "list", "items": ["pH <7,30 (criterio mayor).", "Creatinina >3,4 mg/dL, encefalopatía III–IV, INR >6,5.", "Lactato >3,5 a las 4 h de la sueroterapia (o >3 a las 12 h).", "Fosfato >1,2 mmol/L a las 48–96 h."]}, {"type": "h", "text": "Situaciones especiales"}, {"type": "list", "items": ["Embarazo: pauta completa.", "<12 años: 5 veces menos hepatotoxicidad."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Errata del protocolo: en la tabla del nomograma (línea 150), a las 14 h el umbral es ≈27 µg/mL, no 37.", "King's College: el criterio no es \"cualquiera\". Es pH <7,30 sola, o los tres juntos (INR >6,5 + creatinina >3,4 + encefalopatía III–IV). El lactato y el fósforo son criterios añadidos (modificados).", "Consenso de EE. UU. y Canadá 2023 (Dart et al., JAMA Netw Open):", "Una sola línea de tratamiento (150) para todos, sin \"línea de alto riesgo\".", "El Reino Unido (MHRA 2012) usa la línea 100 para todos.", "Ingesta masiva (nivel ≥300 µg/mL a las 4 h, o ≥ el doble de la línea):", "Aumentar la dosis de NAC (p. ej., doblar la bolsa de mantenimiento).", "Valorar fomepizol (inhibe el CYP2E1) en ingestas muy masivas o con acidosis o coma precoces.", "Carbón activado hasta 4 h o más en ingestas grandes.", "NAC si se desconoce la hora o hay dosis repetidas y la ALT está alta o el nivel es >20 µg/mL (consenso de 2023)."]}]}], "sources": "Dart RC et al. Management of Acetaminophen Poisoning in the US and Canada: A Consensus Statement (JAMA Netw Open 2023); Bateman DN et al. SNAP trial (Lancet 2014); Gosselin S et al. EXTRIP acetaminophen (Clin Toxicol 2014); O'Grady JG et al. King's College criteria (Gastroenterology 1989).", "cats": ["tox"], "vital": true}, {"title": "Intoxicación por setas (micetismos)", "page": 113, "protocol": "MICETISMES", "service": "Enverinament per bolets, SoCMUETox", "date": "rev. mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Clave: la latencia entre la ingesta y los síntomas. – <6 h (75 %, leve): gastrointestinal, neurológico, muscarínico, *disulfiram-like*, alucinógeno, hemolítico. – >6 h (graves, potencialmente mortales): hepatotóxico (amatoxinas, 6–24 h), convulsivo (giromitra), nefrotóxico (cortinarius, días), rabdomiolítico.", "Errores típicos: ingesta de varias especies (la latencia corta enmascara la larga), o dos comidas con setas (el paciente solo refiere la última).", "Anamnesis: dónde se recogieron, especie, restos, cantidad, hora, número de comidas, otros comensales con síntomas."]}, {"type": "h", "text": "Latencia corta (<6 h)"}, {"type": "list", "items": ["Gastrointestinal (*Entoloma*, *Tricholoma pardinum*, *Omphalotus*, *Boletus satanas*): vómitos y diarrea autolimitados en 24 h.", "Neurológico o isoxazólico (*A. muscaria*, *A. pantherina*): parece una borrachera, con alucinaciones, agitación, midriasis y taquicardia; luego somnolencia.", "Muscarínico (*Clitocybe*, *Inocybe*): sialorrea, broncorrea, sudoración, miosis, bradicardia, hipotensión.", "*Disulfiram-like* (*Coprinus*): rubor, cefalea e hipotensión al beber alcohol en los 5 días siguientes a comer la seta.", "Alucinógeno (*Psilocybe*): alucinaciones, pánico.", "Hemolítico-urémico (*Paxillus*): hemólisis inmune + IRA."]}, {"type": "h", "text": "Latencia larga (>6 h)"}, {"type": "list", "items": ["Hepatotóxico (*A. phalloides*, *A. verna*, *A. virosa*, *Galerina*, *Lepiota*): 90 % de las muertes. Evoluciona en fases: – Latencia de 6–12 h sin síntomas. – Fase coleriforme (6–24 h): diarrea profusa, vómitos, deshidratación. Hígado todavía normal. – Mejoría aparente (24–36 h). – Fallo hepático (>36 h): transaminasas >1.000, caída del TP, encefalopatía, SHR.", "Convulsivo (*Gyromitra*, primavera, se confunde con la colmenilla): latencia de 5–8 h. Convulsiones, hemólisis, metahemoglobinemia.", "Orellánico (*Cortinarius*): IRA a los 7–8 días (nefritis tubulointersticial).", "Rabdomiolítico (*Tricholoma equestre*): tras ingestas repetidas; mialgias, CK alta, miocarditis."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Amatoxinas si la latencia es >6 h, si hay varias especies o si hay dudas en la identificación.", "Gastroenteritis por otra causa, otros comensales afectados."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemograma, glucosa, iones, perfil hepático, coagulación (TP), función renal, gasometría, láctico, amonio, LDH, lipasa, tira de orina.", "Si se confirma la intoxicación hepatotóxica: repetir cada 12 h.", "Amatoxinas en orina: Laboratorio de Toxicología del Hospital Clínic (llamar antes). Pierden fiabilidad pasadas 48 h. Positivas → tratar siempre. No hace falta repetirlas.", "Pronóstico por amatoxinas en orina (<24 h): 3–15 ng/mL moderada, 15–50 grave, >50 potencialmente mortal.", "Micólogo con los restos, sin retrasar el tratamiento.", "CK (rabdomiólisis), metahemoglobina (giromitra), Coombs (*Paxillus*)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Latencia corta"}, {"type": "list", "items": ["Soporte (antiemético, hidratación). Carbón activado 25 g en dosis única si han pasado <2 h (no en el gastrointestinal puro ni en el *disulfiram-like*).", "Neurológico o alucinógeno: BZD. No usar fisostigmina.", "Muscarínico: atropina 1–2 mg IV. Doblar la dosis cada 5–10 min (máximo 20 mg/h) o perfusión de 0,02–0,05 mg/kg/h hasta secar las secreciones.", "*Disulfiram-like fluidos (vasoactivos si hace falta) y valorar betabloqueantes si hay taquicardia. Fomepizol si hay shock refractario. Sin alcohol ≥3 días.**", "Hemolítico: fluidos, prednisona 1–1,5 mg/kg y valorar la hemodiafiltración."]}, {"type": "h", "text": "Síndrome hepatotóxico (amatoxinas)"}, {"type": "list", "items": ["Iniciar el tratamiento sin esperar la confirmación si hay síntomas y alta sospecha (si está asintomático, se puede esperar a las amatoxinas). Ingreso en semicríticos o UCI. Suspender al 3.er día si no hay hepatotoxicidad.", "Soporte: cristaloides IV (4–6 L en la fase inicial), corregir la hipoglucemia y el K. Bicarbonato si pH <7,20. Vitamina K 20 mg/24 h IV, omeprazol 40 mg/24 h IV. Lactulosa si hay encefalopatía.", "Descontaminación: – SNG o, mejor, nasoduodenal con aspiración intermitente (cortar la circulación enterohepática). – Carbón activado 50 g → aspirar a las 2 h → 25 g cada 3 h, hasta 72 h (incluso en asintomáticos). – Ondansetrón 0,15 mg/kg si hay vómitos. Sulfato sódico como catártico solo si no tiene diarrea. – Contraindicaciones: íleo, obstrucción, perforación, o bajo nivel de conciencia sin vía aérea protegida.", "Silibinina: 5 mg/kg IV en 2 h cada 6 h × 6 días (≈20 mg/kg/día) o hasta la mejoría. Si no hay en el hospital, préstamo en www.redantidotos.org. No asociar penicilina G.", "N-acetilcisteína (si se confirma y hay hepatotoxicidad): 150 mg/kg en 1 h → 50 mg/kg en 4 h → 100 mg/kg en 16 h, y después 150 mg/kg/24 h. Hace bajar el TP un 10–20 % sin significado clínico.", "Valorar cimetidina 300 mg/8 h IV y vitamina C 3 g/24 h IV.", "Diuresis forzada neutra hasta 72–96 h una vez normalizada la volemia (p. ej., SG 5 % 500 mL + 10 mEq de KCl cada 4 h + SF 500 mL + 10 mEq de KCl cada 8 h).", "Trasplante hepático: – Contactar con un centro trasplantador si no mejora el 4.º día, o antes según los criterios. – Clichy: encefalopatía III–IV con factor V <20 % (<30 años) o <30 % (>30 años). – Escudié: latencia <8 h + TP <10 %. – Ganzert: TP <25 % + creatinina >106 µmol/L.", "Mal pronóstico: creatinina >1,2 al ingreso, amatoxinas >50 ng/mL, TP <30 % a las 48 h, bilirrubina >5 a partir de las 72 h."]}, {"type": "h", "text": "Otros síndromes de latencia larga"}, {"type": "list", "items": ["Convulsivo (giromitra): BZD + piridoxina 1.500 mg IV en 15 min y luego 3.500 mg en 1 h. – Metahemoglobina >20 % o sintomática: azul de metileno 1 mg/kg en 15 min, repetible a los 30–60 min (máximo 7 mg/h). – Déficit de G6PD: vitamina C 1 g/h × 8 h. – Carbón activado en dosis única si han pasado <2 h.", "Orellánico: soporte. Avisar a Nefrología (hemodiálisis si hay edemas refractarios, K >6,5, pH <7,10 o uremia).", "Rabdomiolítico: SF 20–40 mL/kg/h hasta una diuresis >4 mL/kg/h (sin alcalinizar y sin manitol). ECG seriados. Valorar hemodiafiltración."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Silibinina (Legalon SIL®): pauta del fabricante y de la mayoría de centros: bolo de 5 mg/kg en 1 h y luego 20 mg/kg/día en perfusión continua. La dosis total coincide con la del protocolo.", "Evidencia baja: no hay ensayos clínicos. Los análisis retrospectivos (Garcia J 2015, Ye 2018) apoyan silibinina + NAC + carbón activado multidosis y la remisión precoz para trasplante.", "Criterios del King's College (paracetamol o no paracetamol) también en uso. En Europa, Clichy para las amatoxinas.", "Ensayos con policlonal de anticuerpos o rifampicina: experimentales."]}]}], "sources": "Garcia J et al. Amanita phalloides poisoning: mechanisms of toxicity and treatment (Food Chem Toxicol 2015); Escoda O et al. Urinary amatoxin as prognostic marker (Clin Toxicol 2019/2021); Diaz JH. Amatoxin-containing mushroom poisonings (Wilderness Environ Med 2018).", "cats": ["tox"], "vital": false}, {"title": "Isquemia mesentérica aguda (IMA) – Código AMI", "page": 115, "protocol": "GUIA CLÍNICA ISQUÈMIA MESENTÈRICA AGUDA", "service": "Cirugía General y Vascular", "date": "v3, jun 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Dolor abdominal desproporcionado a la exploración (EVA >8) con el abdomen blando al principio, en un paciente con FA, cardiopatía o enfermedad vascular. Primera causa de abdomen agudo en >75 años (10 % en >70 años).", "Tipos: – Embolia de la AMS (≈25 %): inicio brusco. Dolor + diarrea o urgencia defecatoria + fuente embolígena (FA, IAM, endocarditis, cardioversión o cateterismo reciente). – Trombosis arterial (15–25 %): angina intestinal previa (dolor posprandial, pérdida de peso, sitofobia), aterosclerosis. Subaguda. – Trombosis venosa (5–10 %, más jóvenes): insidiosa, durante días o semanas. ETV previa, trombofilia, ACO o estrógenos, neoplasia, cirrosis o HTP, pancreatitis, EII. – NOMI (20 %; mortalidad del 70–90 %): paciente crítico con vasopresores, bajo gasto, hemodiálisis (hipotensiones), cirugía cardiaca. Distensión o HDB sin dolor (sedado).", "Fases de la embolia: – 1: dolor brusco (todavía reversible). – 2: calma engañosa. – 3: peritonitis (irreversible)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["No esperar a la analítica: la radiografía simple no sirve y un lactato normal no descarta (sube tarde, con mortalidad >75 %).", "Dímero D normal → casi excluye (alto VPN). Leucocitosis >15.000 frecuente.", "Diagnóstico diferencial: pancreatitis, perforación, obstrucción, disección o rotura de aorta, cólico biliar o renal."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Código AMI (lo activa el cirujano de guardia). Antes de mover al paciente: – ≥2 vías periféricas, sonda vesical, SNG 18 Ch si hay distensión o vómitos, protocolo 0. – Analítica: creatinina, urea, iones, lactato, CK, lipasa, bilirrubina, AST, ALT, FA, PCT, dímero D, hemograma y coagulación. – Traslado monitorizado.", "Angio-TC trifásico (basal, arterial y venosa) INMEDIATO (S y E del 92–100 %), sin esperar la analítica ni la función renal. – Busca de Radiología: 25910 (de 8 a 15 h) / 25413 (de 15 a 8 h y fines de semana). – Cirugía y Radiología valoran las imágenes en tiempo real y después Cirugía Vascular.", "Alergia al contraste: hidrocortisona 150 mg + dexclorfeniramina (Polaramine®) 5 mg IV (5–10 min cada uno) antes del TC. Avisar a Reanimación (25611)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales"}, {"type": "list", "items": ["Objetivo: arteria mesentérica permeable en <2 h desde el diagnóstico (con 10 h de demora la mortalidad ya es del 50 %).", "Fluidos guiados por objetivos, corregir la acidosis. Sonda vesical (diuresis horaria). Avisar a UCI o Anestesia.", "Evitar los vasopresores (reducen el flujo esplácnico) hasta haber repuesto la volemia y controlado la FA. Evitar la digoxina. Evitar la vasopresina. Alternativas: dobutamina o dopamina a dosis bajas.", "SNG si hay distensión.", "ATB precoz (mientras dure el shock o la PCR >10 mg/dL o los leucocitos >12.000): – Estable: ceftriaxona (el protocolo pone 1 g/12 h) + metronidazol 500 mg/8 h IV. Alergia: ciprofloxacino 400 mg/12 h + metronidazol. – Inestable o con riesgo de multirresistentes: meropenem 2 g/8 h + linezolid 600 mg/12 h.", "Anticoagulación: perfusión de HNF al terminar la revascularización (objetivo TTPa ×1,5–2,5, control cada 6 h), incluso si es quirúrgico."]}, {"type": "h", "text": "Según la etiología"}, {"type": "list", "items": ["Embolia: embolectomía quirúrgica (Fogarty) + resección del intestino no viable (control de daños), **abdomen abierto y *second-look* a las 48 h**.", "Trombosis arterial: endovascular (angioplastia y stent, trombectomía, fibrinólisis) si está estable y sin infarto intestinal. Si no, bypass o cirugía híbrida. Laparotomía si persisten los signos de isquemia.", "Trombosis venosa: – Anticoagulación (HBPM terapéutica; HNF si se opera o está inestable) → ACO 3–6 meses (indefinida si hay trombofilia). – Sin cirugía si no hay peritonismo ni afectación intestinal en el TC (1/3 acabará operándose).", "NOMI: tratar la causa, reducir los vasoactivos. Vasodilatador intraarterial en la AMS (papaverina, NTG, glucagón o nimodipino) o alprostadil IV. Laparotomía si hay peritonismo."]}, {"type": "h", "text": "Elección de la estrategia"}, {"type": "list", "items": ["Peritonismo o isquemia avanzada: laparotomía urgente (no laparoscopia).", "Estable, sin isquemia establecida y con buena colateralidad: HNF y vigilancia.", "Estable sin colaterales: endovascular primero.", "Isquemia extensa o gran comorbilidad: paliativo."]}, {"type": "h", "text": "Después de la fase aguda"}, {"type": "list", "items": ["Trombosis arterial: AAS 100 mg o clopidogrel 75 mg de por vida.", "Embolia o trombosis venosa con trombofilia: anticoagulación indefinida."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Reanimación o UCI tras la cirugía o el procedimiento endovascular (complicaciones >70 %: neumonía, IRA, sepsis, íleo).", "Si no hay quirófano ni sala inmediatos: Reanimación o UCI para optimizar.", "Teléfonos: coordinador de quirófano 25412; enfermería de quirófano 25233; Radiología Vascular Intervencionista 25871; UCI 25401."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Heparina en el momento del diagnóstico: ESVS 2017 y WSES 2022 recomiendan HNF IV en cuanto se diagnostica (salvo contraindicación), antes de la revascularización. El protocolo la inicia al terminar.", "Ceftriaxona: la dosis habitual en la infección intraabdominal es 2 g/24 h (o 1 g/12 h). Comprobar la pauta.", "Endovascular primero (*endovascular-first*) en la trombosis arteria los metaanálisis (2022–2024) muestran menos mortalidad y menos resección intestinal**, con laparotomía de revisión según la clínica.", "Quirófano híbrido (revascularización + exploración en el mismo acto): recomendado si está disponible (ESVS).", "Biomarcadores: I-FABP y D-lactato siguen sin validación para uso clínico."]}]}], "sources": "Björck M et al. ESVS 2017 Clinical Practice Guidelines on the Management of the Diseases of Mesenteric Arteries and Veins (Eur J Vasc Endovasc Surg 2017); Bala M et al. WSES Acute mesenteric ischemia: updated guidelines (World J Emerg Surg 2022); Tolonen M et al. Overall mortality and endovascular-first approach (Scand J Surg 2021).", "cats": ["dig"], "vital": true}, {"title": "Liquen plano oral (LPO)", "page": 117, "protocol": "GUIA CLÍNICA LIQUEN PLA ORAL", "service": "Dermatología", "date": "v2, ene 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Formas: – Reticular o en placa: estrías blancas de Wickham, asintomáticas. – Eritematosa o atrófica: incluye la gingivitis descamativa. – Erosiva o ulcerada: dolorosa, crónica, con brotes.", "Más frecuente en la mujer de 50–60 años. En el 15 % hay lesiones cutáneas asociadas. Valorar la afectación genital o esofágica.", "Desencadenantes de brote: traumatismo (Koebner), prótesis, tabaco, placa dental, estrés.", "Lesión precancerosa (OMS): riesgo de carcinoma escamoso, sobre todo en las formas erosiva y atrófica."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Reacción liquenoide por fármacos o por inmunoterapia (anti-PD-1), alergia de contacto a las amalgamas o los metales.", "Pénfigo vulgar o paraneoplásico y penfigoide de mucosas (en las formas erosivas extensas), EICH.", "VHC (y VHB). Candidiasis sobreañadida.", "Carcinoma: biopsiar toda lesión que cambie, se indure o no cicatrice."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Biopsia con punch de 4 mm: 2 muestras (histología + inmunofluorescencia directa).", "Analítica: VSG, hemograma, bioquímica, ferritina, fólico, B12, serologías de VHC y VHB, TSH y T4L, proteinograma, ANA, antitiroideos, FR. – Formas erosivas extensas: antidesmogleína 1 y 3, anti-BP180 y anti-BP230 + seroteca (IFI o Western blot).", "Frotis para cultivo de levaduras en la primera visita y si se sospecha *Candida*.", "Pruebas epicutáneas (batería estándar, dental y de metales) si lleva amalgamas o prótesis.", "Gravedad: *Oral Disease Severity Score* (17 sublocalizaciones, máximo 72) + EVA del dolor."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales"}, {"type": "list", "items": ["Higiene dental suave, revisiones dentales y ajuste de las prótesis. Evitar el tabaco y los irritantes.", "Cambiar las amalgamas si se demuestra la relación y no hay respuesta. Retirar el fármaco sospechoso.", "Candidiasis: miconazol gel 2 % o nistatina solución 3 veces al día tras las comidas durante 7–15 días (hasta 48 h después de resolverse). Sin profilaxis."]}, {"type": "h", "text": "Escalones"}, {"type": "list", "items": ["1. No erosivo o erosivo: – Corticoide tópico de potencia alta o muy alta, 2–3 veces al día: clobetasol 0,05 %, triamcinolona 0,1 % en orabase, fluocinolona 0,1 % o betametasona 0,1 % en enjuague. – O infiltración intralesional.", "2. Si no responde: añadir tacrolimus 0,1 % o pimecrolimus 1 % tópicos (más eficaces para prevenir recaídas) y/o retinoide tópico.", "3. Erosivo refractario (sistémico): – Prednisona 0,5 mg/kg/día en tanda corta. – Ahorradores de corticoide: acitretina o alitretinoína 30 mg/día, hidroxicloroquina, metotrexato semanal (mejor con corticoide tópico). – Tercera línea: azatioprina, micofenolato o ciclosporina. Uso compasivo de apremilast, anti-TNF, anti-IL-17 o IL-23, o inhibidores de JAK. – Alternativas: terapia fotodinámica o láser de baja potencia."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Seguimiento por Dermatología cada 4–6 meses (antes si hay brote), por el riesgo de malignización.", "Desde urgencias: tratar el dolor y la candidiasis, empezar un corticoide tópico y derivar a Dermatología."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Riesgo de malignización: las revisiones sistemáticas recientes (González-Moles 2021, Oral Oncology) lo sitúan en ≈1,4 %, más alto en fumadores, bebedores, con VHC, en la lengua y en las formas atróficas o erosivas. Apoyan el seguimiento.", "Inhibidores de JAK (tofacitinib, baricitinib, upadacitinib): series de 2022–2024 con buena respuesta en el LPO erosivo refractario. Hay ensayos en curso.", "Fotobiomodulación (láser de baja potencia): metaanálisis de 2022 con eficacia similar a la del corticoide tópico en el dolor.", "Higiene con dentífricos sin laurilsulfato sódico."]}]}], "sources": "González-Moles MÁ et al. Malignant transformation risk of oral lichen planus: systematic review and meta-analysis (Oral Oncol 2021); Lodi G et al. Interventions for treating oral lichen planus (Cochrane 2020); Didona D et al. Therapeutic strategies for oral lichen planus (Front Med 2022).", "cats": ["derm"], "vital": false}, {"title": "Meningitis bacteriana aguda", "page": 118, "protocol": "PROTOCOLO DE MENINGITIS AGUDA BACTERIANA", "service": "PROA", "date": "v3, jul 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Inicio brusco de fiebre + rigidez de nuca + alteración de la conciencia (la tríada completa aparece en <45 %). Cefalea, vómitos, convulsiones, focalidad, pares craneales.", "Petequias → meningococo (sepsis fulminante).", "Etiología en el adulto: neumococo, *Listeria* (>50 años, inmunodepresión, DM, alcohol, embarazo) y meningococo.", "Pistas: otitis o sinusitis, rinolicuorrea u otolicuorrea (neumococo), inmunodepresión, contactos.", "Nosocomial: tras neurocirugía, válvula o drenaje de LCR, o cirugía lumbar."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Agudo (<72 h) o subagudo (>72 h): – Subagudo: TBC, criptococo, *Brucella*, sífilis, hongos. – No infecciosas: HSA, tumoral, autoinmune.", "Encefalitis herpética (cambios de conducta, crisis, temporal).", "LCR hemático que no aclara en el 3.er tubo → HSA. Si aclara, es una PL traumática. Corregir restando 1 leucocito por cada 500–1.000 hematíes."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Analítica (hemograma, bioquímica, coagulación, gasometría venosa) + 2 hemocultivos.", "TC craneal ANTES de la PL solo si hay: – Curso subagudo (>48–72 h). – GCS <10. – Focalidad (excepto los pares craneales). – Edema de papila. – Crisis de nueva aparición. – Inmunodepresión grave (trasplante, VIH).", "Un TC rutinario retrasa el tratamiento y empeora el pronóstico.", "PL (salvo CID con sangrados e INR >1,7; si hay riesgo, que la haga el más experto): – Medir la presión de apertura (indispensable si hay VIH o se sospecha TBC o criptococo). – Tubos de 1–2 mL cada uno: – 1: bioquímica (proteínas, glucosa, lactato). – 2: Gram urgente, cultivo, FilmArray® de meningitis-encefalitis (resultado en 60 min). – 3: citología. – Uno de reserva en la nevera.", "Interpretación del LCR: – Bacteriana: turbio, glucosa <40 (o <10), proteínas 100–500, 100–3.000 células con >50 % de PMN (*Listeria* puede dar linfocitos). – Vírica: claro, glucosa >40, proteínas 50–300, >80 % de linfocitos (PMN en las primeras 12–24 h). – Subaguda: glucosa 10–40, linfocitos. Pedir ADA, cultivo y PCR de micobacterias, antígeno de criptococo, tinta china, VDRL.", "Gram: – Diplococos grampositivos → neumococo. – Bacilos grampositivos → *Listeria*. – Diplococos gramnegativos → meningococo. – Cocobacilos gramnegativos → *H. influenzae*.", "Además: Rx de tórax, ECG, fondo de ojo, antígeno de neumococo en orina, frotis faríngeo (meningococo), VIH urgente."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Objetivo: primera dosis de ATB en <1 h desde la llegada"}, {"type": "list", "items": ["Petequias + síndrome meníngeo: dexametasona + ATB ANTES de la PL (tras los hemocultivos)."]}, {"type": "h", "text": "Dexametasona (antes del ATB o a la vez)"}, {"type": "list", "items": ["10–12 mg IV y luego 4 mg/6 h × 48 h. No retirarla, sea cual sea la etiología."]}, {"type": "h", "text": "ATB empírico"}, {"type": "list", "items": ["Sin sospecha clara: cefotaxima 300 mg/kg/día cada 6 h (máximo 24 g/día) ± ampicilina 250 mg/kg/día cada 4 h (si tiene >50 años o inmunodepresión; individualizar en la DM o en <50 años).", "Neumococo: cefotaxima 300 mg/kg/día. Sin vancomicina empírica (resistencia baja en España).", "Meningococo, *H. influenzae* o enterobacteria ceftriaxona 50 mg/kg/24 h** (máximo 4 g/24 h).", "*Listeria ampicilina 250 mg/kg/día cada 4 h** ± gentamicina 240 mg/24 h."]}, {"type": "h", "text": "Alergia a betalactámicos"}, {"type": "list", "items": ["Reinterrogar. Valorar una prueba de exposición con cefotaxima 250 mg IV o la desensibilización (Farmacia).", "Alergia grave: – Neumococo: vancomicina 10–20 mg/kg/8–12 h + rifampicina 15 mg/kg/24 h (máximo 900 mg). – Meningococo, *H. influenzae* o enterobacteria aztreonam 2 g/8 h.** – *Listeria cotrimoxazol 1.600/320 mg cada 6–8 h.**"]}, {"type": "h", "text": "Nosocomial o posneuroquirúrgica"}, {"type": "list", "items": ["Vancomicina 15–20 mg/kg/8–12 h + ceftazidima, cefepima o meropenem 2 g/8 h. Avisar al servicio quirúrgico.", "Alergia: vancomicina + aztreonam."]}, {"type": "h", "text": "Otras medidas"}, {"type": "list", "items": ["Profilaxis anticomicial individualizada (sobre todo en el neumococo, por un 15–20 % de crisis), durante 10 días: – Lacosamida 200 mg IV de carga y después 100 mg/12 h (ECG antes: BAV). – O levetiracetam 1.500 mg IV y después 500 mg/12 h.", "HTIC (neumococo o presión de apertura >30 cmH₂O): manitol 0,5–1 g/kg IV en 10–15 min (no si hay shock o IC).", "Aciclovir 10 mg/kg/8 h si se sospecha VHS o VVZ (inmunodeprimido o encefalitis). Diluir bien y pasar en 2 h si la dosis es ≥500 mg.", "Fluidos con K las primeras 48 h. Vigilar las constantes, la conciencia y las lesiones cutáneas."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Semicríticos o UCI si la conciencia está baja, hace falta monitorizar o hay que intubar.", "Meningococo: – Aislamiento respiratorio (gotas) las primeras 24 h de tratamiento. – Quimioprofilaxis urgente a convivientes y contactos íntimos (y al personal sanitario con exposición no protegida a secreciones; avisar a Salud Laboral): – Rifampicina 600 mg/12 h × 48 h. – O ciprofloxacino 500 mg v.o. en dosis única. – Declaración obligatoria en <24 h (epi.litoral@aspb.cat)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["ESCMID 2016 y NICE NG240 (2024):", "Vancomicina empírica donde la resistencia del neumococo a las cefalosporinas sea >1 %. En España es baja, pero muchas guías añaden vancomicina hasta tener el antibiograma si el paciente viene de zonas de alta resistencia o ha recibido betalactámicos recientes.", "Ceftriaxona 2 g/12 h como alternativa a la cefotaxima. Es más práctica.", "Dexametasona: 10 mg/6 h × 4 días en la ESCMID y la NICE (el protocolo pone 48 h). Iniciarla antes o con la primera dosis de ATB.", "No se recomienda manitol de rutina (ESCMID). Tampoco profilaxis anticomicial (sin evidencia).", "Quimioprofilaxis del meningococo: también ceftriaxona 250 mg IM (de elección en la embarazada).", "NICE NG240 (2024): ATB en <1 h. No retrasar la PL por un TC si no hay criterios (coincide)."]}]}], "sources": "van de Beek D et al. ESCMID guideline: diagnosis and treatment of acute bacterial meningitis (Clin Microbiol Infect 2016); NICE NG240 Meningitis (bacterial) and meningococcal disease (2024); van de Beek D et al. Community-acquired bacterial meningitis (Lancet 2021).", "cats": ["neuro", "infec"], "vital": true}, {"title": "Mpox (viruela del mono)", "page": 120, "protocol": "Protocolo de actuación del hospital ante casos sospechosos de MPOX", "service": "Infecciosas, Dermatología, Microbiología", "date": "v4, sep 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Incubación de 6–16 días (5–21).", "Pródromo: fiebre, astenia, odinofagia, mialgias y adenopatías inflamatorias (las distinguen de la varicela). Después, a los 3–5 días:", "Lesiones papulovesiculares → pústulas umbilicadas → úlcera o costra en el punto de inoculación (genital, anal, perioral) ± diseminación (<25 lesiones, acras).", "Proctitis (proctalgia intensa) y faringitis.", "Epidemiología (21 días previos): – Contacto con un caso. – Relaciones sexuales de riesgo (HSH; 50 % con VIH; usuarios de PrEP). – Viaje a la RDC, Uganda, Burundi, Ruanda o Kenia (clado Ib; ESPII de la OMS de agosto de 2024).", "Definición de caso: – Sospechoso: clínica (exantema vesiculopustuloso + fiebre >38,5, cefalea, mialgias o adenopatías). – Probable: clínica + epidemiología. – Confirmado: PCR positiva."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Diagnóstico diferencial: varicela, herpes (eccema herpético), sífilis, enterovirus (Coxsackie), sarampión, infección bacteriana, sarna, toxicodermia.", "ITS concomitantes (30–50 %).", "Complicaciones: – Sobreinfección (SARM), celulitis, edema de pene o parafimosis. – Proctitis grave, odinofagia que impide beber. – Afectación ocular, encefalitis, neumonía, miocarditis o pericarditis. – Diseminación en el inmunodeprimido (VIH con CD4 <200)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["PCR de mpox: líquido de la vesícula (lo ideal) o frotis de una vesícula abierta (escobillón seco); rectal si solo hay proctitis. – Petición \"D. MOLECULAR VIRUS VEROLA SÍMICA M. biològica (8246)\". – Avisar a Microbiología (681 27 11 71 / ext. 25790) y llevarla en mano. Resultado en ≤48 h (lunes, miércoles y viernes).", "Cribado de ITS: – VIH urgente, VHC, HBsAg, *T. pallidum*. – PCR de gonococo y *Chlamydia*** (faríngea, orina, rectal", "Valorar la gravedad: inmunodepresión, proctalgia, ojo, odinofagia."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Aislamiento y EPI"}, {"type": "list", "items": ["Despacho 1 de Urgencias. Paciente con mascarilla quirúrgica.", "Personal: FFP2, guantes, bata. FFP3 + gafas en procedimientos con aerosoles o toma de muestras.", "Ingreso: presión negativa o habitación individual con baño, hasta que caigan todas las costras."]}, {"type": "h", "text": "Sintomático (en la mayoría)"}, {"type": "list", "items": ["Analgesia escalonada.", "Proctalgia: anestésico tópico (Dermovagisil® cada 12 h), baños de asiento o defecar en agua tibia.", "Edema, proctalgia o balanitis: prednisona 30 mg/día en pauta corta.", "Lesiones: antiséptico (povidona yodada al 50 % o clorhexidina 0,05–1 %), mantenerlas secas y cubiertas.", "Sobreinfección: ATB con cobertura de SARM (cotrimoxazol o clindamicina)."]}, {"type": "h", "text": "Antiviral (casos graves ingresados ≥48 h)"}, {"type": "list", "items": ["Tecovirimat (v.o. o IV; pedirlo a Farmacia y la AEMPS).", "Indicaciones: neumonía, encefalitis, lesiones oculares, faringe con compromiso de la vía aérea o de la deglución, proctitis grave, celulitis grave (pene), inmunodeprimido con enfermedad diseminada.", "Ocular: trifluridina tópica."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Criterios de ingreso: – Ojo (dolor, alteración visual). – Faringe que impide beber o compromete la vía aérea. – Celulitis grave o que necesita ATB IV. – Proctitis que requiere analgesia IV o dieta absoluta. – Dolor o prurito incontrolables, deshidratación, problema nutricional. – Sepsis, neumonía o afectación del SNC. – Inmunodeprimido con fiebre >48–72 h.", "Alta: – Sin aislamiento domiciliario estricto, pero evitar el contacto físico y el sexo hasta la reepitelización completa. Preservativo 12 semanas después. – Lesiones cubiertas, utensilios y ropa no compartidos (lavar a 60 °C), sin mascotas.", "Seguimiento: – Interconsulta urgente a Dermatología (busca 25828, de 8 a 17 h). – Infecciosas (busca 25444) si hay afectación sistémica o hay que ingresar. – Llamada a las 48–72 h (DER50 / INF-13).", "Declarar a Salud Pública: epi.litoral@aspb.cat / mdo@aspb.cat (932384557). Fuera de horario, SUVEC 627480828.", "Contactos estrechos: – Vacuna Imvanex®/Jynneos® en ≤4 días (hasta 14). – Control de la temperatura durante 21 días. – Sin cuarentena.", "Vacuna preexposición: 2 dosis s.c. separadas 28 días en personas con prácticas sexuales de riesgo o riesgo laboral."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Tecovirimat:", "STOMP (clado II, 2024–2025) y PALM007 (clado I, NEJM 2025): sin beneficio en el tiempo de resolución de las lesiones en la enfermedad no grave.", "Se mantiene solo para la enfermedad grave o el inmunodeprimido (uso compasivo o protocolos). Coincide con el protocolo.", "Clado Ib: casos importados en Europa (Suecia, Alemania, Reino Unido, Bélgica, 2024–2025) con transmisión en el hogar y heterosexual. La OMS levantó la ESPII en septiembre de 2025, aunque la vigilancia sigue.", "Vacuna MVA-BN: efectividad ≈66–86 % con 2 dosis. Autorizada en adolescentes de 12–17 años (EMA 2024) y por la OMS (precualificada) para niños en zonas de brote."]}]}], "sources": "WHO Clinical management and IPC for mpox (2025 update); STOMP trial results (NEJM 2025); PALM007 Writing Group. Tecovirimat for clade I mpox (NEJM 2025); ECDC Epidemiological update mpox clade I (2025).", "cats": ["infec", "derm"], "vital": false}, {"title": "Neumonía: comunitaria, nosocomial y asociada a ventilación (antibioterapia empírica)", "page": 122, "protocol": "PROTOCOLO DE MANEJO DE NEUMONÍAS", "service": "PROA", "date": "v2.0, jul 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["NAC: no ingresado, o primeras 48 h de ingreso. Nosocomial: ≥48 h de ingreso. NAVM: ≥48 h de IOT o <72 h tras la extubación.", "Atípica: inicio subagudo, sin síntomas clásicos, con clínica extrapulmonar.", "Riesgo de multirresistentes (nosocomial): ingreso o ATB en los últimos 3 meses, colonización por bacterias MR, ingreso actual ≥5 días.", "Gravedad (NAVM): sepsis o shock, IR grave, ≥2 lóbulos o SDRA, inmunosupresión.", "Riesgo de SARM: colonización o infección previa, institucionalizado.", "Estabilidad para pasar a VO: afebril ≥24 h, FC ≤100, FR ≤24, SatO2 ≥90%, TAS ≥90, mejoría clínica, tolera VO."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["TEP, IC, neoplasia, aspiración, absceso o empiema (derrame → toracocentesis), TBC, gripe o COVID."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Ambulatoria: Rx de tórax (± esputo).", "Ingresada: Rx de tórax + cultivo de esputo + antigenurias de neumococo y Legionella (± hemocultivos). El antígeno de neumococo puede seguir positivo 1–3 meses.", "UCI o NAVM: lo anterior + hemocultivos + muestras invasivas (BAS o LBA) + PCR de virus (gripe, SARS-CoV-2) según la epidemiología.", "Sospecha de SARM: frotis nasal (desescalar si es negativo).", "Analítica, gasometría, lactato; CURB-65 o PSI para decidir el destino."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "NAC ambulatoria (5–7 días; control en el CAP a las 48–72 h)"}, {"type": "list", "items": ["Amoxicilina 1 g/8 h VO. Si se sospecha atípica o hay alergia: levofloxacino 500 mg/24 h VO."]}, {"type": "h", "text": "NAC que ingresa en planta (5–7 días)"}, {"type": "list", "items": ["Ceftriaxona 1 g/24 h IV o amoxicilina-clavulánico 1 g/8 h IV ± azitromicina 500 mg/24 h (3 días). Alergia: levofloxacino 500 mg/24 h (puede pasar a VO tras la 1ª dosis).", "Pasar a VO según el resultado: neumococo + → amoxicilina 1 g/8 h; Legionella + → levofloxacino 500 mg; cultivos negativos → amoxicilina-clavulánico 875/125 mg/8 h (o levofloxacino si no recibió azitromicina)."]}, {"type": "h", "text": "NAC grave o UCI (5–7 días si responde pronto; si no, 7–10)"}, {"type": "list", "items": ["Ceftriaxona 2 g/24 h + azitromicina 500 mg/24 h (preferida) o + levofloxacino 750 mg/24 h. Alergia: levofloxacino 750 mg."]}, {"type": "h", "text": "Situaciones especiales"}, {"type": "list", "items": ["Broncoaspiración: amoxicilina-clavulánico 1–2 g/8 h IV (alergia: levofloxacino + clindamicina 600 mg/8 h), 5–7 días. Absceso o necrotizante: 4–8 semanas.", "Gripe + neumonía: oseltamivir 75 mg/12 h × 5 días + ceftriaxona 1 g o amoxicilina-clavulánico 1 g/8 h (coinfección bacteriana frecuente). Alergia: + levofloxacino.", "Legionella: levofloxacino 500 mg/24 h (750 mg + azitromicina si es grave) durante 10–14 días.", "Sospecha de SARM: + clindamicina 600 mg/8 h, cotrimoxazol 800 mg/12 h o linezolid 600 mg/12 h según el antibiograma previo.", "Riesgo de Pseudomonas: tratar como nosocomial con riesgo de multirresistentes."]}, {"type": "h", "text": "Neumonía nosocomial (5–7 días)"}, {"type": "list", "items": ["Bajo riesgo de MR y no grave: igual que la NAC.", "Riesgo de MR, sin sepsis: piperacilina-tazobactam 4 g/6 h. Alergia: aztreonam + clindamicina.", "Riesgo de MR + sepsis: meropenem 2 g de carga y después 2 g/8 h en perfusión de 6 h ± linezolid 600 mg/12 h. Alergia: aztreonam ± linezolid ± colistina.", "BLEE previo: carbapenem. P. aeruginosa XDR: ceftolozano-tazobactam 2 g/8 h (en 3 h) + colistina nebulizada 3–5 MU/8 h → interconsulta a Infecciosas o PROA.", "Aztreonam (alérgicos graves): 2 g de carga + 6 g/día en perfusión continua. Valorar desensibilización."]}, {"type": "h", "text": "NAVM (5–7 días si responde)"}, {"type": "list", "items": ["VM ≤5 días sin factores de riesgo de MR: ceftriaxona 2 g o amoxicilina-clavulánico + levofloxacino 750 mg, o piperacilina- tazobactam (4 g de carga + 16 g/día en perfusión continua).", "VM >5 días sin gravedad ni riesgo de MR: piperacilina-tazobactam en perfusión continua.", "VM >5 días + riesgo de MR o gravedad: meropenem 2 g/8 h (perfusión de 6 h) + linezolid ± colistina nebulizada.", "Colistina IV: carga de 9 MU y después 4,5 MU/12 h (ajustar al ClCr; ver la ficha de dosificación EUCAST)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Corticoides en la NAC grave (UCI): hidrocortisona 200 mg/día × 4–7 días con retirada progresiva (ensayo CAPE COD, NEJM 2023). Lo recomiendan la ERS/ESICM/ESCMID/ALAT 2023 y la SCCM 2024. No usar en la neumonía gripal ni por aspergilosis. No está en el protocolo.", "Macrólido mejor que quinolona en la combinación de la NAC grave (ERS 2023: mejor supervivencia en estudios observacionales). Coincide (azitromicina preferida).", "ATS/IDSA 2019: en la NAC ambulatoria con comorbilidades se usa amoxicilina-clavulánico + macrólido o quinolona. Para el paciente sano, amoxicilina (EE. UU.) o doxiciclina.", "Duración: 3 días de betalactámico si es estable a las 72 h (ensayo PTC, Lancet 2021). Ver la ficha de duración de antibióticos.", "Nosocomial: la guía ERS/ESICM/ESCMID/ALAT 2017 y la IDSA/ATS 2016 recomiendan 7 días. Doble cobertura antipseudomónica solo si hay shock o riesgo muy alto de MR."]}]}], "sources": "Martin-Loeches I et al. ERS/ESICM/ESCMID/ALAT guidelines for severe CAP (Intensive Care Med 2023); Dequin PF et al. CAPE COD (N Engl J Med 2023); Chaudhuri D et al. SCCM 2024 focused update on corticosteroids (Crit Care Med 2024); Metlay JP et al. ATS/IDSA CAP (Am J Respir Crit Care Med 2019); Kalil AC et al. IDSA/ATS HAP/VAP (Clin Infect Dis 2016).", "cats": ["resp", "infec"], "vital": false}, {"title": "Paciente anticoagulado o antiagregado con traumatismo", "page": 124, "protocol": "MANEIG DE PACIENTS ANTICOAGULATS AMB TRAUMATISME", "service": "Cirugía, COT, Hematología, Urgencias", "date": "rev. dic 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Preguntar en el triaje por antiagregantes o anticoagulantes. Revisar la receta electrónica: fármaco, dosis, cumplimiento y hora de la última dosis.", "Riesgo de hemorragia oculta (intracraneal, retroperitoneal, hematomas musculares).", "Fármacos: – Antiagregantes: AAS, clopidogrel, prasugrel, ticagrelor. – HBPM: enoxaparina, bemiparina, tinzaparina. – AVK: acenocumarol, warfarina. – ACOD: dabigatrán, rivaroxabán, apixabán, edoxabán."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["TCE con hemorragia (TC craneal según la ficha de TCE), sangrado mayor, síndrome compartimental."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Función renal (aclaramiento de creatinina por Cockcroft-Gault), iones, hemograma, coagulación básica.", "AVK: INR.", "ACOD: no hay control en urgencias. Si lo toma bien, está anticoagulado. El INR, el TP y el TTPa no reflejan su efecto (un tiempo de trombina alargado indica que hay dabigatrán).", "Repetir la analítica al terminar la observación."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Según el traumatismo"}, {"type": "list", "items": ["Banal (p. ej., contusión de un dedo): valorar el alta.", "Con o sin fractura: observación 12 h.", "Politraumatismo: valorar observación 24 h.", "Alteraciones no manejables quirúrgicamente: contactar con Medicina Interna o Hematología."]}, {"type": "h", "text": "Hemorragia mayor: reversión"}, {"type": "list", "items": ["AVK: CCP (Octaplex®) según el INR: 2–3,9 → 25 UI/kg; 4–6 → 35 UI/kg; >6 → 50 UI/kg + vitamina K IV.", "Dabigatrán: idarucizumab 5 g IV (2 viales de 2,5 g/50 mL).", "Apixabán, rivaroxabán o edoxabán: CCP 25–50 UI/kg.", "HBPM (<8 h desde la última dosis): protamina 1 mg por cada 100 UI anti-Xa (1 mg por cada 1 mg de enoxaparina).", "Antiagregantes: sin antídoto. Transfusión de plaquetas según el caso. Ticagrelor: plaquetas si la última dosis fue hace >24 h (si fue hace <24 h, valorar factor VIIa)."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Alta si está estable: \"Control por el médico de familia en 2–3 días. Vigilar la aparición o evolución de hematomas. Volver si empeora\" + signos de alarma.", "Más información en la intranet: Guía de antídotos (Comisión de Transfusiones) y protocolo de anticoagulación (Hematología)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Andexanet alfa (Ondexxya®) está autorizado en la UE para la hemorragia potencialmente mortal con apixabán o rivaroxabán (ESC 2024 y guía europea de trauma 2023 como opción). ANNEXA-I (NEJM 2024): mejor control hemostático en la HIC, con más trombosis. Disponibilidad según el hospital. Si no hay, CCP 50 UI/kg.", "Guía europea de hemorragia en el trauma (6.ª ed., 2023):", "Ácido tranexámico 1 g IV en <3 h en el trauma con sangrado, y después 1 g en 8 h.", "Niveles específicos de ACOD (anti-Xa calibrado) si están disponibles.", "AVK con sangrado mayor: vitamina K 5–10 mg IV junto al CCP. Muchos centros usan una dosis fija de CCP (1.000–1.500 UI) como alternativa (ACC 2020/2024).", "TCE leve anticoagulado: ver la ficha de TCE (TC precoz; valorar un 2.º TC según el caso)."]}]}], "sources": "Rossaint R et al. European guideline on management of major bleeding and coagulopathy following trauma, 6th ed (Crit Care 2023); Connolly SJ et al. ANNEXA-I (NEJM 2024); Tomaselli GF et al. 2020 ACC Expert Consensus on Management of Bleeding in Patients on Oral Anticoagulants.", "cats": ["hemato", "tec"], "vital": false}, {"title": "Pancreatitis aguda", "page": 125, "protocol": "PANCREATITIS AGUDA", "service": "Protocol d'actuació a Urgències, Digestivo", "date": "mar 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Diagnóstico con 2 de 3 criterios: – Dolor epigástrico en cinturón o transfixivo + vómitos. – Amilasa o lipasa >3 veces el LSN. – Imagen compatible.", "Etiología: – Biliar y alcohol o tabaco (las más frecuentes). – Fármacos nuevos, hipertrigliceridemia, hipercalcemia, post-CPRE. – DM de reciente aparición o síntomas de neoplasia."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Clínica atípica (fiebre, Murphy, dolor atípico o muy intenso) → imagen urgente: – Ecografía: colecistitis, coledocolitiasis, dilatación de la vía biliar. – TC: perforación, isquemia mesentérica, patología aórtica.", "Colangitis asociada → ATB + CPRE urgente.", "PA reciente: TC urgente para descartar complicaciones (colecciones, infección, trombosis).", "Signos de alarma o gravedad: – Hipovolemia: oliguria <0,5 mL/kg/h, TAS <90 o TAM <65, creatinina >1,1 o BUN >20–25, hematocrito >44 %. – SIRS ≥2. – Fallo orgánico. – BISAP ≥3. – PCR >15 mg/dL a las 48 h. – IMC >30."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Constantes: TA, FC, FR, SatO₂, diuresis, nivel de conciencia.", "Analítica: hemograma (hematocrito), urea, BUN y creatinina, iones, calcio, triglicéridos, perfil hepático, lipasa o amilasa, PCR, gasometría, glucosa.", "No repetir la amilasa ni la lipasa una vez diagnosticada.", "BISAP (1 punto cada uno): BUN >25, alteración del estado mental (*Impaired mental status*), SIRS, edad (*Age*) >60, derrame pleural. ≥3 = potencialmente grave.", "SIRS: FC >90, T <36 o >38 °C, leucocitos <4.000 o >12.000, FR >20 (o pCO₂ <32).", "Ecografía abdominal (etiología biliar).", "TC con contraste: no de entrada si la clínica es típica. Mejor pasadas 72 h para valorar la necrosis, salvo dudas diagnósticas."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Monitorización"}, {"type": "list", "items": ["2 vías + sonda vesical si hay deshidratación, hipovolemia o signos de alarma (sirve también para medir la presión intraabdominal)."]}, {"type": "h", "text": "Fluidos (SF o, mejor, Ringer lactato)"}, {"type": "list", "items": ["Mantenimiento: ≈1,5 mL/kg/h × 24–48 h (unos 3.000–3.500 mL/24 h en un adulto estándar).", "Hipovolemia: bolos de 10 mL/kg.", "Objetivos: FC <120, TAM 65–85, diuresis 0,5–1 mL/kg/h y descenso del BUN y el hematocrito.", "Reevaluar cada 4 h, luego cada 6–8 h. Evitar la hiperhidratación y los coloides. Cuidado en la IC."]}, {"type": "h", "text": "Analgesia"}, {"type": "list", "items": ["Paracetamol 1 g/8 h + metamizol 2 g/8 h + morfina si hace falta.", "Los AINE son útiles (vigilar la nefrotoxicidad). Los opioides no son perjudiciales."]}, {"type": "h", "text": "Dieta"}, {"type": "list", "items": ["Ayuno inicial → dieta oral precoz (semiblanda progresiva) en cuanto se controle el dolor.", "Si no tolera a las 48–72 h: nutrición enteral por SNG (nasoyeyunal si hay vómitos, obstrucción o íleo). NPT solo si no es posible la vía enteral."]}, {"type": "h", "text": "Otros"}, {"type": "list", "items": ["Enoxaparina 40 mg/24 h s.c.", "Alcohol: diazepam + tiamina (prevención de la abstinencia).", "Sin ATB profiláctico (la necrosis infectada suele aparecer a partir de la 2.ª semana).", "Colangitis: ATB + CPRE urgente.", "Hiperglucemia o hipertrigliceridemia: perfusión de insulina IV."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Contactar con Digestivo. UCI o semicríticos si hay fallo orgánico persistente o signos de alarma que no responden."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Fluidos (ensayo WATERFALL, NEJM 2022): la reanimación agresiva (20 mL/kg + 3 mL/kg/h) aumentó la sobrecarga sin mejorar los resultados.", "Pauta actual: moderada, con Ringer lactato 10 mL/kg en bolo solo si hay hipovolemia + 1,5 mL/kg/h y reevaluación a las 12, 24, 48 y 72 h.", "Coincide con el protocolo (ACG 2024, AGA 2024). El Ringer lactato es preferible al SF.", "CPRE urgente (<24 h) solo si hay colangitis. En la PA biliar sin colangitis, la CPRE precoz no aporta beneficio (APEC, Lancet 2020).", "Colecistectomía en el mismo ingreso en la PA biliar leve (PONCHO, Lancet 2015).", "Necrosis infectada: abordaje **escalonado (*step-up*) endoscópico, idealmente pasadas 4 semanas** (*walled-off*).", "Hipertrigliceridemia >1.000 mg/dL: insulina IV ± heparina. La plasmaféresis solo en casos seleccionados."]}]}], "sources": "de-Madaria E et al. WATERFALL trial (NEJM 2022); Tenner S et al. ACG Guideline: Management of Acute Pancreatitis (Am J Gastroenterol 2024); Schepers NJ et al. APEC trial (Lancet 2020); IAP/APA evidence-based guidelines (Pancreatology 2013, update in progress).", "cats": ["dig"], "vital": false}, {"title": "Paracentesis (técnica)", "page": 127, "protocol": "TÉCNICA: PARACENTESIS", "service": "Urgencias", "date": "dic 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Diagnóstica: ascitis de nueva aparición, sospecha de PBE, ascitis refractaria.", "Terapéutica: ascitis a tensión con disnea o dolor."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Contraindicaciones absolutas: coagulopatía grave no corregida (la CID), obstrucción intestinal con asas dilatadas (salvo con guía ecográfica), infección de la pared abdominal.", "Relativas: paciente poco colaborador, cicatrices, gran masa abdominal o embarazo de 2º–3er trimestre (usar ecografía), circulación colateral marcada."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Petitorio de Urgencias > Líquidos > Líquido ascítico: recuento celular, proteínas, glucosa, cultivo aerobio y anaerobio, Gram. ADA en el mismo apartado.", "Citología: EECC → A. Patológica → \"Selecció proves\" → citología + resumen clínico. En la guardia, guardarla en la nevera de Códigos. Enviar todo el volumen si es evacuadora."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Técnica"}, {"type": "list", "items": ["Decúbito supino lateralizado a la izquierda, cabecero a 30–45°. Punto: unión del tercio externo con los 2/3 internos de la línea ombligo–EIAS izquierda (alternativa: línea media 2 cm bajo el ombligo, con la vejiga vacía y ecografía).", "Asepsia, guantes y paño estériles. Punción en Z, aspirando mientras se avanza.", "Diagnóstica: aguja IM de 21G, extraer 30–60 mL.", "Evacuadora: anestesia local con 3–5 mL. Aguja del kit de 16G (trocar 18G), avanzando de 5 en 5 mm. Conectar al colector en declive. Terminar cuando el flujo se vuelva intermitente aunque se movilice la aguja o al paciente.", "Después: apósito y decúbito lateral derecho durante 60–90 min. Si sigue drenando por el orificio: un punto simple."]}, {"type": "h", "text": "Albúmina"}, {"type": "list", "items": [">5 L extraídos: albúmina 8 g IV por litro extraído (máx. 100 g), en infusión lenta."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["AASLD 2021 / EASL 2018: no hay que corregir el INR ni las plaquetas de forma rutinaria. El riesgo de sangrado grave es <1%.", "Guía ecográfica: reduce los sangrados y las punciones fallidas. La recomiendan las guías de procedimientos (p. ej. la Society of Hospital Medicine 2019) siempre que esté disponible.", "Albúmina 6–8 g/L (AASLD) y no hace falta un máximo fijo de 100 g. Con volúmenes de 3–5 L, valorar albúmina si hay FRA o ACLF."]}]}], "sources": "Biggins SW et al. AASLD Practice Guidance (Hepatology 2021); EASL decompensated cirrhosis guidelines (J Hepatol 2018); Cho J et al. SHM Ultrasound-guided paracentesis position statement (J Hosp Med 2019).", "cats": ["dig", "tec"], "vital": false}, {"title": "Profilaxis post-exposición no ocupacional a VIH, VHB y VHC (PPE)", "page": 128, "protocol": "ACTUACIÓ POST-EXPOSICIÓ NO OCUPACIONAL A VIH, VHB I VHC", "service": "Urgencias e Infecciosas", "date": "2018, rev. may 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Exposición no ocupacional (sexual o percutánea accidental) a sangre o fluidos fuera del ámbito laboral.", "Fluidos potencialmente infectantes: semen, secreciones vaginales, sangre, LCR, líquidos pleural, pericárdico, peritoneal y amniótico, leche materna.", "NO infectantes (sin sangre): orina, heces, saliva, vómito, sudor, lágrimas, secreciones nasales, esputo.", "Más riesgo: exposición traumática o violenta, sangrado o menstruación, úlceras o ITS, fuente con carga viral alta (VIH agudo o avanzado sin TAR; >5.000 copias/mL)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Sin indicación: besos, mordeduras sin herida, arañazo superficial, agujas abandonadas en la calle, fluidos sobre piel intacta, fluidos no infectantes, fuente VIH negativa.", "Agresión sexual (circuito específico), embarazo (misma pauta), otras ITS."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Estado de la fuente si es posible (VIH, carga viral, TAR, VHB, VHC).", "Al expuesto: serologías basales de VIH, VHB (anti-HBs, HBsAg, anti-HBc), VHC y sífilis. Creatinina. Prueba de embarazo. No hace falta el VIH urgente el mismo día."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Indicación de PPE frente al VIH (en <72 h; lo antes posible, idealmente <24 h)"}, {"type": "list", "items": ["Recomendada: – Fuente VIH positiva + exposición de recto, vagina, ojos, boca, mucosas, piel no intacta o percutánea + fluido infectante. – Fuente desconocida de alta probabilidad: HSH, ADVP, trabajador/a sexual, agresor sexual, antecedente de prisión, o procedente de un país con prevalencia de VIH >1 % (África subsahariana, Caribe, Rusia, Estonia, Tailandia).", "No recomendada si el riesgo es despreciable. No iniciar pasadas 72 h."]}, {"type": "h", "text": "Pauta (28 días)"}, {"type": "list", "items": ["Truvada® (emtricitabina 200 + tenofovir DF 245 mg) 1 comprimido cada 24 h", "+ Isentress® (raltegravir 600 mg) 2 comprimidos juntos cada 24 h (1.200 mg). No tomarlo con antiácidos de Al o Mg.", "Primera dosis en urgencias. Dar comprimidos suficientes hasta la visita en el Hospital de Día de Infecciosas (el primer día laborable, de 9 a 13 h). Si está de paso, a nuestro Hospital de Día.", "Efectos adversos: GI, cefalea, alteraciones renales o hepáticas (tenofovir, emtricitabina); rabdomiólisis (raltegravir)."]}, {"type": "h", "text": "VHB"}, {"type": "list", "items": ["Vacunado y respondedor (anti-HBs >10): nada.", "Vacunado no respondedor (<10): gammaglobulina anti-VHB IM (<12 h) ± revacunación.", "Respuesta desconocida: gammaglobulina y esperar el anti-HBs.", "No vacunado: gammaglobulina IM (<12 h) + iniciar la vacuna de inmediato.", "Igual en la gestante."]}, {"type": "h", "text": "VHC"}, {"type": "list", "items": ["No hay profilaxis. Solo seguimiento serológico."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Alta con informe y cita en el Hospital de Día de Infecciosas (hospital de referencia).", "No donar sangre durante el seguimiento. Preservativo 3–6 meses.", "Valorar la PrEP después si la exposición de riesgo es recurrente."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Pautas preferentes actuales: bictegravir/emtricitabina/TAF (Biktarvy®) 1 comprimido al día (o TDF/FTC + dolutegravir 50 mg).", "Fuentes: GeSIDA/PNS 2023–2024, EACS 12.0 (2023), CDC 2025.", "Una sola toma, mejor tolerancia y mejor adherencia. Raltegravir 1.200 mg una vez al día sigue siendo una alternativa.", "Seguimiento: VIH (Ag/Ac de 4.ª generación) a las 6 semanas y a los 3 meses (EACS). La serología a los 6 meses solo si hubo coinfección por VHC.", "Agresión sexual: también profilaxis de ITS (ceftriaxona, doxiciclina, metronidazol), anticoncepción de emergencia y vacuna del VHB. Ver ITS.", "Doxi-PEP (doxiciclina 200 mg en <72 h) en HSH y mujeres trans de riesgo (CDC 2024)."]}]}], "sources": "CDC Updated Guidelines for Antiretroviral PEP after Sexual, Injection Drug Use, or Other Nonoccupational Exposure to HIV (MMWR 2025); EACS Guidelines v12.0 (2023); GeSIDA/PNS Documento de consenso PPE (2023).", "cats": ["infec"], "vital": false}, {"title": "Prurito crónico (somatomorfo, prurigo nodular)", "page": 129, "protocol": "PRURIT CRÒNIC. PRURIT SOMATOMORF/PSICÒGEN. PRURIGEN NODULAR – Psicodermatología, Dermatología", "service": "", "date": "", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Prurito crónico: duración >6 semanas. Prevalencia del 17 % en adultos y del 25 % en ancianos. Sin causa identificable en ≈20 %.", "Clasificación de la IFSI: – Grupo I: sobre piel inflamada (dermatitis atópica, urticaria, psoriasis). – Grupo II: sobre piel normal (sistémico, neuropático o somatomorfo). – Grupo III: lesiones crónicas por rascado (prurigo nodular, liquen simple crónico).", "Pistas de origen psicógeno: síntomas desproporcionados, ansiedad o depresión, muchas consultas sin hallazgos, hostilidad, exigencia de curación.", "Delirio de parasitosis en consumidores de cocaína o anfetaminas (excoriaciones, nódulos)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["No etiquetar de somatomorfo en la primera visita sin un cribado básico.", "Causas sistémicas: – IRC (urémico), colestasis o hepatopatía, tiroides. – Ferropenia, neoplasia hematológica (linfoma de Hodgkin, policitemia vera). – VIH, DM, fármacos, drogas, parásitos.", "Escabiosis (pliegues, convivientes con prurito)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Cribado básico: – Hemograma, IgE, B12, ferritina, TSH, VIH. – Creatinina y BUN, LDH, β2-microglobulina. – Glucosa y HbA1c, AST, ALT, GGT, FA, bilirrubina. – Rx de tórax o eco abdominal (adenopatías, linfoma). – Parásitos en heces, tóxicos en orina. – Biopsia con IFD si hay lesiones. – Valoración psiquiátrica o psicosomática.", "Revisar la lista de fármacos."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Base (todos)"}, {"type": "list", "items": ["Restaurar la barrera: emolientes ≥2 veces al día. Evitar los baños calientes, el lavado frecuente, el ambiente seco, el picante o la comida caliente, el alcohol y la lana. Vendajes húmedos."]}, {"type": "h", "text": "Tópico"}, {"type": "list", "items": ["Corticoides o inhibidores de la calcineurina donde haya inflamación.", "Prurigo nodular o liquen simple: oclusión tras aplicar el tópico."]}, {"type": "h", "text": "Sistémico"}, {"type": "list", "items": ["Antihistamínicos: – De 2.ª generación de día. – Hidroxicina por la noche (sedante). – La combinación H1 + H2 es más eficaz que el H1 solo.", "Componente psíquico: – ISRS o IRSN a dosis bajas, con aumento progresivo. – Doxepina (muy anti-H1). – Mirtazapina 15 mg por la noche (prurito nocturno, insomnio, hiporexia). – Ansiolíticos si el estrés lo agrava.", "Fototerapia (UVB de banda estrecha o PUVA): útil en el prurigo y en el prurito urémico.", "Terapia conductual (romper el ciclo picor-rascado) y técnicas de relajación."]}, {"type": "h", "text": "Emergentes (Dermatología)"}, {"type": "list", "items": ["Dupilumab, nemolizumab (anti-IL-31), tralokinumab, lebrikizumab, inhibidores de JAK (abrocitinib, upadacitinib)."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Manejo ambulatorio. Derivar a Dermatología o Psicodermatología. Evitar la confrontación con el paciente."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Dupilumab aprobado para el prurigo nodular (FDA 2022, EMA 2022; PRIME y PRIME2). Nemolizumab aprobado (FDA 2024, EMA 2025) para el prurigo nodular y la dermatitis atópica.", "Gabapentinoides (gabapentina o pregabalina): útiles en el prurito urémico y el neuropático (S2k-EDF 2022).", "Difelikefalina IV (agonista κ periférico): aprobada para el prurito asociado a la ERC en hemodiálisis (EMA 2022).", "Prurito colestásico:", "Colestiramina, luego rifampicina, naltrexona y sertralina (EASL 2022).", "Bezafibrato en la CBP y la CEP (ensayo FITCH).", "Inhibidores del IBAT (odevixibat, maralixibat) en la colestasis pediátrica."]}]}], "sources": "Ständer S et al. S2k European guideline on chronic pruritus (Acta Derm Venereol 2022); Yosipovitch G et al. Dupilumab in prurigo nodularis PRIME/PRIME2 (Nat Med 2023); Kwatra SG et al. Nemolizumab OLYMPIA 2 (NEJM 2023).", "cats": ["derm"], "vital": false}, {"title": "Sedación paliativa y situación de últimos días", "page": 130, "protocol": "PROTOCOL DE SEDACIÓ PAL·LIATIVA", "service": "Geriatría, Cuidados Paliativos y Urgencias", "date": "6.ª ed., dic 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Indicación: síntoma refractario (no controlable pese al tratamiento óptimo) o sufrimiento intolerable, con expectativa de vida limitada.", "Tipos: – Transitoria: crisis, procedimientos (curas), angustia. – Progresiva y proporcionada: síntomas refractarios en las últimas semanas. – Profunda y continua: agonía no controlada, emergencia irreversible (hemorragia masiva, asfixia, disnea terminal, dolor intratable).", "Principio de proporcionalidad: la sedación justa para aliviar el sufrimiento (EAPC 2024: empezar por una sedación superficial)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Causas tratables de agitación: RAO (muy frecuente), fecaloma, dolor, fármacos.", "No es eutanasia ni adecuación del esfuerzo terapéutico (NIT). No es la respuesta a la angustia de la familia o del equipo."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Consentimiento explícit, implícito o delegado. Verbal es suficiente, pero hay que registrarlo.", "Consultar el DVA (documento de voluntades anticipadas): – HC3 → Avisos → Voluntats anticipades. – IMASIS → Documentos. – Web del Col·legi de Metges con certificado digital.", "Consultar el PIIC (visor de cronicidad de la HC3).", "Paciente competente: prevalece lo que diga en ese momento.", "No competente: – Con DVA: es vinculante; hablar con el representante. – Sin DVA: con el referente o la familia, según sus preferencias previas. – Sin nadie: decide el equipo en el mejor interés del paciente.", "Sin consenso con el referente: Comité de Ética Asistencial urgente → si persiste el desacuerdo, comunicado al Juzgado de Guardia (935548650). En una urgencia, se puede iniciar (Ley 41/2002, art. 9.6).", "Registro en la historia clínica: enfermedad terminal + síntoma refractario + con quién se decide + objetivo de aliviar el sufrimiento."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fármacos de base"}, {"type": "list", "items": ["Mantener: analgésicos de 3.er escalón (no retirar los opioides), antieméticos, anticonvulsivantes, antitérmicos, dexametasona si es coadyuvante.", "Retirar: laxantes, heparinas, hipoglucemiantes, antibióticos y todo lo que no sea sintomático.", "Los opioides NO sedan (sí tratan el dolor o la disnea). Cambiar a la vía s.c. o IV. Rescates = 1/6 de la dosis diaria."]}, {"type": "h", "text": "1.ª línea: midazolam (salvo delirium refractario)"}, {"type": "list", "items": ["Vía s.c.: – Inducción con bolo de 5 mg (1 mL de la ampolla de 15 mg/3 mL, sin diluir), cada 5 min hasta conseguir la sedación. – Mantenimiento: 20–30 mg/día en bolos cada 4–6 h o en perfusión s.c. continua (en 100 mL de SF). – Rescate: 5 mg.", "Vía IV: – Diluir 15 mg en 10 mL (1,5 mg/mL). – Inducción: 1,5–3 mg lento, cada 5 min. – Mantenimiento: 20–30 mg/día en perfusión IV.", "Ajuste: sumar los rescates de las 24 h a la dosis basal (o subir un 33–50 %). Nuevo rescate = 1/6 de la dosis diaria. En el hospital, reajustar a las 4 h y luego cada 8 h el primer día.", "Más dosis si toma BZD habitualmente."]}, {"type": "h", "text": "2.ª línea: levomepromazina (Sinogan®)"}, {"type": "list", "items": ["1.ª línea en el delirium refractario, o si fracasa el midazolam (>90 mg/día): añadirla y reducir el midazolam a la mitad.", "Dosis: – >80 años o caquéctico: 12,5 mg IV o s.c. cada 8 h. – <80 años o muy agitado: 25 mg cada 6–8 h. – Rescate con la misma dosis cada 30 min. Si hacen falta 3 rescates seguidos, subir la pauta un 50 %.", "Útil también en: tolerancia a BZD, enfermedad psiquiátrica, alcohol o drogas."]}, {"type": "h", "text": "3.ª línea"}, {"type": "list", "items": ["Propofol o fenobarbital (con Anestesia)."]}, {"type": "h", "text": "Síntomas durante la sedación"}, {"type": "list", "items": ["Estertores: decúbito lateral + escopolamina 0,5 mg s.c. cada 4–6 h (máximo 4 mg/día; también seda).", "Disnea: O₂ de confort con gafas. Morfina 2,5 mg/4–6 h s.c. si no tomaba opioides (o 1/6 de su dosis diaria).", "Dolor: subir la dosis basal del opioide un 30 %. No rotar opioides en la agonía.", "Fiebre: paracetamol 1 g/8 h IV o metamizol 2 g/8 h IV (ni paracetamol ni metamizol por vía s.c.). Dexketoprofeno 50 mg/8 h s.c. o paracetamol rectal.", "RAO: sondaje vesical como medida de confort.", "Boca seca: cuidados de la boca (que participe la familia).", "Nivel de sedación: escala de Ramsay (I agitado … VI sin respuesta).", "Retirar las constantes y los monitores.", "Sueroterapia: individualizar. Desaconsejada si hay estertores, edemas o ascitis. Aconsejada si el pronóstico es incierto (>1 semana) o con opioides a dosis altas."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Facilitar la despedida antes de sedar. Informar a la familia (no comerá, se comunicará menos, el objetivo es el confort). Darle presencia, privacidad y apoyo.", "Equipo de soporte de Cuidados Paliativos si es posible."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Marco revisado de la EAPC (Palliative Medicine, 2024):", "Primero sedación superficial o intermitente.", "Sedación profunda y continua solo si la superficial fracasa, no llegará a tiempo o hay una emergencia terminal.", "Angustia existencial: sedación intermitente con descenso programado.", "El protocolo ya lo incorpora.", "NICE NG31 (cuidados en los últimos días) y QS144: monitorización de síntomas y plan individualizado. Hidratación según el beneficio y los deseos.", "Butilescopolamina 20 mg s.c. cada 4–6 h como alternativa sin efecto central (para no aumentar la sedación). Ningún antimuscarínico ha demostrado superioridad frente a placebo en los estertores (Cochrane)."]}]}], "sources": "Surges SM et al. Revised EAPC recommended framework on palliative sedation (Palliat Med 2024); NICE NG31 Care of dying adults in the last days of life (2015, rev.); Wee B, Hillier R. Interventions for noisy breathing in dying patients (Cochrane 2008/2019).", "cats": ["dolor"], "vital": false}, {"title": "Síncope", "page": 132, "protocol": "SÍNCOPE EN URGENCIAS", "service": "Protocolo de actuación, Cardiología", "date": "2021; basado en ESC/EHRA 2018", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Pérdida transitoria de conciencia por hipoperfusión cerebral, con recuperación espontánea y completa.", "No toda pérdida de conciencia es síncope: crisis epiléptica, psicógena, TCE, metabólica.", "Tipos: – Vasovagal (el más frecuente): desencadenante (dolor, miedo, bipedestación prolongada) + pródromos (náuseas, calor, sudor). – Situacional: tos, micción, defecación, deglución. – Ortostático: al levantarse (fármacos, depleción, disautonomía). – Hipersensibilidad del seno carotídeo (afeitado, giro del cuello). – Cardiogénico (pronóstico grave): – Obstructivo: estenosis aórtica, MCH obstructiva, mixoma, TEP, HTP grave. – Bradiarrítmico: BAV completo, Mobitz II, disfunción sinusal. – Taquiarrítmico: TV, TSV o FA rápidas. – Neurológico: AIT vertebrobasilar (con focalidad), comicial (aura, estado poscrítico). – Anciano: multifactorial (polifarmacia, anemia, disautonomía)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Alto riesgo (ESC 2018): – Durante el esfuerzo o en decúbito, palpitaciones previas, sin pródromos. – Cardiopatía estructural o IC, dolor torácico, FEVI baja, IAM previo, antecedentes familiares de muerte súbita. – Hipotensión mantenida, soplo sistólico nuevo. – Hemorragia digestiva (anemia).", "ECG de alto riesgo: – BAV de 2.º grado Mobitz II o de 3.er grado, bradicardia sinusal <40 lpm o pausas >3 s. – Bloqueo bifascicular, QRS >120 ms. – TV no sostenida, preexcitación, QT largo o corto, Brugada tipo 1, ondas épsilon (DAVD), isquemia.", "Causas graves no cardiacas: TEP, HSA, disección, sangrado, ectópico."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Anamnesis con testigos: postura, esfuerzo, pródromos, duración, recuperación, fármacos (antihipertensivos, QT, bradicardizantes).", "Exploración: soplos (cardiacos y carotídeos), signos de IC.", "ECG de 12 derivaciones + monitorización.", "Test de ortostatismo: TA y FC tras 10 min en decúbito, luego en bipedestación al instante, cada minuto los primeros 3–4 min y después cada 2 min hasta los 10 min. Anormal si la TAS cae ≥30 mmHg (o si aparecen síntomas).", "Masaje del seno carotídeo en >40 años (no si hay soplo carotídeo o ictus previo): – Monitorizado, con vía y atropina preparada. – 5 s en cada lado (separados ≥2 min), en decúbito y de pie. – Anormal: asistolia ≥3 s o hipotensión sintomática.", "Según el caso: – Analítica (Hb), troponina, dímero D, Rx de tórax. – Ecocardiograma si hay soplo o se sospecha cardiopatía. – Ergometría si el síncope es de esfuerzo (salvo estenosis aórtica grave o mixoma). – Coronariografía si hay isquemia. – Holter, estudio electrofisiológico (bloqueo bifascicular, sospecha de TV o Brugada), Holter implantable, test de basculación."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Cardiogénico claro (avisar a Cardiología o UCO de inmediato)"}, {"type": "list", "items": ["Bradiarritmia (BAV completo, pausas): isoprenalina en perfusión + parches de marcapasos transcutáneo. Retirar los bradicardizantes y corregir los iones.", "Taquicardia de QRS estrecho inestable: adenosina o CVE sincronizada.", "QRS ancho (TV): inestable → CVE o desfibrilación. Estable: el protocolo propone procainamida 100 mg en bolos hasta 1.000 mg (y menciona metoprolol 5 mg IV o digoxina 0,5 mg según IC o disfunción).", "Cardiopatía estructural responsable (estenosis aórtica, mixoma, MCH obstructiva): Cardiología de guardia."]}, {"type": "h", "text": "Posible cardiogénico"}, {"type": "list", "items": ["Criterio de alto riesgo → interconsulta a Cardiología (IMASIS).", "Riesgo intermedio: consulta no urgente y monitorización (sin cambiar de monitor o transfiriendo el registro)."]}, {"type": "h", "text": "Vasovagal u ortostático"}, {"type": "list", "items": ["Educación: reconocer los pródromos, maniobras de contrapresión (cruzar las piernas, apretar las manos), hidratación y sal, retirar los hipotensores.", "Alta y médico de familia con el folleto. Si es recurrente o con traumatismo grave: comentar con Cardiología."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Bajo riesgo (síncope único): alta sin consultar a Cardiología → médico de familia.", "Alto riesgo: ingreso en Cardiología.", "Intermedio: monitorizar y consultar a Cardiología.", "Neurología si se sospecha causa neurológica o no hay diagnóstico tras el estudio."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Ortostatismo (ESC 2018): hipotensión ortostática = caída de la TAS ≥20 mmHg (o TAS <90) o de la TAD ≥10. El protocolo usa ≥30 mmHg.", "TV estable (ESC 2022 de arritmias ventriculares): procainamida o amiodarona, o CVE con sedación. Ni digoxina ni metoprolol como tratamiento de la TV (el metoprolol vale solo en casos seleccionados).", "Unidades de síncope y observación estructurada en urgencias (≤6 h de monitorización + ≤24 h si hace falta) para el riesgo intermedio (ESC 2018).", "Escalas validadas: Canadian Syncope Risk Score (mejor que San Francisco o EGSYS) para estratificar el riesgo en urgencias (ACEP 2024, *Clinical Policy on syncope*).", "Pacientes ≥40 años con síncope vasovagal recurrente y asistolia documentada: valorar el marcapasos (ESC 2021 de estimulación)."]}]}], "sources": "Brignole M et al. 2018 ESC Guidelines for syncope (Eur Heart J 2018); Zeppenfeld K et al. 2022 ESC Guidelines on ventricular arrhythmias; Thiruganasambandamoorthy V et al. Canadian Syncope Risk Score validation (JAMA Intern Med 2020).", "cats": ["cardio"], "vital": false}, {"title": "Síndrome de abstinencia alcohólica y delirium tremens", "page": 134, "protocol": "PROTOCOLO SÍNDROME DE ABSTINENCIA ALCOHÓLICA", "service": "Unidad Funcional de Toxicología", "date": "2018, rev. mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Consumo de riesgo: varón ≥4 UBE al día (28 a la semana); mujer ≥2 UBE al día (17 a la semana). 1 UBE = 10 g.", "Cronología tras el último consumo: – 6–12 h: síntomas menores (temblor, insomnio, ansiedad, sudor, palpitaciones, náuseas). – 12–24 h: alucinosis (con el juicio conservado; se resuelve en 48 h). – 24–48 h: convulsiones tónico-clónicas. – 48–72 h: delirium tremens (pico al 5.º día): alucinaciones visuales, desorientación, taquicardia, HTA, fiebre, sudoración, agitación.", "Diagnóstico (DSM-5): cese o reducción del consumo + ≥2 de: hiperactividad autonómica, temblor, insomnio, náuseas, alucinaciones, agitación, ansiedad, crisis."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Lesiones ocultas: TCE o hematoma subdural, infección (neumonía, meningitis, PBE), HDA, pancreatitis, hepatopatía descompensada.", "Wernicke: confusión + oftalmoplejía o nistagmo + ataxia.", "Hipoglucemia, cetoacidosis alcohólica, alteraciones iónicas (Mg, K, P), otras abstinencias (BZD, GHB), encefalopatía hepática.", "Crisis nueva → TC craneal."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemograma, función renal, iones, Mg, Ca, P, perfil hepático, CK, coagulación, gasometría y lactato, glucemia capilar, cetonemia, etanolemia. Tóxicos en orina según el caso.", "ECG (QT antes de neurolépticos), Rx de tórax. TC craneal o PL según la clínica.", "Escala CIWA-Ar (10 ítems, máximo 67), según este protocolo: – ≤15: leve. – 16–20: moderada. – ≥21: grave."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales"}, {"type": "list", "items": ["Ambiente tranquilo, penumbra, contención verbal y familiares.", "Contención mecánica solo si es imprescindible, y siempre con sedación.", "No dar alcohol en ninguna forma."]}, {"type": "h", "text": "BZD de elección (pauta según síntomas, con CIWA-Ar horaria mientras sea >8)"}, {"type": "list", "items": ["Leve: diazepam 5–10 mg/8–12 h v.o. (extra de 5–10 mg) o lorazepam 1 mg/12 h. Bajar 5 mg/día.", "Moderada: diazepam 10–20 mg/6–8 h v.o. × 1–2 días (extra de 10–20 mg cada 1–2 h) o lorazepam 1–2 mg/6 h. Bajar 5– 10 mg/día.", "Delirium tremens: – Diazepam IV 5–10 mg + 2 dosis más de 5–10 mg cada 5–10 min hasta que esté \"tranquilo pero despierto\", supervisado por el médico y monitorizado (SatO₂). – O midazolam 2–5 mg IV o IN cada 5 min (máximo 50 mg). – Más de 80–100 mg de diazepam en 1 h → UCI (fenobarbital 130–260 mg IV cada 15–20 min, o propofol).", "Lorazepam si hay hepatopatía o es >65 años (lorazepam 1–2 mg/6 h; reevaluar a la hora de cada dosis).", "Profilaxis al ingresar si ha tenido abstinencia grave o crisis previas: diazepam con la pauta de leve o moderada.", "Clometiazol (192 mg; pauta descendente de 9–12 días; no ambulatorio; deprime la respiración)."]}, {"type": "h", "text": "Coadyuvantes (nunca en monoterapia)"}, {"type": "list", "items": ["Haloperidol (½–1 ampolla IV cada 8–12 h) si hay alucinaciones o agitación grave (baja el umbral convulsivo; ECG antes).", "Propranolol 10–40 mg/6–8 h si hay hiperadrenergia o cardiopatía isquémica.", "Carbamazepina 200 mg/6 h en descenso (abstinencia leve). Gabapentina. Clonidina o dexmedetomidina (UCI)."]}, {"type": "h", "text": "Crisis"}, {"type": "list", "items": ["<3 crisis de abstinencia: no cambiar la pauta. Dar diazepam 10 mg IV extra. TC si es la primera crisis."]}, {"type": "h", "text": "Vitaminas e iones"}, {"type": "list", "items": ["Tiamina a TODOS antes de la glucosa: 100–250 mg/día IV o IM × 3–5 días, luego 100 mg/día.", "Wernicke: tiamina 500 mg/8 h IV × 3 días (en 200 mL de SF en 1 h), luego 250 mg/día × 5 días, luego 100 mg/día.", "Magnesio: 1 g/6–12 h IV si está bajo. Si hay arritmia: 3 g (2 ampollas de 1,5 g) en 250 mL en 10 min.", "Ácido fólico 5 mg/día (con B12). Complejo B1-B6-B12, 3 comprimidos al día."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Ingreso: abstinencia moderada o grave, DT, crisis, comorbilidad o Wernicke. UCI si el DT es refractario.", "Alta (leve, sin criterios de ingreso): vincular al CAS o centro de adicciones de referencia."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFEREN
