si no tolera la VO.", "RIFAXIMINA 400 mg/8 h (sobre todo para prevenir recurrencias, añadida al disacárido).", "Si no mejora: intensificar el tratamiento y replantear el diagnóstico. Avisar al digestólogo de guardia."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Guía EASL 2022: lactulosa de 1ª línea (el lactitol es equivalente). Rifaximina 550 mg/12 h como profilaxis secundaria (en España la presentación es de 400 mg/8 h; dosis equivalente). Pauta de ≥1,2–1,5 g/kg/día de proteínas y una colación nocturna.", "Amonio: la EASL 2022 recomienda medirlo. Un amonio normal hace poco probable la EH y obliga a buscar otra causa (VPN alto). El protocolo no lo pide.", "Polietilenglicol 4 L (ensayo HELP, JAMA Intern Med 2014; metaanálisis 2023): resuelve la EH antes que la lactulosa. Es una alternativa en la EH aguda.", "L-ornitina L-aspartato IV: opción adicional en la EH manifiesta que no responde (EASL 2022, evidencia moderada).", "TIPS: si la EH recurre, valorar reducir el calibre del stent."]}]}], "sources": "EASL Clinical Practice Guidelines on the management of hepatic encephalopathy (J Hepatol 2022); Rahimi RS et al. HELP trial (JAMA Intern Med 2014); Vilstrup H et al. AASLD/EASL HE guideline (Hepatology 2014).", "cats": ["dig"], "vital": false}, {"title": "Endocarditis infecciosa: profilaxis antibiótica", "page": 45, "protocol": "INFORMACIÓN PARA PACIENTES CON INDICACIÓN DE PROFILAXIS PARA ENDOCARDITIS", "service": "Cardiología/Infecciosas", "date": "feb 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Pacientes de ALTO riesgo (solo estos reciben profilaxis):", "Endocarditis previa.", "Válvula protésica (quirúrgica o transcatéter) o reparación valvular con material.", "Cardiopatía congénita cianótica no corregida, o corregida con conductos, shunts o prótesis.", "Asistencia ventricular como terapia de destino.", "Trasplante cardíaco."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Si el paciente consulta con fiebre + factor de riesgo valvular → descartar endocarditis activa (hemocultivos ×3 antes del antibiótico, ecocardiograma, criterios de Duke-ISCVID 2023)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Procedimientos con indicación de profilaxis (en pacientes de alto riesgo)"}, {"type": "list", "items": ["Dentales: limpieza dental profesional; manipulación gingival o periapical (raspado, endodoncia); extracción; cirugía oral (periodontal, implantes, biopsia).", "Vía respiratoria: amigdalectomía o adenoidectomía; broncoscopia con incisión de la mucosa.", "GI, GU, piel, musculoesquelético: no de forma general. Individualizar si el riesgo de sangrado o infección es alto (polipectomía; cistoscopia con antecedente de *E. faecalis*)."]}, {"type": "h", "text": "Pauta (DOSIS ÚNICA antes del procedimiento)"}, {"type": "list", "items": ["Sin alergia: amoxicilina 2 g VO 30–60 min antes.", "Alergia a penicilina: azitromicina 500 mg VO 2 h antes o doxiciclina 100 mg VO 2–3 h antes."]}, {"type": "h", "text": "Prevención general"}, {"type": "list", "items": ["Higiene dental 2 veces/día + revisión del dentista 1–2 veces/año. Higiene de manos y de heridas.", "No automedicarse con antibióticos. Evitar piercings y tatuajes."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Coincide con la ESC 2023 (endocarditis) y la AHA 2021: grupos de alto riesgo, profilaxis solo en procedimientos dentales de riesgo, amoxicilina 2 g y, en alérgicos, azitromicina, claritromicina o doxiciclina.", "La clindamicina ya no se recomienda (más *C. difficile* y reacciones adversas). El protocol d'Anticoagulació (2021) del propio hospital aún la cita, junto con pautas antiguas (ampicilina + gentamicina en procedimientos GI y GU). Hay que seguir este documento de 2025.", "ESC 2023: riesgo intermedio (valvulopatía nativa, prolapso con insuficiencia, miocardiopatía hipertrófica): profilaxis no recomendada de rutina, pero sí pueden considerarse (IIb) las medidas de higiene reforzadas.", "Alternativa IV si no hay VO: ampicilina 2 g o cefazolina o ceftriaxona 1 g IV (ESC 2023)."]}]}], "sources": "Delgado V et al. 2023 ESC Guidelines for the management of endocarditis (Eur Heart J 2023); Wilson WR et al. AHA Scientific Statement on prevention of viridans group streptococcal IE (Circulation 2021).", "cats": ["cardio", "infec"], "vital": false}, {"title": "Endoftalmitis infecciosa aguda postoperatoria", "page": 46, "protocol": "Endoftalmitis infecciosa aguda postoperatoria: protocolo y manejo urgente", "service": "Oftalmología", "date": "may 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Cirugía ocular en las 6 semanas previas (sobre todo cataratas: facoemulsificación + LIO) + dolor, ojo rojo, ↓ de la agudeza visual.", "Signos: edema corneal, inflamación de cámara anterior o hipopion, edema palpebral, ↓ del reflejo rojo, vitritis.", "Toda inflamación significativa tras una cirugía sin complicaciones = endoftalmitis hasta que se demuestre lo contrario."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Inflamación postoperatoria estéril (TASS), uveítis, queratitis, glaucoma agudo, herida no estanca (Seidel +).", "No dar corticoides antes de que lo vea Oftalmología (retrasan el diagnóstico)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Fuera de Oftalmología (Urgencias generales o planta): avisar SIN DEMORA al busca de Oftalmología de guardia.", "Lo que hará Oftalmología:", "AV (decisiva: ¿percepción de luz o mejor, o peor que percepción de luz?). Lámpara de hendidura (Tyndall según la clasificación SUN, herida, Seidel, suturas, ampolla filtrante). Foto del segmento anterior. Fondo de ojo. Ecografía en modo B si no se ve el fondo (vítreo, desprendimiento de retina, cuerpo extraño, restos de cristalino).", "Muestra de humor acuoso o vítreo para cultivo."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Urgente (en <3 h desde el diagnóstico clínico)"}, {"type": "list", "items": ["AV ≥ percepción de luz: toma de muestra + antibióticos intravítreos (0,1 mL): vancomicina 1 mg + ceftazidima 2 mg.", "AV < percepción de luz: vitrectomía pars plana en <6 h + biopsia vítrea + antibióticos intravítreos intraoperatorios (si es logísticamente posible)."]}, {"type": "h", "text": "Coadyuvantes"}, {"type": "list", "items": ["Tópico: acetato de prednisolona 1% o dexametasona 1% cada 2 h + ciclopléjico cada 12 h. Los antibióticos tópicos solo sirven si hay patología de la superficie (absceso, herida).", "Sistémico: vancomicina + amikacina IV no han demostrado beneficio (ensayo EVS). Moxifloxacino VO (buena penetración) o linezolid según el microorganismo."]}, {"type": "h", "text": "Seguimiento"}, {"type": "list", "items": ["Revisión cada 24–48 h (AV, segmento anterior, vitritis). Reinyectar antibióticos intravítreos según el cultivo y la evolución."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Guía ESCRS 2024 (endoftalmitis): la vitrectomía precoz se considera cada vez más también con AV ≥ percepción de luz, porque la cirugía actual tiene menos complicaciones. Es una diferencia con el criterio clásico del ensayo EVS (1995), que sigue el protocolo.", "Prevención (ESCRS): cefuroxima intracamerular 1 mg (o moxifloxacino intracamerular) al final de la cirugía de cataratas reduce la endoftalmitis unas 5 veces.", "Vancomicina intracamerular profiláctica: evitarla por el riesgo de vasculitis retiniana oclusiva hemorrágica (HORV) (ASCRS/ASRS 2017)."]}]}], "sources": "ESCRS Guideline for Cataract Surgery – endophthalmitis prevention and treatment (2024); Endophthalmitis Vitrectomy Study Group (Arch Ophthalmol 1995); ASCRS/ASRS statement on HORV (2017).", "cats": ["infec", "derm"], "vital": false}, {"title": "Enfermedad inflamatoria intestinal (EII) en Urgencias", "page": 47, "protocol": "PACIENTES CON EII", "service": "Protocol d'actuació a Urgències, Digestivo", "date": "mar 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Paciente con EII conocida que consulta por: brote (diarrea con sangre o productos patológicos, dolor), obstrucción, perforación, megacolon tóxico, fiebre, HDA o HDB, anemia, enfermedad perianal (absceso, fístula), uveítis (bilateral, fotofobia, ↓ de la AV), trombosis (TVP o TEP, también en remisión), efectos adversos del tratamiento.", "Efectos adversos: mielosupresión y pancreatitis por tiopurinas (azatioprina, mercaptopurina), hepatotoxicidad (metotrexato, tiopurinas), neurológicos por anti-TNF, efectos de los corticoides.", "Gravedad de la CU (Truelove-Witts): ≥6 deposiciones con sangre + fiebre >37,8 °C, FC >90, Hb <10,5 o VSG >30 → brote grave."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Infección: coprocultivo + toxina de C. difficile SIEMPRE ante un brote (\"no todo es brote\"), CMV en corticorrefractarios.", "Megacolon tóxico (Rx de abdomen en toda CU con fiebre).", "Absceso o perforación en la EC con fiebre alta y dolor (eco o TC).", "Infección oportunista si está inmunosuprimido."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Siempre: exploración abdominal, perianal, de piel y articulaciones. Hemograma, bioquímica, PCR. Coprocultivo + toxina de *C. difficile*. Hemocultivos si Tª >38 °C.", "Rx de abdomen: si se sospecha obstrucción, neumoperitoneo o dilatación, o si el brote es grave.", "Rx de tórax: si hay fiebre (sobre todo con inmunosupresores o biológicos) o si el brote es grave y va a ingresar.", "Eco o TC: absceso, complicación de la EC.", "No pedir endoscopia de rutina desde Urgencias (solo si hay HD grave)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Brote"}, {"type": "list", "items": ["Consultar SIEMPRE con Digestivo (busca 25414 las 24 h; de 8 a 15 h, digestólogo asignado a Urgencias → UAIEII).", "Ingreso si: brote grave, brote moderado refractario a corticoides orales, sospecha de complicación (abdomen agudo, absceso, megacolon, HD grave, fiebre sin foco en inmunosuprimido).", "Corticoide (lo decide Digestivo): prednisona 1 mg/kg/día VO (máx. 60 mg) + calcio + vitamina D. No usar dosis intermedias ni muy altas.", "Tópico (CU distal o síntomas rectales): mesalazina supositorio 1 g/24 h (recto) o enema (Salofalk 4 g, Pentasa 1 g/100 mL, Claversal 500 mg; llega al ángulo esplénico).", "HBPM profiláctica en casi todo ingreso (aunque haya rectorragia; no si la HDB es grave o hay coagulopatía).", "NO: dieta absoluta generalizada (solo si hay obstrucción, HD masiva, megacolon, perforación o cirugía), ATB de rutina en el brote, antidiarreicos (contraindicados en el brote grave)."]}, {"type": "h", "text": "Complicaciones"}, {"type": "list", "items": ["Perforación u obstrucción: soporte + Digestivo y Cirugía General.", "Fiebre en inmunosuprimido: despistaje de infección + consulta con Digestivo e Infecciosas. Suspender el inmunosupresor o biológico si hay infección activa (decisión conjunta).", "Enfermedad perianal (absceso o fístula): Digestivo + Cirugía (drenaje).", "ATB: metronidazol 500 mg/8 h ± ciprofloxacino 500 mg/12 h (o amoxicilina-clavulánico 875/125 mg/8 h) ≥10 días. Suspender temporalmente el inmunosupresor.", "HD grave: como cualquier HD grave (sin HBPM profiláctica).", "Anemia: hierro oral si tolera y no hay actividad importante; si no, hierro IV (UAIEII). Transfusión si es aguda. Mielotoxicidad por tiopurinas → suspender y consultar.", "Uveítis → Oftalmología urgente. TVP o TEP: anticoagular igual que en cualquier paciente (la rectorragia no lo contraindica).", "UAIEII: tel. 606 786 312 (L–V 8:30–13:30); malaltiainflamatoria@hospitaldelmar.cat."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["CU grave aguda (ECCO 2022, BSG 2025): metilprednisolona 60 mg/día IV (o hidrocortisona 100 mg/6 h). Reevaluar el día 3 con los criterios de Oxford/Travis (>8 deposiciones o 3–8 con PCR >45 → rescate con infliximab o ciclosporina, o colectomía). El protocolo no detalla la vía IV ni el rescate.", "Ustekinumab, vedolizumab, inhibidores de JAK (tofacitinib, upadacitinib) y risankizumab amplían el tratamiento. El upadacitinib se usa como rescate en la CU grave (series de 2023–2024). Las decisiones las toma la UAIEII.", "Tromboprofilaxis con HBPM en todo ingreso por brote, incluso con rectorragia (ECCO 2022). Coincide.", "Cribado de CMV (biopsia) en la CU refractaria a corticoides (ECCO)."]}]}], "sources": "Raine T et al. ECCO Guidelines on therapeutics in UC: medical treatment (J Crohns Colitis 2022); Gordon H et al. ECCO Guidelines on therapeutics in Crohn's disease (J Crohns Colitis 2024); Moran GW et al. BSG consensus guidelines on IBD in adults (Gut 2025).", "cats": ["dig"], "vital": false}, {"title": "Enfermedades del pericardio (pericarditis, derrame, taponamiento, constricción)", "page": 48, "protocol": "MALALTIES DEL PERICARDI", "service": "Cardiología y Urgencias", "date": "jun 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Pericarditis aguda (≥2 de 4 criterios ESC): – Dolor pleurítico retroesternal que mejora al sentarse o inclinarse hacia delante. – Roce (30 %). – ECG: ascenso del ST difuso y cóncavo + descenso del PR (60 %). – Derrame (60 %).", "Apoyan el diagnóstico: PCR, VSG o leucocitos altos, inflamación en TC o RM.", "Miopericarditis: troponina o CK elevadas.", "Por evolución: – Aguda <4–6 semanas. – Incesante 4–6 semanas a 3 meses sin remitir. – Recurrente: nuevo brote tras ≥4–6 semanas sin síntomas (20–30 %). – Crónica >3 meses.", "Taponamiento: disnea, taquicardia, IY, pulso paradójico (caída de la TAS >10 mmHg en inspiración), hipotensión o shock, bajos voltajes.", "Constrictiva: IC derecha con FEVI conservada, IY, signo de Kussmaul, *knock* pericárdico, calcificación en la Rx (tras radioterapia, cirugía cardiaca o TBC)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["SCA (ST convexo o territorial, ondas T negativas simultáneas con el ascenso del ST), disección aórtica, TEP.", "Causas no víricas: TBC, bacteriana o purulenta, neoplasia, autoinmune, uremia, hipotiroidismo, postinfarto o pospericardiotomía, fármacos, traumatismo.", "Factores de mal pronóstico (impiden el alta): – Fiebre >38 °C, curso subagudo. – Derrame grave (>20 mm) o taponamiento. – Sin respuesta a AINE en 7 días. – Miopericarditis, inmunodepresión, traumatismo, anticoagulación oral."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["A todos: ECG, Rx de tórax, analítica con PCR, leucocitos, troponina, hemograma, función renal y hepática, iones.", "Ecocardiograma (portátil si hay dudas: silueta grande, bajos voltajes). Derrame: leve <10 mm, moderado 10–20 mm, grave >20 mm.", "Taponamiento por eco: colapso diastólico de la AD o el VD, VCI >20 mm sin colapso inspiratorio, variación respiratoria del Doppler transmitral >25 %.", "Si es incesante, recurrente, no mejora en 1 semana o hay derrame moderado o grave: – Estudio de TBC: TC de tórax, PPD o IGRA. – Serologías: VIH, lúes, VHB, VHC (otras según la sospecha). – FR, ANA, anti-Ro, anti-La y TSH.", "Líquido pericárdico (si se drena): – Gram, Ziehl, cultivo de bacterias y hongos, PCR de TBC. – Células, glucosa, proteínas, LDH, ADA, gasometría. – Citología (enviar todo el volumen posible)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Pericarditis aguda"}, {"type": "list", "items": ["Reposo mientras dure la fiebre o el dolor; restricción de ejercicio hasta normalizar la PCR, el ECG y la eco. Deportistas: ≥3 meses.", "AINE a dosis altas × 2 semanas, con descenso lento: – AAS 1 g/6–8 h (bajar 500 mg por semana). – O ibuprofeno 600 mg/8 h (bajar 200 mg por semana). – Si vuelve el dolor, volver a la dosis previa 1 semana. Añadir protección gástrica.", "Colchicina 0,5 mg/12 h (0,5 mg/24 h si pesa <70 kg o hay intolerancia) × 3 meses: – Primera línea en la guía ESC. En el protocolo, obligada en la recurrente (≥2 brotes) o si no se controla con AINE. – Mitad de dosis si FG <30. Contraindicada si FG <10, en diálisis o en la IH grave.", "Corticoides NUNCA en primera línea (favorecen las recidivas; contraindicados si se sospecha causa bacteriana o TBC). – Solo si hay enfermedad autoinmune, pospericardiotomía o pericarditis urémica refractarias, o contraindicación del resto. – Prednisona 0,2–0,5 mg/kg/día 3–4 semanas con descenso muy lento.", "TBC: tratar solo si el diagnóstico es seguro."]}, {"type": "h", "text": "Derrame sin taponamiento"}, {"type": "list", "items": ["Tratar la causa. Sin pericardiocentesis salvo taponamiento o sospecha de pericarditis purulenta (individualizar en la urémica o la TBC).", "Sin inflamación, ni AINE ni colchicina ni corticoides reducen el derrame.", "Grave, sintomático, crónico (>3 meses) y refractario: pericardiocentesis. Recurrente: ventana pericárdica."]}, {"type": "h", "text": "Taponamiento"}, {"type": "list", "items": ["Pericardiocentesis urgente subxifoidea o apical, guiada por eco o escopia. Dejar drenaje ≥24 h (hasta que drene <25 mL/24 h).", "Mientras tanto: sueroterapia (aumentar la precarga). Nada de diuréticos ni vasodilatadores.", "Recidivante: pericardiostomía o talcaje (decisión multidisciplinar; causa oncológica)."]}, {"type": "h", "text": "Constrictiva"}, {"type": "list", "items": ["Diuréticos (síntomas). Tratamiento definitivo: pericardiectomía. Tuberculostáticos si es TBC."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Avisar a Cardiología: derrame importante, ausencia de respuesta o criterios de mal pronóstico.", "Con factor de mal pronóstico: observación o ingreso ≥24–48 h.", "Sin factores de riesgo y con buen control con AINE: alta y control por el médico de familia.", "Sin respuesta en 1 semana (sin gravedad): cardiólogo de zona.", "Incesante o recurrente (≥3 episodios al año): consulta CAR-5 (tel. 3118)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["ESC 2025 (guía de miocarditis y pericarditis):", "Colchicina de primera línea junto al AINE en TODA pericarditis aguda (clase I; reduce las recurrencias ≈50 %; COPE, ICAP). El protocolo la reserva para algunos casos.", "Anti-IL-1 (anakinra, rilonacept) en la recurrente refractaria a colchicina y dependiente de corticoides (clase I en la ESC 2025; ensayo RHAPSODY, 2021).", "Restricción de ejercicio: deportistas de competición ≥3 meses. Para el resto, hasta la remisión. En la miopericarditis, 3–6 meses.", "AAS de elección en la pericarditis postinfarto y en el embarazo (≤20 semanas)."]}]}], "sources": "Adler Y et al. 2015 ESC Guidelines for the diagnosis and management of pericardial diseases (Eur Heart J 2015); Schulz-Menger J et al. 2025 ESC Guidelines for myocarditis and pericarditis (Eur Heart J 2025); Klein AL et al. RHAPSODY – Rilonacept (NEJM 2021); Imazio M et al. ICAP (NEJM 2013).", "cats": ["cardio"], "vital": false}, {"title": "Esclerosis múltiple: diagnóstico y seguimiento", "page": 50, "protocol": "PROTOCOL DE DIAGNÒSTIC I SEGUIMENT EN ESCLEROSI MÚLTIPLE", "service": "Neurología", "date": "ene 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["CIS (síndrome clínico aislado): primer episodio agudo o subagudo >24 h compatible con desmielinización: neuritis óptica, tronco o cerebelo, hemisferio, médula, multifocal.", "RIS (síndrome radiológico aislado): lesiones típicas de EM en una RM hecha por otro motivo.", "Diagnóstico: criterios de McDonald 2017 (diseminación en espacio y tiempo + exclusión de otras causas)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Brote vs pseudobrote: fiebre, infección (ITU), calor o estrés empeoran síntomas antiguos de forma transitoria. Descartar infección antes de tratar un \"brote\".", "Otros: NMOSD (anti-AQP4), MOGAD (anti-MOG), ictus, vasculitis, sarcoidosis, déficit de B12, compresión medular."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Paciente no diagnosticado: analítica de cribado (\"perfil neuro esclerosi múltiple\"), RM cerebral + médula cervical, PEV (opcional), PL con bandas oligoclonales (+ suero a la vez).", "RIS: analítica de cribado + PL (aporta pronóstico).", "Ya diagnosticado: las pruebas que falten. RM si la última tiene >5 años o se va a empezar tratamiento.", "RM de control: RIS a los 6 meses; CIS a los 3 y 6 meses si no cumple McDonald; antes de empezar o cambiar el tratamiento; si planea embarazo; si quiere dejar el tratamiento; si hay dudas de que sea un brote."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Seguimiento (Neurología, consultas)"}, {"type": "list", "items": ["EM, CIS o RIS: visita trimestral el 1er año, y después según el tratamiento (inmunomodulador estable: cada 3–6 meses; resto: cada 6–12 meses). Analítica según el protocolo de cada fármaco."]}, {"type": "h", "text": "Brote agudo en Urgencias (no incluido en el protocolo; práctica estándar)"}, {"type": "list", "items": ["Descartar infección (sedimento, PCR) y pseudobrote. Contactar con Neurología de guardia.", "Brote discapacitante: metilprednisolona 1 g/día IV o VO × 3–5 días (sin pauta descendente). Si no responde: plasmaféresis."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Criterios de McDonald revisados en 2024 (presentados en ECTRIMS 2024, publicados en 2025):", "Añaden el nervio óptico como 5ª localización.", "Incluyen el signo de la vena central y las lesiones con anillo paramagnético como biomarcadores de RM.", "Aceptan las cadenas ligeras libres kappa en LCR como alternativa a las bandas oligoclonales.", "Permiten diagnosticar EM en algunos RIS sin clínica.", "Brote (ECTRIMS/EAN 2018; NICE NG220 2022): metilprednisolona 500 mg–1 g/día, 3–5 días, IV o VO (la VO es equivalente; ensayo COPOUSEP). Plasmaféresis en el brote grave que no responde a corticoides.", "NMOSD y MOGAD: pedir anticuerpos anti-AQP4 y anti-MOG en el debut atípico (neuritis óptica bilateral o grave, mielitis longitudinal extensa). Algunos tratamientos de la EM empeoran la NMOSD."]}]}], "sources": "Montalban X et al. 2024 revisions of the McDonald criteria (Lancet Neurol 2025); Montalban X et al. ECTRIMS/EAN guideline on pharmacological treatment of MS (Mult Scler 2018); NICE NG220 Multiple sclerosis in adults (2022).", "cats": ["neuro"], "vital": false}, {"title": "Estado epiléptico (y serie de crisis)", "page": 51, "protocol": "PROTOCOLO ESTADO EPILÉPTICO", "service": "Neurología/Unidad de Epilepsia", "date": "v3, abr 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Estado epiléptico convulsivo (cualquier fase tónico-clónica bilateral): tratar a partir de los 5 min (T1); riesgo de secuelas a partir de los 30 min (T2).", "Focal (con o sin alteración de conciencia) o ausencias: T1 10 min, T2 60 min.", "Serie (cluster): ≥3 crisis en 24 h con recuperación entre ellas (o ≥2 tónico-clónicas en 1 h).", "Refractario: no cede tras BZD + 1 fármaco anticrisis. Superrefractario: persiste >24 h con anestesia o reaparece al retirarla.", "Crisis de alto riesgo: ADAN >1 (lenguaje anormal, desviación ocular, automatismos, nº de crisis), primera crisis, embarazo, mala adherencia (>24 h sin tomar la medicación), fiebre, comorbilidad psiquiátrica grave, crisis con traumatismo.", "Pronóstico (STESS modificado): 0–2 bueno; >4 → mortalidad >80%."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Hipoglucemia, hiponatremia, hipocalcemia o hipomagnesemia, tóxicos o abstinencia, infección del SNC, ictus o HIC, tumor, eclampsia (gestante), crisis psicógena.", "EE no convulsivo si no recupera la conciencia → EEG."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucemia capilar YA.", "Hemograma, glucosa, gasometría + lactato, función renal, Na, Ca, función hepática, amonio, niveles de fármacos (Mg y P si la causa no está clara). β-HCG. Tóxicos en orina.", "TC craneal urgente: primera crisis, cambio de semiología, EE, no vuelve a su estado basal (angio-TC venoso si se sospecha trombosis o HTIC). RM si la causa no está clara.", "PL solo si se sospecha infección o neoplasia (una crisis prolongada puede dar pleocitosis leve).", "Vídeo-EEG urgente si: EE refractario, sospecha de EE no convulsivo, no recupera el basal, está sedado.", "NORSE (sin causa en 24–72 h y sin epilepsia previa): PL obligatoria + anticuerpos autoinmunes y onconeuronales + buscar neoplasia."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 0 · Estabilización (0–5 min)"}, {"type": "list", "items": ["ABCD, anotar la hora de inicio, monitor y ECG, O2, vía venosa + analítica.", "Si la glucemia es <60: tiamina 100 mg IV y después SG 40% 60 mL IV (o glucagón IM)."]}, {"type": "h", "text": "Fase 1 · BZD (5–20 min; en el focal, a los 10 min)"}, {"type": "list", "items": ["CON vía venosa:", "Clonazepam 1 mg IV en 2 min (0,5 mg en ancianos), repetible a los 5 min (máx. 4 mg). De elección.", "O diazepam 10 mg IV (5 mg si <50 kg o anciano), repetible (máx. 20 mg).", "O midazolam 5–10 mg IV.", "SIN vía venosa: MIDAZOLAM 10 mg IM (>40 kg). Alternativas: midazolam bucal 10 mg, diazepam rectal 10 mg.", "Serie de crisis: lorazepam 1–2 mg o clonazepam 0,5–1 mg sublingual (entre labio y encía)."]}, {"type": "h", "text": "Fase 2 · Fármaco anticrisis (20–40 min; 5–10 min después de la BZD)"}, {"type": "list", "items": ["LEVETIRACETAM 40–60 mg/kg IV (máx. 4500 mg) en 100 mL, en 5–10 min → a las 12 h, 1500 mg/12 h (ajustar a la función renal). De elección si ya lo tomaba, hay hepatopatía o interacciones. Evitarlo si hay antecedente psiquiátrico.", "VALPROATO 40 mg/kg IV (máx. 3000 mg; 20 mg/kg y máx. 1500 mg en ancianos o <50 kg) en 10 min → a los 30 min, perfusión de 1 mg/kg/h. De elección en la epilepsia generalizada genética.", "Evitar el valproato en: hepatopatía, enfermedad mitocondrial, pancreatitis, coagulopatía, embarazo, ictus o HIC agudos, neurocirugía reciente.", "Alternativas:", "Lacosamida 5 mg/kg (máx. 400 mg) en 15 min → 200 mg/12 h. Evitar si hay BAV o con fenitoína.", "Fenitoína 20 mg/kg (máx. 1500 mg) a ≤50 mg/min en SF (no con SG), con monitor → 100 mg/8 h. Evitar si hay cardiopatía, hipoTA, epilepsia generalizada genética o intoxicaciones.", "Fenobarbital 15–20 mg/kg a ≤60 mg/min → 100 mg/12 h."]}, {"type": "h", "text": "Fase 3 · Refractario (40–60 min)"}, {"type": "list", "items": ["EE convulsivo → anestesia IV con UCI + EEG (sin retrasarlo más de 30 min tras la fase 2):", "Midazolam: bolo de 0,1–0,2 mg/kg y después 0,1–0,4 mg/kg/h (de elección).", "Propofol: 3–5 mg/kg y después 4–5 mg/kg/h (vigilar el PRIS).", "Ketamina: 0,5–3 mg/kg y después 1–10 mg/kg/h.", "Tiopental: 2–3 mg/kg y después 3–5 mg/kg/h.", "Mantener 24 h la supresión de crisis o el brote-supresión y retirar un 20–25% cada 4 h.", "Focal con alteración de conciencia: añadir otro fármaco no BZD (se puede esperar 4–6 h en el epiléptico conocido) antes de anestesiar.", "Focal sin alteración de conciencia: no anestesiar."]}, {"type": "h", "text": "Superrefractario"}, {"type": "list", "items": ["Perampanel, clobazam o topiramato por SNG; brivaracetam IV; ketamina; isoflurano.", "Inmunoterapia: metilprednisolona 1 g × 3–5 días, IGIV 0,4 g/kg/día × 5 o plasmaféresis; después rituximab, anakinra o tocilizumab.", "Dieta cetogénica, hipotermia, ECT, estimulación del nervio vago."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Ensayo ESETT (NEJM 2019): levetiracetam 60 mg/kg, fosfenitoína 20 mg/kg y valproato 40 mg/kg tienen la misma eficacia (~47%) en el EE establecido. Respalda la elección por perfil de seguridad. Coincide.", "BZD infradosificadas: es el error más frecuente y se asocia a refractariedad. AES 2016 y NICE 2022: dosis completas desde el principio (p. ej. midazolam IM 10 mg; diazepam 0,15–0,2 mg/kg hasta 10 mg/dosis).", "Clonazepam IV: es la pauta europea (ESETT y la AES no lo evalúan). El lorazepam IV 0,1 mg/kg es el estándar norteamericano, pero no está comercializado por vía IV en España.", "Ketamina más precoz: el EE refractario se plantea cada vez más con ketamina (antagonista NMDA) en la fase 3 o antes (series de casos y revisiones de 2023–2024).", "NORSE/FIRES: consenso internacional de 2022: inmunoterapia de 1ª línea en ≤72 h y de 2ª línea en ≤7 días si no responde."]}]}], "sources": "Kapur J et al. ESETT (N Engl J Med 2019); Glauser T et al. AES guideline convulsive SE (Epilepsy Curr 2016); NICE NG217 Epilepsies (2022); Wickstrom R et al. International consensus on NORSE/FIRES (Epilepsia 2022).", "cats": ["neuro"], "vital": true}, {"title": "Faringoamigdalitis aguda del adulto (y absceso periamigdalino)", "page": 53, "protocol": "PROTOCOLO FARINGOAMIGDALITIS EN ADULTOS", "service": "Urgencias/ORL", "date": "mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Vírica en el 80–95%. EBHGA solo en el 5–15% de los adultos.", "Centor-McIsaac (1 punto cada uno): fiebre >38 °C, exudado o hipertrofia amigdalar, adenopatías laterocervicales dolorosas, ausencia de tos; −1 si ≥45 años.", "0–1: no hacer prueba ni dar ATB. ≥2: test rápido (TDR) de Strep A (VPN 98,5%).", "Síndrome mononucleósico (VEB, CMV, primoinfección VIH): fiebre, astenia, adenopatías, esplenomegalia, transaminasas altas.", "ATB sin TDR si: brote comunitario (escarlatina), inmunodeprimido, antecedente de fiebre reumática, clínica muy grave, ATB en las 2 semanas previas."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Absceso periamigdalino: odinofagia unilateral intensa irradiada al oído, trismus, voz gangosa, úvula desviada, abombamiento amigdalar.", "Infección parafaríngea o retrofaríngea, angina de Ludwig (celulitis del suelo de la boca: TC, vía aérea), síndrome de Lemierre (dolor laterocervical + bacteriemia + émbolos sépticos: hemocultivos + eco o TC cervical).", "Epiglotitis (estridor, babeo). Gonococo (sexualmente activo). Difteria. Angina de Plaut-Vincent."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["TDR Strep A (kit Abbott, resultado en 5 min) si Centor ≥2.", "Síndrome mononucleósico: anticuerpos heterófilos (VEB) + anti-VIH (programa VIHgila); CMV al laboratorio central.", "Complicación: analítica (hemograma, PCR), cultivo, TC cervical, valoración por ORL."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Sintomático (Centor 0–1 o TDR negativo; también como complemento)"}, {"type": "list", "items": ["Ibuprofeno 400 mg/8 h o diclofenaco 50 mg/8 h (algo mejores que el paracetamol) o paracetamol 0,5–1 g/6 h.", "Flurbiprofeno 8,75 mg en pastillas (máx. 5/día). Ambroxol 20 mg en pastillas.", "Corticoide oral (prednisona 1 mg/kg o metilprednisolona 40 mg/8–12 h): no de rutina; para un alivio rápido y siempre con ATB si es bacteriana."]}, {"type": "h", "text": "Antibiótico (solo si el TDR es POSITIVO para EBHGA)"}, {"type": "list", "items": ["De elección: penicilina V (fenoximetilpenicilina) 500 mg/12 h × 10 días.", "2ª opción: amoxicilina 500 mg/8 h × 10 días (evitarla si se sospecha VEB: exantema).", "Alergia: clindamicina 150–300 mg/8 h × 10 días (o josamicina 1 g/12 h, diacetilmidecamicina 600 mg/12 h). ~10% de resistencia a los macrólidos de 14 y 15 átomos.", "Mal cumplimiento: penicilina G benzatina 1,2 MUI IM en dosis única.", "Recidiva o mala evolución: amoxicilina-clavulánico 500/125 mg/8 h × 10 días."]}, {"type": "h", "text": "Absceso o flemón periamigdalino"}, {"type": "list", "items": ["Valoración por ORL: punción-aspiración o incisión y drenaje + ATB (amoxicilina-clavulánico o clindamicina; IV si no tolera la VO) + analgesia. Ingreso si hay compromiso de la vía aérea o no tolera la VO.", "Derivar a ORL si: FAA de >2 semanas, no tolera líquidos, sospecha de difteria, Vincent o Ludwig, obstrucción, complicación locorregional."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["NICE NG84 (2018) / guía ESCMID: con FeverPAIN o Centor bajos, no dar ATB. Con riesgo alto: ATB inmediato o diferido. La NICE acepta penicilina V 5–10 días.", "Duración: un ensayo sueco (Skoog, BMJ 2019) mostró que penicilina V 800 mg/6 h × 5 días no es inferior a 10 días. El protocolo mantiene 10 días.", "Corticoide en dosis única (dexametasona 10 mg): un metaanálisis BMJ 2017 (Sadeghirad) y la guía BMJ Rapid Recommendations 2017 apoyan una dosis única para el dolor intenso aunque no haya ATB. El protocolo lo condiciona al ATB.", "Absceso periamigdalino: la aspiración con aguja es tan eficaz como la incisión (Cochrane 2016). Una dosis de corticoide acelera la mejoría."]}]}], "sources": "NICE NG84 Sore throat (acute): antimicrobial prescribing (2018); Skoog Ståhlgren G et al. (BMJ 2019); Sadeghirad B et al. Corticosteroids for sore throat (BMJ 2017); ESCMID Sore Throat Guideline Group (Clin Microbiol Infect 2012).", "cats": ["infec", "derm"], "vital": false}, {"title": "Fibrilación auricular", "page": 54, "protocol": "PROTOCOLO DE FIBRILACIÓN AURICULAR (v6.25, jun 2025) – Urgencias/Cardiología", "service": "", "date": "", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["ECG: RR irregular, sin ondas P, ondas f. Palpitaciones, disnea, dolor torácico, mareo, fatiga, poliuria. Síncope poco frecuente (pensar en EAo, MCHO o vía accesoria).", "Tipos: primer episodio · paroxística (<7 días) · persistente (>7 días) · persistente de larga duración (≥12 meses, se busca el ritmo) · permanente (no se busca el ritmo).", "Buscar desencadenantes: infección o neumonía, TEP, SCA, tirotoxicosis (también por amiodarona), alcohol, cafeína, derrame pleural o pericárdico, hemorragia, cirugía, EPOC o SAHS."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Inestabilidad hemodinámica → CVE inmediata.", "IC (signos de congestión), embolias periféricas (extremidad, mesentérica, renal), preexcitación/WPW (FA irregular con QRS ancho: no dar frenadores del nodo AV), flutter, TEP."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["ECG + monitorización. Analítica: creatinina, iones, hemograma, TP/INR, TTPA. TSH si es el primer episodio o se sospecha tirotoxicosis por amiodarona.", "Rx de tórax. EcoTT si hay IC (si no, ambulatorio). EcoTE antes de la CV en el no anticoagulado (lo decide Cardiología). Angio-TC si se sospecha TEP.", "CHA2DS2-VA (IC 1, HTA 1, edad ≥75 2, DM 1, ictus/AIT/embolia 2, vasculopatía 1, edad 65–74 1; el sexo ya no puntúa) y HAS-BLED (≥3 = riesgo alto: no contraindica anticoagular, obliga a corregir factores).", "¿Toma realmente el ACOD? Dabigatrán alarga el TTPA y rivaroxabán sube el INR; apixabán y edoxabán pueden dar coagulación normal."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Anticoagulación (no depende del tipo de FA ni del ritmo actual)"}, {"type": "list", "items": ["CHA2DS2-VA 0: no anticoagular ni antiagregar · 1: considerar · ≥2: anticoagular · MCH o amiloidosis: anticoagular siempre.", "ACOD de elección, salvo en prótesis mecánica o estenosis mitral moderada-grave → AVK (INR 2–3). Con AVK y TRT >70%: mantenerlo; si TRT <70%: cambiar a ACOD.", "Apixabán 5 mg/12 h (2,5 mg/12 h si cumple ≥2 de: ≥80 años, ≤60 kg, Cr ≥1,5; o si FG 15–29).", "Rivaroxabán 20 mg/24 h (15 mg si FG 15–50).", "Edoxabán 60 mg/24 h (30 mg si FG 15–50, ≤60 kg o toma inhibidores de la P-gp).", "Dabigatrán 150 mg/12 h (110 mg/12 h si ≥80 años, toma verapamilo, FG 30–50 + HAS-BLED ≥3, 75–80 años + HAS- BLED ≥3 o esofagitis). Antídoto: idarucizumab.", "No reducir dosis sin indicación (aumenta la mortalidad). Se considera anticoagulado 2 h después de la dosis de ACOD.", "Si se inicia AVK con CHA2DS2-VA ≥2: puente con enoxaparina 1 mg/kg/12 h SC (≥75 años 0,75 mg/kg/12 h; FG ≤30 1 mg/kg/24 h); INR a los 3 días.", "No añadir antiagregante (solo tras stent, ≤12 meses). Receta del ACOD: marcar la casilla de validación por FA (si no, el paciente paga el importe completo)."]}, {"type": "h", "text": "Fase 2 · Control de frecuencia (siempre, para controlar síntomas)"}, {"type": "list", "items": ["Sin IC ni FEVI <40%: betabloqueante o calcioantagonista no DHP.", "Metoprolol IV 2,5–5 mg en 1–2 min; repetir cada 5 min hasta 15 mg (máx. 20). VO a los 60 min. No usar si TAS <100.", "Esmolol: bolo de 0,5 mg/kg en 1 min y después 0,05 mg/kg/min (≈18 mL/h en 60 kg con 10 mg/mL); doblar cada 4 min hasta 0,3 mg/kg/min.", "Verapamilo IV 0,075–0,15 mg/kg (≈5 mg) en 5 min; VO 120–360 mg/día. Diltiazem solo VO 60 mg/8 h (no hay presentación IV).", "Con congestión, IC aguda o FEVI <40%: NO betabloqueante IV ni verapamilo/diltiazem → DIGOXINA 0,5 mg IV en bolo, y después 0,25 mg/6 h hasta 0,75–1,5 mg en 24 h; mantenimiento 0,25 mg/día (5 días/semana). Evitar en insuficiencia renal y MCHO. Y/o amiodarona IV (en el crítico o con FEVI muy deprimida).", "Amiodarona IV: 300 mg en 250 mL SG5% en 30–60 min, y después 900–1200 mg en 500 mL SG5% en 24 h (21 mL/h), mejor por vía central. Puede cardiovertir, así que no es de 1ª línea para controlar la frecuencia.", "Asma: evitar carvedilol y betabloqueantes no cardioselectivos. Digoxina nunca en monoterapia, salvo en pacientes muy sedentarios.", "Al alta: bisoprolol 2,5–10 mg/día (precaución con el broncoespasmo), nebivolol 2,5–10 mg (anciano frágil o con insuficiencia renal), diltiazem o verapamilo VO."]}, {"type": "h", "text": "Fase 3 · Control del ritmo en Urgencias (paciente estable)"}, {"type": "list", "items": ["Se puede cardiovertir en Urgencias si: FA ≤24 h o anticoagulación correcta ≥3 semanas comprobada.", "No cardiovertir; control de frecuencia + ACOD + Ruta FA si: >24 h sin anticoagular, inicio desconocido o anticoagulación no garantizada. Si no puede esperar → EcoTE.", "Favorecen buscar el ritmo: <70 años, primer episodio, FA paroxística, causa transitoria, FA mal tolerada. En contra: FA >1 año, ≥2 CVE o fármacos fracasados, recaída <1 mes, AI >55 mm, rechazo del paciente.", "Sin cardiopatía estructural (se puede asumir sin eco si anamnesis, exploración, ECG y Rx son normales):", "Flecainida VO 200 mg (<70 kg) / 300 mg (≥70 kg), o propafenona VO 450 / 600 mg, en dosis única. Dar metoprolol 2,5 mg IV 10 min antes (evita el flutter 1:1). Esperar respuesta 6–8 h. Evitar en cardiopatía isquémica o flutter.", "Vernakalant IV 3 mg/kg en 10 min (70 kg: 52,5 mL a 315 mL/h). Si no revierte en 15 min: 2 mg/kg en 10 min. Respuesta en ~11 min.", "Contraindicaciones del vernakalant: TAS <100, SCA <30 días, NYHA III–IV o FEVI ≤35%, QT >440 ms, EAo grave. Vale en cardiopatía moderada, incluida la isquémica no reciente.", "Cardiopatía estructural significativa: amiodarona IV 5 mg/kg (300 mg) en 30–60 min + 1200 mg en 24 h. Esperar 24 h antes de considerarla fallida. No es útil en el flutter.", "Si fracasa 1 antiarrítmico → CVE (no probar un segundo fármaco)."]}, {"type": "h", "text": "Fase 4 · Cardioversión eléctrica"}, {"type": "list", "items": ["Contraindicada en intoxicación digitálica (>2 ng/mL) o hipopotasemia. Avisar a Anestesia y a Cardiología.", "Si es una CVE inmediata por inestabilidad en paciente no anticoagulado: enoxaparina 30 mg IV en bolo.", "Sedación: propofol 1–2,5 mg/kg o midazolam 3–15 mg (este último si hay inestabilidad).", "Choque sincronizado 200 J bifásico (360 J si es monofásico), con palas anteroposteriores. Si lleva marcapasos: avisar a Cardiología y alejar las palas del generador.", "Observación monitorizada 2 h."]}]}, {"key": "destino", "label": "DESTINO / ALTA", "blocks": [{"type": "list", "items": ["CV diferida (Ruta FA): <75 años → dispensario CAR 37 pre-CVE; >75 años → cardiólogo de zona o CAP. Dar el alta con control de frecuencia + ACOD.", "Tras cualquier CV (también la espontánea): anticoagular 4 semanas, y después según CHA2DS2-VA (0 → suspender; 1 → considerar; ≥2 → indefinida).", "Control de comorbilidades: TA <130/80, iSGLT2 si hay IC, alcohol ≤3 bebidas/semana, perder ≥10% del peso si IMC >25, buscar SAOS.", "Antiarrítmico a largo plazo (lo decide Cardiología): FEVI ≤40% → amiodarona; coronariopatía o valvulopatía → amiodarona, sotalol o dronedarona; sin cardiopatía → flecainida, sotalol o dronedarona."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["ESC/EACTS 2024: el protocolo ya sigue lo principal (CHA2DS2-VA, umbral de 24 h para cardiovertir sin anticoagulación previa, no añadir antiagregantes).", "Estrategia «esperar y ver» (wait-and-see): la ESC 2024 la recomienda igual que la CV inmediata (IIa) en la FA reciente y estable, con control de frecuencia y ACOD: la mayoría revierten solas en 48 h (ensayo RACE 7 ACWAS). Es una opción válida para evitar CV en Urgencias.", "Ablación como 1ª línea en la FA paroxística de pacientes seleccionados (ESC 2024: I; ACC/AHA 2023: I). Vale la pena derivar pronto al paciente joven y sintomático.", "Control precoz del ritmo (EAST-AFNET 4): reduce eventos CV si la FA tiene <1 año de evolución.", "Diferencias con ACC/AHA/ACCP/HRS 2023: mantiene el umbral de 48 h y el CHA2DS2-VASc, y anticoagula en hombres ≥2 y mujeres ≥3.", "Frecuencia objetivo: control laxo, <110 lpm en reposo (RACE II), aceptado por ambas guías.", "Anticoagulación tras una FA de <24 h con CHA2DS2-VA 0: la ESC 2024 la deja como opcional (IIa). El protocolo la indica durante 4 semanas en todos.", "FA subclínica detectada por dispositivo: en ARTESIA (apixabán) y NOAH (edoxabán), anticoagular redujo poco los ictus y aumentó las hemorragias. Por eso la ESC 2024 lo recomienda solo de forma selectiva (IIb). Coincide con el protocolo."]}]}], "sources": "Van Gelder IC et al. 2024 ESC/EACTS Guidelines for AF (Eur Heart J 2024); Joglar JA et al. 2023 ACC/AHA/ACCP/HRS AF Guideline (Circulation 2024); Pluymaekers NAHA et al. RACE 7 ACWAS (N Engl J Med 2019); Kirchhof P et al. EAST-AFNET 4 (N Engl J Med 2020).", "cats": ["cardio"], "vital": false}, {"title": "Fiebre y enfermedades importadas del viajero o migrante (malaria, diarrea, tifoidea, arbovirus)", "page": 56, "protocol": "ACTUALIZACIÓN EN ENFERMEDADES IMPORTADAS", "service": "Unidad de Salud Internacional, Infecciosas", "date": "nov 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Fiebre procedente del trópico sin diagnóstico = PALUDISMO hasta que se demuestre lo contrario. – África: el 70 % es tropical; **el 91 % de las malarias son por *P. falciparum***. – Asia: el 50 % es tropical (arbovirus 20 %, tifoidea 33 %, malaria 3 %).", "Historia epidemiológica: destino y ruta migratoria, fecha de regreso (incubación), exposiciones (agua dulce, animales, sexo, picaduras), vacunas, repelentes y quimioprofilaxis. ¿Es un VFR (viajero que visita a familiares y amigos)?", "Arbovirus (incubación <14 días): fiebre + exantema + artromialgias + cefalea. – Dengue: fiebre alta, leucopenia, plaquetopenia, hemorragias. – Chikungunya: artritis intensa. – Zika: conjuntivitis, prurito, exantema (Guillain-Barré, microcefalia).", "Tifoidea: fiebre escalonada >3 días, bradicardia relativa, dolor abdominal, roséola, hepatoesplenomegalia. Perforación en la 3.ª semana.", "Diarrea del viajero (40–60 %): ETEC 50 %, *Campylobacter*, *Salmonella*, *Shigella*, *Giardia*.", "Pistas del hemograma: – Leucopenia: malaria, arbovirus, tifoidea, rickettsias, brucelosis. – Plaquetopenia: malaria, dengue. – Eosinofilia: helmintos de ciclo tisular.", "Larva migrans cutánea: dermatitis serpiginosa → albendazol."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Las infecciones comunes (son las más frecuentes): neumonía, ITU, VIH agudo.", "Malaria grave: – Postración, alteración de la conciencia o convulsiones, insuficiencia respiratoria, hemorragia, shock. – Bilirrubina >3, Hb <5, hipoglucemia, acidosis, IRA. – Parasitemia >2,5 % (>10 % en semiinmunes).", "Dengue grave (fuga plasmática, sangrado, fallo orgánico; ver la ficha de dengue). Leptospirosis, rickettsiosis, fiebres hemorrágicas virales (aislar si es compatible).", "Meningitis concomitante en la malaria cerebral (PL)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemograma, coagulación, función renal y hepática, glucosa, láctico.", "2 hemocultivos, sedimento ± urocultivo, Rx de tórax.", "Malaria: **antígeno de *Plasmodium* + frotis (pedirlo como \"Parásitos en sangre\" en urgencias): especie y % de parasitemia**. Repetir si es negativo y persiste la sospecha (cada 12–24 h × 3). PCR si hay dudas.", "Arbovirus: – Antígeno NS1 de dengue en urgencias (primera semana) ± PCR (LRC). – Serologías de dengue, Zika y chikungunya si han pasado >7 días (reacciones cruzadas). – Alta sospecha (fiebre <7 días, zona tropical o subtropical, malaria descartada): pedir \"antigen i anticossos dengue (ic) m biològica [8844]\" al LRC + ficha epidemiológica (Salud Pública).", "Diarrea: coprocultivo + estudio de parásitos.", "VIH y serologías según el caso."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Malaria por *P. falciparum* no complicada"}, {"type": "list", "items": ["Primera línea, ACT: artemeter-lumefantrina (Riamet®) o dihidroartemisinina-piperaquina (Eurartesim®). Nunca en monoterapia.", "Alternativas: – Atovacuona-proguanil 250/100 mg, 4 comprimidos cada 24 h × 3 días (con comida grasa). – Quinina + doxiciclina. – Quinina + clindamicina (1.er trimestre del embarazo).", "Ingreso si hay plaquetopenia, intolerancia oral o mala adherencia."]}, {"type": "h", "text": "Malaria grave"}, {"type": "list", "items": ["Artesunato IV 2,4 mg/kg a las 0, 12 y 24 h, luego cada 24 h hasta pasar a la vía oral (atovacuona-proguanil, doxiciclina o clindamicina). 7 días en total. Vigilar la hemólisis tardía (días 7–30).", "UCI: glucosa, láctico, hematocrito y parasitemia cada 6 h. Transfundir si Hb <7. BZD si hay convulsiones. Balance hídrico cuidadoso."]}, {"type": "h", "text": "Diarrea del viajero"}, {"type": "list", "items": ["Hidratación.", "ATB solo si dura >7 días, fiebre >38,5 °C, productos patológicos o dolor intenso: azitromicina 1 g en dosis única o 500 mg/24 h × 3 días."]}, {"type": "h", "text": "Fiebre tifoidea"}, {"type": "list", "items": ["Ceftriaxona 1–2 g/24 h × 10–14 días (o cefixima, amoxicilina-clavulánico).", "Grave o procedente del sur o sudeste asiático (Pakistán: XDR): carbapenem (± azitromicina)."]}, {"type": "h", "text": "Arbovirus"}, {"type": "list", "items": ["Sintomático: paracetamol. No dar AINE ni AAS.", "Repelente con DEET 35–50 % durante 10 días (evitar la transmisión autóctona por *Aedes albopictus*).", "Zika: preservativo 2 meses en la mujer y 3 meses en el varón.", "Vacuna Qdenga® (atenuada, 2 dosis separadas 3 meses; no en inmunodeprimidos ni gestantes) para viajeros con factores de riesgo o dengue previo."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Malaria por *P. falciparum ingreso en general. UCI** si es grave.", "Consulta del viajero y de patología tropical: Dispensario MIN 39 o interconsulta a Infecciosas."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["OMS 2023–2024: el artesunato IV sigue siendo de elección en la malaria grave también en el 1.er trimestre del embarazo. Artemeter-lumefantrina en el 1.er trimestre (cambio de la OMS de 2022), en lugar de quinina + clindamicina.", "Dengue (OMS 2025, guía de arbovirus): paracetamol, evitar AINE y corticoides, y cristaloides en el dengue con signos de alarma. Vacuna Qdenga®: OMS 2024 para los 6–16 años en zonas de alta transmisión. Las indicaciones en viajeros varían según el país.", "Tifoidea XDR (Pakistán): azitromicina v.o. en la no complicada y meropenem en la grave (CDC 2024).", "Diarrea del viajero: azitromicina preferida sobre las quinolonas (resistencias en Asia), según el ACG 2024 y la ISTM.", "Profilaxis antipalúdica al alta del viajero que regresa: no aplica. Educar sobre la consulta previaje."]}]}], "sources": "WHO Guidelines for malaria (2024); WHO Guidelines for clinical management of arboviral diseases (2025); CDC Yellow Book (2024); Riddle MS et al. ACG Clinical Guideline: Acute Diarrheal Infections in Adults (2024 update).", "cats": ["infec"], "vital": false}, {"title": "Gastroenteritis aguda: sospecha de brote hospitalario", "page": 58, "protocol": "PROTOCOL D'ACTUACIÓ EN CAS DE SOSPITA DE BROT DE GASTROENTERITIS AGUDA", "service": "Control de Infecciones", "date": "ene 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Caso de GEA: diarrea y/o vómitos y/o fiebre de inicio brusco; ≥3 deposiciones líquidas o blandas al día, no atribuibles a laxantes.", "Brote: ≥2 casos con síntomas similares en ≤7 días en usuarios de la misma institución (hospital, HAI).", "Agentes: sobre todo norovirus (también rotavirus, adenovirus, astrovirus). Toxiinfección alimentaria (fuente común: agua, alimentos crudos, manipuladores)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["*C. difficile* (antibiótico previo, paciente ingresado: ver su protocolo), laxantes, efectos de fármacos, alimentación enteral."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Coprocultivo (prueba 7300) (laboratorio central de MasBlau).", "POCT FilmArray gastrointestinal (prueba 8321): panel múltiple de enteropatógenos, se hace en Microbiología del hospital.", "Avisar SIEMPRE antes de enviarlo: ext. 5831 / tel. 681 27 11 71 (de 8 a 20 h).", "Transporte en medio Cary-Blair.", "Sospecha alimentaria o hídrica: las mismas pruebas + guardar una muestra del alimento o del agua a 4–8 °C (para Salud Pública)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Circuito"}, {"type": "list", "items": ["Avisar al Programa de Control de Infecciones: buscas 25802, 25813, 25218 (hospital), 25812 (CFòrum), 25238 (CAEM). Sábado: busca de guardia del Programa. Domingos y festivos: correo a el correo del servicio + avisar a Microbiología de urgencias."]}, {"type": "h", "text": "Medidas en la unidad"}, {"type": "list", "items": ["Precauciones de contacto inmediatas. Cohortes de sintomáticos.", "Higiene de manos estricta (agua y jabón preferentemente si se sospecha norovirus).", "Limpieza con lejía al 0,5% (clorados). Doble limpieza diaria de baños, zonas de alto contacto y espacios comunes.", "Mantener las precauciones ≥48 h después de que se resuelvan los síntomas.", "En HAI: cerrar los baños compartidos y las fuentes de agua."]}, {"type": "h", "text": "Paciente"}, {"type": "list", "items": ["Rehidratación (oral si tolera; si no, IV), antieméticos. Antibiótico solo si hay criterios (disentería, sepsis, inmunosupresión) según el patógeno."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Norovirus (CDC/HICPAC; ECDC): el gel hidroalcohólico es menos eficaz que agua y jabón. Usar lejía a 1000–5000 ppm. Excluir al personal sintomático 48 h después de que se resuelvan los síntomas. Coincide en lo esencial.", "Paneles moleculares (IDSA 2017): detectan colonización o ADN no viable. Interpretarlos con la clínica. Además, pedir coprocultivo si se va a tratar o hay un brote (hace falta el aislado para el antibiograma y la tipificación). Coincide."]}]}], "sources": "CDC/HICPAC Guideline for the prevention and control of norovirus gastroenteritis outbreaks in healthcare settings; Shane AL et al. IDSA infectious diarrhea guideline (Clin Infect Dis 2017).", "cats": ["dig", "infec"], "vital": false}, {"title": "Golpe de calor y síndromes por calor (hipertermia maligna, SNM)", "page": 59, "protocol": "PROTOCOLO SÍNDROMES POR CALOR", "service": "Urgencias", "date": "ago 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Golpe de calor (tríada): exposición a calor ambiental (clásico: anciano en ola de calor) o esfuerzo intenso (por esfuerzo: joven, deportista o trabajador) + disfunción del SNC (confusión, delirio, convulsiones, coma) + Tª central >40 °C.", "Medir la Tª RECTAL (la timpánica, frontal u oral no son fiables). Nunca descartarlo si hubo exposición o esfuerzo aunque llegue sin hipertermia (enfriado en la ambulancia).", "Afectación sistémica: shock distributivo, rabdomiólisis (sobre todo por esfuerzo), FRA, hepatitis (pico a las 24–72 h; insuficiencia hepática en el 10%), CID, SDRA, hipoglucemia (por esfuerzo) o hiperglucemia (clásico).", "Calambres por calor: hiponatremia, CK alta; reponer por VO. Agotamiento por calor: termorregulación intacta, deshidratación; ambiente fresco + fluidos."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Hipertermia maligna (tras succinilcolina o halogenados: rigidez de maseteros, hipercapnia).", "Síndrome neuroléptico maligno (haloperidol, antipsicóticos: rigidez en \"tubo de plomo\", CK muy alta).", "Síndrome serotoninérgico, simpaticomiméticos (cocaína, MDMA), anticolinérgicos.", "Meningitis o encefalitis, ictus, tirotoxicosis, CAD, sepsis."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["ECG, Rx de tórax.", "Glucosa, iones, Ca, P, Mg, gasometría con lactato, urea, creatinina, CK, perfil hepático, TP, TTPA, fibrinógeno, PDF, hemograma. Repetirlos (el daño hepático y renal aparece más tarde).", "TC o PL solo si hay dudas diagnósticas o focalidad."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · ENFRIAR YA (no retrasarlo por nada)"}, {"type": "list", "items": ["Objetivo: <40 °C en <30 min y <39 °C en la 1ª hora (velocidad >0,15 °C/min). Parar el enfriamiento activo a 38,5 °C (rango 37–39) y seguir monitorizando la Tª central.", "Con lo que hay en el hospital: desvestir, gasas empapadas en agua fría en cuello, axilas, ingles, extremidades y tórax, ventilador dirigido al paciente, sueros fríos IV directos de la nevera (~20 °C). Hielo en la nevera de Códigos (balde con agua y hielo).", "Antitérmicos y dantroleno NO sirven en el golpe de calor."]}, {"type": "h", "text": "Fase 2 · ABCDE y soporte"}, {"type": "list", "items": ["O2 al 100%. IOT según la clínica (GCS <8); la gasometría es difícil de interpretar con hipertermia.", "Fluidos (cuidado con el EAP). La hipoTA suele responder a volumen + enfriamiento; si no, vasopresores o inotrópicos.", "Glucemia capilar. Convulsiones: BZD.", "Tratar el FRA o la hiperK (diálisis si es grave), la CID, el SDRA y la insuficiencia hepática con el manejo habitual."]}, {"type": "h", "text": "Hipertermia maligna"}, {"type": "list", "items": ["Retirar el desencadenante. DANTROLENO 2 mg/kg IV cada 5 min hasta que ceda (máx. 10 mg/kg); puede repetirse a las 10–15 h. Después 4–8 mg/kg/día VO en 4 dosis × 3 días."]}, {"type": "h", "text": "Síndrome neuroléptico maligno"}, {"type": "list", "items": ["Suspender el neuroléptico. Enfriamiento y soporte como en el golpe de calor.", "Bromocriptina 2,5–7,5 mg/8 h VO ± dantroleno 2 mg/kg (de elección si no responde al enfriamiento)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Inmersión en agua helada (1–15 °C) como método de referencia en el golpe de calor por esfuerzo, con una velocidad de enfriamiento de ~0,2 °C/min y mortalidad cercana a 0 si se aplica en 30 min (ACSM 2023, Wilderness Medical Society 2019/2024). Lema: \"enfriar primero, trasladar después\".", "El protocolo usa métodos evaporativos y conductivos (más lentos). Si no se puede sumergir: inmersión del tronco o bolsas de hielo + toallas empapadas que se van rotando (\"TACO\" o lona con hielo).", "Golpe de calor clásico en el anciano: la inmersión es posible pero difícil; la evidencia apoya el evaporativo + hielo. Hay que evitar el sobreenfriamiento.", "SNM y síndrome serotoninérgico: la evidencia de dantroleno y bromocriptina sigue siendo débil (series de casos). Las BZD son la base del tratamiento; ciproheptadina en el síndrome serotoninérgico."]}]}], "sources": "Roberts WO et al. ACSM Expert Consensus Statement on Exertional Heat Illness (Curr Sports Med Rep 2023); Lipman GS et al. Wilderness Medical Society Clinical Practice Guidelines for heat illness (Wilderness Environ Med 2019, 2024 update); Bouchama A et al. Classic and exertional heatstroke (Nat Rev Dis Primers 2022).", "cats": ["tox", "tec"], "vital": true}, {"title": "Hemoptisis", "page": 60, "protocol": "PROTOCOLO DEL DIAGNÓSTICO Y MANEJO DE LA HEMOPTISIS", "service": "Neumología", "date": "v1, jun 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Sangre expulsada con la tos, procedente de la vía respiratoria baja (>90% de las arterias bronquiales).", "Causas: bronquitis crónica (30%), bronquiectasias (15%), TBC, infección, neoplasia (>40 años y fumador), TEP, hemorragia alveolar, anticoagulación.", "Gravedad:", "Expectoración hemoptoica: hilos de sangre en el moco.", "Leve: <20–30 mL/24 h.", "Moderada: 30–200 mL/24 h.", "Grave o amenazante: >200–600 mL/24 h o >100 mL/h, o cualquier volumen con inestabilidad respiratoria o hemodinámica (también cuenta la reserva respiratoria previa)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Hematemesis (sangre oscura, en posos de café, pH ácido, antecedentes digestivos) y sangrado ORL (explorar boca y nariz).", "Hemorragia alveolar (anemia, infiltrados bilaterales: ANCA, anti-MBG)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Rx de tórax (normal en hasta el 30%; ayuda a localizar el lado).", "Hemograma, coagulación, función renal. Gasometría si hay IR. Cultivo y citología del esputo (± baciloscopia).", "ANCA y anti-MBG si se sospecha hemorragia alveolar.", "Angio-TC de tórax con contraste: siempre si es grave; individualizar en el resto.", "Broncoscopia en 24–48 h (localizar, ver si hay sangrado activo, control local). Arteriografía bronquial para embolizar."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales (todas)"}, {"type": "list", "items": ["Reposo en decúbito lateral SOBRE EL LADO QUE SANGRA. O2 si SatO2 <94%. Monitorización.", "Suspender y revertir los anticoagulantes.", "Antitusígeno: codeína 30 mg/8 h.", "ÁCIDO TRANEXÁMICO: nebulizado 500 mg/8 h (máx. 5 días) (de preferencia, menos efectos sistémicos) o IV 1 g/8 h si no tolera la vía inhalada."]}, {"type": "h", "text": "Leve o moderada"}, {"type": "list", "items": ["Ambulatoria o ingreso corto si no se puede descartar una causa grave. Antitusígeno, reposo relativo, O2 si hay hipoxemia."]}, {"type": "h", "text": "Grave o amenazante"}, {"type": "list", "items": ["Ingreso en semicríticos o UCI. Estabilización hemodinámica.", "IOT selectiva (al bronquio sano, con tubo grueso) si hay riesgo de asfixia.", "Broncoscopia urgente: lavado con suero frío, adrenalina 1/10.000 tópica, bloqueo con catéter de Fogarty (24–48 h), electrocauterio, argón o láser.", "Embolización de arterias bronquiales: controla el sangrado en >85% (recidiva del 20–50%). Riesgo raro: infarto medular.", "Cirugía: lesión localizada que no responde a lo anterior."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Ácido tranexámico nebulizado: el ensayo de Wand (Chest 2018) mostró menos volumen de sangrado y estancia más corta. Un metaanálisis de 2022–2023 confirma un beneficio modesto sin más eventos trombóticos. Coincide con el protocolo.", "Codeína: varias revisiones aconsejan usar antitusígenos con prudencia en la hemoptisis grave (dificultan expulsar los coágulos y pueden ocluir la vía aérea).", "Angio-TC antes de la broncoscopia en la hemoptisis grave estable (consenso SEPAR 2016; ERS 2023 sobre bronquiectasias): localiza el sangrado y planifica la embolización mejor que la broncoscopia sola."]}]}], "sources": "Wand O et al. Inhaled tranexamic acid for hemoptysis (Chest 2018); Cordovilla R et al. SEPAR Normativa sobre el diagnóstico y tratamiento de la hemoptisis amenazante (Arch Bronconeumol 2016); Davidson K, Shojaee S. Managing massive hemoptysis (Chest 2020).", "cats": ["resp"], "vital": false}, {"title": "Hemorragia digestiva alta por hipertensión portal (varices)", "page": 61, "protocol": "PROTOCOLO DE HDA POR HIPERTENSIÓN PORTAL", "service": "Digestivo", "date": "mar 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Cirrosis conocida o con estigmas (arañas vasculares, ascitis, circulación colateral) + hematemesis o melenas, síncope.", "Riesgo de sangrado: varices grandes, puntos rojos, Child-Pugh avanzado."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["HDA no varicosa (úlcera), síndrome de Mallory-Weiss.", "Infección asociada (PBE, ITU, neumonía).", "Encefalopatía, trombosis portal, hepatocarcinoma."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Función renal (urea/creatinina), hemograma, coagulación, pruebas cruzadas (\"Protocolo 0\"), fibrinógeno.", "Despistaje infeccioso: Rx de tórax, sedimento, paracentesis si hay ascitis.", "Ecografía abdominal cuando se pueda (trombosis portal, LOE). PCR de SARS-CoV-2 POCT (para la UCI o la endoscopia).", "Tacto rectal (salvo hematemesis evidente)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Medidas generales (idealmente en UCI)"}, {"type": "list", "items": ["Vía aérea: IOT si hay bajo nivel de conciencia o sangrado de alto débito (riesgo de broncoaspiración).", "2 vías de 16G (vía central si es masiva).", "Cristaloides con prudencia (reanimación hipotensiva: la PA mínima para perfundir).", "TRANSFUSIÓN RESTRICTIVA: objetivo Hb 7–8 g/dL (más alto si es anciano, tiene cardiopatía isquémica o sangra activamente).", "NO plasma profiláctico (es perjudicial).", "Plaquetas si sangra activamente con <50.000. Fibrinógeno para mantener 100–120 mg/dL. Transfusión masiva (≥10 CH/día): PFC 15–20 mL/kg + plaquetas >50.000.", "PROFILAXIS ANTIBIÓTICA: CEFTRIAXONA 1 g/24 h IV (máx. 7 días).", "SNG no obligatoria."]}, {"type": "h", "text": "Fase 2 · Vasoactivo YA + avisar a Digestivo de guardia (25414)"}, {"type": "list", "items": ["SOMATOSTATINA (1ª opción):", "Metoclopramida IV previa.", "Bolo de 250 mcg IV.", "Después, perfusión de 3 mg en 250 mL de SG10% a 21 mL/h. Si hay hemorragia activa: 6 mg en 250 mL a 21 mL/h.", "+ OMEPRAZOL: bolo de 80 mg IV y después perfusión de 80 mg en 250 mL de SG10% a 25 mL/h (hasta tener la endoscopia).", "TERLIPRESINA (la indica el digestólogo):", "2 mg/4 h IV (1,5 mg si pesa 50–70 kg; 1 mg si <50 kg).", "Cuando lleve 24 h sin sangrar, bajar a 1 mg/4 h."]}, {"type": "h", "text": "Fase 3 · Endoscopia"}, {"type": "list", "items": ["EDA en las primeras 12 h (dónde y cuándo se decide con Anestesia): ligadura de varices (o cianoacrilato en las fúndicas)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Baveno VII (2022) y AASLD 2024:", "Vasoactivo 2–5 días tras la endoscopia.", "TIPS preventivo (en <72 h) en pacientes de alto riesgo: Child C 10–13 o Child B >7 con sangrado activo en la endoscopia. Mejora la supervivencia. No está en el protocolo.", "Eritromicina 250 mg IV 30–120 min antes de la EDA para vaciar el estómago (si no hay QT largo).", "IBP: tras confirmar el origen varicoso, suspenderlo (no aporta beneficio y aumenta las infecciones).", "Restaurar el betabloqueante (carvedilol o propranolol) cuando se retire el vasoactivo, en combinación con las ligaduras (profilaxis secundaria).", "Hemorragia refractaria: prótesis esofágica autoexpandible (preferible al balón de Sengstaken) como puente al TIPS de rescate.", "Lactulosa como profilaxis de la encefalopatía en la HDA del cirrótico (Baveno VII la sugiere; evidencia moderada)."]}]}], "sources": "de Franchis R et al. Baveno VII – Renewing consensus in portal hypertension (J Hepatol 2022); Kaplan DE et al. AASLD Practice Guidance on risk stratification and management of portal hypertension and varices (Hepatology 2024); EASL Clinical Practice Guidelines on decompensated cirrhosis (J Hepatol 2018).", "cats": ["dig"], "vital": true}, {"title": "Hemorragia digestiva baja (HDB)", "page": 62, "protocol": "HEMORRAGIA DIGESTIVA BAJA", "service": "Protocol d'actuació a Urgències, Digestivo", "date": "mar 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Rectorragia (roja), hematoquecia (mezclada con las heces), a veces melenas.", "Causas: diverticular y colitis isquémica (las más frecuentes), patología anal, angiodisplasia, colitis infecciosa o inflamatoria, neoplasia, proctitis por radioterapia, pospolipectomía.", "Gravedad: inestabilidad hemodinámica, sangrado activo, comorbilidad, Hto <35%."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["HDA (10–15% de las \"HDB\" graves): inestabilidad, anemización importante, urea alta → manejarla como HDA.", "Hemorragia de origen proctológico (tacto rectal, anuscopia). Isquemia mesentérica (dolor desproporcionado)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Monitorización (Códigos o Nivel 2).", "Hemograma, coagulación, iones, función renal y hepática, gasometría venosa, pruebas cruzadas (\"Protocolo 0\").", "Tacto rectal (siempre). Hora exacta de la última dosis de anticoagulante o antiagregante.", "Angio-TC abdominal si hay repercusión hemodinámica o se sospecha isquemia."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Resucitación"}, {"type": "list", "items": ["2 vías gruesas (16–18G), dieta absoluta, ± sonda vesical.", "Cristaloides (SF o Ringer).", "Transfusión restrictiva:", "Hb ≤7 → transfundir para mantener 7–9.", "Cardiopatía (sobre todo isquémica): umbral 8–9, objetivo 9–10.", "Shock masivo refractario: criterio liberal.", "Plaquetas si <50.000 (no sirven si solo toma antiagregantes con recuento normal)."]}, {"type": "h", "text": "Fase 2 · Coagulación"}, {"type": "list", "items": ["AVK con INR supraterapéutico: vitamina K 20 mg + CCP si hay inestabilidad. Si el INR está en rango: individualizar.", "ACOD: suspender; CCP si hay inestabilidad. Dabigatrán + sangrado grave → idarucizumab."]}, {"type": "h", "text": "Fase 3 · Según la causa"}, {"type": "list", "items": ["Origen proctológico claro → Cirugía.", "Digestivo (busca 25414): colonoscopia tras preparación. Si hay sangrado activo con repercusión: angio-TC → embolización.", "Una vez estable: laxante para controlar el aspecto de las deposiciones."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Escala de Oakland (BSG 2019, ESGE 2021): ≤8 puntos → alta segura y colonoscopia ambulatoria. El protocolo no usa escalas de riesgo.", "Inestable (índice de shock >1): angio-TC primero → embolización o endoscopia dirigida (BSG 2019, ACG 2023). Coincide con \"valorar TC\".", "Colonoscopia: no hace falta en <24 h. La urgente no mejora la mortalidad ni el resangrado frente a la diferida (ensayos; ACG 2023). Hacerla en la misma hospitalización tras preparar el colon.", "Antiagregantes: en prevención primaria, suspender el AAS de forma definitiva. En prevención secundaria, no suspender el AAS (ACG 2023, ESGE 2021). Reanudar el ACOD a los ~7 días si se ha controlado el sangrado (BSG/ESGE 2022).", "Vitamina K: las guías usan 5–10 mg IV. Los 20 mg del protocolo superan las dosis habituales."]}]}], "sources": "Oakland K et al. BSG guideline on acute lower GI bleeding (Gut 2019); Sengupta N et al. ACG Clinical Guideline LGIB (Am J Gastroenterol 2023); Triantafyllou K et al. ESGE guideline on LGIB (Endoscopy 2021).", "cats": ["dig"], "vital": true}, {"title": "Hipercalcemia", "page": 63, "protocol": "Hipercalcemia en Urgencias", "service": "Endocrinología", "date": "abr 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Ca total >10,5 mg/dL (corregido) o Ca iónico >1,4 mmol/L. Ca corregido = Ca + 0,8 × (4 − albúmina).", "Grados: leve 10,5–12 · moderada 12–14 · grave >14 o con síntomas.", "Clínica: GI (náuseas, vómitos, estreñimiento), renal (poliuria, FRA prerrenal), neurológica (confusión, coma), ECG (QT corto, bradicardia, BAV), más sensibilidad a la digoxina.", "Causas: hiperparatiroidismo primario y neoplasia (PTHrP, metástasis osteolíticas, mieloma: el 90% entre las dos). Vitamina D (intoxicación, granulomas, linfoma). Fármacos (tiazidas, litio, vitamina A, calcitriol). Leche-alcalinos, hipertiroidismo, insuficiencia suprarrenal, inmovilización."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Pseudohipercalcemia (albúmina alta, mieloma). Deshidratación. Hipervolemia, IC o IRC (cambia la hidratación)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Urgencias: bioquímica, hemograma, GSV con Ca iónico, Ca total. ECG. Rx de tórax.", "Laboratorio central: fósforo, Mg, proteínas totales, albúmina, 25-OH vitamina D, PTH (± PTHrP, 1,25-OH-D, proteinograma)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Leve (10,5–12)"}, {"type": "list", "items": ["Retirar los fármacos hipercalcemiantes. Beber mucho, dieta con sal (si no hay contraindicación), limitar el calcio, evitar la inmovilización."]}, {"type": "h", "text": "Moderada (12–14)"}, {"type": "list", "items": ["Igual + interconsulta a Endocrinología. Tratarla como grave si hay insuficiencia renal, neoplasia o síntomas."]}, {"type": "h", "text": "Grave (>14 o sintomática)"}, {"type": "list", "items": ["Retirar fármacos, constantes cada hora, sonda vesical con diuresis horaria, monitor ECG si hay alteraciones.", "1) SF 500 mL/2 h IV, ajustando para diuresis de 100–150 mL/h. Si no puede eliminar la sal (IC, IRC): furosemida 20 mg/6 h desde la 1ª hora de hidratación. Ca, K y creatinina cada 6 h.", "2) CALCITONINA DE SALMÓN 4 UI/kg SC o IM (no nasal). Repetir el Ca a las 6 h: si ha bajado 1–2 mg/dL, seguir cada 8–12 h (máx. 48 h; dosis máxima 8 UI/kg/6 h). Es la de acción más rápida.", "3) ÁCIDO ZOLEDRÓNICO 4 mg IV en 15 min, en dosis única (empezarlo junto con la calcitonina; efecto máximo a las 48–72 h; no repetir hasta 1–2 semanas). Efectos: síndrome gripal, hipoMg, hipoP.", "Corticoide (exceso de 1,25-OH-D: linfoma, granulomas, intoxicación por vitamina D): prednisona 20–40 mg/día VO o hidrocortisona 40 mg/8 h IV durante 3–5 días.", "Hemodiálisis: en la hipercalcemia maligna >16 o con insuficiencia renal o cardíaca refractaria.", "Cinacalcet: solo ambulatorio (hiperparatiroidismo primario como puente a la cirugía), no en Urgencias."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Guía Endocrine Society 2023 (hipercalcemia maligna): sugiere denosumab o bifosfonatos IV de 1ª línea (el denosumab es de elección si hay insuficiencia renal y en la hipercalcemia refractaria a bifosfonatos). Calcitonina solo al inicio en la grave.", "Ácido zoledrónico: ajustar a la función renal (ClCr <60: reducir la dosis; evitar si ClCr <30). El protocolo no lo menciona.", "Furosemida: las guías actuales no la recomiendan de rutina, solo si hay sobrecarga de volumen después de rehidratar. Coincide en lo esencial con el protocolo."]}]}], "sources": "El-Hajj Fuleihan G et al. Treatment of hypercalcemia of malignancy in adults: Endocrine Society guideline (J Clin Endocrinol Metab 2023); Walker MD, Shane E. Hypercalcemia: a review (JAMA 2022).", "cats": ["metab"], "vital": false}, {"title": "Hipermagnesemia", "page": 64, "protocol": "HIPERMAGNESEMIA", "service": "Endocrinología", "date": "feb 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Mg >2,5 mg/dL. Leve 2,5–4,8 · grave >4,8.", "Causas: insuficiencia renal (la más frecuente) + aporte de Mg (laxantes, enemas, antiácidos), sulfato de Mg en la preeclampsia, CAD, lisis tumoral, litio, teofilina, leche-alcalinos.", "Clínica según el nivel:", "4,8–7,2: náuseas, rubefacción, cefalea, letargia, ↓ de reflejos.", "7,2–12: abolición de reflejos, somnolencia, hipocalcemia, hipoTA, bradicardia, PR y QT largos, QRS ancho.", ">12: parálisis flácida, BAV completo, parada."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucosa, urea, creatinina, iones, GSV, Mg y Ca. ECG.", "El Mg no está en el petitorio de Urgencias: llamar al facultativo del laboratorio de Urgencias (ext. 3028) para que lo procese el laboratorio central."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Causa y eliminación"}, {"type": "list", "items": ["Suspender todos los aportes de Mg.", "Hidratación IV (suficiente si la función renal es normal).", "Insuficiencia renal → hemodiálisis (corrige en 3–4 h)."]}, {"type": "h", "text": "Fase 2 · Con clínica neurológica o alteraciones del ECG (normalizar en <3–4 h)"}, {"type": "list", "items": ["GLUCONATO CÁLCICO 10%: 1–2 ampollas en 150 mL de SF en 10 min (antagoniza el efecto cardíaco).", "Soporte ventilatorio o marcapasos transitorio si hace falta."]}, {"type": "h", "text": "Monitorización"}, {"type": "list", "items": ["ECG y constantes cada hora hasta Mg <4,8.", "Mg cada 3–4 h si es grave (hasta <4,8) y cada 6 h si es leve (hasta <2,5).", "Prevención: reducir los aportes de Mg un 50% si hay insuficiencia renal y evitar los antiácidos y laxantes con Mg."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Sin cambios relevantes en las revisiones recientes.", "Furosemida (con hidratación) puede aumentar la eliminación renal si el FG está conservado. Muchas revisiones la incluyen como opción.", "Preeclampsia con sulfato de Mg: vigilar los reflejos rotulianos, la FR y la diuresis. Si hay toxicidad: suspender la perfusión + gluconato cálcico 1 g IV (ACOG)."]}]}], "sources": "Van Laecke S. Hypomagnesemia and hypermagnesemia (Acta Clin Belg 2019); ACOG Practice Bulletin 222: Gestational hypertension and preeclampsia (2020).", "cats": ["metab"], "vital": false}, {"title": "Hipernatremia", "page": 65, "protocol": "RECOMENDACIONES PARA EL DIAGNÓSTICO Y TRATAMIENTO DE LA HIPERNATREMIA EN URGENCIAS", "service": "Endocrinología/Urgencias", "date": "abr 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Na >145 mEq/L (siempre hay hipertonicidad). Mortalidad del 10–75%.", "Grados: leve 146–150 · moderada 151–155 · grave >155 · extrema >190. Aguda <48 h / crónica >48 h.", "En riesgo: anciano, demencia o encamado sin acceso al agua, intubado, niño.", "Clínica: letargia, confusión, irritabilidad, mioclonías, convulsiones, coma; sed, hipotensión ortostática, oliguria. En la aguda hay riesgo de hemorragia cerebral.", "Causas:", "Pérdida de agua libre: pérdidas insensibles, hipodipsia, diabetes insípida central o nefrogénica (litio, hipercalcemia, hipopotasemia).", "Pérdida de líquido hipotónico: diuréticos de asa, diuresis osmótica (hiperglucemia), diarrea, vómitos, lactulosa, quemaduras.", "Ganancia de Na: bicarbonato, SF o salino hipertónico, NPT."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Pseudohipernatremia (lípidos, proteínas).", "Corregir el Na por la glucosa: Na + 0,016 × (glucemia − 100).", "Estado hiperosmolar, diabetes insípida (orina diluida con poliuria)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Plasma: urea, creatinina, glucosa, iones, Ca, K, osmolalidad, hemograma, GSV.", "Orina: iones y osmolalidad.", "Na en orina <20 → pérdida extrarrenal. Osmolalidad urinaria baja → diabetes insípida.", "Osm eficaz = 2 × Na + glucosa/18."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Causa"}, {"type": "list", "items": ["Frenar las pérdidas GI, tratar la fiebre, corregir la hiperglucemia, retirar diuréticos y laxantes, corregir la hipercalcemia y la hipopotasemia, ajustar los sueros.", "Inestabilidad hemodinámica → SF 0,9% solo hasta estabilizar (después, fluido hipotónico)."]}, {"type": "h", "text": "Fase 2 · Velocidad de corrección (objetivo Na 145)"}, {"type": "list", "items": ["Aguda (<48 h): hasta 1 mmol/L/h.", "Crónica o desconocida: máx. 10 mEq/L en 24 h (riesgo de edema cerebral y convulsiones)."]}, {"type": "h", "text": "Fase 3 · Qué fluido"}, {"type": "list", "items": ["VO o SNG: agua.", "IV: Na 145–150 → SF 0,45%; Na >150 → SG 5%."]}, {"type": "h", "text": "Fase 4 · Cuánto"}, {"type": "list", "items": ["Déficit de agua = [(Osm eficaz − 290)/290] × ACT.", "ACT = peso × 0,6 (hombre), 0,5 (mujer o anciano), 0,4 (anciana).", "La mitad del déficit en 24 h y el resto en 24–48 h + pérdidas insensibles (20–30 mL/h) + pérdidas continuas.", "Sobrecarga de volumen (por ganancia de Na): añadir furosemida."]}, {"type": "h", "text": "Seguimiento"}, {"type": "list", "items": ["Iones y creatinina cada 4–8 h. Balance hídrico."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Corrección rápida en la hipernatremia hospitalaria: estudios observacionales recientes (Chauhan, Clin J Am Soc Nephrol 2019; metaanálisis 2023) no encuentran edema cerebral en adultos con correcciones >0,5 mmol/L/h. La corrección lenta se asoció a más mortalidad. El límite de 10 mEq/día viene sobre todo de pediatría. En adultos se puede ser algo más rápido, con controles frecuentes.", "Diabetes insípida central: el término recomendado es ahora \"deficiencia de arginina-vasopresina\" (AVP-D) (consenso internacional de 2022). Tratamiento con desmopresina."]}]}], "sources": "Chauhan K et al. Rate of correction of hypernatremia and health outcomes (Clin J Am Soc Nephrol 2019); Arima H et al. Changing the name of diabetes insipidus (Endocr J 2022); Adrogué HJ, Madias NE. Hypernatremia (N Engl J Med 2000).", "cats": ["metab"], "vital": false}, {"title": "Hiperpotasemia", "page": 66, "protocol": "HIPERPOTASEMIA", "service": "Endocrinología/Urgencias", "date": "v3, 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["K >5,1 mmol/L. Leve 5,1–5,9 · moderada 6,0–6,4 · grave ≥6,5 o con cambios en el ECG.", "ECG (en orden): T picudas → QT corto → ↓ST → QRS y PR anchos → P aplanada → onda sinusoidal → asistolia o FV. Bradicardia.", "Neuromuscular: debilidad, parestesias, parálisis ascendente.", "Causas: insuficiencia renal + aporte; fármacos (IECA/ARA-II, espironolactona, amilorida, AINE, trimetoprim, heparina, tacrolimus o ciclosporina, betabloqueantes, sustitutos de la sal); Addison; ATR tipo IV (DM2); acidosis; rabdomiólisis, lisis tumoral, quemados; digoxina; hiperglucemia."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["PSEUDOhiperpotasemia (hemólisis, leucocitosis, trombocitosis): repetir sin torniquete o con gas
