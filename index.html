 adecuada: diuresis 100–150 mL/h o Na en orina >50–70 mmol → mantener.", "Respuesta insuficiente → doblar la dosis. Si persiste, añadir hidroclorotiazida 25 mg/24 h. Si persiste, perfusión de furosemida (500 mg en 100 mL = 5 mg/mL; empezar a 1 mL/h = 5 mg/h, máximo 6 mL/h = 30 mg/h).", "Controlar el balance, el peso, la función renal y el K (suplementar K)."]}, {"type": "h", "text": "Vasodilatadores (solo con TAS >110)"}, {"type": "list", "items": ["EAP con TAS ≥140 o insuficiencia valvular grave: siempre.", "Nitroglicerina IV (50 mg en 250 mL SG = 200 µg/mL): empezar a 20 µg/min (6 mL/h). Subir 5–10 µg/min cada 5 min hasta bajar la TAS 30–40 mmHg (máximo 30 mL/h).", "Nitroprusiato si TAS ≥190 o IM grave (evitar en la cardiopatía isquémica): 0,5 µg/kg/min (50 mg en 250 mL = 200 µg/mL; 70 kg ≈ 11 mL/h). Bajar la TA ≤20–25 % en las primeras 2 h. Proteger de la luz. Normalmente basta ≤3 µg/kg/min."]}, {"type": "h", "text": "Hipoperfusión o shock"}, {"type": "list", "items": ["Dobutamina (500 mg en 250 mL = 2 mg/mL): 2–20 µg/kg/min (70 kg a 5 µg/kg/min ≈ 10 mL/h).", "Noradrenalina (25 mg en 250 mL = 100 µg/mL): empezar a 4 µg/min (≈3 mL/h), mantenimiento 8–12 µg/min. Si la dobutamina provoca hipotensión, o en el shock.", "IC derecha: valorar la volemia (sueroterapia si hay depleción intravascular). Dobutamina o levosimendán ± noradrenalina.", "Shock cardiogénico: Cardiología emergente, ecocardiograma o cateterismo, UCI o UCO, soporte mecánico."]}, {"type": "h", "text": "Otros"}, {"type": "list", "items": ["Morfina NO de rutina: solo para la disnea paliativa o para adaptar a la VMNI (3–5 mg IV).", "Betabloqueante: mantenerlo o reducirlo al 50 %. Suspender solo si FC <40 o BAV (o shock).", "iSGLT2 (dapagliflozina o empagliflozina 10 mg/24 h) una vez estable: TAS >100, sin vasoactivos y sin cambios de diurético en 6 h. FG ≥25 (dapagliflozina) o ≥20 (empagliflozina).", "Profilaxis de ETV: enoxaparina 20–40 mg/24 h si no está anticoagulado.", "Digoxina solo en la FA >110 lpm pese al betabloqueante: 0,5 mg IV → 0,25 mg/6 h hasta 1,25–1,5 mg (1 mg en el anciano, la IR o con amiodarona). Mantenimiento: 0,125–0,25 mg/24 h."]}, {"type": "h", "text": "Tratamiento crónico (iniciar en el ingreso)"}, {"type": "list", "items": ["FEVI ≤40 % (los 4 pilares, clase I): – ARNI: sacubitrilo-valsartán 24/26 o 49/51 → 97/103 mg/12 h. Esperar 36 h tras el IECA. IECA o ARA-II si no se tolera. – Betabloqueante: bisoprolol 1,25 → 10 mg/24 h; carvedilol 3,125 → 25 mg/12 h (50 mg/12 h si ≥85 kg). – ARM: espironolactona 12,5–25 → 25–50 mg/24 h; eplerenona 25 → 50 mg/24 h. – iSGLT2. – Además, según el caso: ivabradina (FC >70 en ritmo sinusal con betabloqueante a dosis máxima), vericiguat 2,5 → 10 mg/24 h, hidralazina + nitratos.", "FEVI 41–49 %: diurético + iSGLT2 (clase I). IECA, ARA-II, ARNI, ARM o betabloqueante (clase IIb).", "FEVI ≥50 %: diurético + iSGLT2 + control de comorbilidades."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Avisar a Cardiología: – IC de novo (salvo deterioro funcional o cognitivo grave), IC moderada o grave (FiO₂ >0,5, VMNI o alto flujo), IC crónica con FEVI <40 %. – Reingresos (≥2 en 12 meses sin seguimiento cardiológico), paciente de la UIC, arritmia no controlada. – Sospecha de isquemia, valvulopatía, amiloidosis, endocarditis o candidato a TAVI.", "Si mejora con depleción intensa: en <24 h → observación; en 24–72 h → UCEUr.", "Frágil: centro de subagudos. >85 años: UGA (o MI). IC en el contexto de una infección: MI, Infecciosas o UGA. Prediálisis: Nefrología."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Actualización ESC 2023:", "Finerenona en la FEVI ≥40 % (FINEARTS-HF, 2024; recomendada en la actualización ESC/HFA 2025).", "Estrategia STRONG-HF: titulación intensiva y rápida de los 4 pilares antes del alta y en las 6 semanas siguientes (clase I).", "Acetazolamida 500 mg/24 h IV (ADVOR) o hidroclorotiazida (CLOROTIC) como refuerzo diurético en la congestión. El protocolo solo menciona la tiazida.", "Déficit de hierro (ferritina <100, o 100–299 con IST <20 %) → hierro IV (carboximaltosa o derisomaltosa) antes del alta (clase IIa). No figura en el protocolo.", "Sacubitrilo-valsartán de novo durante el ingreso (PIONEER-HF), sin pasar antes por el IECA.", "Tirzepatida y semaglutida en la IC-FEc con obesidad (SUMMIT, STEP-HFpEF): mejoran los síntomas y los eventos.", "Nitroglicerina a dosis altas en bolo en la ICA hipertensiva (SCAPE): datos observacionales. Las guías no la recomiendan de rutina."]}]}], "sources": "McDonagh TA et al. 2023 Focused Update of the 2021 ESC Guidelines for HF (Eur Heart J 2023); Mullens W et al. Acetazolamide ADVOR (NEJM 2022); Mebazaa A et al. STRONG-HF (Lancet 2022); Solomon SD et al. Finerenone FINEARTS-HF (NEJM 2024); Heidenreich PA et al. 2022 AHA/ACC/HFSA HF Guideline.", "cats": ["cardio"], "vital": true}, {"title": "Insuficiencia suprarrenal y crisis adrenal (adulto y pediatría)", "page": 88, "protocol": "INSUFICIENCIA SUPRARRENAL – Endocrinología (feb 2023) + INSUFICIENCIA SUPRARRENAL AGUDA (CRISIS ADRENAL)", "service": "Pediatría", "date": "dic 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Crisis adrenal: hipotensión o shock desproporcionado o refractario a fluidos y vasopresores en un cuadro banal, vómitos ± diarrea, dolor abdominal (pseudoabdomen agudo), fiebre o hipoglucemia inexplicadas, alteración de la conciencia.", "Crónica: astenia, anorexia, pérdida de peso, apetencia por la sal, hipotensión postural, hiperpigmentación (pliegues, mucosas, cicatrices; solo en la primaria), vitíligo u otras autoinmunidades.", "Analítica: hiponatremia con natriuria alta, hiperpotasemia y acidosis (solo en la primaria), hipoglucemia, urea alta, hipercalcemia, eosinofilia, anemia normocítica.", "Paciente de riesgo: ISR conocida con estrés (infección, cirugía, trauma), suspensión brusca de corticoides (la causa más frecuente), cirugía o radioterapia hipofisaria, TCE, Sheehan, hemorragia suprarrenal (sepsis o anticoagulación). Fármacos que aumentan los requerimientos: rifampicina, fenitoína, carbamazepina, fenobarbital, mitotano.", "Probabilidad de supresión del eje: – Alta: prednisona >20–30 mg/día durante >2–3 semanas, aspecto cushingoide o dosis nocturna >2 semanas. – Intermedia: 10–20 mg/día >3 semanas, o 5–10 mg/día durante semanas. – Baja: <3 semanas, días alternos o <5 mg/día.", "Pediatría: lactante con vómitos, deshidratación desproporcionada, hipoglucemia, ictericia prolongada, convulsiones, genitales atípicos (HSC)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Sepsis como desencadenante (y como diagnóstico alternativo), abdomen agudo.", "Hiponatremia <120 o K >6,5–7 → monitorizar (UCI o UCIP)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["ANTES de los corticoides (sin retrasar el tratamiento): cortisol basal (tubo rojo) + ACTH (tubo rosa con aprotinina, en frío, centrifugado inmediato). Revisar la caducidad de los tubos de aprotinina.", "Si no hay diagnóstico previo: también renina, aldosterona y 17-OH-progesterona (RN y lactantes).", "Hemograma, urea, creatinina, glucosa, iones, calcio, gasometría venosa, glucemia capilar y cetonemia. Na, creatinina y osmolalidad en orina. ECG (K).", "Interpretación: – Cortisol basal o tras estímulo >18–20 µg/dL → descarta la ISR. – Cortisol <5 µg/dL o ACTH >100 pg/mL → ISR (primaria si la ACTH está alta).", "Test de ACTH: avisar a Endocrinología (busca 25223)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Crisis adrenal en el adulto"}, {"type": "list", "items": ["Hidrocortisona 100 mg IV en bolo, luego 100 mg/6–8 h IV (o 200 mg/24 h en perfusión). IM si no hay vía.", "SF 0,9 %: 1 L en la primera hora (el protocolo dice 500 mL/4–6 h en las primeras 12–24 h; ajustar a la hemodinámica).", "SG 10 % si hay hipoglucemia (500 mL/6–8 h).", "No hace falta mineralocorticoide mientras la hidrocortisona sea >50 mg/día.", "A los 2–3 días: descenso hasta hidrocortisona oral de mantenimiento 20-0-10 mg. Añadir fludrocortisona 0,05–0,1 mg/24 h en la primaria al bajar de 50 mg/día.", "Si el test de ACTH es normal: retirar."]}, {"type": "h", "text": "Crisis adrenal en pediatría"}, {"type": "list", "items": ["Hidrocortisona 50–100 mg/m² IV o IM (mínimo 25 mg, máximo 100 mg). Sin superficie corporal: 0–3 años 25 mg; 3–12 años 50 mg; >12 años 100 mg. Repetir si no responde (incluso cada 4 h).", "SF 10–20 mL/kg en 20–30 min, repetible hasta 60 mL/kg en 1 h.", "Hipoglucemia (<45 mg/dL, o <60 con síntomas): 0,5–1 g/kg de glucosa (SG 10 % 5–10 mL/kg a 2–3 mL/min). Glucagón 0,5 mg (<20 kg) o 1 mg (>20 kg). Control a los 15 min.", "Na <120: SSH 3 % 2 mL/kg en 10–15 min, repetible hasta Na >120. Después, subir ≤10 mEq/L al día.", "K >7: gluconato cálcico 10 % 0,5–1 mL/kg + glucosa con insulina 0,1 UI/kg + salbutamol ± bicarbonato. UCIP.", "Ingreso: hidrocortisona 60–80 mg/m²/día cada 4–6 h → 30 mg/m²/día a las 24–48 h → oral 15 mg/m²/día. Fludrocortisona a partir de las 48 h, cuando la hidrocortisona sea <30–40 mg/m²/día."]}, {"type": "h", "text": "Dosis de estrés en la ISR crónica conocida"}, {"type": "list", "items": ["Fiebre o enfermedad intercurrente: doblar o triplicar la dosis de glucocorticoide 3–4 días o hasta la resolución. La fludrocortisona no se cambia.", "Vómitos o intolerancia oral → urgencias, o hidrocortisona 100 mg IM (o metilprednisolona IM).", "Cirugía menor: 25 mg el día de la intervención. Moderada: 50–75 mg/día los días 1–2. Mayor: 100 mg en la premedicación + 50–100 mg/6 h × 3 días. Enfermedad grave: 100 mg/6–8 h.", "Equivalencias: hidrocortisona 20 = prednisona 5 = metilprednisolona 4 = dexametasona 0,75 mg.", "Educación: tarjeta o placa identificativa, kit de inyección IM."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Ingreso: debut como crisis, inestabilidad, alteraciones iónicas, hipoglucemia <45, crisis frecuentes, <1 año, o proceso intercurrente que descompensará (neumonía, GEA con mala tolerancia, cirugía).", "UCI o UCIP: hipotensión refractaria a la primera expansión, Na <120 o K >6,5–7, GCS <14, convulsión, arritmias.", "Alta: solo en la ISR conocida sin criterios de crisis, tras 6 h de observación con buena tolerancia oral y dosis doblada o triplicada."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Adulto (ESE/Endocrine Society 2024 sobre la ISR inducida por glucocorticoides; Endocrine Society 2016): hidrocortisona 100 mg IV/IM → 200 mg/24 h en perfusión continua o 50 mg/6 h, y SF 1 L en la primera hora. El protocolo da un ritmo de fluidos más lento.", "ISR por glucocorticoides (ESE/ES 2024): no hacer cribado rutinario del eje en quien está tomando o reduciendo corticoides. Basta la educación y la dosis de estrés en todo el que tome ≥5 mg/día de prednisona más de 4 semanas.", "Corticoides inhalados o tópicos a dosis altas y fármacos que inhiben el CYP3A4 (ritonavir, cobicistat, itraconazol con budesonida o fluticasona) también suprimen el eje.", "Pediatría: se acepta una dosis de hidrocortisona de 50–100 mg/m², o 2 mg/kg (ESPE/PES 2020).", "Inmunoterapia (anti-PD-1 o anti-CTLA-4): causa frecuente de hipofisitis y ISR secundaria. Preguntar por ella."]}]}], "sources": "Beuschlein F et al. ESE/Endocrine Society Guideline on Glucocorticoid-Induced Adrenal Insufficiency (Eur J Endocrinol / JCEM 2024); Bornstein SR et al. Diagnosis and Treatment of Primary Adrenal Insufficiency (JCEM 2016); Rushworth RL et al. Adrenal Crisis (NEJM 2019).", "cats": ["endo", "pedi"], "vital": true}, {"title": "Intoxicación etílica aguda", "page": 90, "protocol": "PROTOCOLO INTOXICACIÓN ETÍLICA", "service": "Urgencias", "date": "2017, rev. mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Clínica según la alcoholemia: – >0,5 g/L: euforia, verborrea. – >1 g/L: ataxia, nistagmo, disartria, conducta alterada. – >2 g/L: vómitos, diplopía, amnesia, hipotermia. – >4 g/L: coma, depresión respiratoria, muerte.", "Metabólico: hipoglucemia (ayuno), hiponatremia, hipomagnesemia (QT largo), hipopotasemia, hipofosfatemia, cetoacidosis alcohólica, acidosis láctica.", "1 UBE = 10 g de alcohol: 100 mL de vino, 200 mL de cerveza o 25 mL de destilado."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["No conformarse con \"intoxicación etílica\": – Hipoglucemia, TCE o hematoma intracraneal, crisis comicial o estado poscrítico, ictus. – Sepsis o meningitis, otras sustancias (asumirlas si hay dudas), acidosis de otra causa (metanol o etilenglicol: osmol gap). – Wernicke (oftalmoplejía, ataxia, confusión). – Broncoaspiración, pancreatitis, hepatitis alcohólica.", "Alerta si la clínica no cuadra con la anamnesis o con la alcoholemia."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucemia capilar a TODOS.", "Según el caso: función renal, iones, Mg y P, perfil hepático, lipasa, gasometría venosa (cetoacidosis, láctico, osmolalidad).", "ECG si hay arritmia o alteraciones iónicas.", "TC craneal si hay TCE, focalidad, bajo nivel de conciencia desproporcionado o falta de mejoría.", "Alcoholemia: no de rutina. Pedirla si hay duda diagnóstica o disminución de la conciencia."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Soporte"}, {"type": "list", "items": ["No hay antídoto. Posición de seguridad y protección de la vía aérea. IOT si no protege la vía aérea (y UCI).", "Glucosa si hay hipoglucemia. Tiamina 100 mg IV o IM ANTES de la glucosa en el enólico crónico o el desnutrido.", "Reposición de volumen y corrección de Mg, K y P."]}, {"type": "h", "text": "Agitación"}, {"type": "list", "items": ["Diazepam 10–20 mg v.o. o s.l., midazolam 5 mg IM o haloperidol 5 mg IM. Repetible según la respuesta.", "Reevaluar con frecuencia, porque el cuadro es evolutivo."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Alta solo cuando no suponga un riesgo para él ni para terceros (marcha estable, orientado). Reevaluar periódicamente.", "Comunicado judicial en todos los casos.", "Ofrecer intervención breve y derivación a un CAS si hay consumo de riesgo."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Tiamina en la sospecha de Wernicke: las dosis recomendadas son mucho mayores: 200–500 mg IV cada 8 h durante 3–5 días (EFNS 2010, Royal College of Physicians, revisiones de 2023). 100 mg es dosis de profilaxis.", "La glucosa no debe retrasarse por la tiamina si hay hipoglucemia: darla y administrar la tiamina enseguida.", "Agitación en el intoxicado etílico: precaución con las BZD (depresión respiratoria sumada al etanol). Droperidol, olanzapina IM o haloperidol son alternativas (ACEP 2023, *Clinical Policy on severe agitation*).", "Metadoxina: sin evidencia robusta. No se recomienda de rutina.", "Cetoacidosis alcohólica: SG 5 % + SF y tiamina. No necesita insulina."]}]}], "sources": "Galvin R et al. EFNS guidelines for Wernicke encephalopathy (Eur J Neurol 2010); ACEP Clinical Policy: Severe Agitation in the ED (Ann Emerg Med 2023); Goldfrank's Toxicologic Emergencies (11th ed., 2019).", "cats": ["tox"], "vital": false}, {"title": "Intoxicación por anfetaminas (MDMA, metanfetamina, speed)", "page": 91, "protocol": "PROTOCOLO ANFETAMINAS (1ª versión, sep 2024)", "service": "", "date": "", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Toxíndrome simpaticomimético: agitación, midriasis, taquicardia, HTA, temblor, sudoración, bruxismo (\"mascar chicle\").", "Psiquiátrico: agitación, violencia, psicosis paranoide, ideación suicida.", "CV: arritmias (también ventriculares), SCA, crisis HTA, disección aórtica, miocardiopatía (metanfetamina crónica).", "MDMA: hipertermia + hiponatremia (SIADH) + rabdomiólisis + fallo renal y hepático ± CID; síndrome serotoninérgico.", "Neurológico: convulsiones, ictus isquémico o hemorrágico, coma. Colitis isquémica, hepatotoxicidad.", "Contexto: fiesta, chemsex, consumo de \"shabú\" para aguantar jornadas laborales."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Cocaína, catinonas o NPS, LSD, anticolinérgicos.", "Abstinencia de alcohol o BZD.", "Tirotoxicosis, feocromocitoma, golpe de calor, sepsis o meningitis (si hay fiebre).", "TCE o traumatismos asociados. Policonsumo."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Constantes (Tª) + ECG obligatorios.", "Analítica según la clínica: Na, CK, función renal y hepática, coagulación (CID), gasometría con lactato, glucosa, troponina si hay dolor torácico.", "Hipertermia o fiebre: despistaje séptico. TC craneal si hay clínica neurológica grave.", "Tóxicos en orina solo si cambia el manejo. Positivo hasta 3 días; reactividad cruzada.", "Falsos positivos: pseudoefedrina, labetalol, adrenalina/noradrenalina, tetracaína, metilfenidato."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Soporte"}, {"type": "list", "items": ["Monitorizar. Fluidos si hay deshidratación, hipertermia o rabdomiólisis. Corregir los iones.", "Carbón activado 25 g (dosis única) si la ingesta oral fue hace <2 h, con la vía aérea protegida.", "Lavado gástrico si hay convulsiones o bajo nivel de conciencia (tras IOT).", "No hay antídoto. La depuración extrarrenal no está indicada."]}, {"type": "h", "text": "Fase 2 · Agitación y ansiedad (BZD de elección)"}, {"type": "list", "items": ["Diazepam 5–10 mg VO/SL o midazolam 2,5–5 mg IV lento (o 5 mg IM). Repetir si hace falta.", "Psicosis: olanzapina 10 mg VO o IM + contención (box del Área de Códigos)."]}, {"type": "h", "text": "Fase 3 · Complicaciones"}, {"type": "list", "items": ["HTA: nifedipino retard → labetalol → nitroprusiato en perfusión. Evitar betabloqueantes puros (sobre todo si hay cocaína).", "Hipertermia grave (>40 °C): los antitérmicos no sirven. Sueros fríos, hielo en ingles y axilas, ventiladores. Valorar dantroleno IV; evitar los neurolépticos.", "HipoTA: volumen → noradrenalina.", "Convulsiones: diazepam o clonazepam. Estatus → Neurología.", "IOT: relajante cisatracurio o rocuronio (no succinilcolina: hay riesgo de hiperK por rabdomiólisis)."]}]}, {"key": "destino", "label": "ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Observación ~6 h. Alta si es mayor de edad, sin confusión ni psicosis. Menores: solo con padres o tutores.", "Intento autolítico o psicosis >6 h → Psiquiatría.", "Ofrecer cribado de ITS/VIH (circuito \"VIHgila\") en chemsex. Consumo problemático → CAS. Metanfetamina → circuito REDAN (Psiquiatría).", "Comunicado judicial antes del alta.", "Mal pronóstico: focalidad, estatus, hipoTA, lactato alto, hipertermia + FMO, CID, arritmia ventricular, IAM."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Hiponatremia por MDMA: tratar con SSH 3% en bolo de 100–150 mL si hay síntomas graves (convulsiones, coma), según el consenso europeo de hiponatremia (ESE/ESICM/ERA 2014). Restringir líquidos si es leve.", "Hipertermia: el enfriamiento rápido activo (inmersión en agua helada si es posible, objetivo <39 °C en 30 min) es lo que más reduce la mortalidad. El dantroleno no tiene evidencia sólida en la hipertermia simpaticomimética (revisiones de toxicología, ACMT).", "Agitación grave: las guías de toxicología (ACMT/AACT) priorizan BZD a dosis altas y repetidas. Si son insuficientes: ketamina IM 4–5 mg/kg o antipsicótico (olanzapina o droperidol, con ECG).", "Betabloqueantes: la prohibición absoluta (\"unopposed alpha\") se está matizando con evidencia observacional que no demuestra daño (revisión AHA 2023 sobre SCA y drogas). Aun así, evitarlos en la fase aguda sigue siendo lo prudente."]}]}], "sources": "Spasovski G et al. European clinical practice guideline on hyponatraemia (Eur J Endocrinol 2014); ACMT position on management of sympathomimetic toxicity; Gilbert BW et al. Beta-blockers in cocaine/methamphetamine (review 2023).", "cats": ["tox"], "vital": false}, {"title": "Intoxicación por antiepilépticos", "page": 92, "protocol": "INTOXICACIÓN POR ANTIEPILÉPTICOS", "service": "Urgencias", "date": "nov 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "h", "text": "Carbamazepina (CBZ)"}, {"type": "list", "items": ["Dosis tóxica >20 mg/kg. Absorción lenta y errática (pico hasta las 72–100 h).", "Clínica: nistagmo, ataxia, midriasis, coma fluctuante, convulsiones (si >25 mg/L en epilépticos), cuadro anticolinérgico, QRS ancho, QT largo, BAV, hipotensión.", "Por niveles: 12–16 mg/L ataxia; 16–24 estupor; 24–40 coma alternando con agitación; >40 grave; >60 coma arreactivo y cardiotoxicidad.", "Hiponatremia (SIADH) en el tratamiento crónico. Radiopaca. Da falsos positivos de ADT en orina."]}, {"type": "h", "text": "Oxcarbazepina"}, {"type": "list", "items": ["Menos tóxica. Sedación, hiponatremia."]}, {"type": "h", "text": "Fenitoína"}, {"type": "list", "items": ["Dosis tóxica >20 mg/kg. Nistagmo (el primero en aparecer y el último en irse), ataxia, disartria, letargia. Convulsiones raras.", "IV rápida: bradicardia, BAV, hipotensión (propilenglicol), síndrome del guante púrpura.", "Por niveles: 15–30 mg/L nistagmo; 30–40 ataxia y disartria; >40 letargia; >70 potencialmente mortal.", "Con hipoalbuminemia, intoxicación aunque el nivel total sea \"normal\"."]}, {"type": "h", "text": "Valproico"}, {"type": "list", "items": ["Encefalopatía hiperamoniémica (amonio >80 µg/dL; puede darse con transaminasas y niveles normales).", "Edema cerebral de 12 h a 4 días después. Hepatotoxicidad (tipo Reye), miosis, depresión respiratoria, acidosis láctica, hipernatremia, hipocalcemia, pancitopenia, pancreatitis.", ">200 mg/kg o nivel >180 mg/L → depresión del SNC o convulsiones.", "Interacción: los carbapenémicos bajan los niveles un 50–80 %."]}, {"type": "h", "text": "Topiramato"}, {"type": "list", "items": ["Somnolencia, ataxia, convulsiones, acidosis metabólica hiperclorémica (anion gap normal), hiperamoniemia. Glaucoma agudo (crónico)."]}, {"type": "h", "text": "Levetiracetam"}, {"type": "list", "items": ["Depresión leve del SNC, bradicardia, hipotensión. Benigno."]}, {"type": "h", "text": "Gabapentina y pregabalina"}, {"type": "list", "items": ["Sedación, ataxia, temblor o asterixis, mioclonías, depresión respiratoria (con opioides). Pregabalina: QT y BAV.", "Uso recreativo (karkubi: + clonazepam + cannabis). Abstinencia que NO responde a BZD."]}, {"type": "h", "text": "Lamotrigina"}, {"type": "list", "items": ["Ataxia, nistagmo, mioclonías, convulsiones o estatus, QRS ancho, Brugada-like, rabdomiólisis."]}, {"type": "h", "text": "Lacosamida"}, {"type": "list", "items": ["Hipotensión refractaria, QRS ancho, arritmias."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Coingesta (paracetamol, BZD, alcohol). Interacciones (inhibidores del CYP3A4 con la CBZ).", "Hiperamoniemia en todo paciente con valproico y alteración de la conciencia.", "Hipoalbuminemia con fenitoína."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["ECG y monitorización (QRS, QT, BAV). Glucosa, función renal y hepática, iones, hemograma, gasometría venosa, CK.", "Niveles (laboratorio de Urgencias): CBZ, fenitoína, valproico, fenobarbital. Cada 4–6 h hasta que empiecen a bajar. – Rangos terapéuticos: CBZ 4–12; fenitoína 10–20 (libre 1–2); valproico 50–100 mg/L. – Fenitoína corregida = nivel / (0,2 × albúmina en g/dL + 0,1). – Laboratorio central: fenitoína o valproico libres, lamotrigina, gabapentina, oxcarbazepina.", "Valproico: amonio, lactato, calcio, perfil hepático. TC craneal si hay focalidad o la alteración de la conciencia dura >12 h."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Común"}, {"type": "list", "items": ["ABC, vía aérea y soporte hemodinámico (cristaloides y vasopresores).", "Carbón activado 25–50 g en dosis única si es seguro (no sirve en el topiramato). – Multidosis en la CBZ y la fenitoína graves (hasta 48 h, con la vía aérea protegida). – No multidosis en el valproico.", "Convulsiones: diazepam 10–30 mg IV. Si se repiten: levetiracetam o fenobarbital (no fenitoína).", "QRS >110 ms (CBZ, fenitoína, lamotrigina, lacosamida): bicarbonato 1 M 1–2 mEq/kg en 1–2 min, repetible. Perfusión: 150 mEq en 1 L de SF a 150 mL/h, con objetivo de pH 7,45–7,55. Vigilar el Na y el K."]}, {"type": "h", "text": "Específico"}, {"type": "list", "items": ["Fenitoína IV con hipotensión: parar la infusión, SF 250–500 mL y reanudar a la mitad de ritmo (<50 mg/min).", "Guante púrpura: elevar el miembro, NTG tópica, analgesia, observación 24 h.", "Valproico: retirarlo. – L-carnitina IV si hay hepatotoxicidad, encefalopatía o hiperamoniemia grave: 100 mg/kg en 10–30 min (máximo 6 g), luego 50 mg/kg cada 8 h (máximo 3 g). – Asintomático con sobredosis: 50–100 mg/kg/día v.o. – Naloxona 0,4–2 mg (hasta 10 mg) si hay depresión del SNC.", "Topiramato con pH <7,2: bicarbonato 100–150 mEq en bolo y luego perfusión.", "Abstinencia de gabapentinoides: reintroducir y reducir de forma progresiva (no responde a BZD)."]}, {"type": "h", "text": "Depuración extrarrenal (EXTRIP; HD intermitente)"}, {"type": "list", "items": ["CBZ: – Recomendada: crisis refractarias o arritmias malignas. – Sugerida: coma prolongado o VM, o toxicidad persistente con niveles que suben. – Suspender si <10 mg/L. Mantener el carbón activado multidosis.", "Valproico: – Recomendada: >1.300 mg/L, shock o edema cerebral. – Sugerida: >900 mg/L, coma o VM, hiperamoniemia o pH <7,1.", "Fenitoína: sugerida si hay coma prolongado o ataxia incapacitante prolongada (no solo por los niveles).", "Topiramato, gabapentina o pregabalina: valorar en la IR grave o la toxicidad con riesgo vital.", "Levetiracetam y oxcarbazepina: no indicada."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["CBZ: observación ≥24 h aunque llegue asintomático.", "Valproico asintomático con niveles bajos: 6 h (12 h si es de liberación retardada). Si son altos, seriar los niveles.", "UCI: ingesta masiva, clínica grave, niveles muy altos o QRS ancho.", "Psiquiatría si es autolítica."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Emulsión lipídica (ILE): las guías de 2016 (Lipid Emergency Resuscitation Workgroup) no la recomiendan salvo en la toxicidad con riesgo vital refractaria por fármacos liposolubles (CBZ o lamotrigina como rescate). Coincide con el protocolo.", "Estatus en la intoxicación: evitar la fenitoína (es un bloqueante de canales de Na) y preferir BZD → fenobarbital o propofol.", "Carnitina: se usa también profiláctica en todas las ingestas grandes de valproico (>400 mg/kg o nivel >450 mg/L), según series recientes.", "Gabapentinoides: riesgo de depresión respiratoria con opioides (advertencias de la FDA de 2019 y de la EMA de 2022). La pregabalina se asocia a dependencia (sujeta a control en el Reino Unido desde 2019)."]}]}], "sources": "Ghannoum M et al. EXTRIP recommendations for carbamazepine (CJASN 2014), valproic acid (Clin Toxicol 2015), phenytoin (Clin Toxicol 2016); Gosselin S et al. Evidence-based recommendations on lipid emulsion therapy (Clin Toxicol 2016); FDA Drug Safety Communication on gabapentinoids (2019).", "cats": ["neuro", "tox"], "vital": false}, {"title": "Intoxicación por benzodiacepinas (y fármacos Z)", "page": 94, "protocol": "INTOXICACIÓN POR BENZODIAZEPINAS", "service": "Urgencias", "date": "2017, rev. mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["\"Coma con constantes estables\": superficial, hiporrefléxico, tendencia a la miosis.", "Sedación, disartria, ataxia, bradipsiquia. Si es grave: depresión respiratoria, hipotensión, BAV (excepcional).", "La gravedad aumenta con etanol, opioides u otros hipnóticos, y en el anciano.", "BZD de diseño (etizolam, clonazolam, flubromazolam): más potentes y de acción más larga.", "Interacciones que alargan la vida media: macrólidos, diltiazem, inhibidores de la proteasa, azoles, fluoxetina o fluvoxamina."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Coingesta: opioides, etanol, GHB, barbitúricos, ADT. Paracetamol en todo intento autolítico.", "Causa orgánica: ictus, TCE, meningoencefalitis, hipoglucemia, hipoxemia, hipercapnia, hipotermia, hiponatremia, CO.", "Complicaciones del coma: broncoaspiración, rabdomiólisis, síndromes compartimentales por presión."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucemia capilar, temperatura, ECG (QRS y QTc: antes de dar flumazenilo).", "Analítica básica (CK si ha estado tiempo en el suelo). Gasometría arterial si hay depresión respiratoria. Rx de tórax si se sospecha aspiración.", "Tóxicos en orina (BZD, leer a los 5 min) si hay dudas o se sospechan otros. Paracetamolemia si es autolítica.", "Si el paciente está asintomático y la ingesta es aislada, pueden no hacer falta pruebas."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Soporte (casi siempre basta)"}, {"type": "list", "items": ["ABCDE, O₂, vía venosa, SF si hay hipotensión. IOT si hace falta sin retrasarla. Monitorización.", "Carbón activado 50 g en dosis única si han pasado <2 h, solo con la vía aérea protegida."]}, {"type": "h", "text": "Flumazenil (no de rutina)"}, {"type": "list", "items": ["Indicación: GCS ≤12 en un paciente seleccionado, monitorizado y ya estabilizado.", "Dosis: 0,25 mg IV en 1 min, repetible cada minuto hasta un máximo de 1 mg (4 bolos) o GCS >12. Si hay riesgo, administrarlo más despacio.", "Resedación: perfusión de 0,1–0,5 mg/h (2 mg en 500 mL de SF; 80 mL/h ≈ 0,33 mg/h).", "Sin respuesta tras 3,5 mg → buscar otro diagnóstico.", "Contraindicaciones absolutas: epilepsia o crisis, QRS ancho, ECG de ADT.", "Contraindicaciones relativas: ingesta mixta o desconocida, proconvulsivantes (ADT, carbamazepina, teofilina, cocaína, ISRS, isoniazida, anfetaminas), proarritmógenos, dependencia de BZD, etanol."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Observación hasta la recuperación de la conciencia (más larga con BZD de vida media larga o tras flumazenil, por la resedación).", "Psiquiatría si es autolítica."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Flumazenil: la mayoría de guías de toxicología (EAPCCT, AACT y Goldfrank) lo desaconsejan en la intoxicación de origen desconocido o mixta y en usuarios crónicos de BZD. Se reserva para la sedación iatrogénica, para el niño con ingesta accidental aislada o para evitar la IOT en una ingesta pura conocida.", "Revisión sistemática (Penninga 2016): más efectos adversos graves (convulsiones, arritmias) que con placebo, y ninguna diferencia en la mortalidad.", "Carbón activado: las guías no lo recomiendan de rutina en la ingesta aislada de BZD (la toxicidad es baja y hay riesgo de aspiración)."]}]}], "sources": "Penninga EI et al. Adverse events associated with flumazenil treatment (Basic Clin Pharmacol Toxicol 2016); AACT/EAPCCT Position paper: single-dose activated charcoal (Clin Toxicol 2005, reafirmado); Goldfrank's Toxicologic Emergencies (11th ed., 2019).", "cats": ["tox"], "vital": false}, {"title": "Intoxicación por betabloqueantes y calcioantagonistas", "page": 95, "protocol": "INTOXICACIONES POR BETABLOQUEANTES Y ANTAGONISTAS DEL CALCIO", "service": "Urgencias", "date": "abr 2022", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Hipotensión + bradicardia o BAV en un paciente con estos fármacos, ingesta accidental o autolítica. Con 5–10 veces la dosis habitual puede ser grave.", "Inicio: a menudo en <2 h y casi siempre en <6 h. Las formulaciones retard y el sotalol pueden tardar >24 h.", "Betabloqueantes: depresión del SNC o convulsiones (propranolol, liposoluble), hipoglucemia, broncoespasmo. – Propranolol: QRS ancho (estabilizador de membrana). – Sotalol: QT largo, torsades.", "Calcioantagonistas: – Dihidropiridinas (amlodipino): vasodilatación con hipotensión y taquicardia refleja. – Verapamilo y diltiazem: bradicardia, BAV, shock cardiogénico. – Hiperglucemia (orienta al diagnóstico y tiene valor pronóstico). Conciencia conservada salvo en el shock profundo.", "La selectividad se pierde en la sobredosis."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Coingesta: otros cardioactivos (digoxina, cuyos niveles suben), paracetamol y salicilatos en el intento autolítico.", "Otras causas de bradicardia o shock (SCA, hiperpotasemia, sepsis, hipotiroidismo)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucemia inmediata. Na, K, calcio iónico, Mg, urea, creatinina, lactato, perfil hepático, gasometría venosa. Paracetamol y salicilatos.", "ECG (PR, BAV, QRS, QT, patrón de Brugada) y monitorización continua. Rx de tórax.", "Durante el tratamiento: calcio cada 1–2 h (cada 4–6 h si está estable); glucosa y K cada 30–60 min con la insulina.", "Ecocardiograma a pie de cama si no mejora (¿hiperdinámico o contractilidad reducida?)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Descontaminación"}, {"type": "list", "items": ["Carbón activado 50 g: en TODOS los calcioantagonistas aunque estén asintomáticos, y en los betabloqueantes si la dosis es >5 veces la habitual. Hasta 2 h (6 h si es retard). Con la vía aérea segura.", "Irrigación intestinal total (Moviprep®) si es retard o con cubierta entérica. Verapamilo o diltiazem en cantidad significativa: aunque estén asintomáticos.", "Sin lavado gástrico de rutina (estímulo vagal)."]}, {"type": "h", "text": "Escalada (a menudo de forma simultánea)"}, {"type": "list", "items": ["1. Volumen restrictivo: SF 10–20 mL/kg + SG (evitar la hipoglucemia del betabloqueante). Atropina en la bradicardia (respuesta escasa).", "2. Calcio precoz: cloruro cálcico 10 % 10 mL (vía central) o gluconato cálcico 10 % 30 mL, en bolo lento, hasta 3 dosis. – Perfusión: 0,5 mEq/kg/h (cloruro 0,2–0,4 mL/kg/h o gluconato 0,6–1,2 mL/kg/h). Objetivo: Ca iónico al doble del límite superior. – Sulfato de Mg si está bajo o el QT es largo (aunque esté normal).", "3. Vasopresores: noradrenalina 0,2–1 µg/kg/min (o dopamina 2–20 µg/kg/min si hay bradicardia).", "4. Insulina a dosis altas (HIET), sobre todo si la contractilidad está deprimida: – Glucemia >150 antes (si no, SG primero). – Bolo de 1 UI/kg de insulina + 0,5 g/kg de glucosa. Perfusión de 0,5 UI/kg/h + 0,25 g/kg/h de glucosa. – Glucemia y K cada 30 min, luego cada hora. Los calcioantagonistas a veces no necesitan glucosa.", "5. Glucagón (después de los vasopresores, no como primera línea): 5 mg IV en 1 min, repetible a los 15 min. Si responde, perfusión de 2–5 mg/h. Con ondansetrón.", "6. Circulación hiperdinámica: vasopresina o adrenalina. Contractilidad baja: dobutamina 2,5–10 µg/kg/min (con cautela milrinona o levosimendán).", "7. Bradicardia o BAV avanzado o QT largo: isoprenalina (1 mg en 250 mL; en el QT largo, 2–4 µg/min) o marcapasos (captura difícil). – Sotalol: Mg + isoprenalina o marcapasos para mantener la FC >100.", "8. Convulsiones (betabloqueantes): BZD, propofol o barbitúricos.", "9. Refractario: – Emulsión lipídica 20 %: 1,5 mL/kg en bolo + 0,25 mL/kg/min (más útil en liposolubles como el propranolol). Interfiere con la diálisis y la ECMO. – Azul de metileno 1–2 mg/kg en 15 min (repetible a la hora). – ECMO VA o balón de contrapulsación (UCO o UCI).", "HD: solo atenolol y sotalol (bisoprolol, moderadamente). No dializar los calcioantagonistas."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Betabloqueante: – Dosis ≤ la diaria y asintomático → domicilio, salvo sotalol (>24 h hospitalizado), propranolol o carvedilol, o varios cardioactivos (≥6 h en urgencias). – Retard: observación de 6–12 h.", "Calcioantagonista: rápido, 6–8 h; retard, >24 h monitorizado.", "Inestable o con alteración de la conciencia → UCI o semicríticos. Psiquiatría si es autolítica."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Consenso internacional sobre calcioantagonistas (St-Onge 2017, Crit Care Med):", "HIET de primera línea si hay disfunción miocárdica, en paralelo con el calcio y la noradrenalina, no al final.", "Se recomienda titular la insulina hasta 10 UI/kg/h si hace falta (el protocolo limita a 10 UI/h en total). Habitualmente se empieza a 1 UI/kg/h.", "El glucagón no se recomienda en los calcioantagonistas.", "Emulsión lipídica solo en la parada o en el shock *in extremis*.", "Betabloqueantes (consenso de 2021–2023, \"BB-tox\"): igual prioridad para la HIET y los vasopresores. El glucagón es una opción de segunda línea con evidencia débil.", "ECMO VA: las series apoyan su uso precoz en el shock cardiogénico refractario por fármacos (supervivencia >70 % en centros con experiencia)."]}]}], "sources": "St-Onge M et al. Experts consensus recommendations for the management of calcium channel blocker poisoning in adults (Crit Care Med 2017); Graudins A et al. Calcium channel antagonist and beta-blocker overdose: antidotes and adjunct therapies (Br J Clin Pharmacol 2016); Goldfrank's Toxicologic Emergencies (11th ed., 2019).", "cats": ["cardio", "tox"], "vital": true}, {"title": "Intoxicación por cannabis (e hiperémesis cannabinoide)", "page": 97, "protocol": "INTOXICACIÓN POR CÁNNABIS", "service": "Unidad Funcional de Toxicología", "date": "v2, may 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Clínica: euforia o disforia, ansiedad o crisis de pánico, psicosis, taquicardia, hiperemia conjuntival, boca seca, ataxia, aumento del apetito.", "Pico: fumado a los 15–30 min (dura 2–4 h). Oral (comestibles) a los 90–120 min, con una semivida de 7–10 h (efectos más intensos y prolongados).", "Niños (ingesta oral accidental): somnolencia hasta el coma, ataxia, hipercinesia, convulsiones, depresión respiratoria.", "Concentrados (*wax*, *dabs*, *shatter*: 80–99 % de THC) y cannabinoides sintéticos: cuadros más graves.", "Hiperémesis cannabinoide: consumo crónico, vómitos cíclicos y alivio con duchas calientes compulsivas.", "Abstinencia (≥3 síntomas en 7 días): irritabilidad, ansiedad, insomnio, inquietud, ánimo deprimido, cefalea o dolor abdominal."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Coingesta: alcohol (se potencian), cocaína u otros simpaticomiméticos (en el niño con convulsiones), opioides (en el niño en coma).", "Complicaciones: SCA o miocarditis (raros), síncope, neumotórax o neumomediastino, asma descompensada. Hipoglucemia en el niño.", "Hiperémesis: evitar pruebas innecesarias, pero descartar abdomen agudo, pancreatitis, CAD o embarazo."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["El diagnóstico es clínico. Analítica básica si la clínica es importante. ECG si hay síntomas cardiovasculares.", "THC en orina solo en casos seleccionados: niños (pueden faltar los antecedentes), para descartar otras sustancias o si cambia la actitud. – La orina solo indica consumo (positiva durante días). – La sangre sí se correlaciona con la intoxicación aguda (confirmación por LC-MS, muestras llevadas en mano)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Intoxicación aguda"}, {"type": "list", "items": ["Soporte y tranquilizar al paciente en un entorno tranquilo.", "BZD si hay ansiedad o agitación. Agitación grave refractaria: protocolo del paciente agitado.", "No hacer descontaminación digestiva.", "Niño en coma: ABCDE, glucemia y valorar naloxona. Convulsiones: BZD.", "Tratar las complicaciones (SCA, neumotórax, asma)."]}, {"type": "h", "text": "Hiperémesis cannabinoide"}, {"type": "list", "items": ["Hidratación + antieméticos (poco eficaces).", "Capsaicina tópica 0,075 % en el abdomen (la aplica el paciente, con guantes).", "Haloperidol como opción.", "Abstinencia de cannabis, que es lo único curativo."]}, {"type": "h", "text": "Abstinencia o trastorno por consumo"}, {"type": "list", "items": ["Manejo ambulatorio. Derivar al CAS."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Hiperémesis (Consenso de la AAEM, 2024; revisión de AGA 2024):", "Haloperidol 0,05–0,1 mg/kg IV o droperidol: superiores al ondansetrón (ensayo HaVOC 2021).", "Capsaicina tópica como coadyuvante.", "Evitar opioides.", "Los antidepresivos tricíclicos (amitriptilina) sirven como profilaxis del síndrome de vómitos cíclicos.", "Comestibles en niños: las intoxicaciones aumentan en los países con legalización (alertas de AAP y CDC).", "Cannabis y riesgo cardiovascular: estudios de cohortes de 2024 (JAHA) asocian el consumo diario a más IAM e ictus, incluso sin tabaco."]}]}], "sources": "Ruberto AJ et al. Intravenous Haloperidol vs Ondansetron for Cannabis Hyperemesis Syndrome (HaVOC, Ann Emerg Med 2021); AGA Clinical Practice Update on Cannabinoid Hyperemesis Syndrome (Gastroenterology 2024); Jeffers AM et al. Cannabis use and CV outcomes (JAHA 2024).", "cats": ["tox"], "vital": false}, {"title": "Intoxicación por cocaína", "page": 98, "protocol": "PROTOCOLO INTOXICACIÓN AGUDA POR COCAÍNA", "service": "Urgencias", "date": "2019, rev. mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Síndrome simpaticomimético: midriasis, agitación, taquicardia, HTA, sudoración, temblor, hipertermia.", "Cualquier complicación cardiovascular o neurológica en un paciente joven (SCA, disección, ictus, HSA o hemorragia intraparenquimatosa, convulsiones, arritmias).", "Inicio de efectos y duración según la vía: – IV o fumada: <1 min; duración 30–60 min. – Nasal: 1–5 min; duración 1–2 h. – Oral: 30–60 min.", "Con alcohol: se forma cocaetileno, que dura más y es más cardiotóxico y arritmógeno.", "Crack: neumotórax o neumomediastino, broncoespasmo, quemaduras faríngeas, \"pulmón de crack\" (hemorragia alveolar en <48 h), neumonía eosinófila.", "Body-packer (paquetes intestinales)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["SCA (vasoespasmo y trombosis), síndrome aórtico agudo, ictus o hemorragia intracraneal, TEP.", "Ensanchamiento del QRS (bloqueo de canales de Na), QT largo.", "Hipertermia, rabdomiólisis, acidosis, IRA, isquemia mesentérica.", "Endocarditis si consume por vía IV y tiene fiebre.", "Diagnóstico diferencial: otros estimulantes, abstinencia alcohólica o de BZD, síndrome serotoninérgico, SNM, tormenta tiroidea, infección del SNC, cuadro psiquiátrico."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["ECG, analítica con función renal y hepática, iones, gasometría, CK, troponina si hay dolor torácico. Cultivos si hay fiebre.", "Rx de tórax (crack, broncoaspiración, IC). Rx de abdomen si es body-packer.", "TC craneal si hay convulsión, bajo nivel de conciencia, TCE o focalidad. Angio-TC si se sospecha disección o TEP.", "Tóxicos en orina: solo en casos seleccionados (confirma un consumo reciente, no la intoxicación; sin valor legal)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Base: benzodiacepinas"}, {"type": "list", "items": ["Diazepam 5–10 mg IV (o v.o./s.l.), repetible cada 3–5 min. Controla la agitación, la taquicardia, la HTA y las convulsiones, y reduce el consumo de O₂ miocárdico.", "Ansiedad: diazepam 5–10 mg o lorazepam 1 mg v.o., en un lugar tranquilo.", "Agitación (código agitación, box 1): midazolam IM, IN o IV ± haloperidol 2,5–5 mg IM o IV. Contención según el protocolo. Psicosis leve: quetiapina 25 mg u olanzapina v.o. Evitar clorpromazina (baja el umbral convulsivo)."]}, {"type": "h", "text": "Paciente crítico"}, {"type": "list", "items": ["ABCDE. IOT con rocuronio 1 mg/kg (succinilcolina relativamente contraindicada: hiperpotasemia y rabdomiólisis). UCI si es grave.", "Coma: descartar causas metabólicas, traumáticas y estructurales. IOT si GCS <8."]}, {"type": "h", "text": "Cardiovascular"}, {"type": "list", "items": ["HTA grave: BZD en primer lugar. Después nitroglicerina o nitroprusiato en perfusión. En segunda línea, labetalol IV (bloqueo α y β). Por vía oral: amlodipino 10 mg o enalapril 5–20 mg.", "SCA: igual que en el no intoxicado (AAS, nitratos, BZD). Prudencia con los betabloqueantes. Avisar a Cardiología.", "Síndrome aórtico: control estricto del dolor y la TA IV. Cirugía cardiaca o traslado.", "QRS ancho o arritmia ventricular: bicarbonato 1 M 1–2 mEq/kg IV, y lidocaína IV como opción segura. Evitar antiarrítmicos de clase IA y IC.", "FA: diltiazem o verapamilo. Si se usa betabloqueante: carvedilol o labetalol."]}, {"type": "h", "text": "Otros"}, {"type": "list", "items": ["Convulsiones: diazepam 5–10 mg IV, repetible. No iniciar antiepilépticos tras una primera crisis sin lesión estructural. Si es un estatus, avisar a Neurología.", "Ictus: activar el código ictus.", "Hipertermia: medidas físicas, sueros fríos y sedación con BZD. Dantroleno en casos graves.", "Rabdomiólisis: SF >1.000 mL/h al inicio. Objetivo de diuresis 100–150 mL/h.", "Neumotórax: drenaje (Cirugía). Broncoaspiración: ATB con cobertura de anaerobios y grampositivos.", "Body-packer: polietilenglicol (Movicol® o Moviprep®). No hacer endoscopia (riesgo de rotura). Cirugía si hay obstrucción o toxicidad por rotura."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Observación 6–8 h.", "Alta si está orientado, sin psicosis ni agitación y camina con normalidad.", "Comunicado judicial en todos los casos.", "Psiquiatría si hay psicosis, trastorno grave de conducta o intento de suicidio (incluida la abstinencia con disforia e ideación suicida). Ofrecer el CAS de zona."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Betabloqueantes (AHA 2008, AHA/ACC 2014 y 2025 sobre SCA, revisiones sistemáticas 2017–2022): con la intoxicación aguda, la tendencia actual es no darlos mientras haya signos de toxicidad. Con todo, los datos observacionales no muestran más eventos (\"estimulación α no contrarrestada\" sin evidencia sólida). Labetalol o carvedilol si hace falta.", "Dolor torácico tras cocaína: observación de 9–12 h con troponina seriada (AHA). El IAM real es poco frecuente (≈1–6 %).", "Fentolamina 1–5 mg IV (α-bloqueante): alternativa en la HTA o el vasoespasmo refractarios (AHA).", "Agitación grave: en muchas guías estadounidenses y europeas la ketamina IM (4–5 mg/kg) es una opción de rescate, con precaución por la HTA.", "Hipertermia >40 °C: inmersión en agua helada (la medida más eficaz). El dantroleno no tiene evidencia en la hipertermia por simpaticomiméticos."]}]}], "sources": "McCord J et al. Management of cocaine-associated chest pain and MI (AHA Scientific Statement, Circulation 2008); Richards JR et al. Cocaine- associated chest pain/beta-blockers systematic review (Am J Emerg Med 2017/2022); Goldfrank's Toxicologic Emergencies (11th ed., 2019).", "cats": ["tox"], "vital": false}, {"title": "Intoxicación por insulina y antidiabéticos (excepto metformina)", "page": 100, "protocol": "INTOXICACIÓN POR INSULINA Y FÁRMACOS ANTIDIABÉTICOS", "service": "Urgencias", "date": "2019, rev. mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Hipoglucemia ≤60 mg/dL (o más alta con síntomas). – Síntomas autonómicos: temblor, sudoración, taquicardia. – Neuroglucopenia: confusión, focalidad, convulsiones, coma.", "Hipoglucemia prolongada o recurrente tras una ingesta o inyección voluntaria, un error de dosis o insuficiencia renal (acúmulo).", "Insulina: puntos de punción visibles. Hipopotasemia, arritmias o QT largo, SCA. – En sobredosis, la duración depende de la dosis, no del tipo de insulina (hasta una semana). – Glargina U300 ≈ 24–36 h; degludec ≈ 42 h.", "Sulfonilureas: inicio a las 2–4 h (más tardío en el niño, hasta 45 h). Hipoglucemia recurrente hasta 8 días. – Glibenclamida, la de más riesgo; gliclazida, la de menos. – Un solo comprimido puede intoxicar a un niño.", "Glinidas (repaglinida): inicio <30 min, duración <8 h.", "DPP-4, GLP-1, glitazonas, acarbosa: hipoglucemia rara (salvo en combinación). Síntomas gastrointestinales. Vildagliptina: QT y hepatotoxicidad.", "iSGLT2: sobredosis no descritas. Cetoacidosis euglucémica."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Coingesta: otros antidiabéticos, etanol, betabloqueantes, salicilatos, IMAO.", "Interacciones que potencian las sulfonilureas: cotrimoxazol, quinolonas, azoles, claritromicina, IECA, alopurinol, quinina, haloperidol.", "Hipoglucemia facticia o criminal (insulina en un no diabético).", "IR o IH (prolongan la intoxicación), insuficiencia suprarrenal, sepsis."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucemia capilar horaria (cada 2–6 h cuando se estabilice).", "Analítica: glucosa, urea, creatinina, iones (K cada 4–6 h), Mg, P, gasometría, perfil hepático, TP, hemograma. ECG.", "Péptido C + insulina (laboratorio central de Hormonas), si hay dudas sobre el origen: – Insulina alta con péptido C bajo (cociente <1) → insulina exógena. – Insulina y péptido C altos → sulfonilurea (o insulinoma).", "Sulfonilureas en sangre u orina (tubo rojo sin gel) si se sospecha una hipoglucemia facticia."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Hipoglucemia (todos)"}, {"type": "list", "items": ["Consciente y tolera: 2–3 raciones de HC rápidos (un zumo o un sobre de azúcar). Después, HC complejos.", "Inconsciente o no tolera: SG 50 % 50 mL (25 g) IV lento (0,1–1 g/kg), por una vía de calibre grueso. Repetir si hace falta.", "Sin vía: glucagón 1 mg IM o s.c.", "Mantenimiento: SG 10 % 500 mL/4–6 h, ajustado a la glucemia (objetivo 100–200 mg/dL). Vía central si hace falta glucosa >10 %.", "Corregir el K. Convulsión: glucosa + BZD. IOT si no recupera la conciencia tras la glucosa.", "No dar glucosa profiláctica al asintomático."]}, {"type": "h", "text": "Insulina refractaria (SG 10 % >500 mL/2 h)"}, {"type": "list", "items": ["Glucagón 1 mg en 500 mL de SG 10 % cada 4–6 h (poco útil si el glucógeno está agotado, como en el alcohólico).", "Hidrocortisona 100 mg/8 h.", "Valorar extirpar quirúrgicamente el lugar de inyección si la dosis es masiva, en un solo punto, hace <2–3 h y la hipoglucemia es recurrente."]}, {"type": "h", "text": "Sulfonilureas (y glinidas)"}, {"type": "list", "items": ["Carbón activado 50 g si han pasado <2 h (más tiempo si son de liberación prolongada).", "Hipoglucemia recurrente pese a la glucosa → octreótido 50 µg s.c. o IV cada 6 h × 3–4 dosis (niño: 1–1,5 µg/kg). Bajar la glucosa a la vez.", "El glucagón no es de elección en las sulfonilureas (estimula la secreción de insulina)."]}, {"type": "h", "text": "iSGLT2"}, {"type": "list", "items": ["Cetoacidosis euglucémica: retirar el fármaco y tratar como una CAD. Suspenderlo en enfermedad aguda y 48 h antes de una cirugía."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Observación del asintomático: – Insulina: ≥18 h (hasta 36–48 h si es de acción prolongada o la dosis es masiva). – Sulfonilurea: adulto 12 h (más si es de liberación prolongada o hay IR); niño 8–24 h (no darle el alta por la noche). – Glinida: 6 h. DPP-4: 12 h. GLP-1, glitazona o iSGLT2: 24 h.", "Sintomático: semicríticos o área de vigilancia 24 h. Tras retirar la glucosa IV, ≥12 h más de controles (rebote, sobre todo si hubo hiperglucemia >180).", "Psiquiatría si es autolítica."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Octreótido en las sulfonilureas: en muchas guías (AACT, Goldfrank, revisiones de 2020) es de primera línea junto a la glucosa, en cuanto reaparece la hipoglucemia (no solo si es refractaria). Reduce los episodios recurrentes.", "Glucagón: útil solo como puente sin vía. En la intoxicación por betabloqueantes o calcioantagonistas se usa a dosis distintas (ver su ficha).", "Insulina masiva (revisión sistemática de 2018): la necesidad de glucosa puede ser >10–20 g/h durante días. Monitorizar el fósforo y el Mg, además del K.", "GLP-1 semanales (semaglutida, tirzepatida): con el aumento de su uso para la obesidad y de los errores de dosis, los vómitos pueden durar días. Hipoglucemia leve en no diabéticos."]}]}], "sources": "Glatstein M et al. Octreotide for sulfonylurea-induced hypoglycemia: systematic review (Clin Toxicol 2012/2020); Johansen NJ, Christensen MB. Insulin overdose: systematic review (J Med Toxicol 2018); Goldfrank's Toxicologic Emergencies (11th ed., 2019).", "cats": ["metab", "endo", "tox"], "vital": false}, {"title": "Intoxicación por litio", "page": 102, "protocol": "INTOXICACIÓN POR LITIO", "service": "Urgencias", "date": "2017, rev. mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Aguda sin tratamiento previo: dosis tóxica ≥100 mg/kg (≈18 comprimidos de Plenur® 400 mg en 70 kg). En tratamiento crónico: ≥50 mg/kg.", "Crónica (la más grave): aumento de dosis, deshidratación, IR, o fármacos nuevos (diuréticos, IECA o ARA-II, AINE, calcioantagonistas, psicofármacos).", "Clínica: – Digestiva (precoz en la aguda): vómitos, diarrea. – Neurológica (tardía en la aguda): temblor, rigidez en rueda dentada, hiperreflexia, mioclonías, ataxia, disartria, coreoatetosis → confusión, coma, convulsiones. – Cardiaca: QTc largo, bradicardia, alteraciones de la repolarización. – Renal: diabetes insípida nefrogénica, hipernatremia. – Endocrina: hipotiroidismo, hiperparatiroidismo con hipercalcemia.", "Gravedad clínica: – Leve: temblor, hipertonía, hiperreflexia. – Moderada: ataxia, mioclonías, coreoatetosis, desorientación. – Grave: estupor, coma, convulsiones.", "Secuelas (12–20 %): síndrome SILENT."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Síndrome serotoninérgico, SNM, ictus, TCE, infección del SNC.", "Coingesta (intento autolítico: paracetamol)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Litemia al llegar y a las 4 h (después, cada 12 h). Usar tubo marrón de bioquímica, no tubo con heparina de litio.", "Interpretación (frecuente la discordancia clínico-analítica): – 0,8–1,2 mEq/L: rango terapéutico. – 1,3–2,4: leve-moderada. – 2,5–4: moderada-grave. – >4: grave.", "Hemograma, iones (Na), función renal, perfil hepático, lipasa, gasometría venosa. Iones en orina si hay IR. ECG y Rx de tórax. Monitorización continua. TSH y calcio."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Descontaminación (aguda)"}, {"type": "list", "items": ["El carbón activado es INEFICAZ.", "Lavado gástrico hasta 6 h tras la ingesta.", "Polietilenglicol (irrigación intestinal total) en los casos potencialmente graves o con liberación prolongada, aunque haya pasado tiempo.", "No usar poliestireno sulfonato (Resincalcio®)."]}, {"type": "h", "text": "Aumentar la eliminación"}, {"type": "list", "items": ["Diuresis forzada neutra con SF 0,9 % (diuresis ≥100 mL/h) durante ≥24 h si la función renal es normal y no hay IC, sea cual sea la litemia. Añadir SG + KCl.", "Vigilar la hipernatremia (diabetes insípida) y la sobrecarga.", "Sin furosemida. Suspender litio, diuréticos, IECA y AINE.", "Extrapiramidalismo: biperideno."]}, {"type": "h", "text": "Hemodiálisis (intermitente, de elección)"}, {"type": "list", "items": ["Litemia >5 mEq/L, aunque no haya síntomas.", "Litemia >4 (≥12 h tras la ingesta) con cualquier síntoma neurológico.", "Coma, convulsiones o arritmias nuevas, sea cual sea la litemia.", "Deterioro neurológico progresivo (estupor).", "Clínica moderada o grave (mioclonías, ataxia) con litemia >2,5.", "Clínica con FG <45 tras 12 h de tratamiento médico.", "Litemia >4 sin síntomas y con buena función renal: observar, mantener la diuresis salina y repetir la litemia a las 24 h.", "Suspender la HD si la litemia es <1 tras ≥6 h. Litemia al terminar y a las 12 h (rebote). Repetir si sube >1 mEq/L."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["UCI y Nefrología si hay indicación de HD.", "Psiquiatría (trastorno bipolar o intento autolítico).", "La liberación prolongada exige litemias seriadas hasta que bajen."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["EXTRIP (2015) es más restrictivo:", "HD recomendada si la litemia es >4,0 con función renal alterada, o si hay bajo nivel de conciencia, convulsiones o arritmias graves.", "HD sugerida si la litemia es >5,0, hay confusión, o se espera tardar >36 h en bajar de 1 mEq/L.", "Irrigación intestinal total con PEG (1–2 L/h): indicada en las ingestas agudas de liberación prolongada (AACT/EAPCCT).", "La diuresis forzada no aumenta claramente el aclaramiento. La tendencia actual es euvolemia con SF y evitar la hipernatremia. Ni dopamina ni otros diuréticos.", "Amilorida: útil en la diabetes insípida nefrogénica crónica por litio (no en la fase aguda)."]}]}], "sources": "Decker BS et al. EXTRIP: Extracorporeal Treatment for Lithium Poisoning – Systematic Review and Recommendations (Clin J Am Soc Nephrol 2015); Baird-Gunning J et al. Lithium Poisoning (J Intensive Care Med 2017).", "cats": ["tox"], "vital": false}, {"title": "Intoxicación por metanol (y alcoholes tóxicos)", "page": 104, "protocol": "INTOXICACIÓN POR METANOL", "service": "Urgencias", "date": "2017, rev. mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Ingesta de alcohol de quemar, limpiaparabrisas, disolventes o anticongelante. Alcohol adulterado (brotes).", "Fase inicial: parece una borrachera, con vómitos, dolor abdominal y cefalea. Puede retrasarse si se ha bebido etanol a la vez.", "Después: visión borrosa, pérdida de agudeza visual, midriasis, fotofobia (\"tormenta de nieve\"), respiración de Kussmaul, confusión, coma, convulsiones, edema cerebral.", "Secuelas: ceguera (atrofia óptica), parkinsonismo (necrosis de los ganglios basales).", "Dosis: 10 mL de metanol puro ya es tóxico y 30 mL pueden ser mortales."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Diagnóstico diferencial de la acidosis con anion gap alto: etilenglicol (IRA, cristales de oxalato), dietilenglicol, propilenglicol, isopropanol, cetoacidosis alcohólica o diabética, láctica, salicilatos, sepsis, abstinencia alcohólica."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Gasometría (acidosis metabólica, a menudo con pH <7), anion gap (normal 8–16), osmolalidad medida → gap osmolar. – Osmolalidad calculada = 2 × Na + glucosa/18 + urea/6. – Gap osmolar = medida − calculada (patológico si es >10–15).", "Hemograma, iones, función renal, calcio, lactato (desproporcionadamente bajo para la acidosis), lipasa.", "Metanol en sangre + etanol + etilenglicol (Toxicología del H. Clínic: 932275400, ext. 2567; busca 380194). – Gravedad por metanolemia: <0,2 g/L leve; 0,2–0,5 moderada; 0,5–1 grave; 1–1,5 muy grave; ≥1,5 potencialmente mortal.", "ECG, Rx de tórax, monitorización. Fondo de ojo. TC craneal si hay coma."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Inicio"}, {"type": "list", "items": ["Iniciar el tratamiento con la sospecha fundada, sin esperar los niveles.", "Lavado gástrico solo si han pasado <1 h. El carbón activado no sirve."]}, {"type": "h", "text": "Soporte"}, {"type": "list", "items": ["Bicarbonato 1 M para mantener el pH >7,3 (controlar el K).", "Hidratación individualizada, sin diuresis forzada.", "Edema cerebral (coma o convulsiones): cabecero a 45°, restricción hidrosalina (el protocolo añade dexametasona 8 mg/6 h). Proteger la vía aérea.", "Ácido folínico (leucovorina) 50 mg IV cada 4 h × 24 h: favorece la eliminación del ácido fórmico.", "Piridoxina 100 mg/6 h IV + tiamina 100 mg/6 h IV (1.000 mg si se sospecha Wernicke)."]}, {"type": "h", "text": "Antídoto: bloquear la ADH"}, {"type": "list", "items": ["Indicación (ingesta probable >10 mL y al menos uno de estos): – Síntomas extradigestivos (conciencia, conducta, visión). – Exceso de bases < −5. – Anion gap >30. – Gap osmolar >15. – Metanol >0,2 g/L.", "Etanol IV al 100 % por vía central: – Bolo de 1 mL/kg en 500 mL de SG 5 % en 60 min. – Mantenimiento: 0,1 mL/kg/h (0,2 mL/kg/h en el alcohólico crónico). – Objetivo: etanolemia de 1 g/L. Etanolemia cada 6 h y glucemia capilar cada 3 h. – Doblar el ritmo durante la HD. – Suspender cuando el metanol sea <0,1 g/L y el EB > −5 sin bicarbonato.", "Fomepizol (pedirlo a la red de antídotos; empezar con etanol mientras llega): – Indicado si hay pérdida de visión, clínica neurológica grave, contraindicación del etanol (disulfiram) o es un niño. – Dosis: 15 mg/kg IV en 30 min, luego 10 mg/kg cada 12 h × 4 dosis, y después 15 mg/kg cada 12 h hasta que el metanol sea <0,2 g/L."]}, {"type": "h", "text": "Hemodiálisis"}, {"type": "list", "items": ["Indicaciones: – Ingesta >10 mL. – Síntomas extradigestivos (sobre todo visuales o de conciencia). – EB < −10, anion gap >30 o pH <7,1. – Gap osmolar >15. – Metanol >0,5 g/L.", "Mantener hasta corregir la acidosis sin bicarbonato y bajar el metanol a <0,1 g/L. Metanol a las 2 h de terminar."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["UCI y Nefrología.", "Si hay un posible brote (bebidas adulteradas), avisar a Salud Pública."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Fomepizol de primera elección (AACT 2002, EXTRIP 2015, revisiones de 2023): es más fácil de dosificar, no seda y no causa hipoglucemia. El etanol queda como alternativa cuando no hay fomepizol.", "Cada 4 h durante la HD (o en perfusión de 1–1,5 mg/kg/h).", "HD según EXTRIP 2015:", "Recomendada si hay coma, convulsiones o déficit visual nuevo, pH ≤7,15, acidosis persistente pese al antídoto, o anion gap >24.", "Recomendada por metanolemia: >700 mg/L con fomepizol, >600 mg/L con etanol o >500 mg/L sin bloqueo de la ADH.", "HD intermitente de elección, frente a las técnicas continuas.", "Dexametasona en el edema cerebral: sin evidencia en el metanol. No figura en las guías actuales.", "Ácido fólico o folínico 50 mg IV cada 4–6 h hasta eliminar el metanol (no solo 24 h)."]}]}], "sources": "Roberts DM et al. EXTRIP Recommendations for Methanol Poisoning (Crit Care Med 2015); Barceloux DG et al. AACT Practice Guidelines on Methanol Poisoning (J Toxicol Clin Toxicol 2002); Hovda KE et al. Methanol outbreaks (Clin Toxicol 2022).", "cats": ["tox"], "vital": true}, {"title": "Intoxicación por metformina (acidosis láctica asociada)", "page": 106, "protocol": "INTOXICACIÓN POR METFORMINA", "service": "Unidad Funcional de Toxicología", "date": "v2, may 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Acidosis metabólica con lactato alto sin causa clara en un paciente que toma metformina: – Sola o en combinación (con iDPP-4 o iSGLT2). – Tóxica en adultos a partir de >5 g; ingestas de 30–50 g pueden ser graves. En pediatría, >100 mg/kg.", "Tres tipos: – MILA (inducida): sobredosis aislada. Mejor pronóstico, porque el fármaco se puede extraer. – MALA (asociada): FRA o deshidratación más factores de riesgo. – MULA (no relacionada): la metformina coexiste con otra causa (sepsis, shock).", "Sospecha muy alta si se cumplen los 5 criterios: toma metformina, lactato ≥15 mmol/L con anion gap ≥20, pH ≤7,1, HCO₃ ≤10 e IR (FG <45 o creatinina >2).", "Sobredosis: al principio asintomática. A las 6–8 h, vómitos, dolor abdominal y diarrea → shock, alteración de la conciencia, hipotermia, arritmias.", "Hipoglucemia (≈10 %) cuando se combina con otros antidiabéticos.", "Factores de riesgo: – FRA (GEA, deshidratación), cirrosis o IH (la más peligrosa), IC descompensada, sepsis, hipoxemia, alcohol, contraste yodado, edad >65 años. – Fármacos: IECA, ARA-II, AINE, topiramato."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Se confunde con una sepsis abdominal o una isquemia mesentérica (dolor abdominal, leucocitosis, acidosis grave).", "Otras causas de acidosis con anion gap alto: CAD (incluida la euglucémica por iSGLT2), alcoholes tóxicos, salicilatos, paracetamol masivo.", "Coingesta (paracetamol, otros antidiabéticos)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucemia capilar y cetonemia.", "Gasometría (pH, HCO₃, anion gap), lactato, urea, creatinina, iones (Na, K, Cl), calcio, hemograma, bilirrubina, transaminasas, coagulación (TP). PCT si se sospecha sepsis.", "ECG y Rx de tórax.", "Nivel de metformina (tubo de bioquímica con gel; laboratorio central, \"METFORMINA Sèrum [1893G]\"). Es diferido y sirve para confirmar después.", "Pronóstico: la cifra de lactato es el mejor predictor de mortalidad (cada mmol/L aumenta la mortalidad un 9 %; pH <6,9 o lactato >25 → alta mortalidad). TP alargado = mal pronóstico."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales"}, {"type": "list", "items": ["RETIRAR LA METFORMINA.", "Soporte: hidratación intensiva (suelen estar muy deshidratados), vasopresores si hacen falta. IOT si GCS <8 (vigilar la ventilación: compensa la acidosis).", "Carbón activado en la sobredosis aguda con la vía aérea protegida (no sirve en la intoxicación crónica).", "Glucosa si hay hipoglucemia e insulina si hay hiperglucemia.", "Bicarbonato si pH <7,2: bicarbonato 1 M 1 mL/kg en bolo, con objetivo de pH >7,25. Si el pH está entre 7,2 y 7,25 y tolera volumen, bicarbonato 1/6 M. No más allá."]}, {"type": "h", "text": "Hemodiálisis (avisar pronto a Nefrología)"}, {"type": "list", "items": ["Indicaciones (EXTRIP): – Lactato >20 mmol/L. – pH ≤7,0 pese al soporte y 4 h de bicarbonato. – Anuria u oligoanuria o hiperpotasemia refractaria. – Disminución de la conciencia. – IH con INR >1,5 o encefalopatía.", "Técnica: HD intermitente de baja eficiencia, 6–8 h (Qb 200, Qd 400, filtro de baja permeabilidad, sin corregir el K de forma brusca). – HDFVVC si hay shock o inestabilidad. – Control a las 4 h. Suspender si lactato <3,5 y pH >7,35. Repetir al terminar y a las 12 h (rebote).", "No retrasarla en la sobredosis aguda (redistribución tisular)."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Ingesta aguda asintomática: observación 6–8 h con gasometría y lactato, y glucemia. Si no hay acidosis ni hipoglucemia → alta.", "En tratamiento crónico, asintomático y con lactato ligeramente alto (<5 mmol/L): suspender la metformina y control por su médico en unos días. Un lactato <3,5 no es alarmante.", "UCI si hay acidosis, hipoglucemia, alteración de la conciencia o inestabilidad.", "Al alta: suspender la metformina si hay vómitos o diarrea (\"reglas de días de enfermedad\"). Contraindicada si FG <30; mitad de dosis con FG 30–45."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Contraste yodado (ESUR 2018, ACR 2023): no suspender la metformina si el FG es ≥30 y no hay FRA. Coincide con el protocolo.", "EXTRIP (2015): recomienda la HD en las mismas situaciones y prefiere la HD intermitente convencional. La \"baja eficiencia\" del protocolo es una adaptación local para evitar la corrección brusca.", "Bicarbonato: el ensayo BICAR-ICU (Lancet 2018) mostró beneficio en la acidosis grave (pH ≤7,20) con FRA. Apoya la indicación.", "Combinaciones con iSGLT2: pensar en una cetoacidosis euglucémica concomitante (cetonemia)."]}]}], "sources": "Calello DP et al. EXTRIP recommendations for metformin poisoning (Crit Care Med 2015); Jaber S et al. BICAR-ICU (Lancet 2018); ESUR Guidelines on Contrast Agents v10 (2018); ACR Manual on Contrast Media (2023).", "cats": ["metab", "tox"], "vital": false}, {"title": "Intoxicación por nuevas sustancias psicoactivas (NPS)", "page": 108, "protocol": "INTOXICACIÓN POR NUEVAS SUSTANCIAS PSICOACTIVAS", "service": "Urgencias", "date": "mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Clínica tóxica que no cuadra con las drogas clásicas, con tóxicos en orina negativos (los kits no detectan las NPS). *Chemsex*, compra por internet. Policonsumo.", "Ketamina y metoxetamina (disociativos): mareo, ataxia, nistagmo, disminución de la conciencia, delirium o psicosis, agitación, convulsiones. Ketamina crónica: dolor abdominal y cistitis o síntomas urinarios.", "Catinonas (mefedrona, \"sales de baño\"): simpaticomimético (HTA, taquicardia, diaforesis, hipertermia), confusión, trismo, convulsiones, síndrome serotoninérgico, hiponatremia, rabdomiólisis.", "Piperazinas (BZP): hipertermia, convulsiones, psicosis, hiponatremia, QTc largo, acidosis.", "Derivados de la cocaína (RTI, fluorotropacocaína): cuadro similar al de la cocaína (HTA, dolor torácico, psicosis).", "Cannabinoides sintéticos (\"spice\"): agitación, psicosis, convulsiones, taquicardia, vómitos, alteraciones del ECG. Más graves que el cannabis.", "Triptaminas (alucinógenos): alucinaciones, midriasis, HTA, convulsiones, IR o insuficiencia respiratoria.", "Opioides sintéticos (análogos del fentanilo, nitacenos): coma, miosis, depresión respiratoria, edema pulmonar.", "GHB/GBL: tiene su propio protocolo."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Hipertermia, rabdomiólisis, hiponatremia (catinonas, MDMA), síndrome serotoninérgico, SCA, ictus, TCE.", "Otros tóxicos (asumir policonsumo)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["El diagnóstico es clínico.", "ECG (QTc, QRS), glucemia, iones (Na), CK, función renal y hepática, gasometría (acidosis), leucocitos. Temperatura central.", "TC craneal si hay convulsión, focalidad o TCE."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Común a todas"}, {"type": "list", "items": ["No hay antídoto (salvo naloxona para los opioides). Soporte, reducir estímulos y asegurar la vía aérea.", "Agitación o convulsiones: benzodiacepinas (diazepam 5–10 mg IV o midazolam)."]}, {"type": "h", "text": "Específico"}, {"type": "list", "items": ["HTA (estimulantes): BZD + nitratos.", "Hipertermia: medidas físicas agresivas.", "Rabdomiólisis: hidratación intensa (el protocolo menciona alcalinizar la orina).", "Hiponatremia por catinonas: restricción de líquidos. SSH 3 % si hay clínica grave (convulsiones o coma).", "Opioides sintéticos: naloxona a dosis altas (pueden hacer falta varias dosis o perfusión) + soporte respiratorio."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Observación hasta la resolución clínica (la vida media varía según la sustancia; la de los cannabinoides sintéticos ronda las 6 h).", "UCI si hay coma, convulsiones repetidas, hipertermia o arritmias.", "Comunicado judicial. Vincular a la red de adicciones (programas de *chemsex*)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Nitacenos (isotonitaceno, metonitaceno): opioides más potentes que el fentanilo, en aumento en Europa (alertas de la EUDA 2023–2025). Pueden necesitar ≥2–10 mg de naloxona. Observación ≥6–12 h tras la naloxona.", "Rabdomiólisis: la alcalinización de la orina no está demostrada (solo SF en volumen alto). El propio protocolo de setas la desaconseja.", "Hiponatremia sintomática grave: bolo de SSH 3 % de 100–150 mL (guía europea de 2014).", "Agitación con hipertermia: sedación precoz y profunda con BZD. Evitar la contención física prolongada (riesgo de acidosis y muerte súbita).", "Ketamina: uropatía o cistitis ulcerativa y colangiopatía en el consumo crónico, como señales de alarma."]}]}], "sources": "EUDA (antes EMCDDA) European Drug Report (2024–2025); Spasovski G et al. European clinical practice guideline on hyponatraemia (2014); Goldfrank's Toxicologic Emergencies (11th ed., 2019).", "cats": ["tox"], "vital": false}, {"title": "Intoxicación por opioides", "page": 109, "protocol": "INTOXICACIÓN POR OPIOIDES", "service": "Urgencias", "date": "2018, rev. mar 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Tríada: disminución de la conciencia + depresión respiratoria (FR <12) + miosis. Además, bradicardia, hipotensión, íleo, venopunciones, parches (fentanilo, buprenorfina).", "Dos perfiles: – Heroína: joven, vía IV, responde rápido a la naloxona. – Analgésicos: anciano polimedicado con opioides de acción larga. Recae a menudo y necesita perfusión.", "Duración del efecto: – Heroína: 6–8 h. – Metadona: 24–36 h o más (QT largo, torsades). – Fentanilo transdérmico: 48–72 h. – Morfina u oxicodona de liberación lenta: 8–24 h. – Tramadol de liberación lenta: 24 h.", "Toxicidad específica: – Tramadol y tapentadol: convulsiones (+ síndrome serotoninérgico). – Loperamida: QRS y QT largos, TV. – Dextrometorfano y meperidina: síndrome serotoninérgico. – Buprenorfina: agonista parcial (puede precipitar abstinencia)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Coingesta: BZD, etanol, cocaína, ADT. Paracetamol (en combinaciones y en el intento autolítico).", "Otras causas de coma: hipoglucemia (glucemia capilar inmediata), TCE, ictus, infección, causas metabólicas.", "Complicaciones: edema pulmonar no cardiogénico, broncoaspiración, rabdomiólisis o síndrome compartimental, IRA, hipotermia, convulsiones, RAO, encefalopatía posanóxica. Body-packer."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucemia capilar. En la intoxicación leve por heroína no hacen falta más pruebas.", "Según el caso: – Hemograma, función renal y hepática, CK. Gasometría arterial si hay disnea o desaturación. – ECG si hay arritmia, cardiopatía, coingesta arritmógena o se trata de metadona, oxicodona o loperamida (QT). – Rx de tórax si el coma se prolonga, hay fiebre, desaturación o sospecha de aspiración o EAP. – Rx de abdomen si es body-packer o hay íleo. – TC craneal si no responde a la naloxona, hay focalidad, crisis o TCE. – Tóxicos en orina si no responde o se sospecha una intoxicación mixta."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Vía aérea primero"}, {"type": "list", "items": ["Si hay apnea o FR <12: ventilar con ambú y O₂ antes y durante la naloxona. Soporte vital si hay parada."]}, {"type": "h", "text": "Naloxona"}, {"type": "list", "items": ["Bolo: 0,4 mg IV, repetible (0,4–0,8 mg) cada 2–3 min hasta un máximo de 4 mg.", "Sin respuesta tras 4 mg → replantear el diagnóstico. Valorar el flumazenil si no está contraindicado.", "Perfusión si recae tras responder, si el coma se debe a una ingesta masiva o si el opioide es de acción larga: – 2 mg (5 ampollas) en 500 mL de SG 5 % en 4 h (≈0,5 mg/h). – Ajustar a 0,4–0,8 mg/h según la respuesta. – Hasta 48–72 h si es metadona o una forma de liberación lenta.", "La naloxona dura 30–90 min, menos que el opioide → riesgo de resedación. Las dosis altas pueden precipitar una abstinencia."]}, {"type": "h", "text": "Otros"}, {"type": "list", "items": ["Carbón activado 50 g si han pasado <2 h de una ingesta oral (con la vía aérea protegida).", "Retirar los parches.", "Edema pulmonar: naloxona + ventilación (BiPAP o VM)."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Área de vigilancia o UCI: opioide de acción larga o liberación sostenida, recaída tras la naloxona, perfusión de naloxona, VM o soporte hemodinámico.", "Alta tras heroína: observación de 4–6 h, despierto, sin trabajo respiratorio y con constantes normales.", "Alta voluntaria: mayor de edad, consciente y orientado, capaz de decidir y no incapacitado judicialmente.", "Comunicado judicial siempre. Psiquiatría si es autolítica."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Naloxona titulada a dosis bajas en el usuario dependiente con respiración espontánea: 0,04–0,1 mg IV repetidos. Objetivo: FR ≥10–12 y vía aérea, no despertarlo (evita la abstinencia brusca, los vómitos y la agitación; AHA 2020/2023, ACMT).", "Fentanilo ilícito y nitacenos: pueden necesitar dosis altas de naloxona.", "Programas de naloxona intranasal para llevar a casa (4 mg; disponible en España) e iniciar buprenorfina en urgencias tras una sobredosis (ACEP 2021, *Clinical Policy on opioid use disorder*). Reduce la mortalidad posterior.", "Perfusión de naloxona: dar 2/3 de la dosis que despertó al paciente por hora (fórmula de Goldfrank). Es más precisa que una dosis fija.", "Observación tras la naloxona por heroína: 1 h basta si el paciente está alerta, deambula, mantiene la SatO₂ y tiene la FR normal (*St. Paul's Early Discharge Rule*). El protocolo pide 4–6 h."]}]}], "sources": "Panchal AR et al. AHA Focused Update: Opioid-associated emergencies (Circulation 2020); ACEP Clinical Policy: Opioids (2020) and Buprenorphine in the ED (2021); Christenson J et al. St. Paul's Early Discharge Rule (Acad Emerg Med 2000); Goldfrank's Toxicologic Emergencies (11th ed., 2019).", "cats": ["tox"], "vital": true}, {"title": "Intoxicación por paracetamol", "page": 111, "protocol": "PROTOCOLO DE INTOXICACIÓN POR PARACETAMOL", "service": "Unidad Funcional de Toxicología", "date": "v2, may 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Aguda: una toma, o varias en <8 h. Dosis tóxica: ≥125 mg/kg (≥100 mg/kg con factores de riesgo).", "Subaguda o crónica: tomas durante >8 h o dosis supraterapéuticas repetidas. Tóxica si es >100 mg/kg/día.", "Factores de riesgo (menos glutatión o más CYP): – Ayuno, desnutrición, caquexia, TCA, fibrosis quística, alcoholismo crónico, hepatopatía, fiebre >3 días con vómitos. – Inductores del CYP: isoniazida, rifampicina, carbamazepina, fenitoína, fenobarbital, efavirenz o nevirapina. – Gilbert. – El etanol agudo protege.", "Fases: – 0–24 h: asintomático o con náuseas. Perfil hepático normal en las primeras 12 h. – 24–72 h: hepatotoxicidad (sube la AST y luego la ALT), caída del TP, IRA (8 %), fósforo >1,2 mmol/L = mal pronóstico. – 72–96 h: fallo hepático (encefalopatía, hipoglucemia, acidosis, CID). – >4–5 días: recuperación o muerte.", "Ingesta masiva (>20 g o nivel >240 µg/mL): coma, acidosis láctica y shock precoces."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Coingesta: opioides o anticolinérgicos (retrasan la absorción), alcohol, otros fármacos.", "Otras causas de hepatitis si la anamnesis no cuadra.", "Transaminasas normales a las 32–36 h → hepatotoxicidad prácticamente descartada."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Anamnesis (*checklist*
