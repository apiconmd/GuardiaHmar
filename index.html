:root{
  --bg:#f4f5fb; --card:#fff; --ink:#1b1d2a; --muted:#6b7086; --line:#e6e8f2;
  --brand:#4f46e5; --brand2:#ec4899;
  --sos:#f59e0b; --sos-bg:#fff7e6;
  --des:#ef4444; --des-bg:#fdecec;
  --ped:#3b82f6; --ped-bg:#eaf2ff;
  --tra:#10b981; --tra-bg:#e7f8f1;
  --dst:#8b5cf6; --dst-bg:#f1ecff;
  --act:#eab308; --act-bg:#fffbdc;
  --fs:16px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1020; --card:#1a1c30; --ink:#eef0ff; --muted:#9aa0bf; --line:#2a2d48;
    --sos-bg:#3a2a0a; --des-bg:#3a1515; --ped-bg:#13254a; --tra-bg:#0d3326; --dst-bg:#261a4a; --act-bg:#36300a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:var(--fs)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}

/* top */
.top{position:sticky;top:0;z-index:20;padding:calc(var(--safe-t) + 10px) 14px 10px;
  background:linear-gradient(120deg,#4f46e5 0%,#7c3aed 45%,#ec4899 100%);color:#fff;box-shadow:0 4px 18px rgba(79,70,229,.25)}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px}
.brandrow h1{font-size:19px;margin:0;font-weight:900;letter-spacing:-.2px;line-height:1.1}
.brandrow small{display:block;font-weight:700;opacity:.85;font-size:12px}
.brandrow .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:900;font-size:15px}
.search{display:flex;align-items:center;background:#fff;border-radius:14px;padding:0 12px;height:46px;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;color:#1b1d2a;background:transparent;min-width:0}
.search .x{color:#999;font-size:20px;padding:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;font-weight:800;font-size:13.5px;background:var(--card);border:2px solid var(--line);white-space:nowrap}
.chip.on{color:#fff;border-color:transparent}
.secfilter{padding:6px 14px 2px}
.secfilter .lab{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:2px 2px 6px}
.secfilter .chips{padding:0}

main{padding:8px 14px calc(90px + var(--safe-b))}
.banner{background:linear-gradient(135deg,#fff3c4,#ffe0ef);color:#5b3b00;border-radius:16px;padding:12px 14px;font-size:13.5px;font-weight:700;margin:6px 0 14px}
@media (prefers-color-scheme:dark){.banner{background:linear-gradient(135deg,#3a300c,#3a1630);color:#ffe9b0}}
h2.sec{font-size:15px;font-weight:900;margin:18px 2px 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{border-radius:18px;padding:14px 12px;color:#fff;text-align:left;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.cat .em{font-size:24px}
.cat b{font-size:14.5px;font-weight:900;line-height:1.15}
.cat span{font-size:12px;font-weight:800;opacity:.9}
.list{display:flex;flex-direction:column;gap:8px}
.letter{font-weight:900;font-size:20px;margin:14px 4px 2px;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px;text-align:left;width:100%;border:1px solid var(--line)}
.item .bar{width:6px;align-self:stretch;border-radius:4px;flex:none}
.item .tx{flex:1;min-width:0}
.item .t{font-weight:800;font-size:15.5px;line-height:1.25}
.item .m{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px}
.item .snip{font-size:13.5px;margin-top:6px;color:var(--ink);opacity:.9;line-height:1.35}
.item .snip i{font-style:normal;font-weight:900;font-size:11px;padding:1px 6px;border-radius:6px;color:#fff;margin-right:4px}
.item .star{font-size:20px;flex:none;padding:4px}
.pill{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:999px;color:#fff;margin-right:4px;vertical-align:1px}
.vital{background:#ef4444}
mark{background:#fde047;color:#1b1d2a;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-weight:700}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--muted);padding:6px 0;border-radius:12px}
.nav button .i{font-size:21px}
.nav button.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}

/* detail */
#detail{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.dhead{padding:calc(var(--safe-t) + 10px) 14px 14px;color:#fff}
.dtop{display:flex;align-items:center;gap:8px}
.dtop .sp{flex:1}
.dhead h1{font-size:23px;line-height:1.15;margin:12px 0 6px;font-weight:900}
.dhead .meta{font-size:13px;font-weight:700;opacity:.92}
.dhead .cats{margin-top:8px}
.dhead .cats span{display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;margin:3px 4px 0 0}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 12px;border-radius:12px;font-weight:900;font-size:13px;color:#fff}
.dbody{padding:10px 12px calc(40px + var(--safe-b))}
.box{border-radius:18px;margin:12px 0;overflow:hidden;background:var(--card);border:1px solid var(--line);scroll-margin-top:64px}
.box > .bh{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;font-weight:900;font-size:15px;letter-spacing:.4px;width:100%;text-align:left}
.box > .bh .chev{margin-left:auto;transition:transform .2s}
.box.closed > .bh .chev{transform:rotate(-90deg)}
.box.closed > .bb{display:none}
.bb{padding:6px 14px 12px}
.bb h4{margin:14px 0 6px;font-size:14.5px;font-weight:900;padding:6px 10px;border-radius:10px}
.bb ul{margin:4px 0;padding-left:20px}
.bb li{margin:7px 0;line-height:1.45}
.bb li::marker{font-size:1.1em}
.dose{font-weight:900;white-space:nowrap;border-radius:5px;padding:0 3px}
.src{font-size:12.5px;color:var(--muted);line-height:1.45;padding:12px 14px}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:18px 6px;font-weight:700}
.copybtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;font-size:13.5px;display:block;width:100%;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:#1b1d2a;color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet .in{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + var(--safe-b));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-weight:900}
.sheet p,.sheet li{font-size:14.5px;line-height:1.45}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.legend span{color:#fff;font-weight:900;font-size:12px;padding:4px 9px;border-radius:999px}
.fsrow{display:flex;gap:8px;margin:10px 0}

na + FG <30–45, contraste, alcohol o sepsis.", "Hipopotasemia con acidosis = déficit grave de K.", "AG normal: carga neta urinaria (Cl > Na + K = causa digestiva; Cl < Na + K = causa renal)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Constantes, diuresis, glucemia y cetonemia capilar.", "Glucosa, función renal, iones (con Cl), GSV, hemograma.", "Según la sospecha: lactato, CK, osmolalidad (osmol gap), salicilatos, etanol, metanol/etilenglicol, albúmina.", "Orina: iones (carga neta urinaria), sedimento. ECG (K). Rx de tórax."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Soporte y causa"}, {"type": "list", "items": ["Vía, fluidos según la volemia, monitorizar si hay riesgo de arritmia. Tratar la causa: en la mayoría no hace falta bicarbonato.", "CAD → insulina (ver protocolo de diabetes). Cetoacidosis alcohólica → tiamina + SG + SF. Láctica → tratar la causa. Intoxicaciones → protocolo específico."]}, {"type": "h", "text": "Fase 2 · Potasio (sube 0,6 mEq/L por cada 0,1 que baja el pH; caerá al corregir)"}, {"type": "list", "items": ["K >5: no aportar, control en 1 h · 4–5: ClK 10 mEq/h, control en 2 h · 3–4: 20 mEq/h, control en 2 h · <3: 30 mEq/h, control en 1 h (antes de corregir la acidosis).", ">10 mEq/h → vía central + monitor. Concentración máxima 60–80 mEq/L por vía periférica y 120 mEq/L por vía central."]}, {"type": "h", "text": "Fase 3 · Bicarbonato (pH <7,20 y/o HCO3 <15; no en la CAD salvo pH <7,0)"}, {"type": "list", "items": ["Déficit = 0,6 × peso × (HCO3 deseado − medido). Reponer la mitad en 12 h. Si es grave: la mitad del déficit en 30 min y repetir la GSV.", "Bicarbonato 1 M = 1 mEq/mL (hipertónico); 1/6 M = 0,166 mEq/mL.", "Riesgos: sobrecarga de volumen, hiperNa, hipoK, hipocalcemia o tetania, alcalosis de rebote.", "Pérdidas de HCO3 que no se pueden corregir (fístulas): reponer bicarbonato."]}, {"type": "h", "text": "Fase 4 · Depuración"}, {"type": "list", "items": ["Hemodiálisis: insuficiencia renal grave, oliguria, intoxicaciones (etilenglicol, metanol, metformina, salicilatos) o acidosis refractaria."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["BICAR-ICU (Lancet 2018): con pH ≤7,20, el bicarbonato (objetivo pH >7,30) solo mejoró la supervivencia en el subgrupo con FRA (AKIN 2–3) y redujo la necesidad de diálisis. El consenso SRLF/SFAR 2019 recomienda bicarbonato con pH ≤7,20 + FRA moderada-grave, y no de rutina en la acidosis láctica.", "Cristaloides balanceados (SMART 2018, BaSICS/PLUS 2021–22; metaanálisis Hammond NEJM Evid 2022): evitan la acidosis hiperclorémica por SF, con un efecto pequeño o neutro sobre la mortalidad. Son razonables como fluido por defecto.", "El umbral empírico del protocolo (pH <7,20 en todos) es más liberal que las guías, que lo individualizan según la causa y si hay FRA."]}]}], "sources": "Jaber S et al. BICAR-ICU (Lancet 2018); Jung B et al. SRLF/SFAR guidelines on metabolic acidosis in ICU (Ann Intensive Care 2019); Semler MW et al. SMART (N Engl J Med 2018).", "cats": ["metab"], "vital": false}, {"title": "Aftosis oral recidivante y aftosis bipolar", "page": 5, "protocol": "GUÍA TERAPÉUTICA DE LA AFTOSIS RECIDIVANTE Y AFTOSIS BIPOLAR", "service": "Dermatología", "date": "abr 2022", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["AOR: úlceras orales recurrentes, dolorosas, redondeadas, con halo eritematoso y fondo amarillo-grisáceo, en un paciente por lo demás sano (formas minor, major y herpetiforme).", "Aftosis bipolar (Neumann): aftas orales + úlceras genitales. Se considera una forma de Behçet."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Behçet (uveítis o vasculitis retiniana, patergia, HLA-B51), EII, celiaquía, enfermedades autoinflamatorias, déficits nutricionales, herpes, neutropenia.", "Biopsia si una úlcera persiste >2 semanas a pesar del tratamiento."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemograma, hierro, ferritina, ácido fólico, zinc, Mg, vitaminas B1, B2, B6 y B12, antitransglutaminasa, ANA, HLA- B51.", "Según el caso: Tzanck o PCR de herpes, cultivo de hongos y bacterias. Fondo de ojo (Behçet). Test de patergia."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Escalón 1 · Medidas generales + tópico (en todos)"}, {"type": "list", "items": ["Cepillo suave, pasta sin laurilsulfato, colutorio sin alcohol, evitar los alimentos desencadenantes.", "Corticoide tópico (1ª línea, desde el inicio del brote): triamcinolona 0,1% en orabase cada 8 h o en enjuagues de 5 min 3–4 veces/día · dexametasona solución 0,5 mg/5 mL en enjuagues 3–4 veces/día · clobetasol 0,05% en orabase 2– 3 veces/día.", "Coadyuvantes: lidocaína viscosa 2%, sucralfato en enjuagues 4 veces/día, ácido hialurónico en gel, clorhexidina 0,12– 0,2% 4 veces/día, enjuagues de doxiciclina o tetraciclina.", "Suplementos opcionales: vitamina B12 1 mg SL/día × 6 meses, omega-3 1 g/día, sulfato de zinc 150 mg/12 h."]}, {"type": "h", "text": "Escalón 2 · Brotes graves o frecuentes"}, {"type": "list", "items": ["Prednisona 30–40 mg/día durante 6–10 días (controla el brote, no cambia la evolución).", "Colchicina 0,5–2 mg/día (prevención).", "Alternativas: montelukast 10 mg/día × 1 mes y después en días alternos × 1 mes; pentoxifilina 400 mg/8 h."]}, {"type": "h", "text": "Escalón 3 · Refractaria (Dermatología)"}, {"type": "list", "items": ["Apremilast: escalada en 6 días hasta 30 mg/12 h, durante ≥6 meses.", "Dapsona 50–150 mg/día (antes: G6PD; hemograma cada 15 días el 1er mes).", "Talidomida 50–100 mg/día: programa de prevención de embarazo y EMG.", "Anti-TNF fuera de indicación (solicitud a la CFT).", "Fracaso: aftas continuas (>1 brote al mes) tras 6 meses de tratamiento."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["EULAR 2018 (Behçet): colchicina de 1ª línea para prevenir la afectación mucocutánea (sobre todo la genital y el eritema nodoso). Apremilast para las aftas orales resistentes a la colchicina (ensayo RELIEF, NEJM 2019: menos úlceras y menos dolor).", "Aftosis aislada sin Behçet: la evidencia sistémica es débil. Una revisión Cochrane apoya los corticoides tópicos y la clorhexidina como lo más respaldado.", "No hay cambios relevantes que modifiquen el manejo en Urgencias."]}]}], "sources": "Hatemi G et al. 2018 update of the EULAR recommendations for Behçet's syndrome (Ann Rheum Dis 2018); Hatemi G et al. RELIEF trial (N Engl J Med 2019); Brocklehurst P et al. Systemic interventions for recurrent aphthous stomatitis (Cochrane 2012).", "cats": ["derm"], "vital": false}, {"title": "Aislamiento por virus respiratorios (COVID-19, gripe, VRS)", "page": 6, "protocol": "AÏLLAMENT VIRUS RESPIRATORIS", "service": "Programa de Control de Infecciones", "date": "oct 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Cualquier paciente es potencialmente contagioso: precauciones estándar + EPI siempre que haya clínica respiratoria o un procedimiento de riesgo."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["L–J: al Laboratori de Referència de Catalunya: 8487 (SARS-CoV-2) y 8488 (multiplex SARS-CoV-2 / gripe / VRS).", "V–D y festivos: al Laboratorio de Urgencias del hospital: 8188U (POCT PCR SARS-CoV-2 nasofaríngea) y 8292 (POCT PCR SARS-CoV-2 + gripe A/B + VRS).", "Contacto estrecho (compañero de habitación) de COVID o gripe: PCR. Si es negativa, trasladarlo y no aislarlo."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas de precaución de contacto + gotas"}, {"type": "list", "items": ["COVID-19: 7 días (retirar si lleva 24 h asintomático). Inmunodeprimido hematológico → interconsulta a Enfermedades Infecciosas. Se pueden hacer cohortes de positivos confirmados.", "Gripe: 5 días si recibe oseltamivir; 7 días sin tratamiento. Cohortes de positivos (gripe A y B pueden compartir habitación).", "VRS: contacto + gotas solo en UH 60, Pediatría/Neonatos, UCI y Reanimación. No se criban los contactos."]}, {"type": "h", "text": "Brote"}, {"type": "list", "items": ["≥3 casos coincidentes en tiempo y lugar = brote → avisar al Programa de Control de Infecciones (guardia sábados y domingos de 8 a 16 h). Cribado único de toda la unidad."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["CDC (marzo 2024): para la población general recomienda una pauta respiratoria unificada (COVID, gripe, VRS): volver a la actividad tras 24 h sin fiebre y con mejoría, con precauciones 5 días más. En el hospital mantiene el aislamiento de COVID ~10 días (hasta 20 si es grave o inmunodeprimido). Los 7 días del protocolo son una pauta intermedia, coherente con el ECDC.", "Gripe en hospitalizado (IDSA 2018, actualización 2025): oseltamivir precoz en todo paciente ingresado, sea cual sea el tiempo de evolución. No se recomienda la doble dosis.", "Mascarilla FFP2 en procedimientos que generan aerosoles y en COVID (OMS/ECDC); para gripe basta la quirúrgica fuera de esos procedimientos."]}]}], "sources": "CDC Respiratory Virus Guidance (2024) e Infection Control Guidance SARS-CoV-2 in healthcare; ECDC Infection prevention and control for COVID-19 in healthcare settings; Uyeki TM et al. IDSA Influenza guidelines (Clin Infect Dis 2019).", "cats": ["resp", "infec", "tec"], "vital": false}, {"title": "Alcalosis metabólica", "page": 7, "protocol": "ALCALOSIS METABÓLICA", "service": "Endocrinología", "date": "feb 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["pH >7,45 con HCO3 elevado (compensación: la pCO2 sube 0,7 por cada mmol de HCO3).", "Causas más frecuentes: vómitos o SNG y diuréticos. Otras: laxantes, adenoma velloso, realimentación, hiperaldosteronismo, bicarbonato o citrato (politransfusión), Ringer, hipoK, hiperCa o síndrome leche-alcalinos, VM en EPOC (posthipercápnica)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Insuficiencia renal (perpetúa la alcalosis), hipovolemia, hipoK e hipoCl asociadas.", "HTA + Cl urinario >40 → estudiar el eje renina-aldosterona (exceso de mineralocorticoides)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["GSV/GSA, iones (Na, K, Cl), función renal, Ca, Mg.", "Cl en orina (refleja la volemia mejor que el Na urinario):", "≤25 mEq/L = sensible al cloro (hipovolemia).", ">40 mEq/L = resistente al cloro (euvolemia o mineralocorticoides)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Sensible al cloro (hipovolemia, ClU bajo)"}, {"type": "list", "items": ["SF 0,9% + ClK IV; si tolera, agua y sal por vía oral. Retirar los diuréticos si es posible.", "Vómitos o aspiración por SNG: IBP o antiH2."]}, {"type": "h", "text": "Fase 2 · Resistente al cloro"}, {"type": "list", "items": ["Tratar la causa. Espironolactona o amilorida + K. IECA en casos seleccionados (Bartter)."]}, {"type": "h", "text": "Fase 3 · Alcalosis extrema (pH >7,65 o pCO2 >60 con hipoventilación)"}, {"type": "list", "items": ["HCl 150 mM por vía central (150 mEq en 1 L de agua destilada o SF): corregir el 50% del exceso de HCO3 en 12 h. Alternativas: NH4Cl o clorhidrato de lisina o arginina.", "Insuficiencia renal avanzada: hemodiálisis con baño bajo en bicarbonato."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Acetazolamida (250–500 mg IV/VO) es la opción práctica en la alcalosis con sobrecarga de volumen (IC, posthipercapnia en EPOC) cuando no se puede dar SF. No aparece en el protocolo.", "Su uso en VM de EPOC para facilitar la desconexión no mejoró resultados duros (ensayo DIABOLO, JAMA 2016). En la IC descompensada, el ensayo ADVOR (NEJM 2022) mostró más descongestión con acetazolamida + diurético de asa.", "La corrección del K y del Mg es imprescindible: sin ella la alcalosis no se corrige."]}]}], "sources": "Faisy C et al. DIABOLO (JAMA 2016); Mullens W et al. ADVOR (N Engl J Med 2022); Emmett M. Metabolic alkalosis: a brief pathophysiologic review (Clin J Am Soc Nephrol 2020).", "cats": ["metab"], "vital": false}, {"title": "Amenorreas", "page": 8, "protocol": "PROTOCOLO AMENORREAS", "service": "Ginecología/Reproducción", "date": "dic 2022", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Primaria: sin menstruación a los 14 años con caracteres sexuales secundarios normales, o a los 16 años en cualquier caso. Causas: disgenesia gonadal, anorexia, agenesia uterovaginal.", "Secundaria: sin regla 3–6 meses (o >9 meses con oligomenorrea). Causas: hipotalámica (49–62%, incluido SOP), hipofisaria, ovárica, Asherman.", "Grupos OMS: I hipogonadismo hipogonadotropo (FSH baja/normal, PRL normal) · II normoestrogénica (SOP) · III FSH alta (fallo ovárico) · IV alteraciones del tracto genital."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Embarazo (siempre, lo primero).", "Hiperprolactinemia y hipotiroidismo.", "Fármacos que suben la PRL: fenotiazinas, tricíclicos, opiáceos, ACO, metildopa, sulpirida, metoclopramida.", "Trastorno de la conducta alimentaria, ejercicio intenso, estrés.", "Lesión hipotálamo-hipofisaria (tumores, granulomas, radioterapia, silla turca vacía)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["β-HCG, PRL, TSH, T4L, FSH, LH, estradiol.", "Primaria: ecografía transvaginal + cariotipo + FSH, LH, estradiol.", "Sin útero: 46XX = Rokitansky; 46XY = feminización testicular. Con útero: descartar himen imperforado o septo. Sin caracteres sexuales: Turner (45X0), Swyer (46XY), Kallmann.", "Secundaria con FSH/LH normales o bajas → test de progesterona: progesterona micronizada 200 mg/24 h × 5 días o medroxiprogesterona 10 mg/24 h × 5 días.", "Sangra: hay estrógenos → estudiar SOP (ecografía + andrógenos).", "No sangra → test de estrógenos + gestágenos: ACO con 30 mcg de EE × 21 días. Si sangra → causa central → RM hipofisaria. Si no sangra → causa uterina (Asherman).", "FSH/LH en rango menopáusico en <40 años con ≥1 año de amenorrea = fallo ovárico precoz: pedir cariotipo, X frágil, autoinmunidad (tiroides, DM1, Addison, miastenia, paratiroides)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Según la causa"}, {"type": "list", "items": ["Hipotalámica funcional (bajo peso, TCA): tratar la causa (apoyo psicológico o psiquiátrico). Si no se recupera: THS o ACO.", "Lesión central: tratar la lesión. Hiperprolactinemia: ver su protocolo.", "Asherman: histeroscopia (adhesiólisis) + estradiol 2 mg/24 h o parches durante 2 meses.", "Fallo ovárico precoz: THS hasta la edad de la menopausia natural. Si desea gestación → ovodonación (puede haber embarazos espontáneos en el 5–15%).", "Turner: THS. Swyer: gonadectomía (30% de riesgo de malignización). Kallmann: FSH + LH si desea gestación; THS si no."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["ESHRE 2024 (insuficiencia ovárica prematura): se diagnostica con oligo/amenorrea ≥4 meses + una sola FSH >25 UI/L (ya no hacen falta 2 determinaciones). No hay que esperar 1 año de amenorrea. Recomienda THS hasta los ~50 años y vigilar la salud ósea y cardiovascular.", "Amenorrea hipotalámica funcional (Endocrine Society 2017): no usar ACO solo para \"tener regla\", porque enmascara el problema y no protege el hueso. Si se necesita reemplazo, mejor estradiol transdérmico + progestágeno cíclico.", "El test de progesterona ha perdido peso: las guías actuales priorizan la analítica hormonal (estradiol, FSH, PRL, TSH, andrógenos) sobre las pruebas de deprivación, que dan falsos positivos y negativos."]}]}], "sources": "ESHRE/ASRM/CRE/IMS Guideline: Management of premature ovarian insufficiency (Hum Reprod 2024); Gordon CM et al. Functional hypothalamic amenorrhea: Endocrine Society guideline (J Clin Endocrinol Metab 2017).", "cats": ["endo", "gineuro"], "vital": false}, {"title": "Anafilaxia y shock anafiláctico", "page": 9, "protocol": "ANAFILAXIA Y SHOCK ANAFILACTICO (v1.1, dic 2025)", "service": "", "date": "", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Inicio en minutos (hasta 1 h) tras alérgeno: fármacos (betalactámicos, AINE), alimentos, himenópteros, contrastes, látex.", "Criterio 1: piel/mucosas (habones, prurito, eritema, edema labios/lengua/úvula) + compromiso respiratorio (disnea, sibilancias, estridor, ↓PEF, hipoxemia) o hipoTA/disfunción orgánica (síncope, hipotonía, incontinencia).", "Criterio 2: ≥2 tras alérgeno probable: piel/mucosas, respiratorio, hipoTA, GI persistente (dolor abdominal, vómitos).", "Criterio 3: hipoTA tras alérgeno conocido: TAS <90 mmHg o caída >30% de la basal.", "Bifásica en ~20% (intervalo 1–8 h; raro 24–38 h).", "Shock anafiláctico: shock distributivo.", "Refractaria: persisten síntomas (hipoxia, hipoTA, confusión) tras 2 dosis de adrenalina IM (0,3 mg) → UCI."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Angioedema por IECA/bradicinina (sin urticaria, no responde a adrenalina), crisis asmática, síncope vasovagal (bradicardia, palidez, sin urticaria), shock séptico o cardiogénico."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Perfil PNAF (petitorio de Urgencias): PNAF15 = histamina <15 min; PNAF 2h = triptasa + complemento + metilhistamina en orina (frasco de urocultivo); PNAF 6h = triptasa. PNAF 24h no se pide en Urgencias.", "Solo histamina → PNAF15; solo triptasa → PNAF6.", "IgE a látex y a betalactámicos si se sospechan.", "Analítica básica + hemograma, plaquetas, TP, TTPA, fibrinógeno, PDF. Repetir hemostasia y hemograma a las 6 y 24 h (a las 1–2 h si sale alterada).", "Monitorización ECG + SatO2."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Inmediato (todos los casos graves)"}, {"type": "list", "items": ["ABCDE. Retirar alérgeno (parar fármaco, quitar aguijón). No retrasar la adrenalina.", "Posición: decúbito con piernas elevadas; sentado si predomina lo respiratorio; decúbito lateral si inconsciente; gestante en decúbito lateral izquierdo. Evitar incorporarlo bruscamente.", "ADRENALINA 1:1000 IM, cara anterolateral del muslo: 0,3–0,5 mg (0,3–0,5 mL) en adulto; niño 0,01 mg/kg. Repetir cada 5–15 min si no mejora.", "O2 a 10 L/min con reservorio. Vía venosa + monitor."]}, {"type": "h", "text": "Fase 2 · Según órgano afectado"}, {"type": "list", "items": ["HipoTA o shock: SF 0,9% 10 mL/kg en bolo (máx. 500 mL por bolo); repetir según respuesta.", "Estridor: adrenalina nebulizada 1 mg en 4 mL de SF (repetible). Valorar IOT o cricotirotomía precoz.", "Broncoespasmo: salbutamol nebulizado 5 mg + 3 mL SF; repetir en 30–60 min.", "Bradicardia: atropina 0,5–1 mg IV (máx. 3 mg).", "Paciente con betabloqueante: GLUCAGÓN 1–5 mg IV y después perfusión de 5–15 mcg/min (1 mg en 1000 mL SG = 1 mcg/mL)."]}, {"type": "h", "text": "Fase 3 · Refractaria (sin respuesta tras 2 dosis IM)"}, {"type": "list", "items": ["ADRENALINA IV en perfusión (mejor que en bolo): 1 mg en 100 mL de SF (10 mcg/mL). Empezar a 0,5–1 mL/kg/h (≈30– 100 mL/h) y ajustar; máx. 6 mL/kg/h. Siempre con el paciente monitorizado.", "Alternativa en bolo: la misma dilución, pasada en 3–5 min. Riesgo de TV o IAM en ancianos o cardiópatas.", "Si persiste la hipoTA: más cristaloides → coloides → noradrenalina (relativamente contraindicada en anafilaxia por cocaína o en hipertiroidismo). Ingreso en UCI."]}, {"type": "h", "text": "Fase 4 · Adyuvantes (no sustituyen a la adrenalina)"}, {"type": "list", "items": ["Dexclorfeniramina 5 mg IV lenta o IM (alivia solo la clínica cutánea).", "Hidrocortisona 250 mg IV o metilprednisolona 1–3 mg/kg (60–100 mg), y después 1–2 mg/kg/día repartidos en 3–4 dosis (para prevenir la reacción tardía)."]}, {"type": "h", "text": "OBSERVACIÓN, INGRESO Y ALTA"}, {"type": "list", "items": ["Observar 6–8 h tras la resolución; 12–24 h si ha habido hipoTA. Alargar también si: anafilaxias previas, idiopática grave de inicio lento, asma grave, exposición que puede continuar o mal control tras el alta.", "Al alta: antiH1 de 2ª generación a dosis doble durante 2 semanas (p. ej. ebastina 20 mg/día) + prednisona 30 mg/12 h 1 semana, después bajar 10 mg cada 2 días + 2 autoinyectores de adrenalina enseñando cómo usarlos (de estas tres medidas, solo el autoinyector tiene evidencia).", "Derivar a Alergología a través del médico de familia. Evitar el alérgeno."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Errata en el algoritmo del protocolo: pone \"0,3–0,5 ml/kg\". La dosis correcta es 0,3–0,5 mL en total (0,3–0,5 mg) en el adulto, como dice el texto. La RCUK 2021 recomienda 0,5 mg en el adulto.", "Corticoides: la RCUK 2021 ya no los recomienda de rutina en el tratamiento inicial, y el practice parameter AAAAI/ACAAI 2023 dice que no previenen la reacción bifásica. La prednisona al alta 1 semana del protocolo no tiene respaldo en las guías: reservarla para asma o síntomas persistentes.", "Observación (AAAAI/ACAAI 2023): si la reacción no fue grave y respondió rápido a 1 dosis de adrenalina, puede bastar ≥1 h tras la resolución. Si fue grave o necesitó ≥2 dosis, hasta 6 h o ingreso. El protocolo es más conservador.", "Triptasa (EAACI 2021): extraerla idealmente entre 30 min y 2 h desde el inicio, más una basal ≥24 h después. Una elevación >20% + 2 ng/mL sobre la basal apoya el diagnóstico.", "Adrenalina intranasal (neffy/EURneffy 2 mg, aprobada por FDA y EMA en 2024) es una alternativa al autoinyector en ≥30 kg. Útil si el paciente rechaza las agujas."]}]}], "sources": "EAACI Anaphylaxis Guidelines 2021 update (Allergy 2022); Golden DBK et al. Anaphylaxis 2023 practice parameter update (Ann Allergy Asthma Immunol 2024); RCUK Emergency treatment of anaphylaxis 2021; WAO Anaphylaxis Guidance 2020.", "cats": ["cardio"], "vital": true}, {"title": "Analgesia en el paciente con hepatopatía crónica / cirrosis", "page": 11, "protocol": "Utilització d'analgèsics en pacients amb malaltia hepàtica crònica", "service": "Comisión del Dolor", "date": "ene 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Hepatopatía avanzada o cirrosis: plaquetas <150.000 + bazo >12 cm o hígado nodular; elastografía (FibroScan). No toda hepatopatía equivale a insuficiencia hepática."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Factores que obligan a reducir el paracetamol: alcoholismo activo, desnutrición, inductores enzimáticos (rifampicina, antiepilépticos).", "Encefalopatía, estreñimiento, insuficiencia renal o ascitis (empeoran con AINE y opioides)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Escalón 1"}, {"type": "list", "items": ["PARACETAMOL 1 g/6–8 h (máx. 4 g/día). Si hay alcoholismo o desnutrición: máx. 2 g/día. Es el de primera elección.", "AINE CONTRAINDICADOS, incluido el METAMIZOL (insuficiencia renal, ascitis, hiponatremia, hemorragia digestiva)."]}, {"type": "h", "text": "Escalón 2"}, {"type": "list", "items": ["Paracetamol + TRAMADOL 50–100 mg/6–8 h VO o IV (ajustar la dosis y alargar el intervalo). Mejor que codeína, que se acumula y precipita encefalopatía.", "Siempre con laxante: lactitol o lactulosa 10–20 g/6–8 h."]}, {"type": "h", "text": "Escalón 3"}, {"type": "list", "items": ["Paracetamol + MORFINA oral (de primera elección; glucuronidación conservada; menos dosis o más intervalo) o FENTANILO transdérmico (no necesita ajuste).", "Laxante obligado. Si aparece encefalopatía: añadir rifaximina 400 mg, 2 comp/8 h.", "Evitar meperidina (normeperidina: convulsiones). Metadona solo en dolor crónico o rotación de opioides."]}, {"type": "h", "text": "Coadyuvantes"}, {"type": "list", "items": ["Neuropático: gabapentina (no necesita ajuste hepático) o pregabalina 25–50 mg/12 h, subiendo a 75 mg/12 h en 3–7 días (máx. 150 mg/12 h).", "Amitriptilina a dosis bajas, subiendo poco a poco. Duloxetina a menor dosis; evitarla si hay alcoholismo.", "Evitar fenitoína, carbamazepina y valproato (hepatotóxicos)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Paracetamol: varias revisiones de expertos (p. ej. Rakoski, Hepatology 2018) y la práctica de la AASLD aconsejan un máx. de 2– 3 g/día de forma continuada en la cirrosis, más prudente que los 4 g del protocolo.", "Tramadol: las revisiones recientes lo consideran de 2ª línea. Reduce el umbral convulsivo, da riesgo serotoninérgico y en cirrosis la vida media se duplica: máx. 50 mg/12 h en la Child-Pugh C.", "Hidromorfona (glucuronidación) aparece como alternativa bien tolerada a la morfina en varias revisiones. Oxicodona debe evitarse en la Child C.", "Gabapentinoides: estudios de cohortes los asocian a más encefalopatía y caídas en la cirrosis descompensada (dosis bajas y vigilancia).", "AINE: contraindicación coincidente en las guías EASL 2018 de cirrosis descompensada."]}]}], "sources": "Rakoski M et al. Pain management in patients with cirrhosis (Clin Liver Dis 2018); Klinge M et al. The assessment and management of pain in cirrhosis (Curr Hepatol Rep 2018); EASL Clinical Practice Guidelines for decompensated cirrhosis (J Hepatol 2018).", "cats": ["dig", "dolor"], "vital": false}, {"title": "Anemia ferropénica", "page": 12, "protocol": "ANEMIA FERROPÉNICA – Digestivo (mar 2021), con algoritmo de Urgencias", "service": "", "date": "", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Hb <130 g/L (hombre), <120 (mujer), <110 (embarazada) + microcitosis/hipocromía + ferritina baja.", "Clínica: astenia, descompensación de la cardiopatía o la EPOC, deterioro cognitivo en el anciano. Muchas veces es un hallazgo casual.", "Diferencial: talasemia (hematíes ↑, VCM muy bajo), anemia de trastorno crónico (ferritina ↑, transferrina ↓), sideroblástica."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Sangrado digestivo activo (melenas, rectorragia), AINE, antiagregantes o anticoagulantes, celiaquía, hematuria, metrorragia, telangiectasias (Rendu-Osler).", "Gravedad: Hb <6, angina, inestabilidad hemodinámica, FRA (Cr >2 o el doble de la habitual), o que no se pueda hacer el estudio endoscópico en <15 días."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemograma, ferritina, transferrina, IST, % de reticulocitos, B12, fólico, antitransglutaminasa (ATTG) + IgA total. Sedimento de orina (1% es de origen urinario).", "Si hay dudas diagnósticas: prueba con hierro 3 semanas (sube la HCM en 7 días)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Urgencias"}, {"type": "list", "items": ["Carboximaltosa férrica (Ferinject) 500–1000 mg IV según el peso, en 15 min.", "Transfusión restrictiva hasta Hb 7 g/dL si no hay sangrado activo ni cardiopatía o nefropatía. Hemograma tras la transfusión. Después, siempre hierro."]}, {"type": "h", "text": "Fase 2 · Destino según el algoritmo"}, {"type": "list", "items": ["Hombre o mujer posmenopáusica: si hay criterios de gravedad → avisar al busca de Digestivo (25414) → ingreso en UH de Digestivo para EDA + EDB. Si no → estudio ambulatorio: visita en CCEE de Gastro (DIG18/17/33/4/2/14/25) + EDA + EDB + analítica en 15 días.", "Mujer premenopáusica sin factores de riesgo GI (edad >40, Hb <10, síntomas abdominales, pérdida de peso, no respuesta al hierro oral, sin pérdidas menstruales importantes) → médico de familia: EDA con biopsias si la ATTG es positiva, TSOH (si >10 µg Hb/g → colonoscopia) y Ginecología.", "Optimizar antiagregantes/anticoagulantes y suspender el hierro oral antes de la endoscopia."]}, {"type": "h", "text": "Fase 3 · Mantenimiento"}, {"type": "list", "items": ["Sal ferrosa VO: 2–3 mg/kg/día de hierro elemental (p. ej. Tardyferon 80 mg = mejor tolerancia; Ferogradumet 105 mg), en ayunas. Sube ~2 g/dL de Hb en 3–4 semanas. Mantener 3 meses después de normalizar la Hb.", "Hierro IV si: intolerancia o fallo del oral, malabsorción (celiaquía, bariátrica), Hb <8, ERC, EII activa, embarazo en 2º–3er trimestre, IC con FEVI <45%, preoperatorio, rechazo a la transfusión.", "Opciones IV: hierro sacarosa 200 mg en 150 min o carboximaltosa hasta 1 g/semana.", "Si la EDA y la EDB son normales y la anemia recidiva → cápsula endoscópica (y enteroscopia para tratar lo que encuentre)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Ferritina diagnóstica (AGA 2020): el umbral de <45 ng/mL (no <15–30) mejora la sensibilidad. En la inflamación o la ERC, ferritina <100 o IST <20%.", "Hierro oral a días alternos (40–80 mg una sola dosis matutina): absorbe mejor y da menos efectos GI que dosis diarias divididas (ensayos de Stoffel, Lancet Haematol 2017/2020). La BSG 2021 recomienda 1 comprimido al día como máximo.", "Hipofosfatemia por carboximaltosa (ensayos PHOSPHARE, JAMA 2020: ~50–75% frente a ~8% con derisomaltosa férrica). Si se repite la dosis, medir el fósforo, sobre todo en EII, bariátricos o desnutridos.", "IC (ESC 2023, actualización focalizada): hierro IV (carboximaltosa o derisomaltosa) clase I en ICFEr/ICFEm con ferropenia (ferritina <100, o 100–299 con IST <20%) para mejorar síntomas y reducir ingresos (IRONMAN, HEART-FID).", "BSG 2021: gastroscopia + colonoscopia (o colonografía TC) como primera línea en hombres y posmenopáusicas. Cápsula si la anemia recurre."]}]}], "sources": "Snook J et al. BSG guidelines for iron deficiency anaemia in adults (Gut 2021); Ko CW et al. AGA guideline on iron deficiency anemia (Gastroenterology 2020); McDonagh TA et al. 2023 ESC HF focused update (Eur Heart J 2023); Wolf M et al. PHOSPHARE-IDA (JAMA 2020).", "cats": ["hemato"], "vital": false}, {"title": "Anemia hemolítica autoinmune (AHAI)", "page": 13, "protocol": "PROTOCOLO DE DIAGNÓSTICO Y TRATAMIENTO DE AHAI", "service": "Hematología", "date": "v1.0, ene 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Diagnóstico (todo): anemia + Coombs directo + + LDH ↑ + bilirrubina indirecta ↑ + haptoglobina ↓. Reticulocitos altos (bajos en el 20%).", "Anticuerpos calientes (70–80%, IgG): hemólisis extravascular. Idiopática, o secundaria a LLC o linfoma, LES, inmunodeficiencia común variable o fármacos.", "Fríos o crioaglutininas (IgM, C3d): acrocianosis, empeora con el frío o con infecciones (micoplasma, VEB) o linfoproliferativos.", "Grave: Hb <8 con varias transfusiones en <7 días. Síndrome de Evans: + PTI.", "Fármacos: penicilinas, cefalosporinas, fludarabina, oxaliplatino, inhibidores de checkpoint, metildopa."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["MAT (PTT o SHU): esquistocitos + trombopenia → urgencia distinta.", "Hemólisis no inmune: déficit de G6PD, esferocitosis, HPN, válvulas, infecciones como malaria.", "Coombs + sin anemia ≠ AHAI. Coombs − con hemólisis franca → puede ser una AHAI Coombs negativa (5%, grave): tratar igual."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemograma + reticulocitos, frotis (esferocitos, esquistocitos), LDH, bilirrubina total y fraccionada, haptoglobina, perfil hepático, coagulación, Coombs directo (± eluido).", "Inmunoglobulinas, serologías de VIH, VHB (HBsAg y anti-HBc antes del rituximab) y VHC, ANA (si >1/80, anti-dsDNA), inmunofenotipo de sangre periférica, TC.", "Según el caso: PCR de CMV, VEB y parvovirus; antifosfolípidos; función tiroidea; marcadores tumorales; aspirado de médula.", "Pruebas cruzadas o reserva de sangre precoz (las pruebas de compatibilidad son difíciles: avisar al Banco de Sangre)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "AHAI por anticuerpos calientes · 1ª línea (tratar si la anemia da síntomas)"}, {"type": "list", "items": ["PREDNISONA 1–2 mg/kg/día VO durante 2–3 semanas, y bajar muy despacio hasta suspender en ~6 meses.", "Grave o Evans: metilprednisolona 100–200 mg/día × 10–14 días o 250–1000 mg/día × 2–3 días (rescate: bolos de 500– 1000 mg).", "+ RITUXIMAB 375 mg/m² semanal × 4 en la AHAI grave de debut (fuera de ficha técnica; con profilaxis de VHB, cotrimoxazol y aciclovir durante 4–6 meses).", "Rescate en situación grave: IGIV 1 g/kg/día × 2 días, transfusión de los mínimos CH necesarios para controlar los síntomas, EPO o darbepoetina (si hay reticulocitopenia), plasmaféresis (poca evidencia).", "Ácido fólico. Tromboprofilaxis (la hemólisis es protrombótica)."]}, {"type": "h", "text": "Calientes · líneas siguientes (Hematología)"}, {"type": "list", "items": ["2ª línea: rituximab (se puede repetir si la respuesta duró >12 meses).", "3ª línea: esplenectomía (vacunar ≥2 semanas antes), azatioprina, ciclosporina o MMF.", "4ª línea: ciclofosfamida, danazol, sirolimus, bortezomib.", "Secundarias: LES (no esplenectomía; hidroxicloroquina), LLC (evitar fludarabina), inmunodeficiencia común variable (IGIV mensual)."]}, {"type": "h", "text": "AHAI por anticuerpos fríos"}, {"type": "list", "items": ["No tratar si Hb >10 (salvo cardiopatía o EPOC). Protegerse del frío. Sangre y sueros CALENTADOS.", "Ácido fólico. Tromboprofilaxis en situaciones de riesgo. No esplenectomía.", "Tratamiento: rituximab ± bendamustina. Si es grave: plasmaféresis ± eculizumab. Después: rituximab + fludarabina, bortezomib, ibrutinib o sutimlimab."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["1er consenso internacional (Jäger et al., Blood Rev 2020) y BSH 2017: prednisolona 1 mg/kg (no hacen falta 2 mg/kg) y rituximab precoz en la forma grave o en la corticodependencia. Coincide con el protocolo.", "No retrasar la transfusión por incompatibilidad serológica si la anemia amenaza la vida: transfundir el \"menos incompatible\" (consenso internacional y Banco de Sangre).", "Sutimlimab (anti-C1s): aprobado por la EMA en 2022 para la enfermedad por crioaglutininas. Reduce la hemólisis y las transfusiones (ensayos CARDINAL y CADENZA). Se está usando antes de la 4ª línea.", "Tromboprofilaxis con HBPM en la AHAI activa ingresada, salvo contraindicación (riesgo de ETV de hasta el 20%; consenso de 2020)."]}]}], "sources": "Jäger U et al. Diagnosis and treatment of AIHA: First International Consensus Meeting (Blood Rev 2020); Hill QA et al. BSH guidelines on warm AIHA (Br J Haematol 2017); Röth A et al. CARDINAL (N Engl J Med 2021).", "cats": ["hemato"], "vital": false}, {"title": "Antibióticos: dosis estándar vs «sensible con exposición incrementada» (EUCAST)", "page": 14, "protocol": "PROTOCOLO DE DOSIFICACIÓN DE ANTIMICROBIANOS", "service": "PROA", "date": "v1.0, ene 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Antibiograma EUCAST: S = dosis habitual · I = sensible con exposición incrementada (subir dosis o frecuencia, perfusión extendida o pasar de VO a IV) · R = no usar.", "Dosis para función renal normal e IMC normal. Ajustar por peso, función renal y paciente crítico. En SNC u otros focos difíciles: consultar a Infecciosas."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Betalactámicos (dosis estándar → exposición incrementada)"}, {"type": "list", "items": ["Ampicilina 2 g/8 h → 2 g/6 h IV (meningitis 2 g/4 h). Amoxicilina VO 500 mg/8 h → 1 g/8 h.", "Amoxicilina-clavulánico IV 1 g/8 h → 2 g/8 h; VO 500/125 mg/8 h → 875/125 mg/8 h (en ITU no complicada basta 500/125).", "Cloxacilina 1 g/6 h → 2 g/4 h. Cefazolina 1 g/8 h → 2 g/8 h. Cefuroxima-axetilo 250 → 500 mg/12 h.", "Cefotaxima 1 g/8 h → 2 g/8 h (meningitis 300 mg/kg/día cada 4 h). Ceftriaxona 1–2 g/24 h → 2 g/12 h o 4 g/24 h (meningitis igual; gonococo 0,5–1 g IM en dosis única).", "Ceftazidima 1 g/8 h → 2 g/8 h. Cefepima 2 g/12 h → 2 g/8 h. Ceftarolina 600 mg/12 h → /8 h (en 1–2 h). Aztreonam 1 g/8 h → 2 g/6 h.", "Piperacilina-tazobactam 4 g/6 h → 4 g/6 h en perfusión extendida de 3 h.", "Meropenem 1 g/8 h → 2 g/8 h. Imipenem 500 mg/6 h → 1 g/6–8 h. Ertapenem 1 g/24 h.", "Penicilina G: estándar 1 MUI/6 h → 2 MUI/4–6 h. Neumococo: CMI <0,5 → 2 MUI/6 h; 0,5–1 → 4 MUI/6 h o 2 MUI/4 h; 1– 2 → 4 MUI/4 h. Meningitis (CMI <0,06) → 4 MUI/4 h.", "Ceftazidima-avibactam 2/0,5 g/8 h en 2 h. Ceftolozano-tazobactam 1–2/0,5 g/8 h en 1 h. Para ambos: contactar con Infecciosas."]}, {"type": "h", "text": "Otros"}, {"type": "list", "items": ["Ciprofloxacino IV 400 mg/12 h → /8 h; VO 500 → 750 mg/12 h. Levofloxacino 500 mg/24 h → 500 mg/12 h (*S. aureus* 750 mg/24 h). Moxifloxacino 400 mg/24 h.", "Clindamicina IV 600 mg/8 h → /6 h; VO 300 mg/8 h → /6 h. Cotrimoxazol 800/160 mg/12 h → 800–1200 mg/8–12 h (*Pneumocystis*: TMP 5 mg/kg/6 h).", "Amikacina 15 mg/kg/24 h (si dura >72 h: niveles el 2º día). Vancomicina 1 g/12 h: ajustar por peso y niveles. Teicoplanina 400 mg/12 h × 3 dosis y después /24 h.", "Daptomicina 10–12 mg/kg/24 h (piel y partes blandas 6 mg/kg). Linezolid 600 mg/12 h. Tigeciclina 100 mg y después 50 mg/12 h → 200 mg y después 100 mg/12 h.", "Colistina: carga = 12 × peso/100 MU (máx. 9 MU); mantenimiento 4,5 MU/12 h si ClCr >80 (60–80: 4; 40–60: 3,5; 20–40: 3; <20: 2 MU/12 h; HDI 2 MU/12 h después de diálisis; HDFVVC 6 MU/12 h). Niveles a las 48 h.", "Azitromicina 500 mg/24 h · doxiciclina 100 mg/24 h · metronidazol 500 mg/8 h · fosfomicina trometamol 3 g VO."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Perfusión prolongada de betalactámicos en el crítico (ensayo BLING III, JAMA 2024, + metaanálisis de Abdul-Aziz 2024): la perfusión continua o extendida reduce la mortalidad a 90 días en la sepsis. Plantearla de entrada en la UCI, no solo cuando el resultado es «I».", "Vancomicina: las guías ASHP/IDSA 2020 recomiendan dosificar por AUC/CMI 400–600 (con software bayesiano) en vez de por valle de 15–20, y una dosis de carga de 20–35 mg/kg en el crítico.", "Doxiciclina: la dosis habitual en adultos es 100 mg/12 h (con carga de 200 mg). La pauta de 100 mg/24 h del protocolo es inferior a la de la mayoría de guías y fichas técnicas."]}]}], "sources": "EUCAST Clinical Breakpoint Tables v14–15 (2024–2025); Dulhunty JM et al. BLING III (JAMA 2024); Abdul-Aziz MH et al. meta-analysis prolonged β- lactam infusion (JAMA 2024); Rybak MJ et al. ASHP/IDSA/PIDS/SIDP vancomycin consensus (Am J Health Syst Pharm 2020).", "cats": ["infec"], "vital": false}, {"title": "Antibióticos: duración según el síndrome infeccioso", "page": 15, "protocol": "RECOMENDACIÓN DURACIÓN DE TRATAMIENTO ANTIBIÓTICO", "service": "PROA", "date": "v1.0, dic 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Duraciones válidas si la evolución clínica es favorable. Desescalar y pasar a VO según los cultivos siempre que se pueda."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Duraciones recomendadas en el hospital"}, {"type": "list", "items": ["Neumonía: 5–7 días.", "Exacerbación de EPOC o bronquitis crónica: ≤5 días.", "Cistitis no complicada: fosfomicina trometamol 3 g VO en dosis única · nitrofurantoína 100 mg/8 h × 5 días · cotrimoxazol × 3 días.", "Cistitis complicada (anomalía urológica, ITU recurrente, ATB en 3 meses, inmunosupresión, DM mal controlada): fosfomicina 3 g × 2 dosis separadas 48 h, nitrofurantoína 7 días o cotrimoxazol 3–4 días.", "Cistitis: evitar betalactámicos y quinolonas. Si no queda otra opción: quinolona 3–5 días o betalactámico 5–7 días.", "Pielonefritis: 7 días (5 si es quinolona).", "Prostatitis aguda u orquiepididimitis: 14 días. 3–4 semanas si responde tarde (>7 días), es grave, hay absceso o ITU recurrente.", "Bacteriemia no complicada por BGN (foco urinario, biliopancreático, abdominal, catéter, piel o respiratorio; foco controlado; sin inmunosupresión ni dispositivos endovasculares): 7 días.", "Piel y partes blandas: 5–7 días. 10–14 días si es complicada (necrotizante, grave, inmunodeprimido, comorbilidad)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Ensayo BALANCE (NEJM 2025, ~3600 pacientes): 7 días no fueron inferiores a 14 en la bacteriemia por BGN incluidos pacientes de UCI. Esto amplía el uso de pautas cortas más allá de la bacteriemia \"no complicada\".", "NAC (ATS/IDSA 2019): mínimo 5 días y estabilidad clínica. Ensayo PTC (Lancet 2021): 3 días de betalactámico no fueron inferiores a 8 en la NAC hospitalizada que mejora a las 72 h. La guía ERS/ESICM/ESCMID/ALAT 2023 trata la NAC grave aparte.", "Pielonefritis o ITU complicada: la guía IDSA 2025 sobre ITU complicada acepta 7 días en la mayoría de pacientes que mejoran, sea cual sea el antibiótico, incluidos los hombres. La guía EAU 2024 coincide.", "ITU en el hombre afebril: 7 días no fueron inferiores a 14 (Drekonja, JAMA 2021).", "Celulitis: 5–6 días si la evolución es favorable (Cranendonk 2020; guía NICE 2019)."]}]}], "sources": "Daneman N et al. BALANCE (N Engl J Med 2025); Dinh A et al. PTC trial (Lancet 2021); Metlay JP et al. ATS/IDSA CAP guideline (Am J Respir Crit Care Med 2019); IDSA Complicated UTI Guideline (2025); EAU Urological Infections Guidelines 2024; Drekonja DM et al. (JAMA 2021).", "cats": ["infec"], "vital": false}, {"title": "Antibióticos: paso de vía IV a vía oral (terapia secuencial)", "page": 16, "protocol": "PROTOCOLO DE TERAPIA SECUENCIAL DE ANTIMICROBIANOS (PROA-TSA)", "service": "PROA", "date": "v1, ene 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Valorarlo a diario desde la primera dosis IV.", "Puede ser el mismo fármaco (secuencial) o uno distinto (*switch*), aprovechando para desescalar.", "Biodisponibilidad oral muy alta (oral desde el inicio): linezolid, quinolonas, cotrimoxazol, metronidazol, clindamicina, doxiciclina, fluconazol."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["No pasar a vía oral de forma precoz (consultar con Infecciosas) en: – Endocarditis, meningitis u otras infecciones del SNC. – Empiema o absceso no drenado. – Bacteriemia (sobre todo por *S. aureus*). – Infección osteoarticular. – Piel y partes blandas grave, o foco no controlado.", "No es posible si hay íleo, obstrucción o HDA, vómitos en las últimas 24 h, malabsorción o intestino corto, mucositis o diarrea grave, o bajo nivel de conciencia (riesgo de aspiración)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Criterios de estabilidad (todos): – TAS >100, FC <100, FR <20. – Afebril >24 h sin antitérmicos. – Mejoría clínica y descenso de leucocitos y PCR o PCT. – Tolerancia oral (sin vómitos >24 h).", "Infecciones aptas: respiratoria, urinaria, piel y partes blandas no grave, intraabdominal con el foco controlado, pélvica, neutropenia febril."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Equivalencias IV → v.o. (función renal normal)"}, {"type": "list", "items": ["Levofloxacino 500–750 mg/24 h IV → igual v.o. (98 %). Dosis alta: 500 mg/12 h.", "Ciprofloxacino 400 mg/12 h IV → 500 mg/12 h v.o. (75 %). Dosis alta: 400 mg/8 h IV → 750 mg/12 h v.o.", "Amoxicilina-clavulánico 1 g/8 h IV → 875/125 mg/8 h v.o. (o 500 mg/8 h). Dosis alta: 2 g/12 h. Con comida.", "Clindamicina 600 mg/8 h IV → 300 mg/6 h v.o. (90 %).", "Metronidazol 500 mg/8 h → igual (100 %).", "Linezolid 600 mg/12 h → igual (100 %).", "Cotrimoxazol 800 mg/8–12 h → igual (90–100 %).", "Doxiciclina 100 mg/12 h → igual.", "Azitromicina 500 mg/24 h → igual (pese a una biodisponibilidad del 40 %, por su gran volumen de distribución).", "Rifampicina 600 mg/24 h → igual, en ayunas.", "Fluconazol 200–400 mg/24 h → igual.", "Voriconazol 6 mg/kg/12 h × 2 dosis → 4 mg/kg/12 h (también v.o.), en ayunas."]}, {"type": "h", "text": "Solo orales"}, {"type": "list", "items": ["Fosfomicina-trometamol 3 g (cistitis: dosis única o 2 separadas 48 h; en otras ITU, días alternos).", "Nitrofurantoína 100 mg/8 h (solo cistitis; no si FG <45).", "Cefadroxilo 500 mg–1 g/8–12 h.", "Cefuroxima-axetilo 250–500 mg/8–12 h (no en el foco respiratorio).", "Cefixima 200–400 mg/12–24 h.", "Moxifloxacino 400 mg/24 h."]}, {"type": "h", "text": "Interacciones y administración"}, {"type": "list", "items": ["Quinolonas, doxiciclina y azitromicina: separar 2 h del Ca, Fe y antiácidos. Nutrición enteral: parar 1 h antes y 1 h después (o 1 h antes y 2 h después, según el fármaco)."]}, {"type": "h", "text": "Tuberculostáticos"}, {"type": "list", "items": ["Pirazinamida 25 mg/kg/día.", "Rifinah® (RIF 300 + INH 150): 2 comprimidos al día.", "Rifater® según el peso: <40 kg 3; 40–49 kg 4; 50–64 kg 5; ≥65 kg 6 comprimidos al día.", "Etambutol 15–25 mg/kg/día.", "Isoniazida 5 mg/kg/día.", "Rifampicina 600 mg (450 mg si pesa <50 kg).", "Todos en ayunas."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Bacteriemia por gramnegativos no complicada: el paso precoz a vía oral (betalactámico de alta biodisponibilidad o quinolona) no es inferior (ensayos de 2023–2024 y metaanálisis; IDSA 2024 sobre gramnegativos). Ya no es una contraindicación absoluta.", "Endocarditis izquierda estable (POET, NEJM 2019; 5 años en 2022): el paso a vía oral combinada tras ≥10 días IV es no inferior. Aceptado en la ESC 2023 (clase IIa).", "Infección osteoarticular (OVIVA, NEJM 2019): la vía oral es no inferior a la IV a partir de la 1.ª semana.", "Bacteriemia por *S. aureus*:** se estudia el paso a vía oral seleccionado (SABATO, Lancet Infect Dis 2024). Siempre con Infecciosa"]}]}], "sources": "Iversen K et al. POET trial (NEJM 2019); Li HK et al. OVIVA trial (NEJM 2019); Kaasch AJ et al. SABATO trial (Lancet Infect Dis 2024); Delgado V et al. 2023 ESC Guidelines for endocarditis.", "cats": ["infec", "tec"], "vital": false}, {"title": "Anticoagulación: profilaxis, tratamiento, reversión y cirugía", "page": 18, "protocol": "PROTOCOL ANTICOAGULACIÓ (revisión 2021)", "service": "", "date": "", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Necesita profilaxis de ETV: paciente médico ingresado con IC, insuficiencia respiratoria o encamado + ≥1 factor de riesgo (escala PRETEMED: profilaxis si riesgo ajustado ≥4; considerarla si 3). El IMASIS tiene alarma electrónica de riesgo.", "Sangrado moderado: caída de Hb >20 g/L, 2 CH, órgano crítico. Grave: HIC, caída de Hb >50 g/L, >4 CH, necesita cirugía urgente.", "TIH tipo 2: plaquetas <100.000 o caída >50% a los 5–15 días del inicio de la heparina, ± trombosis arterial o venosa."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemograma, TP/INR, TTPA, fibrinógeno, función renal (ClCr). Hora de la última dosis del anticoagulante.", "Dabigatrán: TTPA alargado = hay efecto; TT normal = no hay fármaco. Anti-Xa (rivaroxabán, apixabán, edoxabán): un TP normal no descarta efecto. Con ACOD tomado hace <24 h se asume efecto anticoagulante.", "HNF: TTPA a las 6 h del bolo (1,5–2,5 veces el control) o anti-Xa 0,3–0,7 UI/mL.", "Sospecha de TIH: anticuerpos anti-PF4/heparina."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Profilaxis de ETV"}, {"type": "list", "items": ["Riesgo bajo/moderado: bemiparina 2500 UI/24 h SC. Riesgo alto: enoxaparina 40 mg/24 h o bemiparina 3500 UI/24 h. ClCr <30: enoxaparina 20–30 mg/24 h.", "Duración: hasta la movilización o el alta. Cirugía oncológica: 4–6 semanas. PTC, PTR o fractura de cadera: 35 días. Artroscopia: 1 semana. Cirugía no traumatológica: 7–10 días.", "Alternativas: fondaparinux 2,5 mg/24 h (contraindicado si ClCr <30), rivaroxabán 10 mg/24 h, dabigatrán 220 mg/24 h (150 mg si >75 años o ClCr 30–50).", "Neuroaxial: HBPM profiláctica ≥12 h antes (terapéutica ≥24 h); siguiente dosis ≥4 h después de retirar el catéter. Rivaroxabán: retirar el catéter a las 18 h de la última dosis."]}, {"type": "h", "text": "Anticoagulación terapéutica"}, {"type": "list", "items": ["HNF IV: bolo de 80 UI/kg (o 5000 UI) + 18 UI/kg/h. TTPA a las 6 h y ajustar con el nomograma.", "Enoxaparina 1 mg/kg/12 h (o 1,5 mg/kg/24 h). ClCr <30: 1 mg/kg/24 h.", "AVK: acenocumarol 2 mg/día × 3 días (hasta 4 mg en jóvenes) o warfarina 5 mg/día. Solapar con heparina hasta tener 2 INR en rango. INR objetivo 2–3 en general.", "Embarazo: HBPM a dosis terapéuticas durante toda la gestación (los AVK son teratógenos). Mantener ≥6 semanas posparto. La lactancia es compatible con AVK."]}, {"type": "h", "text": "INR fuera de rango (AVK)"}, {"type": "list", "items": ["<1,4: subir la dosis semanal un 10–20% + HBPM 3 días (dosis terapéutica si el riesgo es alto). Control en 7 días.", "1,5–1,9: subir un 5–10% (HBPM si el riesgo es alto). Control en 10–15 días.", "3–5 sin sangrado: bajar un 10%. Control en 10–14 días.", "5–8 sin sangrado: omitir 1–2 dosis y bajar un 20% (vitamina K 2–3 mg VO si hay riesgo de sangrado).", ">8 sin sangrado: suspender + vitamina K 3–5 mg VO.", "Sangrado menor: suspender 1–2 días ± vitamina K 3–5 mg VO."]}, {"type": "h", "text": "Hemorragia grave o vital con AVK"}, {"type": "list", "items": ["Vitamina K 10 mg IV (repetir a las 6 h) + complejo protrombínico (Octaplex 500 UI/vial): INR 1,5–5 → 15 UI/kg; INR >5 → 30 UI/kg (máx. 3000 UI = 6 viales). En bolo IV lento; INR a los 20 min (repetir si no está corregido). Objetivo INR <1,3.", "El PFC (15–20 mL/kg) solo si no hay CCP.", "HIC con INR <1,5: no revertir. Coma con signos de tronco y no quirúrgico: no revertir (no sirve)."]}, {"type": "h", "text": "Hemorragia grave con ACOD (última dosis hace <24 h → revertir)"}, {"type": "list", "items": ["Dabigatrán: idarucizumab 5 g IV (2 viales de 2,5 g seguidos; contactar con Farmacia). Repetir si el sangrado persiste o reaparece con el TTPA alargado. Es dializable. Carbón activado si la toma fue hace <2 h.", "Rivaroxabán, apixabán, edoxabán: CCP (Octaplex) 25–50 UI/kg en 30 min."]}, {"type": "h", "text": "Hemorragia con heparinas u otros"}, {"type": "list", "items": ["HNF: protamina 1 mg por cada 100 UI administradas en las últimas 2–4 h (0,5 mg/100 UI si pasaron >30 min). Máx. 50 mg en 10 min.", "HBPM: última dosis hace <8 h → protamina 1 mg por 100 UI anti-Xa (1 mg/mg de enoxaparina); hace >8 h → 0,5 mg por 100 UI. La neutralización es solo del ~60%.", "Fondaparinux: CCP 20 UI/kg. Alteplasa: ácido tranexámico 10–15 mg/kg IV.", "Antiagregantes: plaquetas (si hay trombopenia <80.000) o desmopresina 0,3 mcg/kg en 50 mL de SF en 20 min (máx. 24 mcg)."]}, {"type": "h", "text": "TIH tipo 2"}, {"type": "list", "items": ["Suspender TODA la heparina (tampoco HBPM). Fondaparinux según peso: <50 kg 5 mg; 50–100 kg 7,5 mg; >100 kg 10 mg/24 h. (Argatrobán en UCI.)", "No empezar AVK hasta que se normalicen las plaquetas. Solapar ≥5 días hasta INR 2."]}, {"type": "h", "text": "Cirugía"}, {"type": "list", "items": ["AVK + cirugía urgente (puede esperar 6–8 h): vitamina K 10–30 mg IV y operar si INR <1,6. Extrema urgencia: CCP 10– 20 UI/kg + vitamina K 10 mg IV.", "AVK + cirugía programada con riesgo trombótico alto (prótesis mecánica, ETV o embolia <3 meses): suspender el AVK 3 días (acenocumarol) o 5 (warfarina), HBPM terapéutica desde el día 2 y retomarla en el posoperatorio.", "No suspender el AVK en extracciones dentales (ácido tranexámico local), cataratas con anestesia tópica ni biopsias cutáneas.", "Suspender el ACOD antes de la cirugía (anti-Xa): ClCr >50 → 24 h (riesgo moderado) / 48–72 h (riesgo alto) · ClCr 30– 50 → 48 h / 72 h · ClCr <30 → 72 h / 96 h.", "Dabigatrán: ClCr >50 → 24 h / 48 h · ClCr 30–50 → 72 h / 96 h.", "Reinicio del ACOD: 24 h después si el riesgo hemorrágico es moderado; 48–72 h si es alto (con HBPM profiláctica mientras tanto).", "Antiagregantes: mantener AAS 100 mg (si toma 300 mg, bajar a 100). Clopidogrel: suspender 7 días (5 si el riesgo trombótico es muy alto, pasando a AAS). Prasugrel 7–10 días. Ticagrelor 5 días."]}, {"type": "h", "text": "Tras una hemorragia cerebral"}, {"type": "list", "items": ["Heparina profiláctica en cuanto se controle. No reintroducir AVK antes de 2 semanas."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Andexanet alfa está autorizado en Europa desde 2019 (Ondexxya); el protocolo de 2021 dice que no.", "ANNEXA-I (NEJM 2024), HIC con anti-Xa: andexanet mejoró la hemostasia frente al tratamiento habitual (mayoritariamente CCP), pero con más trombosis e ictus isquémicos y sin diferencias funcionales. La ESO 2025 y la ESC 2024 lo aceptan como opción, y la elección depende de la disponibilidad local.", "CCP a dosis fija (1500–2000 UI) en la reversión de AVK o ACOD es igual de eficaz y más rápido que la dosis por peso (ACC 2020, ESO).", "Cirugía con ACOD (estudio PAUSE, JAMA Intern Med 2019): no hacer puente con heparina. Suspender apixabán, rivaroxabán o edoxabán 1 día (riesgo bajo) o 2 días (riesgo alto); dabigatrán 1–2 días o 2–4 días según el ClCr.", "Puente con AVK por FA (ensayo BRIDGE, NEJM 2015): sin puente hay el mismo número de embolias y menos sangrado. Reservarlo para prótesis mecánica mitral o ictus/ETV recientes (ACC 2017 y CHEST 2022).", "Ictus cardioembólico por FA (ELAN, NEJM 2023; OPTIMAS, Lancet 2024): el inicio precoz del ACOD es seguro (1–2 días en el ictus leve o moderado, 6–7 días en el grave). Las \"2 semanas de AVK + AAS\" del protocolo están superadas.", "TIH: ASH 2018 recomienda la escala 4T. Acepta ACOD (rivaroxabán o apixabán) como alternativa al fondaparinux o al argatrobán en el paciente estable.", "Profilaxis en el paciente médico: ASH 2018 y NICE NG89 usan las escalas Padua o IMPROVE. No recomiendan alargar la profilaxis tras el alta de forma rutinaria."]}]}], "sources": "Connolly SJ et al. ANNEXA-I (N Engl J Med 2024); Douketis JD et al. PAUSE (JAMA Intern Med 2019); Douketis JD et al. BRIDGE (N Engl J Med 2015); Fischer U et al. ELAN (N Engl J Med 2023); Cuker A et al. ASH 2018 HIT guideline (Blood Adv 2018); Schünemann HJ et al. ASH 2018 VTE prophylaxis (Blood Adv 2018); CHEST perioperative guideline (Chest 2022).", "cats": ["hemato"], "vital": false}, {"title": "Arbovirosis / dengue", "page": 20, "protocol": "PROTOCOLO DE ACTUACIÓN FRENTE A CASOS DE ARBOVIRUS (DENGUE)", "service": "Infecciosas/Medicina Tropical", "date": "v2, jul 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Criterio epidemiológico: zona endémica en los 15 días previos; zona no endémica con *Aedes* en temporada (mayo– sept, autóctono posible en Cataluña); o relación con otros casos.", "Caso sospechoso: criterio epidemiológico + fiebre de 2–7 días + ≥2 de: náuseas o vómitos, exantema, mialgias o artralgias, cefalea o dolor retroocular, petequias o prueba del torniquete +, leucopenia.", "Fases: febril (2–7 días) → CRÍTICA al bajar la fiebre (días 3–7): fuga capilar, ↑Hto, ↓plaquetas, sangrado → recuperación (exantema en \"islas blancas en mar rojo\").", "Grupo A (leve): sin signos de alarma, tolera VO, diuresis conservada.", "Grupo B, signos de alarma: dolor abdominal intenso, vómitos persistentes, ascitis o derrame, sangrado de mucosas, letargia o irritabilidad, hipoTA postural, hepatomegalia >2 cm, ↑Hto con ↓rápida de plaquetas.", "Grupo B, pacientes de riesgo: embarazada, lactante, anciano, inmunodeprimido, fragilidad social.", "Grupo C (grave): shock (relleno capilar >2 s, presión de pulso ≤20), distrés respiratorio, sangrado grave, AST/ALT ≥1000, alteración de conciencia, miocarditis."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["MALARIA (siempre en el viajero con fiebre), fiebre tifoidea, leptospirosis, rickettsiosis, primoinfección VIH, chikungunya (artralgia intensa, PCR alta) o Zika, meningococemia, sepsis bacteriana."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemograma (Hto y plaquetas seriados), bioquímica con transaminasas, coagulación, gota gruesa o test de malaria.", "Días 0–7: antígeno NS1 + RT-PCR. Días 4–6: NS1 + IgM. Después del día 7: IgM/IgG (seroconversión o IgG ×4). Hay reactividad cruzada entre flavivirus.", "Ecografía o Rx: serositis, engrosamiento de la pared vesicular.", "EDO: ficha de notificación (Anexo 1); si es autóctono, también a suvec.salut@gencat.cat. Avisar al busca de Infecciosas 25444."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Grupo A · Alta"}, {"type": "list", "items": ["Hidratación oral abundante. PARACETAMOL (máx. 1 g/8 h). NO AINE ni AAS.", "Reconsultar si: intolerancia oral, sangrado, fiebre >10 días.", "Cita en el dispensario de Medicina Tropical (INF39, Dra. Villar).", "Medidas durante 10 días: casa, repelente con DEET 35–50%, manga larga, mosquiteras, preservativo (mujeres 2 meses, hombres 3). Salud Pública llamará y hará inspección entomológica."]}, {"type": "h", "text": "Grupo B · Ingreso"}, {"type": "list", "items": ["Constantes cada hora. Si tolera VO: sintomático.", "Si no tolera VO: Ringer lactato o SF 10 mL/kg en 1 h (hasta 3 bolos).", "Si mejora (diuresis >1 mL/kg/h, Hto estable o bajando): 5–7 mL/kg/h × 2–4 h → 3–5 mL/kg/h × 2–4 h → 2–3 mL/kg/h, y retirada progresiva.", "Si empeora (diuresis <0,5, Hto subiendo) o ya ha recibido ≥3 bolos → manejo del grupo C."]}, {"type": "h", "text": "Grupo C · Shock (monitorizar cada 5–30 min)"}, {"type": "list", "items": ["Compensado: RL o SF 5–10 mL/kg en 1 h. Hipotensivo (PAM <65): 20 mL/kg en 15 min (10 mL/kg en embarazadas y ancianos).", "Si mejora: bajar a 7–10 mL/kg/h × 1–2 h → 5–7 → 3–5 → 2–3 mL/kg/h durante 24–48 h.", "Si no mejora y el Hto sube (>50%): repetir el bolo (hasta 3) y valorar coloides (poca evidencia).", "Si no mejora y el Hto baja → buscar sangrado → transfundir CH 5–10 mL/kg.", "Descartar otras causas de shock: miocarditis, taponamiento, sepsis, TEP. Drogas vasoactivas → UCI.", "En Urgencias y en planta no hace falta aislamiento específico."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["OMS julio 2025 (1ª guía conjunta de dengue, chikungunya, Zika y fiebre amarilla, GRADE): cristaloides (mejor balanceados) frente a coloides como primera línea. Guiar los fluidos por relleno capilar, lactato y respuesta a volumen, no solo por el Hto. No usar corticoides, inmunoglobulinas ni transfusión profiláctica de plaquetas aunque la trombopenia sea grave si no hay sangrado.", "Vacuna TAK-003 (Qdenga), autorizada por la EMA en 2022: se ofrece a viajeros con dengue previo según las recomendaciones nacionales. No cambia el manejo agudo.", "El protocolo sigue la clasificación OMS 2009/OPS 2015, que la guía de 2025 mantiene en lo esencial."]}]}], "sources": "WHO guidelines for clinical management of arboviral diseases: dengue, chikungunya, Zika and yellow fever (Geneva, 2025); OPS/OMS Dengue: guías para la atención de enfermos en las Américas (2ª ed., 2015).", "cats": ["infec"], "vital": false}, {"title": "Ascitis", "page": 21, "protocol": "ASCITES", "service": "Protocol d'actuació a Urgències, Digestivo", "date": "rev. nov 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Grado 1: solo se ve en la ecografía · grado 2: distensión moderada · grado 3: distensión marcada o a tensión.", "Causas: cirrosis (80%), neoplasia peritoneal (10%), IC (3%), Budd-Chiari, trombosis portal, TBC peritoneal, síndrome nefrótico, pancreática, quilosa, mixedema."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["PBE (en todo cirrótico descompensado: fiebre, encefalopatía, HDA, FRA, leucocitosis, empeoramiento hepático).", "Peritonitis secundaria, carcinomatosis, IC derecha o constrictiva, Budd-Chiari."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemograma, coagulación, iones, urea, creatinina, perfil hepático, NT-proBNP. Rx de tórax. Ecografía abdominal (a pie de cama si hay dudas).", "Paracentesis diagnóstica (≥40 mL) en todo primer episodio y en todo cirrótico descompensado. En fosa ilíaca izquierda. No hace falta transfundir plasma ni plaquetas (solo está contraindicada en la CID).", "Petitorio \"Líquido ascítico\": proteínas, glucosa, recuento de leucocitos con PMN y hematíes, Gram + 10 mL en frasco de hemocultivo aerobio + 10 mL en anaerobio.", "Primer episodio, además (petición aparte al laboratorio central): albúmina (GASLA), LDH, TG, ADA + citología (el máximo volumen posible).", "GASLA ≥1,1 → hipertensión portal (proteínas <2,5 → cirrosis; >2,5 → IC o Budd-Chiari). GASLA <1,1 → causa peritoneal (carcinomatosis, TBC con ADA >40, pancreática, biliar, quilosa con TG >110–200)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Según el algoritmo"}, {"type": "list", "items": ["Primer episodio: paracentesis diagnóstica. Carcinomatosis en paciente oncológico → busca de Onco/Hemato. Cirrosis o causa no filiada → busca de Digestivo. IC → busca de Cardiología.", "Cirrótico conocido: paracentesis diagnóstica.", "Si hay ≥250 PMN → protocolo de PBE.", "Ascitis a tensión sin sepsis ni FRA: paracentesis evacuadora + albúmina 8 g por litro extraído si se sacan >5 L.", "Con sepsis o FRA: contactar con Digestivo antes de evacuar (o sacar poco volumen).", "Contraindicaciones de la paracentesis: infección en el punto de punción, embarazo, CID, obstrucción intestinal."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Tratamiento de base que el protocolo no incluye (EASL 2018 / AASLD 2021): restricción de sodio a 80–120 mmol/día (≈2 g).", "Espironolactona 100 mg + furosemida 40 mg/día, subiendo cada 3–5 días hasta 400/160 mg. Objetivo de pérdida: 0,5 kg/día sin edemas, 1 kg/día con edemas.", "Nada de AINE. Evitar IECA y ARA-II en la ascitis refractaria.", "Albúmina en la paracentesis (AASLD 2021): 6–8 g/L si se sacan >5 L. La AASLD acepta considerarla también con volúmenes menores en el paciente con FRA o ACLF.", "Baveno VII (2022): en la cirrosis con ascitis, el carvedilol o propranolol reduce las descompensaciones. Bajar la dosis o suspender si TAS <90, Na <130 o FRA.", "Albúmina de forma crónica: el ensayo ANSWER (Lancet 2018) mostró beneficio con 40 g/semana. No está aprobada en todos los sistemas sanitarios y la EASL la considera opcional."]}]}], "sources": "EASL Clinical Practice Guidelines for decompensated cirrhosis (J Hepatol 2018); Biggins SW et al. AASLD Practice Guidance: ascites, SBP and HRS (Hepatology 2021); de Franchis R et al. Baveno VII (J Hepatol 2022); Caraceni P et al. ANSWER (Lancet 2018).", "cats": ["dig"], "vital": false}, {"title": "Asma: exacerbación (crisis asmática del adulto)", "page": 22, "protocol": "DESCOMPENSACIÓ ASMA", "service": "algoritmo adaptado de GEMA 4.0 y Rodrigo et al.", "date": "1 página", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Valoración estática inicial: anamnesis, exploración, FEV1 o PEF, SatO2.", "Leve-moderada: FEV1 o PEF >50%. Grave: FEV1 o PEF <50%, habla con frases cortas, FR >25, FC >110, SatO2 <90%.", "Riesgo vital (criterios GEMA): tórax silencioso, cianosis, bradicardia, hipoTA, confusión o coma, agotamiento, pCO2 normal o alta."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Neumotórax, neumonía, anafilaxia, EAP o IC (asma cardial), TEP, obstrucción de la vía aérea superior o disfunción de cuerdas vocales, aspiración de cuerpo extraño, exacerbación de EPOC."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["PEF o FEV1 al llegar y cada 30 min. SatO2 continua.", "Gasometría si SatO2 <92% o es grave (una pCO2 ≥42 es signo de alarma).", "Rx de tórax si hay sospecha de complicación (neumotórax, neumonía) o no responde. Analítica (K: los β2 lo bajan)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Crisis leve-moderada"}, {"type": "list", "items": ["Salbutamol 2–4 pulsaciones con cámara cada 20 min (la 1ª hora).", "O2 si SatO2 <92% (FiO2 <40%, objetivo 93–95%).", "Prednisona 20–40 mg VO (o hidrocortisona 200 mg IV)."]}, {"type": "h", "text": "Crisis grave"}, {"type": "list", "items": ["O2 para SatO2 93–95%.", "Salbutamol + ipratropio: 4 pulsaciones con cámara cada 10 min, o salbutamol 2,5 mg + ipratropio 0,5 mg nebulizados cada 30 min.", "Hidrocortisona 200 mg IV o prednisona 20–40 mg VO.", "Si responde mal: fluticasona 2 × 250 mcg con cámara cada 10–15 min o budesonida 800 mcg nebulizada cada 15 min.", "Considerar sulfato de magnesio IV."]}, {"type": "h", "text": "Riesgo vital"}, {"type": "list", "items": ["O2, salbutamol + ipratropio 10–20 pulsaciones por minuto con cámara (o nebulizado continuo), hidrocortisona 200 mg IV.", "Considerar VMNI / IOT → UCI."]}, {"type": "h", "text": "Reevaluar a las 1–3 h"}, {"type": "list", "items": ["Buena respuesta (FEV1 o PEF >60% estable, asintomático) → ALTA:", "Prednisona 40–60 mg/día VO 7–10 días (sin pauta descendente).", "Corticoide inhalado + LABA de mantenimiento.", "Plan de acción por escrito, comprobar la técnica inhalatoria, cita de control en 1 semana.", "Mala respuesta (FEV1 o PEF <60% o inestable) → INGRESO:", "O2 si SatO2 <92%. Salbutamol 2,5 mg + ipratropio 0,5 mg nebulizados cada 4–6 h.", "Hidrocortisona 100–200 mg/6 h IV o prednisona 20–40 mg/12 h VO. Considerar Mg IV."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["El protocolo se basa en GEMA 4.0 (2015). La GEMA 5.x (2024–2025) y la GINA 2025 mantienen el esquema, con estos matices:", "Sulfato de magnesio: dosis concreta 2 g IV en 20 min (dosis única) en la crisis grave o que no responde (GINA). El protocolo no da dosis.", "Prednisona: 40–50 mg/día, 5–7 días (GINA). No hace falta bajarla poco a poco.", "Corticoide inhalado a dosis altas en Urgencias en la 1ª hora: reduce los ingresos en quien no recibe corticoide sistémico (Cochrane). Coincide con el protocolo.", "Al alta (cambio importante de GINA y GEMA): pauta de mantenimiento y rescate con budesonida-formoterol (MART) como preferente. No dar de alta solo con SABA.", "Oxígeno: objetivo 93–95%. La hiperoxia aumenta la pCO2 (GINA, BTS/SIGN).", "Aminofilina IV, adrenalina SC o heliox: no se recomiendan de rutina.", "Medir eosinófilos al alta. La crisis grave es candidata a valoración en la Unidad de Asma por biológicos."]}]}], "sources": "GINA Global Strategy for Asthma Management and Prevention (2025); GEMA 5.4 Guía Española para el Manejo del Asma (2024); BTS/SIGN/NICE Asthma guideline (2024).", "cats": ["resp"], "vital": true}, {"title": "Cetoacidosis diabética (pediatría)", "page": 23, "protocol": "CETOACIDOSIS DIABETICA – Pediatría (nov 2024). En adultos, ver «Descompensaciones metabólicas agudas de la diabetes»", "service": "", "date": "", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Definición (las 3): glucemia >200 mg/dL + cetonemia ≥3 mmol/L (cetonuria ≥2+) + pH <7,30 o HCO3 <18.", "Clínica: deshidratación, respiración de Kussmaul, vómitos, dolor abdominal, alteración de la conciencia.", "Gravedad: leve pH 7,20–7,29 / HCO3 10–18 · moderada pH 7,10–7,19 / HCO3 5–10 · grave pH <7,10 / HCO3 <5."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Intoxicación por salicilatos o alcohol, sepsis (neumonía, meningitis), hiperglucemia de estrés, coma hipoglucémico y estado hiperosmolar (glucemia >1000: puede no ser CAD).", "Hallazgos esperables que no indican otra patología: leucocitosis sin infección, hiperamilasemia, creatinina falsamente elevada, \"abdomen agudo\" que no es quirúrgico."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Pesar al paciente al llegar (todos los cálculos van por el peso actual). Valorar Glasgow y grado de deshidratación.", "Glucemia y cetonemia capilar (glucómetro Optium). Analítica: glucosa, iones, gasometría venosa, urea, creatinina, osmolalidad, hemograma, Ca, PCR/PCT. Tira de orina. ECG (signos de alteración del K).", "Si hay fiebre: hemocultivo, Rx de tórax, orina, frotis faríngeo.", "Debut: IAA, anti-GAD, anti-IA2, ICA, anti-ZnT8, péptido C, HbA1c, TSH, T4L, anti-TPO, anti-Tg, IgA, antitransglutaminasa, albúmina, P, Mg.", "Controles: glucemia y cetonemia capilar cada hora; gasometría e iones seriados (hoja de monitorización del anexo).", "Fórmulas: Na corregido = Na + 1,6 × (glucemia − 100)/100. AG = Na − (Cl + HCO3) (si >35, pensar en acidosis láctica asociada). Osm efectiva = 2(Na + K) + glucemia/18."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · 0–2 h: expansión"}, {"type": "list", "items": ["2 vías venosas, monitorización, O2 si hay shock, cabecera elevada (antiTrendelenburg salvo hipoTA).", "0–1 h: SF 0,9% 10–20 mL/kg (20 mL/kg en 20–30 min si hay shock).", "1–2 h: SF 10 mL/kg (repetir 20 mL/kg si persiste el shock).", "Si K bajo: añadir K 20 mEq/L ya en la 1ª hora y retrasar la insulina."]}, {"type": "h", "text": "Fase 2 · Insulina (empezar 1 h después de iniciar los líquidos)"}, {"type": "list", "items": ["Insulina rápida IV 0,1 UI/kg/h, SIN bolo. Valorar 0,05 UI/kg/h si <5 años o pH >7,15. Preparación: 100 UI en 100 mL de SF (1 mL = 1 UI).", "Objetivo: bajar la glucemia 50–100 mg/dL/h y mantenerla en 200–300 mg/dL hasta que se resuelva la acidosis.", "Si baja >100 mg/dL/h o glucemia <250–300: si HCO3 <15 → subir la glucosa (no bajar la insulina); si HCO3 >15 → bajar la insulina a 0,05 UI/kg/h.", "Si baja <50 mg/dL/h con glucemia >300 → subir la insulina a 0,15–0,2 UI/kg/h.", "Sin vía IV o CAD leve: lispro o aspart SC 0,3 UI/kg, y después 0,1 UI/kg/h o 0,15–0,2 UI/kg cada 2 h."]}, {"type": "h", "text": "Fase 3 · 2–6 h: sistema de dos bolsas (Na 154 + K 40 mEq/L)"}, {"type": "list", "items": ["Ritmo total (V) según peso: 3–9 kg 6 mL/kg/h · 10–19 kg 5 · 20–39 kg 4 · 40–59 kg 3,5 · ≥60 kg 3 mL/kg/h. Cubre el mantenimiento + 10% de déficit en 48 h. Restar lo que tome por vía oral.", "Bolsa A: 500 mL SF 0,9% + 5 mL ClK 14,9% + 10 mL fosfato monopotásico.", "Bolsa B: 500 mL SG 10% + 22 mL ClNa 20% + 5 mL ClK 14,9% + 10 mL fosfato monopotásico.", "Proporción A/B según glucemia: >300 → 100% A (glucosa 0%) · 200–300 → 50/50 (glucosa 5%) · <200 → 100% B (glucosa 10%). Las fracciones 75/25 y 25/75 dan glucosa al 2,5% y al 7,5%.", "Si el K inicial es <4: subir el K a 60 mEq/L. Velocidad máxima de K: 0,5 mEq/kg/h. Si hay hiperK: no poner K hasta que haya diuresis y K <5,5."]}, {"type": "h", "text": "Fase 4 · >6 h"}, {"type": "list", "items": ["Si Na corregido >130: cambiar a SF 0,45% en la bolsa A (+ ClK y fosfato) y bolsa B con SG 10% + 11 mL ClNa 20% + ClK + fosfato.", "El Na medido debe subir 1–2 mEq por cada 100 mg/dL que baje la glucemia. Si no sube, hay riesgo de edema cerebral."]}, {"type": "h", "text": "Fase 5 · Bicarbonato y otros electrolitos"}, {"type": "list", "items": ["Bicarbonato solo si pH <6,9, HCO3 <5, pCO2 <15 o shock: bicarbonato 1 M 1–2 mEq/kg en 60 min; parar al llegar a pH 7,10.", "Ca: gluconato cálcico 10% 0,25–0,5 mL/kg/6 h (máx. 5 mL) en 15 min; no mezclarlo con el fosfato ni con e
