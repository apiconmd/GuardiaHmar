CIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["CIWA-Ar: los puntos de corte habituales en la literatura (ASAM 2020) son <10 mínima o leve, 10–18 moderada y ≥19 grave. El protocolo usa umbrales más altos (≤15, 16–20, ≥21). Tratar si es ≥8–10.", "Guía ASAM 2020:", "BZD de primera línea.", "Fenobarbital como alternativa o coadyuvante (también en dosis de carga única de 10 mg/kg IV en algunos centros; Rosenson 2013).", "Carbamazepina o gabapentina en el manejo ambulatorio leve.", "No usar alcohol, antipsicóticos en monoterapia ni baclofeno para tratar la abstinencia.", "Tiamina: profilaxis de ≥100 mg IV. En la sospecha de Wernicke, 500 mg cada 8 h (EFNS). Coincide.", "Tras la abstinencia: iniciar naltrexona, acamprosato (o topiramato o gabapentina) para prevenir recaídas (NICE CG115, APA 2018)."]}]}], "sources": "ASAM Clinical Practice Guideline on Alcohol Withdrawal Management (J Addict Med 2020); Rosenson J et al. Phenobarbital for alcohol withdrawal in the ED (J Emerg Med 2013); NICE CG100/CG115; APA Practice Guideline for Pharmacological Treatment of AUD (2018).", "cats": ["neuro", "tox"], "vital": false}, {"title": "Síndrome de Guillain-Barré (SGB) y variantes anti-GQ1b", "page": 136, "protocol": "Diagnóstico y Tratamiento del Síndrome de Guillain-Barré-Strohl", "service": "Neurología", "date": "v1, nov 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Debilidad progresiva y simétrica, distal y ascendente, + hipo o arreflexia, que empeora durante ≤4 semanas (habitualmente 2).", "Antecedente en las 6 semanas previas: infección GI (*C. jejuni*) o respiratoria, CMV, VEB, hepatitis E, vacunas, **inhibidores de *checkpoint* o anti-TNF**, cirugía.", "También: diplejía facial, oftalmoplejía, ataxia, disautonomía (arritmias, labilidad de la TA, íleo), parestesias, dolor radicular (precede a la debilidad en 1/3). Los reflejos pueden ser normales al principio (formas axonales o AMAN).", "Insuficiencia respiratoria en el 20–30 %.", "Variantes: – Miller Fisher: oftalmoplejía + ataxia + arreflexia (anti-GQ1b). – Encefalitis de Bickerstaff: + disminución de la conciencia. – Faringo-cervico-braquial: debilidad bulbar, cervical y de los brazos."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Datos que hacen improbable el SGB: – Asimetría marcada. – Nivel sensitivo, Babinski, esfínteres afectados. – Fiebre al inicio. – Insuficiencia respiratoria grave con poca debilidad. – LCR con >50 células/µL. – Progresión >4 semanas o fluctuación (CIDP de inicio agudo).", "Diagnóstico diferencial: – Mielopatía (compresiva, mielitis transversa). – Miastenia, botulismo. – Hipopotasemia o hipofosfatemia, porfiria. – Polineuropatía del crítico, infección (VIH, Lyme, VNO), tóxicos."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["PL siempre: – Disociación albuminocitológica: proteínas altas con <5 células (80 %). – Las proteínas pueden ser normales en los primeros 3 días (50 %). A los 7 días son altas en el 84 %. – Antes de las IgIV (alteran el LCR).", "Analítica: iones (K, P, Mg), CK, glucosa, función renal, TSH, VIH. Serologías (*C. jejuni*, CMV, VEB, VHE) sin retrasar el tratamiento.", "Anticuerpos antigangliósido (anti-GQ1b si se sospecha Miller Fisher). Tardan y no cambian el manejo.", "EMG/ENG para el diagnóstico diferencial (más útil a partir de la semana). No hace falta el subtipo (EAN 2023).", "RM de médula o de raíces si es atípico (descartar mielopatía; las raíces captan contraste).", "Monitorización respiratoria: – CVF o *single breath count* (anormal si no cuenta hasta >20 en una inspiración). – Fuerza del cuello, tos, deglución. – ECG o monitor (disautonomía)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "list", "items": ["Iniciar de forma preferente según el tiempo desde el inicio de la debilidad y la escala GBS-DS (no valora los brazos ni los pares craneales). – Indicado en general si no camina sin ayuda (GBS-DS ≥3) en las primeras 2 semanas (o 4 semanas en la plasmaféresis).", "IgIV 0,4 g/kg/día × 5 días (2 g/kg en total) o plasmaféresis de 4–5 sesiones en 7–14 días (eficacia equivalente).", "Enoxaparina profiláctica (con las IgIV y por la inmovilidad).", "CORTICOIDES CONTRAINDICADOS.", "No repetir las IgIV o la plasmaféresis si no responde, salvo fluctuación relacionada con el tratamiento (mejoría o estabilización y después empeoramiento).", "Miller Fisher: tratar solo si hay debilidad de extremidades, disfagia, debilidad facial o compromiso respiratorio. Bickerstaff: UCI + IgIV.", "Soporte: dolor neuropático (gabapentina o pregabalina), prevención de la ETV, úlceras y aspiración, rehabilitación precoz."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Comentar siempre con UCI y Neumología.", "Riesgo de VM (mEGRIS a los 2 meses): 25–32 puntos → >70 %; 18–24 → 20–70 %; 0–17 → <18 %.", "Criterios de UCI: – Progresión rápida (<7 días del inicio al ingreso), GBS-DS 4. – Debilidad cervical, facial o bulbar, tos ineficaz. – Disautonomía. – Single breath count <20 o CVF baja."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Guía EAN/PNS 2023: coincide con el protocolo.", "IgIV 2 g/kg en 5 días o plasmaféresis de 12–15 L en 4–5 sesiones.", "No combinarlas.", "No dar corticoides.", "Una 2.ª dosis de IgIV no es útil (ensayo SID-GBS, Lancet Neurol 2021).", "Regla de la intubación (20/30/40): CVF <20 mL/kg, PIM más débil que −30 cmH₂O o PEM <40 cmH₂O, o caída >30 % → intubación electiva.", "EGOS (*Erasmus GBS Outcome Score*) para el pronóstico de la marcha a los 6 meses.", "Imlifidasa y eculizumab: en investigación (sin aprobación en el SGB)."]}]}], "sources": "van Doorn PA et al. EAN/PNS guideline on Guillain-Barré syndrome (Eur J Neurol / J Peripher Nerv Syst 2023); Walgaard C et al. SID-GBS trial (Lancet Neurol 2021); Doets AY et al. mEGRIS (Neurology 2022).", "cats": ["neuro"], "vital": false}, {"title": "Síndrome de ovario poliquístico (SOP)", "page": 138, "protocol": "PROTOCOLO SÍNDROME DE OVARIOS POLIQUÍSTICOS", "service": "Ginecología, Reproducción Asistida", "date": "dic 2022", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["La endocrinopatía más frecuente en la mujer fértil (5–8 %).", "Rotterdam (2 de 3): – Oligo o anovulación (oligoamenorrea, menos de 6–8 reglas al año). – Hiperandrogenismo clínico (hirsutismo con Ferriman-Gallwey >8, acné, alopecia androgénica) o bioquímico. – Ovarios poliquísticos en la ecografía (≥12 folículos de 2–9 mm o volumen >10 mL en un ovario; no vale con ACO ni con un folículo dominante >10 mm).", "Obesidad central (50 %), resistencia a la insulina, esterilidad."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Otras causas de oligoamenorrea: embarazo, hiperprolactinemia (PRL), hipotiroidismo (TSH), amenorrea hipotalámica, fallo ovárico prematuro (FSH alta).", "Tumor productor de andrógenos: inicio tardío y rápido, virilización (voz grave, clitoromegalia, calvicie), testosterona o DHEA-S >2,5 veces el LSN.", "Hiperplasia suprarrenal congénita no clásica: – 17-OH-progesterona basal en fase folicular. – Si es de 6–11 nmol/L: test de ACTH (250 µg). Positivo si a los 30–60 min es ≥30 nmol/L o sube ≥9,5.", "Cushing, hirsutismo idiopático (andrógenos normales), hipertricosis (generalizada)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Testosterona total + SHBG → índice de testosterona libre (TT/SHBG ×100 >6,5 = hiperandrogenismo).", "17-OH-progesterona, DHEA-S, PRL, TSH, FSH, LH, β-hCG.", "Ecografía transvaginal.", "Metabólico: SOG o curva de glucemia, insulina basal (normal <20), HOMA (glucosa en mg/dL × insulina / 405; normal <3,8), lípidos, TA, IMC y cintura."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Sin deseo gestacional"}, {"type": "list", "items": ["Perder un 10–15 % del peso (puede restablecer los ciclos).", "Hirsutismo o necesidad de anticoncepción: ACO de etinilestradiol con acetato de ciproterona o drospirenona (evitar los progestágenos derivados de la 19-nortestosterona).", "Antiandrógenos (SIEMPRE con anticoncepción, por el riesgo para un feto varón): – Espironolactona 100 mg/día. – Acetato de ciproterona 2 mg/día. – Finasterida 2,5 mg/día. – Flutamida 125 mg/día (control hepático). – Combinaciones ACO + antiandrógeno si no hay respuesta a los 4–6 meses.", "Láser como coadyuvante. Reevaluar con el Ferriman-Gallwey."]}, {"type": "h", "text": "Con deseo gestacional"}, {"type": "list", "items": ["Estilo de vida. Metformina si hay resistencia a la insulina.", "Inducción de la ovulación (escalonada): – Clomifeno 50–150 mg/día del día 3 al 5 del ciclo (≤6 meses; eco en el primer ciclo). – Después, gonadotropinas (*step-up* o *step-down*), luego IA y luego FIV."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Ambulatorio: Ginecología o Endocrinología Ginecológica. Sin papel en urgencias salvo complicaciones (hiperestimulación ovárica, metrorragia por hiperplasia endometrial)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Guía internacional 2023 (Teede et al.):", "La AMH puede sustituir a la ecografía en la mujer adulta.", "El umbral ecográfico pasa a ≥20 folículos por ovario (con sondas de alta resolución).", "No diagnosticar con ecografía en los primeros 8 años tras la menarquia.", "Cribado cardiometabólico (SOG, lípidos), apnea del sueño y depresión o ansiedad.", "Letrozol 2,5–7,5 mg/día de primera línea para inducir la ovulación (superior al clomifeno en nacidos vivos; guía de 2023, NICE). El protocolo usa clomifeno.", "Ciproterona: la EMA (2020) la restringe por el riesgo de meningioma a dosis ≥10 mg. Preferir drospirenona u otros progestágenos.", "Agonistas del GLP-1 (semaglutida o liraglutida) para la pérdida de peso en el SOP con obesidad (guía de 2023, uso condicional)."]}]}], "sources": "Teede HJ et al. Recommendations from the 2023 International Evidence-based Guideline for PCOS (Hum Reprod / JCEM 2023); Legro RS et al. Letrozole vs clomiphene (NEJM 2014); EMA PRAC Cyproterone and meningioma (2020).", "cats": ["endo", "gineuro"], "vital": false}, {"title": "Síndrome febril en urgencias (adulto)", "page": 139, "protocol": "SÍNDROME FEBRIL", "service": "Servicio de Urgencias", "date": "v1, nov 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Fiebre ≥38,0 °C (axilar ≥37,9 °C). Febrícula 37,2–37,8 °C.", "Hiperpirexia: ≥41 °C o subida >1 °C/h durante ≥2 h.", "Hipertermia: fallo de la termorregulación, que no responde a antitérmicos (golpe de calor, SNM, síndrome serotoninérgico, anticolinérgico, hipertermia maligna).", "Duración: breve <48 h; corta 48 h–7 días; intermedia 7–14 días; prolongada >2–3 semanas. FOD: >3 semanas, ≥38,3 °C y sin diagnóstico tras un estudio adecuado.", "Enfoque por binomios: fiebre + exantema, cefalea, tos, disuria, dolor abdominal, focalidad, artralgias, catéter o prótesis, viaje, inmunodepresión, embarazo, anciano.", "Bradicardia relativa: tifoidea, *Legionella*, fiebre por fármacos, rickettsias."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Sepsis o shock (ABCDE, ver protocolos), meningitis, endocarditis (soplo, Osler, Janeway, hemorragias en astilla), neutropenia febril, artritis séptica, empiema, peritonitis.", "Fiebre importada (malaria; ver su ficha).", "No infecciosa: fármacos, autoinmune, neoplasia, TVP o TEP, SNM, síndrome serotoninérgico, anticolinérgico.", "Criterios de gravedad clínicos: – Alteración de la conciencia, T >39 o <35 °C. – PAS <100 o PAM <65, hipoperfusión, FC >100, FR >24. – Disnea, convulsiones, diátesis hemorrágica, deterioro rápido, alta reciente.", "Criterios de gravedad analíticos: – Lactato >2, acidosis (pH <7,35 o HCO₃ <20). – PaO₂/FiO₂ <300 (gasometría ARTERIAL si hay disnea). – Creatinina >2 u oliguria, bilirrubina >2. – Leucocitos >12.000 o <4.000 con desviación, neutrófilos <1.000, plaquetas <100.000. – INR >1,5, PCR >20 mg/L, PCT >0,5, hiperglucemia en un no diabético.", "Factores de mala evolución: – Comorbilidad moderada o grave, deterioro cognitivo, >75 años, embarazo. – Prótesis, ADVP, inmunodepresión, ingreso en las últimas 72 h."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Anamnesis: – Comorbilidades, esplenectomía, dispositivos, ingresos. – Fármacos (antibióticos, corticoides, inmunosupresores, neurolépticos). – Epidemiología: ITS, VIH, animales, viajes en los últimos 3 meses, residencia o prisión.", "Exploración completa y repetida: piel y mucosas, ORL, signos meníngeos, soplos, abdomen y visceromegalias, puñopercusión, extremidades (TVP), catéteres, prótesis y heridas, tacto rectal o genital si procede (salvo en la neutropenia).", "Sin gravedad ni foco: hemograma, glucosa, urea, creatinina, Na, K, PCR, sedimento, Rx de tórax. Si hay foco, pruebas dirigidas.", "Con gravedad o sospecha bacteriana: + perfil hepático, PCT, lactato, coagulación, gasometría, ≥2 pares de hemocultivos antes del ATB. – Hemocultivos también del catéter central (tiempo diferencial). – Urocultivo (cambiar la sonda y cultivar la nueva). – Panel viral respiratorio. – POCUS, eco, TC, PL, artrocentesis, coprocultivo, *C. difficile*, gota gruesa o Ziehl según el caso."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales"}, {"type": "list", "items": ["Aislamiento si procede (contacto, gotas, aérea o entérico).", "Hidratación, analgesia, retirar el dispositivo si es la puerta de entrada.", "Antitérmicos (preferir la vía oral): – Paracetamol 1 g/6–8 h (máximo 4 g). – Metamizol 2 g/6–8 h IV. – Ibuprofeno 600 mg/8 h. – Dexketoprofeno 25 mg v.o. o 50 mg IV cada 8 h. – Medidas físicas."]}, {"type": "h", "text": "ATB empírico (tras los cultivos; en la sepsis, en <1 h)"}, {"type": "list", "items": ["NAC: ceftriaxona 1–2 g/24 h + azitromicina 500 mg/24 h × 3–5 días (alternativa: levofloxacino o moxifloxacino).", "Broncoaspiración: – Comunitaria: ceftriaxona o amoxicilina-clavulánico 1–2 g/8 h. – Nosocomial o con riesgo de multirresistentes: piperacilina-tazobactam 4/0,5 g/6–8 h.", "ITU no complicada: cefuroxima 1,5 g/12 h IV o ceftriaxona 1 g/24 h (evitar quinolonas).", "ITU complicada o bacteriemia por *E. coli ceftriaxona 1–2 g o piperacilina-tazobactam 4/0,5 g/6 h. BLEE:** meropenem (o amikacina).", "Intraabdominal: piperacilina-tazobactam 4/0,5 g/6 h (o meropenem o ertapenem).", "Celulitis o erisipela: amoxicilina-clavulánico 1–2 g/8 h (o cefazolina o clindamicina).", "Fiebre sin foco grave: piperacilina-tazobactam ± vancomicina 15–20 mg/kg/12 h (o meropenem + vancomicina).", "Meníngea: ceftriaxona 2 g/12 h + ampicilina 2 g/4 h (si tiene >50 años o inmunodepresión). Ver la ficha de meningitis.", "Multirresistentes previos o riesgo: piperacilina-tazobactam o carbapenem + vancomicina o linezolid (SARM) ± cobertura de *Pseudomonas*. Consultar al PROA.", "Reevaluar a los 60–90 min y a las 4–6 h."]}, {"type": "h", "text": "Situaciones especiales"}, {"type": "list", "items": ["Hipertermia: enfriamiento activo, fluidos fríos. Dantroleno en la hipertermia maligna o el SNM.", "Inmunodeprimido: umbral bajo para cultivos, imagen, ATB e ingreso (ver neutropenia febril)."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Alta: – Fiebre corta sin criterios de gravedad (con o sin foco y con tratamiento oral). – Seguimiento por primaria o Infecciosas. – Signos de alarma: fiebre >72 h, deterioro, disnea, hipotensión, confusión.", "Ingreso: – Criterios de gravedad, sepsis, inmunodepresión, anciano frágil o embarazo. – Fiebre >7 días sin diagnóstico, intolerancia oral o necesidad de ATB IV. – Causa social, o sospecha de causa no infecciosa grave."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Nota del propio protocolo (pendiente de revisar por el PROA): **retirar la azitromicina en la NAC si el antígeno de *Legionella* es negativo** y no hay sospecha de atípicos (ATS/IDSA 2019 y ERS 2023 la mantienen en la NAC grave; ensayo ACCESS 2023: beneficio de la claritromicina en la NAC grave con respuesta inflamatoria).", "Piperacilina-tazobactam: la ficha técnica y la EUCAST indican 4/0,5 g/6 h en la infección grave, o perfusión extendida. La pauta cada 8 h queda corta.", "Sobreviviendo a la Sepsis 2021:", "ATB en <1 h si hay shock o la sepsis es probable.", "En <3 h si la sepsis es posible y no hay shock (dar tiempo al diagnóstico).", "qSOFA no como herramienta única de cribado.", "PCT: útil para suspender los ATB (reduce su duración sin aumentar la mortalidad). No sirve sola para decidir si iniciarlos."]}]}], "sources": "Evans L et al. Surviving Sepsis Campaign Guidelines 2021 (Crit Care Med 2021); Metlay JP et al. ATS/IDSA CAP Guideline (2019); Giamarellos- Bourboulis EJ et al. ACCESS trial clarithromycin (Lancet Respir Med 2024); EUCAST Clinical Breakpoints – dosing (v15, 2025).", "cats": ["infec"], "vital": false}, {"title": "Temblor esencial (TE)", "page": 141, "protocol": "PROTOCOLO PARA EL MANEJO DEL TEMBLOR ESENCIAL", "service": "Unidad de Trastornos del Movimiento, Neurología", "date": "v2, feb 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Criterios de la MDS (2018): – Temblor de acción bilateral de las EESS, ≥3 años de evolución. – Con o sin temblor en la cabeza, la voz o las EEII. – Sin distonía, ataxia ni parkinsonismo.", "TE-plus: con signos leves añadidos (tándem alterado, postura distónica dudosa, temblor de reposo, deterioro de la memoria).", "Frecuencia de 8–12 Hz. El componente cinético predomina sobre el postural (95 %). Asimetría leve.", "Temblor cefálico (\"no-no\" o \"sí-sí\"; desaparece al tumbarse). Temblor de la voz.", "Mejora con el alcohol y empeora con la cafeína y el estrés. Antecedentes familiares (autosómico dominante).", "Prevalencia del 1 % (del 5 % en >60 años)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Sobrediagnóstico del 30–50 % (sobre todo distonía y Parkinson).", "Parkinson: temblor de reposo, bradicinesia, rigidez, mandíbula en reposo que desaparece al hablar.", "Temblor secundario: – Fármacos (valproico, litio, β-agonistas, ISRS, amiodarona, levotiroxina, corticoides). – Alcohol o abstinencia, tóxicos (mercurio, manganeso, plomo, disolventes). – Hipertiroidismo, hiperparatiroidismo, hipocalcemia, Cushing. – Wilson (en jóvenes), lesión estructural (ictus, TCE)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["TSH, calcio, iones, glucosa, función hepática y renal. Revisar los fármacos.", "<50 años: ceruloplasmina y cobre en orina (Wilson).", "Metales pesados si hay exposición.", "Neuroimagen solo si se sospecha causa estructural. DaTSCAN si hay dudas con el parkinsonismo.", "Gravedad: escalas Fahn-Tolosa-Marín o TETRAS."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales"}, {"type": "list", "items": ["No siempre hace falta tratar (solo si hay repercusión funcional o social).", "No farmacológico: pesos en la muñeca, utensilios estabilizadores, relajación o biofeedback, evitar la cafeína y los fármacos tremorígenos."]}, {"type": "h", "text": "1.ª línea"}, {"type": "list", "items": ["Propranolol (p. ej., 10–20 mg/8–12 h → 60–240 mg/día; formas retard).", "Primidona (empezar con 25 mg por la noche → 50–250 mg/día; marea o somnolencia al inicio).", "Combinación de ambos si uno solo no basta."]}, {"type": "h", "text": "2.ª línea"}, {"type": "list", "items": ["Topiramato, gabapentina, pregabalina, zonisamida.", "BZD (clonazepam, alprazolam).", "Atenolol o metoprolol."]}, {"type": "h", "text": "Refractario (≥3 fármacos, uno de 1.ª línea)"}, {"type": "list", "items": ["Unidad de Trastornos del Movimiento (Dr. Puente, Dra. Navalpotro): – Toxina botulínica (temblor cefálico o de la voz; en las manos, debilidad). – Estimulación cerebral profunda del VIM (control del 70–90 %). – HIFU guiado por RM (talamotomía por ultrasonidos focalizados). – Radiocirugía con Gamma Knife."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Ambulatorio. Neurología o Unidad de Trastornos del Movimiento. Sin papel urgente salvo para descartar causas agudas (fármacos, tirotoxicosis, abstinencia)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Revisión de evidencia de la MDS (Ferreira 2019): solo el propranolol, la primidona y el topiramato se consideran \"eficaces\". El resto tienen evidencia insuficiente.", "HIFU bilateral por etapas: aprobado por la FDA en 2022 y con buena seguridad en series de 2023–2024. HIFU unilateral con beneficio mantenido a 5 años.", "Estimulación periférica no invasiva del nervio mediano o radial (pulsera Cala Trio®, aprobada por la FDA): opción para el temblor de la mano.", "Fármacos en investigación: ulixacaltamida (bloqueante del canal de Ca T; fase 3 Essential3, 2024–2025) y CX-8998."]}]}], "sources": "Bhatia KP et al. Consensus Statement on the classification of tremors (Mov Disord 2018); Ferreira JJ et al. MDS evidence-based review of treatments for ET (Mov Disord 2019); Elias WJ et al. Focused ultrasound thalamotomy (NEJM 2016) and 5-year follow-up (2023).", "cats": ["neuro"], "vital": false}, {"title": "Traumatismo craneoencefálico (TCE) pediátrico", "page": 142, "protocol": "PROTOCOLO TRAUMATISMO CRANEOENCEFÁLICO + PÓSTER TCE", "service": "Urgencias de Pediatría", "date": "jul 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Etiología según la edad: – <2 años: caídas, maltrato. – 2–10 años: tráfico, bicicleta, caídas. – >10 años: deporte, tráfico.", "Gravedad por GCS: leve 14–15; moderado 9–13; grave <9 o inestable.", "Riesgo ALTO de lesión intracraneal (LIC): – Focalidad, pérdida de conciencia >5 s, convulsión. – Fractura palpable, signos de fractura de base (hemotímpano, Battle, ojos de mapache, licuorrea). – Fontanela tensa. – Cefalohematoma: cualquiera en <3 meses, no frontal en <2 años, o >3 cm y blando.", "Riesgo INTERMEDIO: – Pérdida de conciencia <5 s, vómitos, cefalea intensa, conducta anormal según los padres, TCE en <6 meses. – Mecanismo de riesgo: accidente de tráfico con expulsión, vuelco o muerte de otro pasajero; bici o patinete sin casco; objeto a alta velocidad; caída >1,5 m (>0,9 m en <2 años).", "Riesgo BAJO: GCS 15, asintomático, sin signos de fractura, sin mecanismo de riesgo y sin focalidad."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Maltrato: hemorragias retinianas, historia incongruente, lactante, otras lesiones.", "Factores de riesgo: coagulopatía, válvula de derivación ventriculoperitoneal, malformaciones vasculares.", "Lesiones asociadas (columna cervical, otras)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Triángulo de evaluación pediátrica, ABCDE, GCS seriado (con sus componentes).", "Exploración: neurológica completa, palpación del cráneo (escalón, crepitación), otoscopia, fosas nasales, fondo de ojo.", "TC craneal (con reconstrucción 3D): – Siempre si el riesgo es alto o el GCS es <14. – Riesgo intermedio: valorarlo si empeora, aparecen síntomas nuevos en observación, hay varios signos o síntomas, tiene <3 meses o lo prefiere la familia. – PECARN como alternativa validada.", "No hacer Rx de cráneo ni ecografía como prueba inicial (la Rx solo para el seguimiento de fracturas o la sospecha de maltrato)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "TCE moderado o grave"}, {"type": "list", "items": ["ABCDE, collarín si hay riesgo, O₂ al 100 %, IOT si GCS <9, vía venosa, monitorización, vigilar la HTIC, analgesia."]}, {"type": "h", "text": "TCE leve según el riesgo"}, {"type": "list", "items": ["Bajo: alta con recomendaciones.", "Intermedio: observación 6 h (12 h si tiene <3 meses, válvula de DVP, coagulopatía o el TCE fue nocturno).", "Alto: TC."]}, {"type": "h", "text": "Heridas del cuero cabelludo"}, {"type": "list", "items": ["Compresión. Si no basta, lidocaína con adrenalina. Explorar las heridas amplias con el dedo enguantado."]}, {"type": "h", "text": "Según el TC"}, {"type": "list", "items": ["Con LIC: – >14 años: UCI de adultos + Neurocirugía de guardia. – ≤14 años: Neurocirugía pediátrica del centro de referencia y traslado a un centro con UCIP.", "Fractura complicada (hundimiento, basilar, diástasis >3 mm o con LIC): comentar con Neurocirugía.", "Fractura lineal no complicada: – Observación 24 h desde el TCE, luego alta con control por su pediatra en 1–2 días. – Control en Neurocirugía de Sant Pau (correo a el correo del servicio): <2 años, a los 2 meses; >2 años, a los 6 meses (con Rx previa).", "TC normal: alta u observación según la clínica."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Alta: instrucciones escritas de signos de alarma (vómitos repetidos, somnolencia, cefalea progresiva, irritabilidad, focalidad, convulsión).", "Sospecha de maltrato: activar el circuito de protección del menor."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["PECARN (validado en >40.000 niños): en <2 años con riesgo intermedio, la observación frente al TC depende de la experiencia, de si hay varios hallazgos, de la edad <3 meses, del empeoramiento y de la preferencia de los padres. Coincide con el protocolo.", "Reglas comparadas (PECARN, CATCH, CHALICE; Babl, Lancet 2017): PECARN tiene la mayor sensibilidad (≈100 % para la LIC clínicamente importante).", "NICE NG232 (2023): TC en <1 h si hay criterios de riesgo alto. En la anticoagulación, TC en <8 h (en adultos, TC en todo TCE con anticoagulante).", "Marcadores séricos (GFAP y UCH-L1, S100B) para evitar TC en el adulto con TCE leve (aprobados por la FDA; recomendados en la guía escandinava). No validados en pediatría.", "TCE en el adulto: no hay ficha específica en estos protocolos. Para el adulto anticoagulado, ver \"Paciente anticoagulado o antiagregado con traumatismo\". Para el adulto, Canadian CT Head Rule o NICE."]}]}], "sources": "Kuppermann N et al. PECARN prediction rules (Lancet 2009); Babl FE et al. Accuracy of PECARN, CATCH, CHALICE (Lancet 2017); NICE NG232 Head injury: assessment and early management (2023).", "cats": ["neuro", "pedi"], "vital": false}, {"title": "Tromboembolismo pulmonar (TEP)", "page": 144, "protocol": "PROTOCOLO DE MANEJO DEL TROMBOEMBOLISMO PULMONAR", "service": "", "date": "act. 2022; basado en ESC 2019", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Disnea nueva o que empeora, dolor torácico pleurítico, síncope, hipotensión, taquicardia o desaturación sin otra explicación (Rx de tórax, ECG y GSA no la aclaran).", "Factores de riesgo mayores (OR >10): – Fractura de EEII, prótesis de cadera o rodilla, traumatismo grave, lesión medular. – Ingreso por IC o FA en los últimos 3 meses, IAM en los últimos 3 meses. – ETV previa.", "Factores moderados: cáncer, quimioterapia, ACO o THS, puerperio, catéter central, infección, EII, ictus parético, trombofilia, FIV.", "TEP de ALTO riesgo = inestabilidad: – Parada. – Shock obstructivo: TAS <90 o vasopresores + hipoperfusión. – Hipotensión persistente: TAS <90 o caída ≥40 mmHg durante >15 min, no debida a arritmia, hipovolemia ni sepsis."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["SCA, disección, neumotórax, taponamiento, neumonía, IC.", "Contraindicaciones de la fibrinólisis, si va a hacer falta: – Absolutas: ictus hemorrágico o de origen desconocido, ictus isquémico en los últimos 6 meses, neoplasia del SNC, trauma, cirugía o TCE en las últimas 3 semanas, diátesis hemorrágica, sangrado activo. – Relativas: AIT en los últimos 6 meses, ACO, embarazo o 1.ª semana de puerperio, punciones no compresibles, RCP traumática, TAS >180, hepatopatía avanzada, endocarditis, úlcera activa."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "h", "text": "Paciente inestable"}, {"type": "list", "items": ["Ecocardiograma a pie de cama: – Sin disfunción del VD → buscar otra causa. – Con disfunción del VD → angio-TC si se puede hacer ya. Si no, tratar como TEP de alto riesgo."]}, {"type": "h", "text": "Paciente estable"}, {"type": "list", "items": ["Wells (probabilidad clínica): – Baja o intermedia → dímero D: – Normal (<500 µg/L, o <edad × 10 en >50 años) → descarta. – Alto → angio-TC. – Alta → angio-TC directo (sin dímero D).", "No ajustar el dímero D por la edad en el cáncer ni en la IR.", "Embarazo: algoritmo YEARS + eco Doppler de EEII primero. Gammagrafía de perfusión si la Rx es normal.", "Angio-TC negativo con probabilidad alta: eco Doppler de EEII (o gammagrafía V/Q).", "Gammagrafía V/Q: si hay alergia al contraste, IR o embarazo."]}, {"type": "h", "text": "Estratificación tras el diagnóstico"}, {"type": "list", "items": ["PESIs, troponina, NT-proBNP, lactato, función renal.", "VD en el angio-TC o la eco (VD/VI >1).", "Clases de riesgo: – Bajo: PESIs 0, sin disfunción del VD. – Intermedio-bajo: PESIs ≥1 con, como mucho, un marcador positivo (VD o troponina). – Intermedio-alto: VD dilatado + troponina positiva. – Alto: inestable."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Inicio"}, {"type": "list", "items": ["Anticoagular YA ante una sospecha intermedia o alta, antes de la confirmación (si no hay contraindicación)."]}, {"type": "h", "text": "Anticoagulación (riesgo bajo o intermedio)"}, {"type": "list", "items": ["ACOD de elección frente a AVK: – Apixabán 10 mg/12 h × 7 días → 5 mg/12 h. – Rivaroxabán 15 mg/12 h × 21 días → 20 mg/24 h (valorar 15 mg/24 h si el aclaramiento es de 15–49 y el riesgo de sangrado es alto). – Edoxabán 60 mg/24 h tras ≥5 días de heparina (30 mg si el aclaramiento es de 15–50, pesa <60 kg o toma inhibidores de la gp-P). – Dabigatrán 150 mg/12 h tras ≥5 días de heparina (110 mg/12 h si tiene >80 años, toma verapamilo o el riesgo de sangrado es alto).", "No usar ACOD en el SAF triple positivo, el embarazo o la lactancia ni la IR grave.", "HBPM: enoxaparina 1 mg/kg/12 h (o 1,5 mg/kg/24 h). Ajustar en la IR grave.", "AVK: solapar con la heparina ≥5 días y hasta INR 2–3 dos días seguidos. Sin dosis de carga.", "Fondaparinux por peso (obesidad, trombopenia, anticuerpos antiheparina).", "HNF IV (bolo de 80 UI/kg + 18 UI/kg/h, TTPa ×1,5–2,5) si se plantea reperfusión, el riesgo de sangrado es alto o la IR es grave.", "Riesgo hemorrágico: escala RIETE.", "Movilización precoz en el riesgo bajo. Reposo los primeros días en el intermedio."]}, {"type": "h", "text": "TEP de alto riesgo (inestable)"}, {"type": "list", "items": ["HNF + fibrinólisis sistémica a dosis completa: – Alteplasa (rtPA) 100 mg en 2 h. – En la parada: 0,6 mg/kg en 15 min (máximo 50 mg). – Riesgo de sangrado: escala BACS.", "Soporte del VD: – Fluidos ≤500 mL en 15–20 min solo si la PVC es baja. – Noradrenalina 0,2–1 µg/kg/min, dobutamina 2–20 µg/kg/min. – Evitar la IOT si es posible (colapso).", "Trombectomía mecánica o fibrinólisis intraarterial (Hemodinámica) si la fibrinólisis está contraindicada o fracasa, o hay trombo central.", "Intermedio-alto: anticoagular con monitorización. Reperfusión de rescate si se deteriora. Valorar el tratamiento endovascular en <36–48 h si hay trombo central."]}, {"type": "h", "text": "Otros"}, {"type": "list", "items": ["Filtro de cava (recuperable) so y for VTE (2021, update 2024).", "cats": ["cardio", "resp"], "vital": true}, {"title": "Tumores del SNC (gliomas y meningiomas): resumen del protocolo de Oncología Radioterápica", "page": 146, "protocol": "TUMORS SISTEMA NERVIÓS CENTRAL (PC1.2-D2)", "service": "Oncología Radioterápica", "date": "v4, ene 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["En urgencias: cefalea progresiva (matutina, con vómitos), crisis de nueva aparición, focalidad subaguda, cambio de conducta o cognitivo, signos de HTIC (papiledema).", "Clasificación molecular (OMS 2021): – Glioblastoma: IDH wild-type (grado 4). – Astrocitoma IDH mutado (grados 2–4). – Oligodendroglioma: IDH mutado + codeleción 1p/19q. – Metilación de MGMT: mejor respuesta a la temozolomida. – Si no hay estudio molecular: añadir \"NOS\".", "Pronóstico: edad, *performance status* (PS) posquirúrgico, grado de resección (RTOG)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Diagnóstico diferencial en urgencias: absceso, metástasis (lo más frecuente en el adulto), linfoma primario (no dar corticoides antes de la biopsia si se sospecha), ictus o hemorragia, desmielinizante.", "Complicaciones agudas: HTIC o herniación, estatus epiléptico, hemorragia intratumoral, hidrocefalia, TEP o TVP (riesgo alto)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["TC craneal urgente (y RM con gadolinio preferente).", "Analítica, coagulación (antes de una posible cirugía).", "Neurocirugía (y comité de neurooncología)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Glioblastoma o astrocitoma anaplásico (alto grado)"}, {"type": "list", "items": ["<65–70 años: cirugía (resección máxima) + RT 60 Gy en 30 fracciones (2 Gy) + temozolomida (TMZ) concomitante y adyuvante. – TMZ concomitante 75 mg/m²/día (incluidos los fines de semana). – Profilaxis de *Pneumocystis cotrimoxazol forte en ", "Antiepilépticos solo si ha habido crisis (no profilácticos). Levetiracetam de elección (EANO y SNO 2021–2023; interacciones mínimas).", "Profilaxis de ETV en el ingresado.", "Vorasidenib (inhibidor de IDH1/2; ensayo INDIGO, NEJM 2023; aprobado por la FDA en 2024 y la EMA en 2025) en el glioma de grado 2 IDH mutado tras la cirugía, para retrasar la RT o la QT.", "OMS CNS5 (2021): el \"astrocitoma anaplásico IDH wild-type\" con criterios moleculares (TERT, EGFR, +7/−10) se reclasifica como glioblastoma.", "Glioblastoma en >70 años con MGMT metilado: RT corta (40 Gy en 15 fracciones) + TMZ (Perry, NEJM 2017). Coincide."]}]}], "sources": "Weller M et al. EANO guidelines on diffuse gliomas of adulthood (Nat Rev Clin Oncol 2021); Louis DN et al. WHO CNS5 classification (Neuro Oncol 2021); Mellinghoff IK et al. INDIGO – Vorasidenib (NEJM 2023); Perry JR et al. Short-course RT plus TMZ in elderly GBM (NEJM 2017).", "cats": ["neuro"], "vital": false}, {"title": "Ventilación mecánica no invasiva (VMNI) y oxigenoterapia de alto flujo (OAF)", "page": 148, "protocol": "PROTOCOLO DE VENTILACIÓN NO INVASIVA EN INSUFICIENCIA RESPIRATORIA AGUDA", "service": "Neumología", "date": "v1, 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Indicación clínica: – Taquipnea (>24 rpm en el obstructivo, >30 en el restrictivo). – Trabajo respiratorio (musculatura accesoria, respiración paradójica).", "Indicación gasométrica: – Hipercapnia aguda o crónica agudizada con acidosis: PaCO₂ >45 y pH <7,35 tras optimizar el tratamiento médico (la mejor indicación).", "Evidencia 1A: EPOC agudizada y EAP cardiogénico (CPAP o BiPAP).", "Evidencia 2B: restrictivos (caja torácica, neuromuscular, obesidad-hipoventilación), *weaning* de la VM invasiva, posoperatorio de cirugía torácica.", "Sin evidencia (solo en UCI y vigilado): asma, neumonía hipoxémica grave, SDRA, trauma torácico, posoperatorio abdominal.", "No indicada: fallo respiratorio ya establecido tras la extubación; prevención de la acidosis en la EPOC (sin acidosis)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Contraindicaciones absolutas: parada inminente, imposibilidad de ajustar la mascarilla (trauma facial).", "Contraindicaciones relativas: – Inestabilidad (shock, isquemia, arritmia, HDA grave). – Bajo nivel de conciencia, agitación grave. – No protege la vía aérea, secreciones abundantes. – Cirugía reciente de la vía aérea o del tracto GI alto.", "No retrasar la IOT si está indicada."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Gasometría arterial basal y a la 1–2 h de VMNI. SatO₂ continua. FR y constantes.", "Predictores de fracaso: – pH <7,25 basal o a la hora. – PaCO₂ >75 a las 2 h. – PaO₂/FiO₂ <150 (SDRA o neumonía). – >80 años, APACHE, SOFA o SAPS altos, Vt elevado.", "Momento del fracaso: inmediato (<1 h, 15 %), precoz (1–48 h, 65 %), tardío (>48 h)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Interfaz"}, {"type": "list", "items": ["Oronasal (de elección en la fase aguda; tallas S, M o L con medidor; pack Respironics® con tubuladura de rama única con fuga espiratoria y filtro).", "Nasal si hay muchas secreciones. Full-face si se prolonga.", "Ventiladores: Trilogy EVO, V60."]}, {"type": "h", "text": "Modo presión soporte (BiPAP)"}, {"type": "list", "items": ["Inicio: EPAP 4 + IPAP 8–12 cmH₂O. Subir de forma progresiva hasta FR <25 y Vt 8–10 mL/kg de peso ideal.", "Habitual: IPAP 16–24, EPAP 4–8. PS mínima de ≈10. EPAP ≥4 (evita la reinhalación).", "FR de seguridad 12–16 (más alta si hay bajo nivel de conciencia o apneas).", "*Rise time* 1–2** (el más rápido que tolere", "FiO₂ para una SatO₂ del 88–92 % si hay hipercapnia."]}, {"type": "h", "text": "Según la patología"}, {"type": "list", "items": ["EPOC: – EPAP 5–8 (no >8) para compensar la auto-PEEP. – IPAP suficiente sin hiperinsuflar, ***rise time* corto** y Ti corto. – Controlar las fugas (>40 L/min en total o >20 L/min de mascarilla prolongan el Ti; valorar presión control).", "EAP: CPAP de 5 → 10 cmH₂O de primera línea. BiPAP si hay hipercapnia o acidosis.", "Obesidad-hipoventilación: IPAP >20, EPAP 8–10 (si usa CPAP en casa, EPAP 1–2 cmH₂O menos que su presión). Valorar AVAPS (volumen asegurado)."]}, {"type": "h", "text": "OAF (hipoxémica)"}, {"type": "list", "items": ["50–60 L/min, 34–37 °C. FiO₂ para una SatO₂ del 88–92 % (EPOC) o del 94–98 % (resto).", "Índice ROX = (SatO₂/FiO₂)/FR: – Predice fracaso si es <3 a la hora, <3,5 a las 6 h o <4 a las 12 h. – >4,8: mantener."]}, {"type": "h", "text": "Retirada"}, {"type": "list", "items": ["Criterios: FR <25, FC 50–120, TAS >90, pH >7,35, SatO₂ >90 % con FiO₂ <40 %, PaCO₂ un 10 % más baja.", "Si se mantienen 2–4 h desconectado y se ha corregido la causa → retirar."]}, {"type": "h", "text": "Complicaciones"}, {"type": "list", "items": ["Úlcera nasal (5–20 %): talla correcta, no apretar en exceso, apósito hidrocoloide, rotar interfaces.", "Sequedad, aerofagia, vómitos."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Fracaso o predictores de fracaso: UCI e IOT sin demora.", "Indicaciones sin evidencia (asma, neumonía, SDRA): solo en UCI."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Guía ERS/ATS 2017 (con la actualización ERS de 2023 sobre la insuficiencia respiratoria hipoxémica):", "OAF preferida a la VMNI en la insuficiencia respiratoria hipoxémica de novo (neumonía), por su menor mortalidad (FLORALI).", "VMNI preventiva tras la extubación en el paciente hipercápnico.", "OAF tras la extubación en el riesgo bajo.", "Casco (*helmet*) en la hipoxémica** (ensayos HENIVOT y otros, 2021–2023): alternativa en UCI con experienci", "COVID y SDRA: CPAP, OAF o *helmet* con vigilancia estrecha. IOT precoz si no hay respuesta (no retrasarla).", "EPOC hipercápnica estab const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
P.forEach(p=>{

    p.secText[s.key] = (p.secText[s.key]||'') + ' ' + t;
  });
  p.nTitle = norm(p.title+' '+p.protocol);
  p.nSec = Object.fromEntries(Object.entries(p.secText).map(([k,v])=>[k,norm(v)]));

const DOSE = /(\d+(?:[.,]\d+)?(?:\s?[–-]\s?\d+(?:[.,]\d+)?)?\s?(?:mg|mcg|µg|g|mEq|mmol|mL|ml|UI|U|L|gotas|puff|inh)(?:\/(?:kg|m2|h|min|día|dia|d|\d+\s?h|semana|mL|L|dL))*(?:\/(?:h|min|día|d|\d+\s?h))?)(?![a-zA-Z])/g;
function fmt(text, terms, sc){
  let h = esc(text);
  h = h.replace(DOSE, m=>`<span class="dose" style="background:${sc.bg}">${m}</span>`);
  if(terms && terms.length) h = hl(h, terms);
  return h;
}
// highlight accent-insensitively on already-escaped html, skipping tags
function hl(html, terms){
  const parts = html.split(/(<[^>]+>)/);
  return parts.map(part=>{
    if(part.startsWith('<')) return part;
    const n = norm(part);
    const ranges=[];
    terms.forEach(t=>{ if(t.length<2) return; let i=0; while((i=n.indexOf(t,i))>-1){ranges.push([i,i+t.length]); i+=t.length;} });
    if(!ranges.length) return part;
    ranges.sort((a,b)=>a[0]-b[0]);
    let out='',last=0;
    for(const [a,b] of ranges){ if(a<last) continue; out+=part.slice(last,a)+'<mark>'+part.slice(a,b)+'</mark>'; last=b; }
    return out+part.slice(last);
  }).join('');
}

    <span class="bar" style="background:linear-gradient(${c.map(x=>x.color).join(',')}${c.length===1?','+c[0].color:''})"></span>
    <span class="tx"><div class="t">${p.vital?'<span class="pill vital">CRÍTICO</span>':''}${query?hl(esc(p.title),terms()):esc(p.title)}</div>
    <div class="m">${c.map(x=>x.em).join(' ')} ${esc(p.service||'')}${p.date?' · '+esc(p.date):''}</div>${snip||''}</span>
    <span class="star" data-fav="${p.id}">${favs.has(p.id)?'⭐':'☆'}</span></button>`;
}
function terms(){ return norm(query).split(/\s+/).filter(Boolean); }

function filtered(){
  let arr = P;
  if(activeCat) arr = arr.filter(p=>p.cats.includes(activeCat));
  if(view==='vital') arr = arr.filter(p=>p.vital);
  if(view==='fav') arr = arr.filter(p=>favs.has(p.id));
  return arr;
}

function search(){
  const ts = terms();
  const res=[];
  for(const p of filtered()){
    let score=0, hits=[];
    const okAll = ts.every(t=>{
      const inT = p.nTitle.includes(t);
      let inS=false;
      if(activeSec==='title') return inT;
      for(const [k,v] of Object.entries(p.nSec)){ if(activeSec!=='all'&&k!==activeSec) continue; if(v.includes(t)){inS=true;} }
      if(inT) score+=10; if(inS) score+=1;
      return activeSec==='all' ? (inT||inS) : inS;
    });
    if(!okAll) continue;
    // snippets
    if(activeSec!=='title'){
      for(const s of p.sections){
        if(activeSec!=='all'&&s.key!==activeSec) continue;
        for(const b of s.blocks){
          const items = b.type==='list'?b.items:[b.text];
          for(const it of items){ const n=norm(it); if(ts.every(t=>n.includes(t))||ts.some(t=>n.includes(t))&&hits.length<1){ hits.push([s.key,it, ts.filter(t=>n.includes(t)).length]); } }
        }
      }
      hits.sort((a,b)=>b[2]-a[2]); hits=hits.slice(0,2);
    }
    res.push({p,score,hits});
  }
  res.sort((a,b)=>b.score-a.score||a.p.title.localeCompare(b.p.title,'es'));
  return res;
}
function snippet(key,txt){
  const ts=terms(); const n=norm(txt); let i=Math.min(...ts.map(t=>{const x=n.indexOf(t);return x<0?1e9:x}));
  if(i===1e9) i=0;
  let a=Math.max(0,i-60), b=Math.min(txt.length,i+120);
  let s=(a>0?'…':'')+txt.slice(a,b)+(b<txt.length?'…':'');
  return `<div class="snip"><i style="background:${SEC[key].c}">${SECSHORT[key]||''}</i>${hl(esc(s),ts)}</div>`;
}

function render(){
  $('secFilter').classList.toggle('hidden', !query);
  if(query){
    const r=search();
    main.innerHTML = `<h2 class="sec">${r.length} resultado${r.length===1?'':'s'}${activeCat?' en '+CATMAP[activeCat].name:''}</h2>` +
      (r.length? `<div class="list">${r.map(({p,hits})=>itemHTML(p, hits.map(h=>snippet(h[0],h[1])).join(''))).join('')}</div>`
       : `<div class="empty">😕 Sin resultados.<br>Prueba con otra palabra o quita el filtro.</div>`);
    return;
  }
  if(view==='home' && !activeCat){
    const rec = recents.map(i=>P[i]).filter(Boolean).slice(0,5);
    const fv = P.filter(p=>favs.has(p.id)).slice(0,6);
    main.innerHTML = `
      <div class="banner">⚠️ Síntesis de protocolos de Urgencias para la guardia. Verifica siempre las dosis y pautas con el protocolo vigente de tu centro.</div>
      ${rec.length?`<h2 class="sec">🕘 Consultados hace poco</h2><div class="list">${rec.map(p=>itemHTML(p)).join('')}</div>`:''}
      ${fv.length?`<h2 class="sec">⭐ Favoritos</h2><div class="list">${fv.map(p=>itemHTML(p)).join('')}</div>`:''}
      <h2 class="sec">📚 Por especialidad</h2>
      <div class="grid">${CATS.map(c=>{const n=P.filter(p=>p.cats.includes(c.id)).length;
        return `<button class="cat" data-cat="${c.id}" style="background:linear-gradient(140deg,${c.color},${c.color}bb)"><span class="em">${c.em}</span><b>${c.name}</b><span>${n} protocolos</span></button>`}).join('')}</div>
      <h2 class="sec">🚨 Críticos (tiempo-dependientes)</h2>
      <div class="list">${P.filter(p=>p.vital).map(p=>itemHTML(p)).join('')}</div>`;
    return;
  }
  const arr = filtered();
  let head = '';
  if(view==='fav') head = `<h2 class="sec">⭐ Favoritos${activeCat?' · '+CATMAP[activeCat].name:''}</h2>`;
  else if(view==='vital') head = `<h2 class="sec">🚨 Críticos${activeCat?' · '+CATMAP[activeCat].name:''}</h2>`;
  else head = `<h2 class="sec">${activeCat?CATMAP[activeCat].em+' '+CATMAP[activeCat].name:'🔤 Todos'} · ${arr.length}</h2>`;
  if(!arr.length){ main.innerHTML = head + `<div class="empty">${view==='fav'?'Toca ☆ en cualquier protocolo para guardarlo aquí.':'Nada en este filtro.'}</div>`; return; }
  let html='', L='';
  arr.slice().sort((a,b)=>a.title.localeCompare(b.title,'es')).forEach(p=>{
    const l = norm(p.title[0]).toUpperCase();
    if(l!==L && view==='az'){ html+=`<div class="letter">${l}</div>`; L=l; }
    html+=itemHTML(p);
  });
  main.innerHTML = head + `<div class="list">${html}</div>`;
}

main.onclick=e=>{
  const st=e.target.closest('[data-fav]'); if(st){ e.stopPropagation(); toggleFav(+st.dataset.fav); return; }
  const it=e.target.closest('.item'); if(it){ openP(+it.dataset.id); return; }
  const ct=e.target.closest('.cat'); if(ct){ activeCat=ct.dataset.cat; setView('az',true); renderCatChips(); render(); window.scrollTo({top:0}); }
};
function toggleFav(id){
  favs.has(id)?favs.delete(id):favs.add(id); store.set('favs',[...favs]);
  toast(favs.has(id)?'⭐ Añadido a favoritos':'Quitado de favoritos');
  render(); if(!$('detail').classList.contains('hidden')) { const b=$('dfav'); if(b) b.textContent=favs.has(id)?'⭐':'☆'; }
}
function setView(v,keep){ view=v; document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); if(!keep&&v==='home') activeCat=null; }
document.querySelector('.nav').onclick=e=>{const b=e.target.closest('button'); if(!b) return; closeP(); setView(b.dataset.v); if(b.dataset.v==='home'){activeCat=null;} renderCatChips(); render(); window.scrollTo({top:0});};

let qt;
$('q').oninput=e=>{ clearTimeout(qt); qt=setTimeout(()=>{ query=e.target.value.trim(); $('qx').classList.toggle('hidden',!query); render(); },120); };
$('qx').onclick=()=>{ $('q').value=''; query=''; $('qx').classList.add('hidden'); render(); $('q').focus(); };

// ---------- detail ----------
function openP(id, noHash){
  const p=P[id]; if(!p) return;
  recents=[id,...recents.filter(x=>x!==id)].slice(0,8); store.set('recents',recents);
  const ts = query?terms():[];
  const c=p.cats.map(x=>CATMAP[x]);
  const keys=[...new Set(p.sections.map(s=>s.key))];
  let h=`<div class="dhead" style="background:linear-gradient(140deg,${c[0].color},${(c[1]||c[0]).color}cc)">
    <div class="dtop"><button class="iconbtn" id="dback" aria-label="Volver">←</button><div class="sp"></div>
    <button class="iconbtn" id="dexp" aria-label="Plegar o desplegar todo">⇅</button>
    <button class="iconbtn" id="dfav" aria-label="Favorito">${favs.has(id)?'⭐':'☆'}</button></div>
    <h1>${p.vital?'<span class="pill vital" style="font-size:12px">CRÍTICO</span><br>':''}${esc(p.title)}</h1>
    <div class="meta">📄 ${esc(p.protocol)}${p.service?' · '+esc(p.service):''}${p.date?' · '+esc(p.date):''} · pág. ${p.page}</div>
    <div class="cats">${c.map(x=>`<span>${x.em} ${x.name}</span>`).join('')}</div></div>
    <div class="tabs">${keys.map(k=>`<button class="tab" style="background:${SEC[k].c}" data-go="${k}">${SEC[k].e} ${SECSHORT[k]||SEC[k].n}</button>`).join('')}</div>
    <div class="dbody">`;
  p.sections.forEach((s,si)=>{
    const sc=SEC[s.key];
    h+=`<div class="box" id="s-${s.key}-${si}" data-k="${s.key}"><button class="bh" style="background:${sc.c}">${sc.e} ${esc(s.label||sc.n)}<span class="chev">▾</span></button><div class="bb">`;
    s.blocks.forEach(b=>{
      if(b.type==='list') h+=`<ul>${b.items.map(it=>`<li style="--m:${sc.c}">${fmt(it,ts,sc)}</li>`).join('')}</ul>`;
      else h+=`<h4 style="background:${sc.bg};color:inherit;border-left:5px solid ${sc.c}">${fmt(b.text,ts,sc)}</h4>`;
    });
    h+=`</div></div>`;
  });
  if(p.sources) h+=`<div class="box closed"><button class="bh" style="background:#64748b">📚 FUENTES<span class="chev">▾</span></button><div class="bb"><div class="src">${esc(p.sources)}</div></div></div>`;
  h+=`<button class="copybtn" id="dcopy">📋 Copiar el protocolo como texto</button>
    <div class="disc">Verificar siempre con el protocolo vigente.</div></div>`;
  const d=$('detail'); d.innerHTML=h; d.classList.remove('hidden'); d.scrollTop=0;
  document.body.style.overflow='hidden';
  d.querySelectorAll('li').forEach(li=>li.style.setProperty('color','inherit'));
  $('dback').onclick=()=>{ if(location.hash) history.back(); else closeP(); };
  $('dfav').onclick=()=>toggleFav(id);
  $('dexp').onclick=()=>{ const boxes=[...d.querySelectorAll('.box')]; const anyOpen=boxes.some(b=>!b.classList.contains('closed')); boxes.forEach(b=>b.classList.toggle('closed',anyOpen)); };
  $('dcopy').onclick=()=>copyP(p);
  d.querySelectorAll('.bh').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('closed'));
  d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ const el=d.querySelector(`.box[data-k="${b.dataset.go}"]`); el.classList.remove('closed'); el.scrollIntoView({behavior:'smooth',block:'start'}); });
  if(ts.length){ const m=d.querySelector('mark'); if(m) setTimeout(()=>m.scrollIntoView({block:'center'}),60); }
  if(!noHash && location.hash!=='#p'+id) try{ history.pushState(null,'','#p'+id);}catch(e){ location.hash='p'+id; }
}
function closeP(){ $('detail').classList.add('hidden'); document.body.style.overflow=''; render(); }
function copyP(p){
  let t=p.title+'\n'+p.protocol+(p.service?' – '+p.service:'')+'\n';
  p.sections.forEach(s=>{ t+='\n'+(s.label||SEC[s.key].n)+'\n'; s.blocks.forEach(b=>{ if(b.type==='list') b.items.forEach(i=>t+='• '+i+'\n'); else t+=b.text+'\n'; }); });
  try{ navigator.clipboard.writeText(t).then(()=>toast('📋 Copiado'),()=>toast('No se pudo copiar')); }catch(e){ toast('No se pudo copiar'); }
}
function route(){
  const m=location.hash.match(/^#p(\d+)$/);
  if(m) openP(+m[1],true); else if(!$('detail').classList.contains('hidden')) closeP();
}
window.addEventListener('hashchange',route);
window.addEventListener('popstate',route);

// ---------- settings sheet ----------
$('btnInfo').onclick=()=>{
  const s=document.createElement('div'); s.className='sheet';
  s.innerHTML=`<div class="in"><h3>Tamaño de letra</h3>
  <div class="fsrow">${[14,16,18,20].map(v=>`<button data-fs="${v}" class="${v===fs?'on':''}" style="font-size:${v}px">A</button>`).join('')}</div>
  <h3 style="margin-top:16px">Código de colores</h3>
  <div class="legend">${Object.entries(SECSHORT).map(([k,n])=>`<span style="background:${SEC[k].c}">${SEC[k].e} ${SEC[k].n}</span>`).join('')}</div>
  <p>Las dosis aparecen resaltadas. El recuadro amarillo (▲) indica dónde difiere la literatura actual del protocolo.</p>
  <h3 style="margin-top:16px">Instalar como app</h3>
  <ul><li><b>iPhone (Safari):</b> botón Compartir → «Añadir a pantalla de inicio».</li>
  <li><b>Android (Chrome):</b> menú ⋮ → «Añadir a pantalla de inicio» / «Instalar app».</li></ul>
  <p style="color:var(--muted);font-size:13px">Síntesis de ${P.length} protocolos de Urgencias. Herramienta de consulta; no sustituye al protocolo oficial vigente ni al juicio clínico.</p>
  <button class="copybtn" id="closeSheet">Cerrar</button></div>`;
  document.body.appendChild(s);
  s.onclick=e=>{ if(e.target===s||e.target.id==='closeSheet') s.remove();
    const b=e.target.closest('[data-fs]'); if(b){ fs=+b.dataset.fs; store.set('fs',fs); document.documentElement.style.setProperty('--fs',fs+'px'); s.querySelectorAll('[data-fs]').forEach(x=>x.classList.toggle('on',+x.dataset.fs===fs)); } };
};
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1400); }

renderCatChips(); renderSecChips(); render(); route();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
