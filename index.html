l bicarbonato. Mg solo si hay síntomas: sulfato de Mg 15% 0,25 mL/kg/6 h."]}, {"type": "h", "text": "Fase 6 · Resolución y paso a insulina SC"}, {"type": "list", "items": ["Criterios de resolución: pH >7,29, HCO3 >18, β-hidroxibutirato <1 mmol/L (guiarse por la cetonemia, no por la cetonuria) y tolerancia oral.", "Poner la insulina SC 15–30 min antes de parar la bomba si es lispro o aspart (1–2 h antes si es Actrapid), mejor antes de una comida. La glargina se empieza al parar la bomba.", "Debut: 0,75 UI/kg/día (prepúber) a 1 UI/kg/día (púber). En ≥2 años: 60% en rápida repartida en las comidas + 40% en glargina. En <2 años: 2 dosis de regular + NPH. Si ya era diabético: su pauta habitual.", "Si se resuelve de noche: SG 10% + Na 50–70 + K 20–40 mEq/L, bomba a 0,04 UI/kg/h, y empezar la SC con el desayuno."]}, {"type": "h", "text": "EDEMA CEREBRAL (0,5–1%; SOBRE TODO ENTRE LAS 4 Y LAS 24 H)"}, {"type": "list", "items": ["Factores de riesgo: <5 años, debut, pCO2 <21, acidosis grave, haber puesto bicarbonato, Na que no sube, urea >20.", "Sospechar: cefalea, bradicardia, HTA, empeoramiento neurológico, afectación de pares craneales, desaturación.", "Tratar sin esperar al TC: SSH 3% 5 mL/kg (máx. 250 mL) en 10–15 min o manitol 20% 0,5–1 g/kg (2,5–5 mL/kg) en 20–30 min. Cabecera a 30°, bajar el ritmo de líquidos 1/3, IOT si hace falta (pCO2 >27). Traslado a UCIP. Tener el SSH o el manitol preparados junto a la cama."]}]}, {"key": "destino", "label": "INGRESO EN UCIP", "blocks": [{"type": "list", "items": ["Obligado: pH <7,0, compromiso neurológico o compromiso cardiocirculatorio.", "Conveniente: CAD grave, <2 años, glucemia >1000, alteraciones electrolíticas graves."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["ISPAD 2022: las cifras coinciden (insulina 0,05–0,1 UI/kg/h al menos 1 h después de los líquidos; bolos en 20–30 min; reponer el déficit en 24–48 h). La ISPAD admite SF 0,45–0,9% o soluciones balanceadas (Ringer, Plasma-Lyte) desde el inicio.", "Ensayo PECARN FLUID (NEJM 2018): ni el ritmo de rehidratación ni la concentración de Na (0,45% vs 0,9%) cambiaron el daño cerebral. Esto respalda el esquema del protocolo.", "Cristaloides balanceados: en adultos resuelven la CAD antes (análisis secundario de SMART, 2020). En niños no hay beneficio claro, aunque producen menos acidosis hiperclorémica.", "Edema cerebral: la ISPAD considera el manitol y el SSH igual de válidos. Algunos estudios retrospectivos asocian el SSH a más mortalidad, así que no hay motivo para preferirlo sobre el manitol.", "Adolescentes ≥16–18 años o adultos: usar el consenso ADA/EASD/JBDS/AACE 2024. Define la CAD con cetonemia ≥3,0 mmol/L y glucemia ≥200 mg/dL o diabetes conocida, porque existe la CAD euglucémica con iSGLT2."]}]}], "sources": "Glaser N et al. ISPAD Clinical Practice Consensus Guidelines 2022: DKA and HHS (Pediatr Diabetes 2022); Kuppermann N et al. PECARN FLUID (N Engl J Med 2018); Umpierrez GE et al. Hyperglycemic crises in adults with diabetes: consensus report (Diabetes Care 2024).", "cats": ["endo", "pedi"], "vital": true}, {"title": "Cólico nefrítico", "page": 25, "protocol": "CÓLICO NEFRÍTICO", "service": "Urgencias/Urología", "date": "rev. sep 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Dolor lumbar brusco y paroxístico (crisis de 20–60 min) que irradia a flanco, ingle, testículo o labio mayor. Paciente inquieto. Náuseas o vómitos. Puñopercusión +. Hematuria en el 90% (que no haya hematuria no lo descarta).", "Signos de alarma = cólico COMPLICADO: sepsis, fiebre >38 °C, monorreno, anuria, hidronefrosis moderada-grave.", "Resistente: dolor >12 h a pesar de tratamiento correcto. Recidivante: reaparece a pesar del tratamiento."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Aneurisma de aorta abdominal fisurado (>50 años, vasculópata), apendicitis o diverticulitis, cólico biliar, neumonía basal, patología de columna, torsión testicular, orquiepididimitis, salpingitis o ectópico.", "Pielonefritis obstructiva: fiebre + obstrucción = emergencia."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Tira o sedimento de orina (Gram si ≥20–50 leucocitos/campo).", "Analítica (función renal, iones, hemograma) si hay fiebre, anuria, vómitos importantes o hace falta tratamiento IV.", "Rx de abdomen no rutinaria (sí si se queda en observación, para el seguimiento).", "Ecografía urgente si: sepsis o signos de alarma, masa abdominal, trasplantado renal, embarazada, monorreno, cirugía previa, cólico resistente, dudas diagnósticas.", "TC sin contraste de baja dosis si la ecografía no es concluyente o antes de instrumentar (TC estándar si IMC >30)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Escalón 1"}, {"type": "list", "items": ["Diclofenaco 75 mg IM o dexketoprofeno 50 mg IM o metamizol 2 g IM (si hay úlcus o alergia a AINE). ~90% ceden en 20 min.", "± diazepam 5–10 mg VO/SL/IM si hay agitación. ± antiemético (metoclopramida u ondansetrón)."]}, {"type": "h", "text": "Escalón 2 · 30 min sin ceder"}, {"type": "list", "items": ["Cloruro mórfico 0,05 mg/kg SC."]}, {"type": "h", "text": "Escalón 3 · 30 min más sin ceder (mantener 12 h)"}, {"type": "list", "items": ["Dieta absoluta + SF 500 mL/8 h.", "Metamizol 2 g/8 h IV (en 100 mL en 20 min) alternando cada 4 h con dexketoprofeno 50 mg/8 h IV (paracetamol 1 g/6 h si hay alergia a AINE).", "Morfina 0,05 mg/kg/4 h IV de rescate.", "Dexketoprofeno IV: ClCr 50–80 → 50 mg/24 h. Contraindicado si ClCr <50."]}, {"type": "h", "text": "Avisar a Urología si"}, {"type": "list", "items": ["Signos de alarma, dolor >12 h a pesar del tratamiento, hematuria con coágulos, cirugía urológica o litotricia reciente, cólico recidivante, embarazo.", "Sepsis → protocolo de sepsis + ecografía. Si hay obstrucción → Urología para derivar la vía urinaria."]}, {"type": "h", "text": "ALTA"}, {"type": "list", "items": ["Si el dolor cede y no hay pielonefritis obstructiva ni insuficiencia renal.", "Analgesia pautada 2–3 días: metamizol 2 g/8 h VO + diclofenaco 50 mg/8 h (o dexketoprofeno 25 mg/8 h), alternos cada 4 h. Pantoprazol 40 mg mientras tome AINE. Tramadol 50–100 mg/8 h de rescate.", "Tamsulosina 0,4 mg por la noche, 3–4 semanas o hasta expulsar el cálculo (litiasis ureteral <10 mm). Ondansetrón 4 mg/8 h si tiene náuseas. Beber normal (forzar líquidos solo fuera de las crisis) y calor local.", "Sin antibiótico profiláctico. Control por el médico de familia. Volver si hay fiebre, dolor que no cede o anuria."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["AINE de 1ª línea (EAU 2024–25; ensayo de Pathan, Lancet 2016: el diclofenaco IM, el paracetamol IV y la morfina IV dieron analgesia similar, con menos rescates con el AINE). El paracetamol IV es una alternativa sin opioide.", "Hidratación IV forzada: sin beneficio (revisión Cochrane). No hace falta como medida analgésica.", "Tamsulosina (terapia expulsiva): el ensayo SUSPEND (Lancet 2015) fue negativo en conjunto, pero metaanálisis posteriores y la EAU 2024 la recomiendan en cálculos de uréter distal >5 mm. En cálculos ≤5 mm aporta poco.", "Imagen: el ensayo STONE (NEJM 2014) mostró que empezar por ecografía a pie de cama es seguro y reduce radiación. El TC de baja dosis es el estándar para confirmar (EAU/ACEP).", "Riñón obstruido e infectado: descompresión urgente (catéter doble J o nefrostomía, son equivalentes) + antibiótico. Nunca la litotricia en la fase aguda (EAU)."]}]}], "sources": "EAU Guidelines on Urolithiasis (2024–2025); Pathan SA et al. (Lancet 2016); Pickard R et al. SUSPEND (Lancet 2015); Smith-Bindman R et al. STONE trial (N Engl J Med 2014).", "cats": ["dolor", "gineuro"], "vital": false}, {"title": "Coma mixedematoso", "page": 26, "protocol": "COMA MIXEDEMATOSO", "service": "Endocrinología", "date": "feb 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["El diagnóstico es CLÍNICO; no esperar a la analítica. Típico en una mujer anciana en invierno. Mortalidad del 30–40%.", "Signos cardinales: alteración de la conciencia + hipotermia (absoluta o relativa; medir la Tª rectal) + bradicardia + desencadenante.", "Además: hiponatremia, hipoglucemia, hipoventilación con hipercapnia, macroglosia, edema facial sin fóvea, derrame pleural o pericárdico, hipoTA, íleo o megacolon, QRS de bajo voltaje, FRA.", "Antecedente de hipotiroidismo, tiroidectomía (cicatriz), I-131 o abandono de la levotiroxina.", "Desencadenantes: infección (a menudo sin fiebre ni taquicardia), frío, fármacos (opioides, sedantes, litio, amiodarona), cirugía, trauma, HDA, IAM, ictus, TEP."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Otras causas de coma, hipotermia por exposición, sepsis, insuficiencia suprarrenal asociada (autoinmune o central)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["TSH, T4L, T3L (tubo rojo, laboratorio central) + ACTH y cortisol basal ANTES del corticoide.", "Glucemia, iones (Na), gasometría (pCO2), función renal, CK, hemograma, cultivos, ECG, Rx de tórax.", "Seguimiento: TSH, T4L y T3L cada 24 h."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Soporte"}, {"type": "list", "items": ["Hipotermia: solo recalentamiento PASIVO (manta). El activo produce vasodilatación y shock.", "Hipoventilación: VMNI o IOT si hace falta (el centro respiratorio puede tardar meses en recuperarse).", "HipoTA: fluidos ± vasopresores hasta que actúe la LT4.", "Hipoglucemia: SG 50% 50 mL.", "Hiponatremia (se comporta como un SIADH): Na >120 → restricción hídrica; Na <120 → NaCl IV (protocolo de hiponatremia)."]}, {"type": "h", "text": "Fase 2 · Corticoide (antes o a la vez que la LT4)"}, {"type": "list", "items": ["HIDROCORTISONA 100 mg/6–8 h IV hasta descartar insuficiencia suprarrenal (la LT4 aumenta el aclaramiento del cortisol)."]}, {"type": "h", "text": "Fase 3 · Hormona tiroidea (solo LT4)"}, {"type": "list", "items": ["Levotiroxina IV 300 mcg en dosis de carga (viales de 500 mcg).", "Desde el 2º día: 50–100 mcg/día IV hasta que tolere VO.", "Riesgo de arritmia o IAM con dosis altas: se asume por la mortalidad del cuadro sin tratar."]}, {"type": "h", "text": "Fase 4 · Causa precipitante"}, {"type": "list", "items": ["Buscar infección activamente (valorar antibiótico empírico), retirar los fármacos desencadenantes. Ingreso en UCI."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["ATA 2014: LT4 IV 200–400 mcg de carga (dosis más bajas si es anciano, pesa poco o tiene cardiopatía) y después 1,6 mcg/kg/día × 0,75 IV. Coincide con el protocolo.", "La ATA sugiere considerar añadir LT3 IV (5–20 mcg de carga y después 2,5–10 mcg/8 h), porque en el coma la conversión periférica de T4 a T3 está reducida. El protocolo usa solo LT4. La evidencia es débil; en España la LT3 IV es de difícil acceso.", "Hidrocortisona antes de la LT4 hasta descartar insuficiencia suprarrenal (ATA y Japan Thyroid Association 2016). Coincide.", "Criterios de la Japan Thyroid Association / escala de Popoveniuc (2014): una puntuación ≥60 apoya el diagnóstico. Útil cuando hay dudas."]}]}], "sources": "Jonklaas J et al. ATA Guidelines for the treatment of hypothyroidism (Thyroid 2014); Popoveniuc G et al. A diagnostic scoring system for myxedema coma (Endocr Pract 2014); Ono Y et al. Japan Thyroid Association criteria (2016).", "cats": ["endo"], "vital": true}, {"title": "Crisis hipertensiva (urgencia y emergencia)", "page": 27, "protocol": "CRISIS HIPERTENSIVA", "service": "Urgencias/Nefrología", "date": "rev. may 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Crisis HTA: PAS ≥180 y/o PAD ≥110. Lo que la define es si hay lesión de órgano diana, no la cifra.", "Urgencia HTA: sin lesión de órgano diana → bajar la PA en 24–48 h por vía oral.", "Emergencia HTA: con lesión aguda de órgano diana: encefalopatía, ictus o HIC, SCA, EAP, disección aórtica, FRA o glomerulonefritis, preeclampsia o eclampsia, feocromocitoma, cocaína o IMAO.", "HTA maligna: PAD >130 + retinopatía grado III–IV."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Falsa crisis (dolor, ansiedad, retención urinaria). Tomar la PA en ambos brazos tras 5–10 min de reposo, con el manguito adecuado.", "Fármacos o tóxicos: AINE, corticoides, ACO, EPO, ciclosporina o tacrolimus, simpaticomiméticos, regaliz, mal cumplimiento.", "Asimetría de pulsos o soplo de IAo → disección."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["HTA de debut o sospecha de lesión de órgano diana: ECG, Rx de tórax, urea, creatinina, iones, hemograma, sedimento y tira de orina.", "Fondo de ojo si PAD ≥120. TC craneal si hay focalidad o bajo nivel de conciencia. Angio-TC toracoabdominal si se sospecha disección. Eco-Doppler renal si se sospecha estenosis de la arteria renal."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Urgencia HTA (sin lesión de órgano diana) · objetivo <160/100 en 24–48 h"}, {"type": "list", "items": ["Reposo 5–10 min. ± diazepam 5 mg si hay ansiedad. Repetir la PA a los 10–15 min.", "HTA conocida que no tomó la medicación → darle la suya. Si la tomaba → subir la dosis o añadir un fármaco.", "Sin tratamiento previo: captopril 25 mg VO → a los 30 min, si sigue alta: amlodipino 5 mg (o nifedipino 20 mg *retard*).", "Si sigue >160/100 a la hora → el protocolo pasa a tratamiento IV (ver la caja de actualización).", "Hemodiálisis crónica: valorar diálisis antes que fármacos (HTA dependiente de volumen)."]}, {"type": "h", "text": "Emergencia HTA · bajar la PA ≤20–25% en los primeros minutos–2 h"}, {"type": "list", "items": ["Monitorizar, O2 si hace falta, vía venosa, tratamiento IV inmediato.", "Nitroprusiato: 50 mg en 250 mL de SG5% (protegido de la luz; cambiarlo cada 4 h). Empezar a 0,5 mcg/kg/min y subir según respuesta hasta un máx. de 10 mcg/kg/min (no más de 10 min a dosis máxima).", "Labetalol: bolo de 20–80 mg en 100 mL de SG en 3–5 min si hace falta bajar la PA rápido.", "Empezar pronto IECA o ARA-II VO + otros fármacos para poder retirar la perfusión.", "Emergencias específicas (ictus, disección, SCA, EAP, preeclampsia): seguir su protocolo.", "HTA maligna: bajar la PAD a 100–105 en 2–6 h (máx. 25%) por vía IV + IECA o ARA-II VO."]}, {"type": "h", "text": "Avisar a Nefrología"}, {"type": "list", "items": ["Emergencia con afectación renal (FRA, microhematuria).", "Antes del alta: HTA de debut en <40 años; HTA en tratamiento con 3 fármacos a dosis adecuadas; gestante; PA >180/110 tras 2 fármacos VO de distinta familia o difícil de controlar con tratamiento IV."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["AHA/ACC 2025: el término \"urgencia HTA\" pasa a llamarse \"HTA grave\" (>180/120 sin lesión aguda de órgano diana). Se trata de forma ambulatoria con fármacos orales. No se recomienda (clase III-daño) bajar la PA de forma aguda con fármacos IV ni VO a demanda en estos pacientes. También ACEP 2025 y ESC 2024 (las dos desaconsejan el descenso rápido en el asintomático).", "Por tanto, pasar a nitroprusiato IV una urgencia HTA solo porque persiste >160/100 no tiene respaldo y puede causar isquemia.", "Nifedipino de acción corta (cápsulas o sublingual): no se recomienda por hipoTA brusca e isquemia (ESC, AHA). Usar solo presentaciones *retard* u otros fármacos.", "Fármacos IV de elección en la emergencia (ESC 2018/2024, ESH 2023): labetalol, nicardipino, clevidipino o urapidilo según el órgano afectado.", "Disección aórtica: esmolol o labetalol primero (FC <60) y después un vasodilatador, con objetivo PAS <120 en 20 min.", "EAP: nitroglicerina. Feocromocitoma o cocaína: fentolamina o urapidilo + BZD, sin betabloqueante solo.", "Nitroprusiato: relegado por la toxicidad por cianuro y el robo coronario. Ya no es de 1ª línea en la ESC."]}]}], "sources": "2025 AHA/ACC High Blood Pressure Guideline (Circulation/Hypertension 2025); ACEP Clinical Policy on asymptomatic elevated BP (Ann Emerg Med 2025); McEvoy JW et al. 2024 ESC Guidelines for elevated BP and hypertension (Eur Heart J 2024); ESC Council on Hypertension position on hypertensive emergencies (Eur Heart J Cardiovasc Pharmacother 2019).", "cats": ["cardio", "gineuro"], "vital": false}, {"title": "Crisis tirotóxica (tormenta tiroidea)", "page": 28, "protocol": "CRISIS TIROTÓXICA", "service": "Endocrinología", "date": "feb 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Diagnóstico CLÍNICO; no esperar a la analítica. Mortalidad del 30–90%. Ocurre en Graves o bocio multinodular tóxico.", "4 signos cardinales: taquicardia y diaforesis desproporcionadas a la fiebre · fiebre >38 °C · clínica digestiva (vómitos, diarrea, ictericia) · clínica neurológica (agitación, psicosis, convulsiones, coma).", "Además: IC o FA rápida, HTA sistólica (si hay hipoTA: pensar en insuficiencia suprarrenal), estado procoagulante, hiperglucemia o hipoglucemia, hipercalcemia, leucocitosis sin infección.", "Desencadenantes: infección, cirugía, trauma, I-131, contraste yodado, amiodarona, litio, retirada de antitiroideos, parto, CAD, IAM, TEP, ictus.", "Escala de probabilidad (Burch-Wartofsky) en el anexo del protocolo."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Sepsis, golpe de calor, simpaticomiméticos (cocaína, anfetaminas), síndrome serotoninérgico o SNM, abstinencia alcohólica, feocromocitoma."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["TSH, T4L, T3L (tubo rojo, laboratorio central) sin esperar el resultado. Cortisol basal.", "Hemograma, glucosa, iones, Ca, perfil hepático, función renal, gasometría con lactato, cultivos, ECG, Rx de tórax. Ecocardiograma si hay IC."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Soporte (UCI o semicríticos)"}, {"type": "list", "items": ["Fiebre: medidas físicas + paracetamol (NO AAS: desplaza las hormonas de las proteínas y sube la fracción libre).", "Fluidos individualizados. Tiamina (algunas guías la recomiendan).", "IC o taquiarritmia: si se usa digoxina, hacen falta dosis mayores."]}, {"type": "h", "text": "Fase 2 · Bloquear la síntesis (elegir uno)"}, {"type": "list", "items": ["PROPILTIOURACILO (de elección en el protocolo; además bloquea la conversión de T4 a T3): 500 mg de carga y después 200 mg/4 h VO o por SNG (comprimidos de 50 mg).", "O metimazol 20–25 mg/6 h VO."]}, {"type": "h", "text": "Fase 3 · Bloquear la liberación (≥1 h DESPUÉS del antitiroideo)"}, {"type": "list", "items": ["Lugol 14 gotas/8 h VO (en IMASIS), o yoduro potásico 5 gotas/6–8 h VO, o yoduro sódico 0,5–1 g en 500 mL de SF cada 8–12 h IV."]}, {"type": "h", "text": "Fase 4 · Bloquear la conversión periférica y los efectos adrenérgicos"}, {"type": "list", "items": ["HIDROCORTISONA 100 mg/6–8 h IV (carga opcional de 300 mg).", "PROPRANOLOL 60–80 mg/4–6 h VO (de elección) o esmolol en bolo de 250–500 mcg/kg y después 50–100 mcg/kg/min IV."]}, {"type": "h", "text": "Fase 5 · Refractaria y causa"}, {"type": "list", "items": ["Refractaria: plasmaféresis, diálisis, colestiramina, tiroidectomía urgente.", "Tratar la causa: infección, retirar la amiodarona, fluidos."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Japan Thyroid Association/JES 2016 y la mayoría de revisiones actuales prefieren el METIMAZOL (60–80 mg/día) por la hepatotoxicidad grave del PTU. El PTU se reserva para el 1er trimestre del embarazo o la alergia al metimazol. La ATA 2016 acepta los dos.", "Betabloqueante en la IC o el shock por tirotoxicosis: el propranolol a dosis altas se ha asociado a colapso cardiovascular. Mejor un β1 selectivo de vida corta (esmolol o landiolol) con monitorización (JTA 2016).", "Escalas diagnósticas: Burch-Wartofsky ≥45 = muy probable. Los criterios de la JTA ayudan cuando hay dudas.", "Tiroidectomía precoz si no mejora en 24–48 h o hay agranulocitosis o hepatotoxicidad (ATA 2016)."]}]}], "sources": "Ross DS et al. 2016 ATA Guidelines for hyperthyroidism and other causes of thyrotoxicosis (Thyroid 2016); Satoh T et al. JTA/JES Guidelines for the management of thyroid storm (Endocr J 2016); Burch HB, Wartofsky L (1993).", "cats": ["endo"], "vital": true}, {"title": "Cuerpo extraño digestivo (ingesta)", "page": 29, "protocol": "PACIENTES CON CUERPO EXTRAÑO", "service": "Protocol d'actuació a Urgències, Digestivo", "date": "mar 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Anamnesis: – Accidental o voluntaria (presos, psiquiatría: varios objetos peligrosos). – Tipo: bolo alimenticio, objeto cortante o punzante, objeto romo (monedas), pila, paquetes de droga. – Tamaño, hora de la ingesta. – Predisposición: ERGE, esofagitis eosinofílica, trastorno motor, estenosis, cirugía previa, cáusticos.", "Sialorrea = obstrucción esofágica completa (riesgo de aspiración)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Compromiso de la vía aérea (disnea, tiraje, estridor) → ORL urgente, broncoscopia o cirugía.", "Perforación (crepitación o enfisema subcutáneo, fiebre, dolor torácico): no hacer endoscopia; TC y Cirugía."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Rx cervical (AP y lateral), de tórax (PA y lateral) y de abdomen.", "TC cervical, torácico o abdominal si se sospecha una complicación (o el objeto no es radiopaco: espinas, huesos)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Esófago"}, {"type": "list", "items": ["Bolo alimenticio sin sialorrea: – Glucagón 1,5–2 mg IV en bolo (o diazepam 5 mg IV lento). – Endoscopia si no se resuelve en 12 h. – \"Resuelto\" = desaparecen los síntomas y bebe agua sin problemas.", "Bolo con sialorrea: endoscopia precoz <6 h (± glucagón).", "Objeto punzante o cortante: endoscopia URGENTE (con sobretubo).", "Objeto romo (monedas): endoscopia precoz (en <6 h si es cervical o medio; hasta 24 h si es distal).", "IOT si el objeto es difícil de agarrar (riesgo de que caiga a la vía aérea).", "Si la endoscopia flexible falla: esofagoscopio rígido (ORL)."]}, {"type": "h", "text": "Estómago"}, {"type": "list", "items": ["Romo pequeño (redondo <2–2,5 cm, una moneda de 2 € mide 2,5 cm; alargado <5–7 cm): – Control radiológico semanal. Endoscopia electiva si no progresa en 3–4 semanas. – Excepción: gastrectomizados o con estenosis pilórica.", "Romo grande: endoscopia en <24 h.", "Punzante o cortante: endoscopia urgente.", "Si pasa el píloro: valorar por Cirugía o control radiológico."]}, {"type": "h", "text": "Situaciones especiales"}, {"type": "list", "items": ["Pila de botón en el esófago: endoscopia URGENTE (<2 h).", "Pila en el estómago: endoscopia precoz o control radiológico (extraer si no progresa en 24–48 h). Si pasa el píloro: laxantes y alta.", "Paquetes de droga (body packer): – Endoscopia CONTRAINDICADA (rotura). – Observación + IBP + laxantes. – Cirugía si no se expulsan en 48 h o hay síntomas de liberación (ver cocaína y opioides).", "Recto: extracción manual. Si son pequeños, intento endoscópico. Cirugía si se sospecha una complicación.", "Niños: valorar el traslado a Sant Joan de Déu."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Digestivo de guardia para la endoscopia urgente (con apoyo de Anestesia).", "Alta tras la resolución, si no hay complicaciones."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Glucagón: sin eficacia demostrada frente a placebo en la impactación alimentaria (revisiones sistemáticas). La ESGE 2016 y la ASGE 2023 no lo recomiendan de rutina, para no retrasar la endoscopia.", "Impactación alimentaria: endoscopia en <24 h aunque no haya sialorrea (ESGE). Biopsias para descartar esofagitis eosinofílica (causa muy frecuente).", "Imanes múltiples o imán + metal: extracción urgente aunque estén en el estómago (riesgo de perforación o fístula).", "Pila de botón en niños: miel 10 mL cada 10 min (>1 año, <12 h desde la ingesta) mientras se espera la endoscopia (NCPC y guías pediátricas de 2023)."]}]}], "sources": "Birk M et al. Removal of foreign bodies in the upper GI tract: ESGE Guideline (Endoscopy 2016); ASGE guideline on management of ingested foreign objects and food bolus impactions (GIE 2023); Arms JL et al. Glucagon for esophageal food impaction: meta-analysis (Am J Emerg Med 2021).", "cats": ["dig"], "vital": false}, {"title": "Déficit de vitamina D (pediatría)", "page": 30, "protocol": "DÉFICIT DE VITAMINA D", "service": "Pediatría", "date": "v2, oct 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Factores de riesgo: poca exposición solar, piel oscura, ropa que cubre, obesidad, lactancia materna exclusiva sin suplemento, dietas de exclusión, prematuridad, déficit materno, malabsorción (celiaquía, FQ, EII), hepatopatía o nefropatía, fármacos (antiepilépticos, corticoides, antirretrovirales, azoles).", "Raquitismo: genu varo o valgo, craneotabes, fontanelas grandes, rosario costal, ensanchamiento metafisario."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["25-OH-vitamina D si hay clínica de raquitismo o familiares con déficit. No de cribado en sanos ni obesos. En factores de riesgo: individualizar.", "Déficit <10–12 ng/mL · insuficiencia 12–20 · suficiencia >20 · intoxicación >100 (con hiperCa, hipercalciuria y PTH suprimida).", "Si hay déficit o raquitismo: Ca, P, FA, PTH ± Rx de muñeca o rodilla."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Prevención"}, {"type": "list", "items": ["<12 meses: 400 UI/día a todos desde la 1ª semana (Deltius 10.000: 2 gotas/día; Vitamina D3 Kern: 6 gotas/día).", "Prematuros: <35 sem 600 UI/día; <28 sem 1000 UI/día (vitamina D3 + Hidropolivit hasta los 6 meses).", ">12 meses con factores de riesgo: 600–1000 UI/día de septiembre a abril (lactancia y adolescencia)."]}, {"type": "h", "text": "Insuficiencia (12–20) sin raquitismo"}, {"type": "list", "items": ["Igual que la profilaxis + dieta + sol 10–15 min/día."]}, {"type": "h", "text": "Déficit (<10–12) sin raquitismo (colecalciferol D3)"}, {"type": "list", "items": ["<12 meses: 2000 UI/día durante 6–12 semanas → mantenimiento 400 UI/día.", ">12 meses: 2000 UI/día durante 6–12 semanas o 25.000 UI/semana × 6 (Deltius 2,5 mL o Videsil 1 mL) → mantenimiento 600–1000 UI/día. (Dosis de choque no indicada en <3 meses.)"]}, {"type": "h", "text": "Raquitismo carencial"}, {"type": "list", "items": ["<3 meses: 2000 UI/día × 12 semanas.", "3–12 meses: 2000 UI/día × 12 semanas o 50.000 UI/mes × 3.", "1–12 años: 3000–6000 UI/día × 12 semanas o 150.000 UI en dosis única (p. ej. Videsil 50.000 cada 14 días × 3).", ">12 años: 6000 UI/día × 12 semanas o 300.000 UI en dosis única (Hidroferol choque 180.000 UI, repetible a las 4–6 semanas).", "Mantenimiento: 400–600 UI/día hasta acabar el crecimiento.", "+ CALCIO 30–75 mg/kg/día de calcio elemento en 3 dosis (máx. 1000–1200 mg/día) durante 1–2 semanas (previene el hueso hambriento) y después ≥500 mg/día con la dieta.", "Control a los 3 meses: Ca, P, FA, PTH, 25-OH-D."]}, {"type": "h", "text": "Derivar a Endocrinología pediátrica"}, {"type": "list", "items": ["Raquitismo (criterios radiológicos + PTH/FA altas + hipoCa o hipoP + clínica) o falta de respuesta."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Endocrine Society 2024 (Demay et al.): recomienda suplementar de forma empírica a niños y adolescentes de 1–18 años (para prevenir raquitismo y quizá infecciones respiratorias). No recomienda medir la 25-OH-D de rutina en población sana.", "La misma guía eliminó los umbrales de \"suficiencia\" (no hay evidencia de un objetivo concreto). Coincide con la prudencia del protocolo.", "Consenso global de raquitismo nutricional 2016: es la referencia de las dosis del protocolo. Las dosis de choque >300.000 UI se desaconsejan por riesgo de hipercalcemia."]}]}], "sources": "Demay MB et al. Vitamin D for the Prevention of Disease: Endocrine Society Guideline (J Clin Endocrinol Metab 2024); Munns CF et al. Global consensus recommendations on nutritional rickets (J Clin Endocrinol Metab 2016).", "cats": ["endo", "pedi"], "vital": false}, {"title": "Delirium (síndrome confusional agudo)", "page": 31, "protocol": "Protocol de prevenció i atenció al malalt amb delirium", "service": "", "date": "v3, ene 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Cambio agudo y fluctuante de la atención y la conciencia + alteración cognitiva (desorientación, memoria, lenguaje) o perceptiva (alucinaciones visuales, ideas delirantes). Empeora al anochecer.", "Tipos: hiperactivo, hipoactivo (letargo, somnolencia: el más infradiagnosticado y de peor pronóstico) o mixto.", "Riesgo: delirium previo, edad avanzada, déficit sensorial, demencia + desencadenante.", "CAM: (1) inicio agudo o curso fluctuante + (2) inatención + (3) pensamiento desorganizado o (4) alteración del nivel de conciencia. En la UCI: RASS → CAM-ICU."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Causa orgánica (siempre): infección (orina, respiratoria), fármacos (anticolinérgicos, BZD, opioides, corticoides), retención urinaria, fecaloma, dolor, deshidratación, hipoxia o hipercapnia, alteraciones iónicas o glucemia, abstinencia de alcohol o BZD, ictus, HSD, meningitis o encefalitis, crisis no convulsivas.", "Demencia (inicio insidioso, atención conservada): si hay dudas, tratar como delirium."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemograma, bioquímica (iones, Ca, glucosa, función renal y hepática), coagulación, gasometría, sedimento de orina, ECG (QT antes de dar antipsicóticos), Rx de tórax ± abdomen.", "Según la clínica: TC craneal (focalidad, trauma, anticoagulado), PL, EEG, niveles de fármacos, cultivos.", "Registrar el delirium en ETI/ETM y en el informe de alta (activa la alerta en ingresos futuros)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Causa + medidas no farmacológicas (en todos)"}, {"type": "list", "items": ["Tratar la infección, los iones y la hipoxia. Retirar o reducir los fármacos deliriógenos.", "Orientación: nombre, fecha, reloj y calendario, objetos familiares, familiar acompañando.", "Gafas y audífonos. Luz de día y oscuridad y silencio por la noche (no interrumpir el sueño). Movilización precoz.", "Hidratación, nutrición, control del dolor, del estreñimiento y de la retención urinaria.", "Evitar sondas, sueros y contenciones innecesarias (\"contención cero\"; antes, contención verbal y ambiental)."]}, {"type": "h", "text": "Fase 2 · Fármacos (solo si hay riesgo para el paciente u otros, agitación o alucinaciones que angustian, o si impide un tratamiento) · tiempo limitado"}, {"type": "list", "items": ["Agitación leve, con VO: RISPERIDONA 0,25 mg/12 h (máx. 2 mg/12 h; dosis habitual 0,5 mg/12 h). Tarda 30–45 min.", "Agitación grave o sin VO: HALOPERIDOL SC (de elección) o IM (vial de 5 mg/mL).", "VO: 10–15 gotas/8 h (1–1,5 mg) + 10 gotas extra cada 2–4 h si hace falta (máx. 10 mg/día). IV solo con monitorización (torsades).", "Parkinson o Lewy: QUETIAPINA 25 mg por la noche (comprimidos de liberación inmediata, no los retard), subiendo 25– 50 mg cada 12–24 h (máx. 400 mg/día). Alternativas: olanzapina 2,5 mg o aripiprazol 5 mg (IM si no hay VO). Nada de haloperidol ni risperidona.", "Otras: olanzapina 2,5 mg/día (si hay insomnio); aripiprazol 5–15 mg (hipoactivo, cardiópata).", "Evitar rescates de madrugada (al día siguiente estará somnoliento y parecerá que empeora).", "Delirium refractario que necesita sedación: levomepromazina 12,5–25 mg SC o IV cada 6–8 h (máx. 300 mg/día). Midazolam solo en agitación extrema o en paliativos.", "Dexmedetomidina: solo en UCI o Reanimación (hasta 1,4 mcg/kg/h)."]}, {"type": "h", "text": "Situaciones especiales"}, {"type": "list", "items": ["Abstinencia de alcohol o BZD: BZD (lorazepam 0,5–2 mg/8 h si hay hepatopatía), no antipsicóticos.", "Tiamina: profilaxis 200 mg/12–24 h IM o IV × 3 días. Si hay abstinencia: 500 mg/8 h IV × 3 días → 250 mg/24 h × 5 días. Interconsulta a Toxicomanías (busca 25409).", "Sin mejoría en 48 h: interconsulta a Geriatría (>85 años) o Psiquiatría (<85).", "Estudio de deterioro cognitivo tras el alta: ≥85 años o >80 con >3 síndromes geriátricos → Geriatría; resto → Neurología (TC + perfil \"neuro demencia\" durante el ingreso)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Antipsicóticos: metaanálisis (Nikooie, Ann Intern Med 2019) y ensayos como AID-ICU (NEJM 2022) no muestran que acorten el delirium ni reduzcan la mortalidad. Las guías (NICE CG103, actualización 2023; SCCM PADIS 2018) los limitan a la angustia o el riesgo, a dosis bajas y durante poco tiempo. Coincide con el protocolo.", "Herramienta de cribado: la 4AT (validada en Urgencias, no necesita formación y puntúa a pacientes somnolientos) es la recomendada por SIGN 157 (2019) y NICE. El protocolo menciona la 4AT, pero en el hospital se usa el CAM.", "Delirium posoperatorio (ESAIC 2023): dexmedetomidina perioperatoria en pacientes de alto riesgo. Evitar BZD y anticolinérgicos.", "Haloperidol IV: la FDA y la AEMPS advierten del alargamiento del QT. Pedir ECG y vigilar el K y el Mg."]}]}], "sources": "NICE CG103 Delirium (update 2023); SIGN 157 Risk reduction and management of delirium (2019); Devlin JW et al. SCCM PADIS guidelines (Crit Care Med 2018); Andersen-Ranberg NC et al. AID-ICU (N Engl J Med 2022); Aldecoa C et al. ESAIC postoperative delirium guideline (Eur J Anaesthesiol 2024).", "cats": ["neuro"], "vital": false}, {"title": "Derrame pleural y toracocentesis", "page": 32, "protocol": "DERRAME PLEURAL", "service": "Urgencias", "date": "nov 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Disnea, dolor pleurítico, tos seca. Matidez, abolición del murmullo y de las vibraciones vocales.", "Rx: borra el seno costofrénico posterior con ≥75 mL (proyección lateral). Menisco, subpulmonar o en cisura (pseudotumor). Si hay nivel hidroaéreo → hidroneumotórax.", "Hemitórax opaco: mediastino desplazado al mismo lado = atelectasia; centrado = derrame + atelectasia (cuidado al evacuar).", "Ecografía: más sensible que la Rx y mejor que el TC para ver septos. Para guiar la punción en derrames pequeños o loculados y en el paciente crítico."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Empiema o derrame paraneumónico complicado (puede complicarse en <12 h), hemotórax (Hto del líquido >50% del de la sangre), TEP, neoplasia, TBC, rotura esofágica (amilasa alta, pH muy bajo)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Toracocentesis diagnóstica en casi todo derrame nuevo (salvo IC clara). Anotar el aspecto (pus, lechoso, hemático).", "Evitarla si plaquetas <50.000 o TP <50% (transfundir antes) o el paciente no colabora.", "Petitorio: Urgencias > Líquidos > \"Líquido pleural\" (fórmula, recuento, proteínas, glucosa, LDH, pH, Gram, cultivo aerobio y anaerobio) + pestaña ADA.", "Volumen y tubos: pH en jeringa de gasometría (1 mL); bioquímica en tubo de heparina de litio (3 mL); recuento en EDTA (2,5 mL); hemocultivos aerobio y anaerobio con 5 mL cada uno (o Portagerm); micobacterias en tapón azul (5 mL); PCR 3 mL sin aditivos.", "Citología (50–100 mL; si es evacuadora, una bolsa entera): EECC > A. Patológica > citología. En la guardia, a la nevera, bien etiquetada.", "Lo ideal es extraer 120–150 mL. Si se saca poco: priorizar recuento, pH, glucosa y proteínas.", "Opcional: Hto (si es hemático), TG/colesterol/amilasa (si es lechoso), NT-proBNP en el líquido (>1500 = IC).", "Sangre a la vez: proteínas, LDH, albúmina, glucosa, hemograma, coagulación.", "Exudado si cumple ≥1 criterio de Light: proteínas LP/suero >0,5 · LDH LP/suero >0,6 · LDH LP >2/3 del límite superior sérico. Si parece un falso exudado con diuréticos: gradiente de albúmina suero − LP >1,2 → trasudado.", "Orientación: glucosa <60 o pH <7,20 → paraneumónico complicado, empiema, neoplasia, TBC, AR. ADA >40–45 → TBC (también empiema o linfoma). Linfocitos >50–80% → neoplasia o TBC. Células mesoteliales >5% → descarta TBC. TG >110 → quilotórax."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Técnica"}, {"type": "list", "items": ["En jóvenes: atropina 0,5–1 mg SC 30–45 min antes (prevención vasovagal).", "Paciente sentado, espalda recta, brazos sobre una mesa. Punción posterior, un espacio por debajo del nivel de matidez, por el borde superior de la costilla inferior. Mepivacaína 2%. Aguja de 21–22G con llave de 3 pasos.", "Evacuadora: máx. 1–1,5 L con aspiración suave. Parar si aparece tos, disnea o dolor (riesgo de edema de reexpansión). Rx de control siempre tras la evacuadora (tras la diagnóstica solo si hay complicaciones)."]}, {"type": "h", "text": "Trasudado"}, {"type": "list", "items": ["Tratar la causa (IC, cirrosis). Toracocentesis si hay dudas, fiebre o dolor, y evacuadora si es grande."]}, {"type": "h", "text": "Paraneumónico o empiema"}, {"type": "list", "items": ["Toracocentesis + hemocultivos siempre.", "ATB empírico con cobertura de anaerobios:", "Comunitario: cefalosporina de 3ª G (cefotaxima o ceftriaxona) + clindamicina o metronidazol (alergia: levofloxacino).", "Nosocomial: vancomicina o linezolid + piperacilina-tazobactam, cefepima, ceftazidima o carbapenem + metronidazol.", "Duración ≥2 semanas.", "Drenaje torácico si: pus, pH <7,2, loculación o Gram/cultivo +, o mala evolución.", "Fibrinolíticos intrapleurales precoces si hay loculaciones o empiema (no si hay fístula broncopleural). Toracoscopia o cirugía si fracasan."]}, {"type": "h", "text": "TBC pleural"}, {"type": "list", "items": ["Exudado linfocitario, ADA alto, <5% de células mesoteliales. Tratamiento igual que la TBC pulmonar. Confirmar con cultivo o biopsia."]}, {"type": "h", "text": "Derrame maligno"}, {"type": "list", "items": ["Toracocentesis evacuadora si es masivo y desplaza el mediastino.", "Pleurodesis con talco (4 g en 50–100 mL de SF por el drenaje, o pulverizado) si es sintomático y recidivante, con Karnofsky >40 y el pulmón se reexpande.", "Toracoscopia si persiste >2 semanas con citología negativa (en >40 años con exudado)."]}, {"type": "h", "text": "Hemotórax"}, {"type": "list", "items": ["Drenaje torácico + Cirugía torácica si es traumático o el sangrado continúa."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Fibrinolíticos (MIST2, NEJM 2011; BTS 2023): la pauta con evidencia es alteplasa 10 mg + DNasa 5 mg intrapleurales cada 12 h × 3 días. La urocinasa o la estreptocinasa solas no mejoraron los resultados (MIST1).", "Escala RAPID para el pronóstico de la infección pleural (BTS 2023, consenso ERS/EACTS 2023).", "TBC pleural: la pauta estándar es 2 meses de HRZE + 4 meses de HR = 6 meses (OMS, NICE, ATS/CDC). El protocolo dice \"4 meses (HRZE) + 2 meses (HR)\", lo que parece una errata.", "Derrame maligno recidivante (BTS 2023): el catéter pleural tunelizado es una alternativa de 1ª línea a la pleurodesis con talco. Reduce los días de ingreso y las nuevas intervenciones (ensayos TIME2 y AMPLE). Si el pulmón está atrapado, es la opción de elección.", "Toracocentesis guiada por ecografía (BTS 2023): recomendada siempre. Reduce el neumotórax y las punciones fallidas."]}]}], "sources": "Roberts ME et al. BTS Guideline for pleural disease (Thorax 2023); Bedawi EO et al. ERS/ESTS statement on management of pleural infection (Eur Respir J 2023); Rahman NM et al. MIST2 (N Engl J Med 2011); WHO consolidated guidelines on TB treatment (2022).", "cats": ["resp", "tec"], "vital": false}, {"title": "Descompensaciones agudas de la diabetes en el adulto (hipoglucemia, hiperglucemia, cetosis, CAD, EHH)", "page": 34, "protocol": "TRATAMIENTO DE LAS DESCOMPENSACIONES METABÓLICAS AGUDAS DE LA DM", "service": "Endocrinología y Urgencias", "date": "2021, act. feb 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Hipoglucemia: <60 mg/dL. Síntomas adrenérgicos; neuroglucopenia si es <40.", "Hiperglucemia simple: >250, cetonemia <1, sin acidosis.", "Cetosis simple: >250, cetonemia 1–3, pH >7,31, HCO₃ >22.", "CAD: >250 (o normal con iSGLT2), cetonemia >3, pH <7,31 y HCO₃ <18.", "EHH: >600, osmolalidad eficaz >320, cetonemia <2, sin acidosis. DM2 con un desencadenante grave."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Desencadenante en TODOS: – Infección (Rx de tórax, sedimento, revisar los pies). – SCA (ECG ± troponina). – Omisión de la insulina, transgresión dietética, corticoides. – Debut de DM1, iSGLT2.", "Hipoglucemia: IR (acúmulo), error de dosis, intento autolítico (ver intoxicación por antidiabéticos).", "Cetosis de ayuno en un no diabético (glucemia <100): se corrige con glucosa.", "HbA1c previa (¿mal control agudo o crónico?): 8–9 % ≈ 180–210 mg/dL; 10–11 % ≈ 240–270; 12–13 % ≈ 300–330."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucosa, urea, creatinina, hemograma, iones, gasometría venosa, cetonemia capilar, sedimento. ECG, Rx de tórax.", "CAD: monitorización. Glucemia y cetonemia cada hora. Iones, gasometría, urea y creatinina cada 2 h (cada 3–4 h si evoluciona bien). Constantes y diuresis cada hora.", "EHH: osmolalidad eficaz = 2 × (Na + K) + glucosa/18. Déficit de agua. Glucemia cada 2–4 h."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Hipoglucemia"}, {"type": "list", "items": ["Consciente: 2–3 raciones de HC rápidos (½ vaso de zumo o 1 sobre de azúcar cada una). Control a los 10–15 min. Repetir si es <80.", "Inconsciente: SG 50 % 20 mL IV (o glucagón 1 mg IM; poco eficaz en la desnutrición o la hepatopatía).", "Mantenimiento: SG 10 % 500 mL/4–6 h + dieta. Glucemia cada hora × 2 h y luego cada 4 h.", "Observación según el fármaco (más si hay IR): – Ultrarrápida: 3 h. Rápida: 6 h. – NPH o mezclas: 12 h. – Glargina U100 o detemir: 24 h. – Toujeo® o Tresiba®: 36–48 h. – Sulfonilureas: 24 h. Repaglinida: 6 h. Gliptinas: 12 h. – Metformina, pioglitazona e iSGLT2 no causan hipoglucemia (cuenta el otro fármaco).", "Alta: retirar el SG, control a la hora. – Si la causa fue la insulina: bajar la dosis un 20 %. – Glibenclamida → cambiar a gliclazida 30 mg. – Revisar las contraindicaciones (FG)."]}, {"type": "h", "text": "Hiperglucemia simple"}, {"type": "list", "items": ["Tratar la causa. 150 g/día de glucosa (dieta o SG 10 % 1.500 mL/día).", "Insulina ultrarrápida 0,15 UI/kg s.c. (70 kg → 10 UI). Repetir si sigue >300 a las 2 h.", "Alta: – Insulinizado: subir la dosis total un 10–20 %. – No insulinizado con criterios de insulinización (>300 persistente, síntomas de insulinopenia, cetosis, contraindicación de orales): Hospital de Día de Endocrinología. Dosis inicial 0,3–0,5 UI/kg/día.", "Corticoides: – Con orales: añadir gliclazida o NPH 0,3 UI/kg en el desayuno. – Con insulina: subir la dosis del desayuno un 20 %."]}, {"type": "h", "text": "Cetosis simple (falta insulina: insulinizar)"}, {"type": "list", "items": ["Glucemia <250: dieta de cetosis (20 g de HC cada 2 h) o SG 10 % 500 mL/6 h.", "No insulinizado: – Dosis total de 0,5 UI/kg/día (0,7 si se sospecha DM1) como basal o basal-bolo. – + ultrarrápida del 15–20 % de la dosis total cada 2 h hasta cetonemia <1. – *Ejemplo con 70 kg:* glargina 35 UI (o 17 + aspart 5-5-5) + aspart 5–7 UI cada 2 h.", "Insulinizado: su pauta + el 15–20 % de su dosis total cada 2 h.", "Glucemia y cetonemia cada 2 h."]}, {"type": "h", "text": "CAD"}, {"type": "list", "items": ["Fluidos: – SF 500–1.000 mL en 1 h, luego 500 mL cada 2–6 h. – Glucemia <250 → añadir SG 10 % 500 mL/4–6 h (con iSGLT2, SG desde el inicio).", "Insulina: – Glargina 0,3 UI/kg s.c. AL LLEGAR (o su dosis habitual), y dejarla pautada cada 24 h. – + insulina IV (100 UI en 500 mL de SG 5 % = 0,2 UI/mL; 5 mL = 1 UI) según la glucemia capilar: – <100: parar y control a los 30 min. – 101–150: 5 mL/h. – 151–200: 10 mL/h. – 201–250: 15 mL/h. – 251–300: 20 mL/h. – 301–350: 25 mL/h. – >350: 30 mL/h. – Peso <50 kg: reducir la perfusión un 50 %. Peso >120 kg: aumentarla un 50 %. – El objetivo es resolver la cetosis, no la glucemia: si la glucemia baja, subir la glucosa, no parar la insulina.", "Potasio (esperar la creatinina): – >5: no dar (control cada hora). – 4–5: 10 mEq/h (control cada 2 h). – 3–4: 20 mEq/h (cada 2 h). – <3: 30 mEq/h (cada hora; retrasar la insulina). – >10 mEq/h: bomba ± vía central. – Hipercloremia: 1/3 del K como fosfato monopotásico.", "Bicarbonato 1 M 1 mEq/kg en 45 min solo si: – pH <7,0 o HCO₃ <5. – pH <7,1 o HCO₃ <10 con IAM o shock. – Hiperpotasemia grave.", "Retirar la bomba con cetonemia <1: su pauta habitual, o basal-bolo de 0,6–0,7 UI/kg/día. Retirar la perfusión 2–3 h después de la ultrarrápida s.c. (la glargina ya se puso al inicio).", "Acidosis hiperclorémica persistente con cetonas negativas: reducir el SF y usar fosfato potásico.", "iSGLT2: retirarlo."]}, {"type": "h", "text": "EHH (lo esencial es el AGUA)"}, {"type": "list", "items": ["Déficit de agua = (osmolalidad eficaz − 290) / 290 × 0,6 × peso + 30 mL/kg/día. – 50 % en 12 h y el 50 % restante en las 24 h siguientes (más despacio si hay IC). – *Ejemplo con 70 kg, Na 152, K 4, glucosa 900:* osmolalidad 362 → 10,4 L + 2,1 L = 12,5 L.", "Tipo de suero según el Na: – <145: SF. – 145–150: hipotónico. – >150: SG 5 %. – Glucemia <250: SG 10 % 500 mL/6–8 h.", "Insulina 1–2 h DESPUÉS de empezar los fluidos: – IV (la misma tabla), o s.c. 0,5–0,6 UI/kg/día. – Pasar a s.c. cuando la glucemia sea <250 y tolere: mantener la perfusión 3–4 h tras la glargina.", "K como en la CAD (más IR: cuidado)."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["CAD y EHH: ingreso (semicríticos o UCI según la gravedad).", "Hiperglucemia o cetosis sin causa que obligue a ingresar: Endocrinología (Hospital de Día, ext. 3168) para insulinizar antes del alta.", "Contraindicaciones de los orales al alta: – Metformina: FG <30, IH, IC descompensada, insuficiencia respiratoria, alcohol, ingreso o TC con contraste. – Sulfonilureas: FG <50, IH. Glibenclamida, no en >75 años. – Repaglinida: FG <15, gemfibrozilo. – Pioglitazona: IC, IH, cáncer de vejiga. – iSGLT2: el protocolo pone FG <45; ITU complicada."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Consenso ADA, EASD, JBDS, AACE y DTS 2024 sobre crisis hiperglucémicas:", "CAD: glucosa ≥200 (o DM conocida), cetonemia ≥3, pH <7,3 o HCO₃ <18.", "EHH: glucosa ≥600, osmolalidad >300, cetonas <3, pH ≥7,3.", "Insulina IV a ritmo fijo de 0,1 UI/kg/h (sin bolo) y glucosa al 10 % cuando la glucemia es <250. El protocolo usa una tabla por glucemia.", "Basal s.c. precoz (coincide con la glargina al inicio).", "Preferencia por cristaloides balanceados (Ringer lactato o Plasma-Lyte) frente al SF (SCOPE-DKA; menos acidosis hiperclorémica).", "EHH: iniciar la insulina cuando la glucosa deje de bajar solo con fluidos (0,05 UI/kg/h).", "K <3,5 → retrasar la insulina hasta que el K sea >3,5 (ADA). El protocolo usa <3.", "iSGLT2 en la ERC: la dapagliflozina y la empagliflozina se mantienen hasta FG 20–25 por su beneficio renal y cardiaco (KDIGO 2024). El límite de 45 del protocolo se refiere al efecto glucémico."]}]}], "sources": "Umpierrez GE et al. Hyperglycemic Crises in Adults With Diabetes: A Consensus Report (Diabetes Care 2024); JBDS-IP Management of DKA in adults (2023); KDIGO 2024 CKD Guideline.", "cats": ["endo"], "vital": false}, {"title": "Disminución del nivel de conciencia / coma", "page": 36, "protocol": "DISMINUCIÓN DEL NIVEL DE CONSCIENCIA", "service": "Urgencias", "date": "v1.0, oct 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Estructural: inicio brusco, focalidad, pupilas asimétricas o arreactivas, patrón respiratorio anormal, tronco afectado → TC.", "Metabólico o tóxico: progresivo, simétrico, pupilas reactivas (salvo tóxicos), Kussmaul.", "Pupilas: midriasis unilateral arreactiva → herniación uncal o aneurisma de la AComP · puntiformes reactivas → protuberancia u opioides · intermedias arreactivas → herniación central · midriasis bilateral arreactiva → anoxia o fármacos.", "AEIOU-TIPS: Alcohol o acidosis · Epilepsia, Endocrino, Electrolitos · Insulina (hipo o hiperglucemia) · Overdose · Uremia · Trauma o Tumor · Infección · Psicógeno · Stroke o Shock."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["HIPOGLUCEMIA (glucemia capilar YA), hipoxia o hipercapnia, opioides o BZD, meningitis o encefalitis (fiebre, petequias), ictus o HSA, TCE (hematoma subdural), estatus no convulsivo, Wernicke, encefalopatía hepática o urémica, hiponatremia, hipotermia."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucemia capilar inmediata. GSA o GSV. Hemograma, iones (Na, Ca), función renal y hepática, coagulación, amonio si hay hepatopatía. ECG.", "TC craneal si GCS ≤13 o se sospecha causa neurológica (o trauma o anticoagulación).", "Rx de tórax. Tóxicos en orina y sangre (etanol, paracetamol, salicilatos). Cultivos si hay sospecha de sepsis.", "PL si se sospecha meningitis y no hay contraindicación (HTIC o efecto masa, coagulopatía).", "EEG si se sospecha estatus no convulsivo.", "Historia: última vez visto bien, fármacos (insulina, psicofármacos, anticoagulantes), tóxicos, trauma, fiebre, cefalea, convulsiones."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · ABCDE"}, {"type": "list", "items": ["A: frente-mentón o tracción mandibular, aspirar, cánula de Guedel. IOT si la vía aérea está comprometida (GCS ≤8) → avisar a UCI.", "B: O2 con reservorio, ventilar con bolsa si hay hipoventilación.", "C: 2 vías venosas, monitorización, fluidos si hay shock, analítica.", "D: GCS, pupilas, posturas, convulsiones, glucemia.", "E: buscar trauma, punciones, petequias, Tª. Collarín cervical si se sospecha trauma."]}, {"type": "h", "text": "Fase 2 · Tratamiento empírico según los hallazgos"}, {"type": "list", "items": ["Hipoglucemia: glucosa IV en bolo (glucosa 33% o 50%; 2 ampollas de 50% = 50 mL) y después SG 10% 500 mL/8 h.", "Sospecha de Wernicke (alcohólico, desnutrido): tiamina 100 mg IV ANTES de la glucosa.", "Convulsiones: diazepam 10 mg IV, repetir a los 5 min. Sin vía: midazolam 10 mg IM.", "Sepsis o meningitis: antibiótico empírico sin esperar al TC ni a la PL (ver Meningitis).", "Opioides: naloxona 0,4 mg IV, repetir hasta un máx. de 4 mg. Si recae: perfusión de 2 mg en 500 mL de SG5% en 4 h (0,4–0,8 mg/h).", "BZD: flumazenilo 0,25 mg IV (máx. 1 mg). Si recae: perfusión de 2 mg en 500 mL de SG5% en 6 h.", "Flumazenilo contraindicado si: epilepsia, tricíclicos o QRS ancho, uso crónico de BZD, cocaína (riesgo de convulsiones).", "Otras drogas depresoras: posición lateral de seguridad + ABC."]}, {"type": "h", "text": "Fase 3 · Registro y destino"}, {"type": "list", "items": ["Documentar hora, constantes y GCS seriado. UCI o Neurocirugía según la causa."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Tiamina: la dosis de 100 mg es probablemente insuficiente si se sospecha Wernicke. EFNS 2010 y RCP de Londres recomiendan 200–500 mg IV cada 8 h. Además, no hay que retrasar la glucosa en la hipoglucemia por esperar a la tiamina (el riesgo teórico es mínimo; dar las dos a la vez).", "Naloxona: dosis inicial más baja (0,04–0,1 mg IV ajustando) en el consumidor crónico de opioides para evitar la abstinencia brusca y la agitación (AHA 2023 en toxicología, ACMT). La dosis de 0,4 mg es adecuada en el no habituado o en el paciente en parada respiratoria.", "Flumazenilo: la mayoría de guías de toxicología (EAPCCT, ACMT) desaconsejan su uso empírico en el coma de causa desconocida. Lo reservan para la sedación iatrogénica por BZD en pacientes sin consumo crónico.", "Estatus no convulsivo: está infradiagnosticado en el coma sin causa clara. Pedir EEG precoz (Neurocritical Care Society).", "Escalas: FOUR como alternativa al GCS en el paciente intubado."]}]}], "sources": "Galvin R et al. EFNS guidelines for Wernicke encephalopathy (Eur J Neurol 2010); Lavonas EJ et al. 2023 AHA Focused Update on Toxicology in ACLS (Circulation 2023); Brophy GM et al. Neurocritical Care Society status epilepticus guideline (Neurocrit Care 2012).", "cats": ["neuro"], "vital": true}, {"title": "Disnea aguda: enfoque en Urgencias", "page": 37, "protocol": "ACTUACIÓN ANTE UN PACIENTE CON DISNEA", "service": "Urgencias", "date": "nov 2025; versión borrador con comentarios de revisión sin resolver", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Gravedad / claudicación inminente: FR >40, desaturación progresiva, alteración mental (agitación, somnolencia), habla entrecortada, no tolera el decúbito, musculatura accesoria o respiración paradójica, cianosis, diaforesis, mala perfusión, hipoTA o HTA extremas, dolor torácico o síncope.", "Pistas: ortopnea o DPN (IC) · platipnea (shunt, síndrome hepatopulmonar) · trepopnea (derrame o parálisis diafragmática unilateral) · bendopnea (IC avanzada).", "Insuficiencia respiratoria: PaO2 <60 y/o PaCO2 >50. PaFi: 200–300 leve · 100–200 moderada · ≤100 grave (SDRA, Berlín). Si no hay GSA, usar la SaFi."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Respiratorio: obstrucción alta (cuerpo extraño, angioedema o anafilaxia), asma o EPOC, neumonía, TEP, neumotórax, derrame.", "Cardíaco: IC o EAP, SCA, arritmia, taponamiento, valvulopatía.", "Metabólico: sepsis, anemia, CAD, tirotoxicosis, tóxicos (CO, salicilatos, metanol, organofosforados).", "Neuromuscular: Guillain-Barré, miastenia, ELA, botulismo.", "Mecánico: fracturas costales o volet. Ansiedad (diagnóstico de exclusión)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["ECG.", "Gasometría arterial siempre (basal o con su FiO2 habitual; anotar la FiO2). Pulsioximetría (SatO2 90% ≈ PaO2 60).", "Analítica: glucosa, urea, creatinina, iones, hemograma. Troponina (y CK) si se sospecha SCA. Dímero D si se sospecha TEP. NT-proBNP si se sospecha IC o la causa no está clara.", "Rx de tórax PA y lateral (portátil si no se puede).", "Según la sospecha: angio-TC (TEP), ecocardiograma (taponamiento, TEP con inestabilidad), TC (politrauma), toracocentesis (derrame)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Estabilizar"}, {"type": "list", "items": ["Vía aérea permeable, cabecera elevada, monitorización, vía venosa.", "O2 para PaO2 >60 / SatO2 >90%.", "Dispositivos: gafas nasales 1–3 L · Venturi (FiO2 0,24–0,5; de elección en la IRA) · reservorio (FiO2 0,6–0,9) · CPAP (EAP) · BiPAP (EPOC hipercápnica, hipoventilación) · alto flujo nasal (IRA hipoxémica) · IOT."]}, {"type": "h", "text": "Fase 2 · Según la causa"}, {"type": "list", "items": ["Broncoespasmo: salbutamol con cámara o nebulizado (cada 20 min la 1ª hora si es grave) ± ipratropio. Sulfato de Mg en la crisis asmática grave.", "Corticoide: metilprednisolona IV o hidrocortisona IV (en adultos, ver los protocolos de asma y EPOC para las dosis).", "IC: furosemida IV. Infección: antibiótico según el foco.", "Sospecha de TEP: enoxaparina 1 mg/kg/12 h SC. Profilaxis de ETV en el paciente encamado: enoxaparina 40 mg/24 h."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Objetivo de SatO2 (BTS 2017, TSANZ 2022): 94–98% en general y 88–92% si hay riesgo de hipercapnia (EPOC, obesidad- hipoventilación, neuromuscular). El protocolo pide >90% en todos e insiste en no limitar el O2 en el hipercápnico. Las guías advierten que la hiperoxia aumenta la mortalidad y la hipercapnia en la EPOC (Austin, BMJ 2010).", "Dosis de corticoide del borrador: metilprednisolona 1–2 mg/kg + 2–4 mg/kg/día, e hidrocortisona 4–8 mg/kg, parecen dosis pediátricas o de choque. En el adulto: asma → prednisona 40–50 mg/día; EPOC → prednisona 40 mg × 5 días (GOLD 2025, ensayo REDUCE).", "Alto flujo nasal: de 1ª línea en la IRA hipoxémica no hipercápnica (ensayo FLORALI, guía ERS 2022). VMNI (BiPAP) de elección en la EPOC con acidosis respiratoria (pH <7,35) y en el EAP (ERS/ATS 2017).", "Ecografía pulmonar a pie de cama (BLUE): mejora el diagnóstico de la disnea aguda en Urgencias (líneas B = EAP; deslizamiento ausente = neumotórax)."]}]}], "sources": "O'Driscoll BR et al. BTS guideline for oxygen use (Thorax 2017); Rochwerg B et al. ERS/ATS NIV guideline (Eur Respir J 2017); Oczkowski S et al. ERS HFNC guideline (Eur Respir J 2022); GOLD 2025 Report.", "cats": ["resp"], "vital": false}, {"title": "Distonía aguda (farmacológica) y estatus distónico", "page": 38, "protocol": "Protocolo para el manejo de la DISTONÍA AGUDA EN URGENCIAS", "service": "Unidad de Trastornos del Movimiento", "date": "dic 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Contracción sostenida con postura anómala, de inicio brusco en las primeras 24 h de empezar un fármaco antidopaminérgico. Es intermitente.", "Fármacos: haloperidol y otros antipsicóticos típicos, metoclopramida, antieméticos o antivertiginosos (sulpirida, tietilperazina), ISRS o IRSN, cocaína; raramente calcioantagonistas, antiepilépticos, triptanes, rivastigmina.", "Formas: tortícolis o retrocolis (30–40%), trismus o desviación mandibular, crisis oculógiras, protrusión lingual, disfagia, opistótonos. Rara pero grave: distonía laríngea con estridor.", "Riesgo: varón joven (10–19 años), distonía previa, cocaína, deshidratación, VIH, hipoparatiroidismo."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Tétanos, síndrome *stiff person*, síndrome de Grisel (subluxación atloaxoidea tras faringitis o absceso retrofaríngeo), procesos infecciosos de cuello, tumor de fosa posterior o cervical.", "Crisis epiléptica, hipocalcemia (tetania), SNM (fiebre + rigidez + CK alta), conversivo."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Habitualmente nada si la causa farmacológica es clara.", "Si hay dudas: Ca, Mg, CK, función renal y hepática, tóxicos (cocaína).", "Estridor → laringoscopia o fibroscopia urgente y valorar la vía aérea."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Distonía aguda"}, {"type": "list", "items": ["Retirar el fármaco causante.", "BIPERIDENO (Akineton) 2 mg IV o IM. Repetir a los 30 min si persiste.", "Después, pauta oral los días siguientes para evitar recaídas precoces (habitualmente biperideno 2 mg/8–12 h VO durante 2–3 días).", "Contraindicaciones: glaucoma de ángulo cerrado, íleo, obstrucción intestinal o megacolon. Precaución en HBP, arritmias, epilepsia.", "Crisis oculógiras: clonazepam 0,5–4 mg.", "Alternativas: difenhidramina 50–100 mg IM, IV o VO o diazepam 5–10 mg IV.", "Advertir: tiene más riesgo de volver a hacer distonía con otros antidopaminérgicos. Anotar la reacción en la historia."]}, {"type": "h", "text": "Distonía laríngea (estridor)"}, {"type": "list", "items": ["Asegurar la vía aérea (CPAP, intubación o traqueostomía urgente si hace falta). Biperideno IV. El tratamiento definitivo es la toxina botulínica."]}, {"type": "h", "text": "Estatus o tormenta distónica (UCI)"}, {"type": "list", "items": ["Contracción generalizada progresiva + hipertermia, rabdomiólisis, FRA, insuficiencia respiratoria.", "Tratar el desencadenante (infección, fiebre, cambio de medicación). Soporte: fluidos, iones, CK, analgesia, IOT si hace falta. Sedación con midazolam o propofol.", "Fármacos empíricos: trihexifenidilo 3–6 mg/día (subiendo), tetrabenazina 12,5–100 mg/día, risperidona o sulpirida, baclofeno (IV o intratecal). En casos refractarios: palidotomía o estimulación cerebral profunda.", "Portador de estimulación cerebral profunda: si se apaga el estimulador, puede aparecer distonía grave → contactar con Neurología."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["No hay guías específicas recientes que cambien la pauta. El biperideno IV o IM (o la difenhidramina) sigue siendo el tratamiento de referencia según las revisiones de movimientos anormales inducidos por fármacos (Movement Disorders Society).", "Prevención (EMA 2013): la metoclopramida está limitada a ≤0,5 mg/kg/día durante ≤5 días y contraindicada en <1 año por el riesgo extrapiramidal. Elegir otro antiemético (ondansetrón) en jóvenes.", "Profilaxis anticolinérgica al iniciar un antipsicótico típico de alta potencia en varones jóvenes: valorarla (APA 2020).", "Estatus distónico: la evidencia viene de series de casos. Un registro multicéntrico (Ruiz-Lopez, Mov Disord 2017) apoya la sedación profunda precoz y valorar pronto la estimulación cerebral profunda si la causa no es reversible."]}]}], "sources": "EMA PRAC review on metoclopramide (2013); APA Practice Guideline for the Treatment of Schizophrenia (2020); Ruiz-Lopez M, Fasano A. Status dystonicus (Mov Disord 2017).", "cats": ["neuro", "tox"], "vital": false}, {"title": "Dolor agudo en urgencias (escalera analgésica y opioides)", "page": 39, "protocol": "DOLOR AGUDO EN URGENCIAS", "service": "Urgencias", "date": "mar 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Tipo de dolor: – Nociceptivo somático: localizado (osteomuscular, articular, piel). – Nociceptivo visceral: mal localizado, referido, con síntomas vegetativos. – Neuropático: lesión de la fibra nerviosa (quemazón, descargas, alodinia).", "Evaluar con una escala numérica, verbal o EVA, de forma rápida y repetida."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Contraindicaciones de los AINE: IR, IC o HTA (descompensación), sangrado digestivo, 3.er trimestre del embarazo (cierre del ductus), anticoagulación.", "Interacciones. Dolor mal controlado = EVA ≥4 durante >48 h."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Lo que corresponda según la causa del dolor (esta ficha es de tratamiento)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Principios"}, {"type": "list", "items": ["Pauta fija y reevaluación. Anticiparse a los efectos adversos (laxante y antiemético con los opioides).", "No asociar dos AINE (tienen techo).", "El paracetamol es la base de todos los escalones."]}, {"type": "h", "text": "Escalera"}, {"type": "list", "items": ["1.er escalón (EVA <3): paracetamol 1 g/6–8 h o AINE ± coadyuvante.", "2.º escalón (EVA 3–7): paracetamol + AINE + opioide débil (tramadol, codeína) ± coadyuvante.", "3.er escalón (EVA >7): paracetamol + opioide potente ± coadyuvante."]}, {"type": "h", "text": "No opioides"}, {"type": "list", "items": ["Dexketoprofeno 50 mg/8–12 h IV (≤48 h) o 12,5–25 mg/8–12 h v.o.", "Diclofenaco 50 mg/6–8 h v.o. o 75 mg/12–24 h IM.", "Ibuprofeno 1.200–1.800 mg/día en 3–4 tomas (máximo 2.400 mg).", "Metamizol 0,5–2 g/6–8 h v.o., IV o IM.", "Paracetamol 1 g/6–8 h v.o. o IV."]}, {"type": "h", "text": "Opioides"}, {"type": "list", "items": ["Sin dosis máxima (titular según el efecto y los efectos adversos).", "Morfina IV de inicio: 0,05–0,1 mg/kg cada 4 h.", "Conversiones desde la morfina oral diaria: – IV = oral/3. – s.c. = oral/2. – Parche de fentanilo (µg/h) ≈ oral/2.", "Rescates = 1/6 de la dosis diaria.", "Ajuste: sumar los rescates de las 24 h, o subir un 25 % si la EVA es 4–7.", "Rotación: reducir un 25 % la dosis del nuevo opioide (la tolerancia cruzada es incompleta). Los parches se ajustan cada ≥6 días.", "Ancianos: reducir la dosis un 25 %.", "Factores para pasar a morfina oral: codeína ×0,15; tramadol ×0,25; tapentadol ×0,4; oxicodona ×1,5; hidromorfona ×5; metadona ×1,5; buprenorfina s.l. ×40; morfina IV ×3.", "Dolor irruptivo oncológico: fentanilo transmucoso o intranasal (Actiq®, Effentora®, Abstral®, Instanyl®, PecFent®): inicio en 5–15 min. Titular con el dolor basal ya controlado."]}, {"type": "h", "text": "Coadyuvantes (dolor neuropático)"}, {"type": "list", "items": ["Amitriptilina 10 mg por la noche, subiendo cada 3–5 días hasta 25–100 mg.", "Duloxetina 30 mg → 60 mg.", "Gabapentina 300 mg/día → 600–900 mg/8 h.", "Pregabalina 75–150 mg/12 h (25 mg por la noche en el anciano o la IR).", "Carbamazepina 100 mg/8–12 h → 200–800 mg/día (dolor lancinante; neuralgia del trigémino)."]}, {"type": "h", "text": "Situaciones especiales"}, {"type": "list", "items": ["Acenocumarol: paracetamol, ibuprofeno y diclofenaco son compatibles (INR a los 3 días). Los opioides no interactúan.", "Hepatopatía: paracetamol ≤4 g/día (≤2 g/día en alcohólicos o desnutridos).", "IR: paracetamol y metamizol cada 12 h. Ajustar los opioides (evitar la morfina en la IR grave).", "Embarazo: paracetamol."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Al alta: pauta fija, laxante con los opioides, y revisión por el médico de familia."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Opioides para el dolor agudo (CDC 2022): la menor dosis eficaz y la menor duración (normalmente ≤3 días, rara vez >7). Evitar los de liberación prolongada.", "Dolor lumbar agudo no complicado (ensayo OPAL, Lancet 2023): un opioide no fue mejor que el placebo y hubo más efectos adversos. Usar AINE, calor y movilidad.", "Ketamina en dosis subdisociativa (0,1–0,3 mg/kg IV) como alternativa o complemento del opioide en el dolor agudo intenso en urgencias (ACEP 2022, SAEM).", "Bloqueos ecoguiados (fascia iliaca en la fractura de cadera, serrato en las fracturas costales): recomendados para reducir los opioides en el anciano (AAGBI 2020/2021).", "Metamizol: riesgo de agranulocitosis (alerta de la AEMPS de 2018). Evitarlo en tratamientos prolongados en población del norte de Europa o con antecedentes. Hemograma si se prolonga."]}]}], "sources": "Dowell D et al. CDC Clinical Practice Guideline for Prescribing Opioids for Pain (MMWR 2022); Jones CMP et al. OPAL trial (Lancet 2023); AEMPS Nota de seguridad metamizol (2018).", "cats": ["dolor"], "vital": true}, {"title": "Dolor neuropático en Urgencias", "page": 41, "protocol": "PROTOCOLO MANEJO DEL PACIENTE CON DOLOR NEUROPÁTICO EN URGENCIAS", "service": "Unidad del Dolor", "date": "sep 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Dolor quemante, lancinante o eléctrico, con hormigueo, alodinia o hipoestesia en un territorio nervioso.", "Causas: neuropatía diabética, neuralgia del trigémino, herpes zóster o neuralgia postherpética, radiculopatía, lesión nerviosa traumática o posquirúrgica, ictus o EM, alcohol, quimioterapia, túnel carpiano."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Radiculopatía con signos de alarma (déficit motor progresivo, síndrome de cola de caballo, fiebre, cáncer).", "Zóster activo (antiviral). Isquemia arterial. Causa estructural tratable."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Exploración neurológica (sensibilidad, fuerza, reflejos), EVA o escala numérica. Comorbilidades, fármacos, función renal (ajuste de dosis)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Analgesia general"}, {"type": "list", "items": ["Paracetamol (dolor leve) → AINE (moderado) → tramadol 50–100 mg/6–8 h (intenso; máx. 400 mg/día). Ver protocolo de dolor agudo."]}, {"type": "h", "text": "Fase 2 · Fármaco específico (1ª línea)"}, {"type": "list", "items": ["GABAPENTINA 300 mg/día, subiendo 300 mg cada 3 días (máx. 3600 mg/día). Es el de elección en Urgencias.", "PREGABALINA 75 mg/12 h, subiendo a 100–300 mg en 7 días (máx. 600 mg/día; la mitad si hay insuficiencia renal; precaución en IC).", "AMITRIPTILINA 10–25 mg por la noche, subiendo 25 mg/semana (máx. 100 mg). Alarga el QT. Evitar en ancianos, glaucoma, IMAO o riesgo suicida.", "Parche de lidocaína al 5% (dolor localizado, neuralgia postherpética)."]}, {"type": "h", "text": "Fase 3 · 2ª línea o añadir"}, {"type": "list", "items": ["Duloxetina 60 mg/día (subiendo 30 mg/semana; máx. 120 mg). No usar en insuficiencia hepática ni con FG <30.", "Venlafaxina 75 mg/día (subiendo 75 mg/semana; máx. 375 mg). Alarga el QT, HTA.", "Lamotrigina (escalada lenta), capsaicina en crema 3–4 veces/día, toxina botulínica, tramadol.", "Si ya toma un fármaco de 1ª línea a dosis correcta: añadir otro de 1ª o 2ª línea (vigilar interacciones).", "Neuralgia del trigémino: ver la guía específica del hospital (carbamazepina de 1ª elección).", "Opioides potentes solo en casos extremos y pautados por Anestesia-Dolor (avisar al busca)."]}]}, {"key": "destino", "label": "DESTINO", "blocks": [{"type": "list", "items": ["Si el dolor se controla: médico de familia o especialista para ajustar.", "Interconsulta a Anestesia-Dolor de guardia si ha necesitado fármacos de 1ª y 2ª línea, consulta a menudo o necesita mórficos (técnicas intervencionistas).", "Ingreso si el dolor es intratable o hay riesgo (Neurología, Traumatología o Anestesia; ketamina en perfusión)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["NeuPSIG/IASP (Lancet Neurol 2015) y su actualización (Soliman, Lancet Neurol 2025): se mantienen como 1ª línea gabapentinoides, ADT e IRSN (duloxetina). La duloxetina pasa a ser 1ª línea igual que la pregabalina (en el protocolo es de 2ª). El parche de lidocaína y la capsaicina al 8% quedan en 2ª línea.", "Tramadol y otros opioides: bajan a 3ª línea en las guías NeuPSIG y NICE CG173 (riesgo de dependencia). El protocolo lo pone en el escalón inicial para el dolor intenso.", "Gabapentinoides: alerta de la AEMPS y la FDA (2019–2020) por depresión respiratoria si se combinan con opioides o hay EPOC, y por riesgo de abuso. Ajustar siempre a la función renal.", "Neuropatía diabética (ADA 2025): pregabalina, duloxetina y gabapentina como 1ª línea, con efecto similar (ensayo OPTION-DM, Lancet 2022: las combinaciones mejoran a los que no responden a monoterapia)."]}]}], "sources": "Finnerup NB et al. NeuPSIG pharmacotherapy for neuropathic pain (Lancet Neurol 2015); Soliman N et al. NeuPSIG update (Lancet Neurol 2025); NICE CG173 Neuropathic pain in adults; Tesfaye S et al. OPTION-DM (Lancet 2022).", "cats": ["neuro", "dolor"], "vital": false}, {"title": "Dolor torácico / síndrome coronario agudo (circuito de Urgencias)", "page": 42, "protocol": "Circuit dolor toràcic a Urgències", "service": "Urgencias/Cardiología", "date": "may 2022", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Coronario: opresivo retroesternal, irradiado a mandíbula, brazo izquierdo, codos, muñecas o espalda; 2–20 min (angina) o >20 min (IAM); con esfuerzo, frío o ingesta; cede con reposo o NTG; cortejo vegetativo. Atípico en mujeres, ancianos y diabéticos (solo disnea, fatiga o vegetativo).", "Síndrome aórtico agudo: brusco, máximo desde el inicio, desgarrador, interescapular o migratorio; asimetría de pulsos, soplo de IAo, focalidad, síncope, taponamiento.", "Pericárdico: empeora con la inspiración y el decúbito, mejora sentado. Pleurítico o TEP. Neumotórax. Esofágico (rotura: vómitos + dolor brusco)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["IAMCEST (código IAM), SAA, TEP, neumotórax a tensión, taponamiento, rotura esofágica."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Box de Códigos 5: ECG de 16 derivaciones (incluye V3R, V4R, V7–V9) e interpretado en <10 min. Anotar la hora. Avisar al busca del médico de Códigos (R3/R4; si no contesta, 25330).", "Perfil dolor torácico (3 tubos): glucosa, creatinina, urea, iones, TnT-us(0); hemograma; TP, TTPA, fibrinógeno (+ dímero D si se sospecha TEP o SAA).", "A las 3 h: ECG(3h) + TnT-us(3h).", "Curva de TnT-us negativa: <14 a las 0 y 3 h, o >14 con variación <20%. Positiva: >14 con variación >20%.", "Si el dolor empezó hace >6 h y el riesgo es bajo: una TnT-us(0) <14 es suficiente.", "Escalas: HEART si el dolor es inespecífico (Historia, ECG, edad, factores de riesgo, troponina; 0–10). GRACE + CRUSADE si la sospecha de SCA es alta.", "Criterios ECG de código IAM:", "↑ST ≥1 mm en 2 derivaciones contiguas (V2–V3: ≥1,5 mm en mujeres, ≥2 mm en hombres ≥40 años, ≥2,5 mm en <40).", "VD: ↑ST ≥0,5 mm en V3R–V4R. Posterior: ↑ST ≥0,5 mm en V7–V9 (sospechar si hay ↓ST en V1–V3).", "↓ST ≥1 mm en ≥8 derivaciones + ↑ST en aVR (tronco o multivaso).", "BRI o marcapasos: criterios de Sgarbossa.", "Equivalentes: De Winter y Wellens (estenosis crítica de la DA)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Escenario 1 · IAMCEST → ACTIVAR CÓDIGO IAM (puerta-balón <60 min)"}, {"type": "list", "items": ["AAS 300 mg + prasugrel 60 mg de carga (preferente; contraindicado si >75 años, <60 kg o ictus/AIT previo).", "O ticagrelor 180 mg (contraindicado si ictus hemorrágico, disfunción sinusal o BAV).", "O clopidogrel 600 mg (si los otros están contraindicados o CRUSADE >40).", "Anotar la hora de activación."]}, {"type": "h", "text": "Escenario 2 · SCASEST"}, {"type": "list", "items": ["Avisar a Cardiología. GRACE y CRUSADE.", "AAS 300 mg (clopidogrel si es alérgico) + anticoagulación + NTG IV + betabloqueante.", "El 2º antiagregante, después del cateterismo (clopidogrel si se decide manejo conservador)."]}, {"type": "h", "text": "Escenario 3 · ECG no diagnóstico → HEART Pathway"}, {"type": "list", "items": ["Monitorización, ECG y troponina seriados, solo AAS.", "HEART 0–3 + curva negativa (MACE <1%) → alta y control por el médico de familia.", "HEART ≥4 con curva negativa → Cardiología (guardia 25402): test de isquemia precoz (prueba de esfuerzo L–V, SPECT lunes y jueves, eco de estrés viernes) + visita virtual CAR 52.", "Troponina positiva o HEART ≥4 → monitorizar e interconsulta a Cardiología.", "Dolor que persiste tras nitratos con ECG normal → Cardiología YA (ECG seriados)."]}, {"type": "h", "text": "Escenario 4 · No coronario"}, {"type": "list", "items": ["SAA (TC) → Cardiología. TEP con sobrecarga derecha → Neumología o Cardiología. Neumotórax → Cirugía. Taponamiento → Cardiología."]}, {"type": "h", "text": "Nitroglicerina SL (0,4 mg en spray)"}, {"type": "list", "items": ["NO si: ha tomado inhibidores de la PDE5, sospecha de IAM de VD (↑ST en V3R–V4R), pulso paradójico, TAS <90.", "No dar doble antiagregación de rutina a cualquier dolor torácico."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Algoritmos de troponina (ESC 2023, SCA): se recomienda 0/1 h (o 0/2 h) con troponina de alta sensibilidad, validados para cada ensayo. El 0/3 h del protocolo queda como alternativa. Para la TnT-hs Elecsys: descartar si 0 h <5 ng/L, o <12 con Δ1h <3.", "Pretratamiento con inhibidor de P2Y12:", "SCASEST con cateterismo precoz (<24 h): no se recomienda de rutina (ESC 2023: III). Coincide con dar el 2º antiagregante después del cateterismo.", "IAMCEST con ICP primaria: puede considerarse (IIb).", "Prasugrel preferente frente a ticagrelor en el SCA que va a ICP (ensayo ISAR-REACT 5; ESC 2023 IIa). Coincide.", "ACC/AHA/ACEP 2025 (guía de SCA): concepto de IAM por oclusión (OMI). Algunos pacientes sin criterios clásicos de ↑ST se benefician de cateterismo inmediato (De Winter, posterior, Sgarbossa modificado de Smith).", "Sgarbossa modificado (Smith): ↑ST discordante ≥25% de la S. Es más sensible que el criterio clásico de ≥5 mm.", "SAA: escala ADD-RS + dímero D (<500) para descartarlo en riesgo bajo (ESC 2024 de aorta)."]}]}], "sources": "Byrne RA et al. 2023 ESC Guidelines for ACS (Eur Heart J 2023); Rao SV et al. 2025 ACC/AHA/ACEP/NAEMSP/SCAI ACS Guideline (Circulation 2025); Schüpke S et al. ISAR-REACT 5 (N Engl J Med 2019); Mazzolai L et al. 2024 ESC Guidelines on peripheral arterial and aortic diseases (Eur Heart J 2024).", "cats": ["cardio"], "vital": true}, {"title": "Encefalopatía hepática (cirrosis, tipo C)", "page": 44, "protocol": "ENCEFALOPATIA HEPÀTICA", "service": "Protocol d'actuació a Urgències, Digestivo", "date": "mar 2021", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Cirrótico con confusión, alteración de conducta o del nivel de conciencia, asterixis (flapping). Generalmente reversible.", "West Haven: I (alteraciones sutiles, inversión del sueño) · II (desorientación, flapping) · III (somnolencia, estupor, confusión marcada) · IV (coma).", "Precipitantes (buscarlos siempre): infección (PBE, ITU, neumonía), HDA, estreñimiento, diuréticos, hiponatremia o hipopotasemia, FRA, BZD u opioides, deshidratación, TIPS, transgresión dietética."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Hipoglucemia, hiperosmolar, uremia, hipercapnia.", "Alcohol: intoxicación, abstinencia, Wernicke, delirium tremens.", "Otros tóxicos, trastorno psiquiátrico.", "Lesión estructural (HSD por caída en paciente con coagulopatía, ictus, absceso) → TC si hay focalidad. Infección del SNC (PL)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucemia, función hepática (bilirrubina, GPT, FA, TP), función renal, iones, hemograma.", "Sedimento + urocultivo, hemocultivos, paracentesis diagnóstica (\"Líquido ascítico\"), Rx de tórax. Tacto rectal (melenas).", "Eco o TC abdominal si no estaba diagnosticado de cirrosis o hay dolor abdominal.", "TC craneal: si hay focalidad, dudas clínicas, trauma o coagulopatía grave sin mejoría en 12 h."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Fase 1 · Medidas generales"}, {"type": "list", "items": ["Grado III–IV: cabecera a 45°, SNG en declive, dieta absoluta + nutrición, sonda urinaria. Grado IV o GCS <8 → IOT + UCI (semicríticos o UCI en grado III).", "Dieta SIN restricción proteica (las dietas hipoproteicas empeoran el pronóstico).", "Retirar diuréticos y sedantes. Corregir la volemia y los iones."]}, {"type": "h", "text": "Fase 2 · Tratar el precipitante"}, {"type": "list", "items": ["Infección: cultivos + ATB empírico (ver Infecciones en el cirrótico). HDA: ver su protocolo. Estreñimiento: enemas + lactitol.", "BZD: flumazenilo (puede evitar la IOT en grado III–IV)."]}, {"type": "h", "text": "Fase 3 · Específico"}, {"type": "list", "items": ["LACTITOL 10–20 mL/6–8 h VO o por SNG (disacáridos no absorbibles, 60–80 g/día en 3–4 dosis) hasta conseguir 2–3 deposiciones blandas al día.", "Enemas de limpieza cada 8 h (o enemas de lactulosa)
