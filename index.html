ometría."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["ECG + monitorización. Glucosa, iones en plasma y orina, función renal, GSV, hemograma (CK, ácido úrico o LDH si se sospecha lisis o rabdomiólisis; digoxinemia si la toma).", "Iones y ECG a las 4 h de empezar el tratamiento."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "En todos"}, {"type": "list", "items": ["Box monitorizado. Retirar los fármacos hiperkalemiantes."]}, {"type": "h", "text": "Leve (5,1–5,9)"}, {"type": "list", "items": ["Dieta pobre en K.", "Poliestireno sulfonato cálcico (Resincalcio) 20–40 g/8 h VO (no con sorbitol; evitar si hay íleo, posoperatorio u opioides).", "Salbutamol nebulizado 20 mg (10 mL) + 1 mL de SF en 10 min (o 0,5 mg IV en 100 mL de SG5% en 20 min). Evitar si hay FA, cardiopatía isquémica reciente o TSV."]}, {"type": "h", "text": "Moderada (6,0–6,4)"}, {"type": "list", "items": ["Lo anterior +", "INSULINA RÁPIDA 10 UI + 3 ampollas de SG 50% (20 mL cada una) en 50 mL de SF, en 10–15 min. En IMASIS: protocolo \"hiperpotasemia\". Riesgo de hipoglucemia: controlar la glucemia.", "Bicarbonato 1M 50–100 mEq en 30 min solo si hay acidosis metabólica."]}, {"type": "h", "text": "Grave (≥6,5) o con cambios en el ECG"}, {"type": "list", "items": ["Lo anterior +", "GLUCONATO CÁLCICO 10%: 10–30 mL IV a 2–5 mL/min, repetible a los 5–10 min si persisten los cambios del ECG.", "Con digoxina: diluir en 100 mL de SG5% y pasar en 20–30 min. No usar la misma vía que el bicarbonato (precipita).", "Furosemida si no hay hipovolemia.", "Diálisis si no se controla (sobre todo en la ERC terminal o la lisis)."]}, {"type": "h", "text": "Crónico"}, {"type": "list", "items": ["Tratar la causa, dieta, diuréticos (tiazida o de asa), retirar fármacos. Fludrocortisona si hay hipoaldosteronismo hiporreninémico. Control por el médico de familia."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Insulina-glucosa: las guías recientes (UK Kidney Association 2023, ERC 2021) usan 10 UI + 25 g de glucosa (= 50 mL de SG 50%). Si la glucemia es <126 mg/dL (7 mmol/L), añadir SG 10% a 50 mL/h durante 5 h, porque la hipoglucemia aparece hasta 6 h después, sobre todo en la ERC. Las 3 ampollas del protocolo dan 30 g. Controlar la glucemia cada hora durante 6 h.", "Nuevos quelantes: patiromer y ciclosilicato de sodio y zirconio (SZC, Lokelma 10 g/8 h). El SZC actúa en ~1 h y es útil también en la hiperpotasemia aguda (UK KA 2023, KDIGO 2024). Permiten mantener los IECA, ARA-II o ARM en la IC o la ERC. El poliestireno sulfonato tiene poca evidencia y riesgo de necrosis intestinal.", "Bicarbonato: las guías lo reservan para la acidosis metabólica (pH <7,2). Coincide.", "Calcio: el cloruro cálcico 10% (10 mL) aporta 3 veces más calcio, pero necesita vía central o una vena gruesa."]}]}], "sources": "UK Kidney Association Clinical Practice Guideline: Treatment of acute hyperkalaemia in adults (2023); Lott C et al. ERC Guidelines 2021: Cardiac arrest in special circumstances (Resuscitation 2021); KDIGO 2024 CKD Guideline.", "cats": ["metab"], "vital": true}, {"title": "Hiperprolactinemia", "page": 67, "protocol": "PROTOCOLO HIPERPROLACTINEMIA", "service": "Ginecología", "date": "v2, 2022", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Mujer: oligo/amenorrea, galactorrea, infertilidad, osteopenia. Hombre: ↓ de la libido, disfunción eréctil, ginecomastia.", "Macroprolactinoma (>10 mm): cefalea, alteraciones del campo visual (hemianopsia bitemporal), hipopituitarismo.", "Pedir PRL solo si hay clínica sugestiva."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Embarazo y lactancia (fisiológico), hipotiroidismo primario (TRH alta), insuficiencia renal o hepática.", "Fármacos antidopaminérgicos: antipsicóticos, metoclopramida, domperidona, sulpirida, tricíclicos, opiáceos, verapamilo, metildopa.", "Estrés o venopunción, ejercicio, comida o relación sexual reciente. Macroprolactina (si la analítica no cuadra con la clínica).", "Apoplejía hipofisaria: cefalea brusca + alteración visual u oftalmoplejía + hipotensión → urgencia (corticoides, TC o RM, Neurocirugía)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["PRL (normal <25 µg/L en la mujer; repetirla para confirmar, extraída >1 h después de despertar o comer).", "β-HCG, TSH/T4L, función renal y hepática. Macroprolactina si hay discordancia. Perfil hipofisario completo si hay lesión selar.", "RM hipofisaria (TC con contraste si está contraindicada) cuando se hayan descartado las causas secundarias, y siempre si hay cefalea o alteración visual. Campimetría si es un macroadenoma."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Microprolactinoma (<10 mm)"}, {"type": "list", "items": ["Tratar solo si: infertilidad, galactorrea molesta, alteración de la pubertad, hipogonadismo prolongado o pérdida ósea. Si no: seguimiento con PRL (RM si sube o hay efecto masa).", "Si tiene hipogonadismo y no desea gestación: los ACO no están contraindicados."]}, {"type": "h", "text": "Macroprolactinoma (>10 mm)"}, {"type": "list", "items": ["Tratar siempre y derivar (Endocrinología o Neurocirugía)."]}, {"type": "h", "text": "Fármacos (agonistas dopaminérgicos)"}, {"type": "list", "items": ["Deseo gestacional: bromocriptina (Parlodel; comprimidos de 2,5 mg). Empezar con dosis baja y subir 1,25 mg/semana hasta ~7,5 mg/día (rango 2,5–15). Suspender al confirmar el embarazo.", "Cabergolina: más eficaz y mejor tolerada (0,25–0,5 mg 1–2 veces/semana). Menos experiencia en el embarazo.", "Objetivo: normalizar la PRL (no hace falta suprimirla del todo)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Endocrine Society 2011 y consenso de la Pituitary Society (Petersenn, Nat Rev Endocrinol 2023): la CABERGOLINA es el agonista de 1ª elección (más eficaz para normalizar la PRL y reducir el tumor, y mejor tolerada). La bromocriptina queda para cuando se desea gestación, como opción razonable, aunque la evidencia de seguridad con cabergolina en el embarazo ya es amplia (>1000 embarazos).", "Cabergolina a dosis altas (>2 mg/semana, como en el Parkinson): ecocardiograma por el riesgo de valvulopatía. A las dosis de prolactinoma, el riesgo es mínimo.", "Cirugía transesfenoidal: el consenso de 2023 la considera alternativa de 1ª línea en el microprolactinoma (curación >80% en centros con experiencia)."]}]}], "sources": "Melmed S et al. Endocrine Society guideline on hyperprolactinemia (J Clin Endocrinol Metab 2011); Petersenn S et al. Diagnosis and management of prolactin-secreting pituitary adenomas: Pituitary Society international consensus (Nat Rev Endocrinol 2023).", "cats": ["endo", "gineuro"], "vital": false}, {"title": "Hipertensión intracraneal (HTIC)", "page": 68, "protocol": "HIPERTENSIÓ INTRACRANIAL", "service": "Medicina Intensiva", "date": "v2, sep 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["PIC ≥20 mmHg (umbral de tratamiento 22). PPC = PAM − PIC; mantenerla en 60–70 mmHg.", "Clínica: cefalea, vómitos, deterioro de la conciencia, papiledema, tríada de Cushing (HTA + bradicardia + respiración irregular), midriasis unilateral (herniación uncal), posturas anómalas.", "Causas: TCE, HIC, HSA, tumor, absceso, ictus maligno, trombosis de senos, meningitis o encefalitis, insuficiencia hepática fulminante, encefalopatía hipertensiva, hiponatremia, CAD, anoxia."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Lesión quirúrgica (hematoma epidural o subdural, hidrocefalia) → TC urgente y Neurocirugía. Crisis comiciales (EEG). Hipoxia, hipercapnia, fiebre, hipoNa (causas extracraneales)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["TC craneal urgente (repetirla si empeora). Gasometría (pCO2, pO2), iones (Na y osmolalidad), glucemia, coagulación, hemograma.", "EEG si se sospecha estatus no convulsivo. Doppler transcraneal (vasoespasmo en la HSA).", "En la UCI: monitorización de PIC y PtiO2."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales (nivel 0; también en Urgencias)"}, {"type": "list", "items": ["Cabecera a 30°, cabeza en línea media, sin compresión yugular (collarín flojo).", "IOT si GCS ≤8. SatO2 >94% y PaO2 >80; PaCO2 35–38 (normocapnia).", "PAM y PPC ≥60–70. Fluidos isotónicos (SF, Plasma-Lyte). NO sueros glucosados ni hipotónicos.", "HTA: labetalol (bolo de 15–25 mg; perfusión de 1–2 mg/min), esmolol o clevidipino. No usar nitratos (vasodilatación cerebral).", "Normotermia (tratar la fiebre >38 °C), normoglucemia, Na en rango normal-alto. Sedoanalgesia (propofol + opioide de acción corta).", "Profilaxis anticomicial solo en TCE con fractura hundida, contusión o hematoma: levetiracetam 20 mg/kg y después 500 mg/12 h (o fenitoína 15–20 mg/kg) durante 7 días."]}, {"type": "h", "text": "Nivel 1 · Osmoterapia en bolos (si hay deterioro o PIC >22)"}, {"type": "list", "items": ["SALINO HIPERTÓNICO 3% (de elección): bolo de 100 mL (30 mL de NaCl 34% + 70 mL de SF).", "O MANITOL 20%: 0,25–1 g/kg en 20–30 min. Vigilar hipoTA, FRA y osmol gap >20.", "Aumentar la sedación. Drenaje ventricular externo si hay hidrocefalia. PaCO2 en el límite bajo de la normalidad."]}, {"type": "h", "text": "Nivel 2–3 (UCI)"}, {"type": "list", "items": ["Hipocapnia leve 32–35 (temporal) → bloqueo neuromuscular → craniectomía descompresiva, coma barbitúrico, hipotermia leve (35–36 °C), PaCO2 30–32 solo como puente."]}, {"type": "h", "text": "NO recomendado de rutina"}, {"type": "list", "items": ["Manitol en perfusión continua, furosemida, corticoides (en el TCE aumentan la mortalidad: CRASH), hipotermia <35 °C, PaCO2 <30, PPC >90 de rutina, propofol a dosis de brote-supresión."]}, {"type": "h", "text": "Corticoides SOLO en"}, {"type": "list", "items": ["Meningitis bacteriana: dexametasona 10 mg/6 h IV antes del ATB.", "Edema peritumoral: dexametasona 4 mg/6 h."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Consenso SIBICC (2019–2020; TCE grave): es la base del sistema de niveles del protocolo, junto con la BTF 2016. Coincide.", "Salino hipertónico vs manitol: el metaanálisis Cochrane 2020 y el ensayo COBI 2023 (bolos de SSH al 20% en el TCE) no muestran diferencias en el pronóstico funcional. Los dos son válidos. El SSH dura más y produce menos rebote.", "Hipotermia profiláctica en el TCE: no recomendada (ensayos POLAR 2018 y Eurotherm 2015: sin beneficio o con daño). Coincide (solo 35–36 °C en el nivel 3).", "Ácido tranexámico en el TCE leve-moderado en <3 h (ensayo CRASH-3, Lancet 2019): reduce la muerte por TCE. Se trata en la ficha de TCE."]}]}], "sources": "Hawryluk GWJ et al. SIBICC algorithm for severe TBI (Intensive Care Med 2019); Carney N et al. BTF Guidelines 4th ed. (Neurosurgery 2017); Chen H et al. Hypertonic saline vs other ICP-lowering agents (Cochrane 2020); Cooper DJ et al. POLAR (JAMA 2018).", "cats": ["neuro"], "vital": true}, {"title": "Hipocalcemia", "page": 69, "protocol": "Hipocalcemia en Urgencias", "service": "Endocrinología", "date": "v2, dic 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Ca total <8,5 mg/dL (corregido: Ca + 0,8 × (4 − albúmina)) o Ca iónico <1,16 mmol/L.", "Clínica: parestesias periorales y acras, Chvostek, Trousseau, espasmo carpopedal, tetania, laringoespasmo o broncoespasmo, convulsiones, QT largo (torsades), hipoTA, IC.", "Causas:", "Hipoparatiroidismo posquirúrgico (la más frecuente: tiroidectomía o paratiroidectomía; hueso hambriento), autoinmune, infiltrativo.", "Déficit de vitamina D, ERC, hipomagnesemia, pancreatitis, lisis tumoral, hiperfosfatemia, sepsis, alcalosis aguda.", "Fármacos: bifosfonatos, denosumab, cinacalcet, foscarnet, fenitoína, citrato (transfusión masiva)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Pseudohipocalcemia por hipoalbuminemia (mirar el Ca iónico).", "Hipomagnesemia (alcoholismo, pérdidas GI, IBP): si no se corrige el Mg, la hipocalcemia no se corrige."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Urgencias: Ca total e iónico, iones, función renal, GSV. ECG (QT). Repetir si es asintomática y hay dudas.", "Laboratorio central ANTES de suplementar: Ca, Ca iónico, fósforo, Mg, albúmina, PTH, 25-OH-vitamina D.", "Monitorizar si Ca <7, síntomas graves o QT largo."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Grave (síntomas graves, QT largo, Ca corregido ≤7 o iónico ≤0,8)"}, {"type": "list", "items": ["Monitorización.", "Bolo de GLUCONATO CÁLCICO 10%: 1–2 ampollas (90–180 mg de Ca elemento) en 50–100 mL de SG5% en 10–20 min. Repetible si persisten los síntomas.", "No ponerlo más rápido (disfunción sistólica). No mezclarlo con bicarbonato ni fosfato. Precaución con digoxina.", "Después, perfusión de gluconato cálcico a 0,5 mg/kg/h (de Ca elemento) en 500 mL de SG5%.", "Ejemplo con 70 kg: 35 mg/h = 840 mg/24 h ≈ 9–10 ampollas en 500 mL a 21 mL/h.", "Si no se normaliza en 12–24 h: subir a 1–1,5 mg/kg/h.", "+ VO desde el inicio: carbonato cálcico 500 mg/8 h + calcitriol (Rocaltrol) 0,25 mcg/24 h.", "Ca cada 6 h. Interconsulta URGENTE a Endocrinología (busca 25223).", "ERC con hipocalcemia asintomática: no dar calcio IV. Priorizar la hiperfosfatemia y el calcitriol."]}, {"type": "h", "text": "Si hay hipomagnesemia (o no responde en 12–24 h)"}, {"type": "list", "items": ["Extraer el Mg y después sulfato de Mg 15%: 1 ampolla (1,5 g = 12,2 mEq) en 50 mL de SG5% en 10–20 min → 0,5 mEq/kg/6 h hasta Mg >1 mg/dL → Mg oral 1 comprimido/8 h. Precaución en la insuficiencia renal."]}, {"type": "h", "text": "Leve-moderada (asintomática o síntomas leves, Ca corregido >7 o iónico >0,8)"}, {"type": "list", "items": ["Carbonato cálcico 500 mg/8 h VO + calcitriol 0,25 mcg/día.", "Ca a las 24 h si es aguda y en 1 semana si es crónica. Hipoparatiroidismo conocido: comprobar el cumplimiento o subir el calcio un 50%.", "Hospital de Día de Endocrinología (ext. 5760/5761)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Society for Endocrinology (2016): bolo de 10–20 mL de gluconato cálcico 10% en 50–100 mL de SG5% en 10 min. Después, 100 mL de gluconato 10% en 1 L de SG5% o SF a 50–100 mL/h. Es equivalente al protocolo.", "Hipoparatiroidismo crónico (guía internacional 2022): objetivo de Ca en el límite bajo de la normalidad, sin hipercalciuria. Palopegteriparatida (Yorvipath, EMA 2023) para el hipoparatiroidismo mal controlado con el tratamiento convencional.", "Denosumab: riesgo de hipocalcemia grave en la ERC avanzada o en diálisis (alerta FDA 2024). Medir el Ca antes y después."]}]}], "sources": "Turner J et al. Society for Endocrinology emergency guidance: acute hypocalcaemia (Endocr Connect 2016); Khan AA et al. Management of hypoparathyroidism: international guidelines (J Bone Miner Res 2022); FDA Drug Safety Communication on denosumab in CKD (2024).", "cats": ["metab"], "vital": false}, {"title": "Hipomagnesemia", "page": 70, "protocol": "HIPOMAGNESEMIA", "service": "Endocrinología", "date": "feb 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Mg <1,5 mg/dL. Leve 1–1,5 · grave <1. Muy frecuente en alcohólicos (30%) y en UCI (60%).", "Causas:", "Alcohol, desnutrición, realimentación.", "Pérdidas GI (diarrea, SNG, malabsorción, fístulas).", "Pérdidas renales: diuréticos, aminoglucósidos, anfotericina, cisplatino, ciclosporina, foscarnet; Gitelman o Bartter.", "IBP crónico, pancreatitis, hueso hambriento.", "Clínica (no se correlaciona con el nivel): debilidad, temblor, tetania, Chvostek y Trousseau, convulsiones, nistagmo vertical, delirium.", "ECG: PR y QT largos, T plana, torsades, TV, FA.", "Se acompaña de hipoK e hipoCa que no se corrigen sin reponer el Mg."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucosa, urea, creatinina, iones, Ca, P, GSV, Mg. ECG.", "Mg: llamar al laboratorio de Urgencias (ext. 3028) (no está en el petitorio).", "Mg en orina para la causa: Mg urinario >20 mg/24 h o EFMg >0,5% → pérdida renal; <20 mg o <0,5% → pérdida extrarrenal."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Presentaciones"}, {"type": "list", "items": ["IV: sulfato de Mg 15% (Sulmetin): 1 ampolla = 10 mL = 1,5 g = 12,2 mEq.", "VO: lactato de Mg (Magnesioboi; 4 mEq/comprimido), Magnogene (4,3 mEq), pidolato (Actimag; 14,2 mEq/5 mL), Magnesio NM sobre (16,6 mEq)."]}, {"type": "h", "text": "Dosis"}, {"type": "list", "items": ["Leve-moderada (>1): 8–32 mEq/día (máx. 1 mEq/kg/día), preferiblemente VO.", "Grave (<1): 32–64 mEq/día IV (máx. 1,5 mEq/kg/día)."]}, {"type": "h", "text": "Velocidad"}, {"type": "list", "items": ["Asintomático: 1 g/h; hasta 6 g (2 ampollas = 24 mEq) en 6–12 h; >6 g en 12–24 h. Diluir en 500 mL de SF o SG5% (intermitente: 1 ampolla en 50 mL).", "Grave con síntomas (convulsiones, arritmia): hasta 32 mEq en 4–5 min (o 1 ampolla en 10 min).", "Torsades: sulfato de Mg 2 g IV en 1–2 min.", "Insuficiencia renal (Cr >2 o FG <50): reducir la reposición un 50%.", "Pérdidas crónicas: mantener 300–600 mg/día VO."]}, {"type": "h", "text": "Monitorización"}, {"type": "list", "items": ["ECG hasta Mg >1,5. Constantes cada hora hasta Mg >1, y después cada 6 h hasta >1,5.", "Grave: Mg, K, Ca, Na, GSV e iones en orina cada 6 h. Leve: cada 12–24 h. (El Mg tarda en equilibrarse y hasta el 50% se elimina por la orina: no cortar la reposición antes de tiempo.)"]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Sin cambios relevantes. Torsades de pointes (ACLS/ERC): sulfato de Mg 2 g IV en bolo aunque el Mg sea normal.", "IBP crónico: la FDA y la EMA advierten de hipomagnesemia. Valorar retirarlo o cambiar a un anti-H2.", "Corregir antes el Mg que el K en la hipopotasemia refractaria. Coincide con el protocolo de hipopotasemia."]}]}], "sources": "ERC Guidelines 2021 – Special circumstances (Resuscitation 2021); FDA Drug Safety Communication: PPIs and hypomagnesemia; Ahmed F, Mohammed A. Magnesium: the forgotten electrolyte (Med Sci 2019).", "cats": ["metab"], "vital": false}, {"title": "Hiponatremia", "page": 71, "protocol": "MANEJO DE LA HIPONATREMIA EN URGENCIAS", "service": "Endocrinología/Urgencias", "date": "v3, 2025", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Na <135 mEq/L. Clínica con Na <130, más grave si Na <120 o instauración <48 h.", "Leve: anorexia, cefalea, náuseas, caídas. Moderada: confusión, alucinaciones, incontinencia. Grave: convulsiones, coma, bradicardia, SDRA, midriasis.", "Riesgo de encefalopatía grave: mujer en edad fértil, niño, lesión intracraneal, hipoxemia, potomanía, estrógenos, posoperatorio con opiáceos.", "Riesgo de desmielinización osmótica: anciano frágil, alcoholismo, hepatopatía, desnutrición, hipoK, tiazidas."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Pseudohiponatremia (TG o proteínas altas).", "Hiponatremia no hipotónica: hiperglucemia, manitol. Osm real − calculada >10 → etanol, manitol.", "Hipotiroidismo e insuficiencia suprarrenal (antes de diagnosticar SIADH).", "Fármacos: tiazidas, ISRS, carbamazepina u oxcarbazepina, opiáceos, ciclofosfamida, MDMA."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Plasma: iones, osmolalidad (calculada = 2Na + glucosa/18 + urea/2,8; eficaz = 2Na + glucosa/18), glucosa, urea, creatinina, ácido úrico, Hto. TSH y cortisol.", "Orina: osmolalidad + iones (Na, K) (es el dato clave).", "Osm urinaria <100 → exceso de agua (polidipsia, cerveza, enemas, sueros hipotónicos, irrigación en RTU).", "Osm urinaria >100 → valorar el volumen extracelular (VEC):", "↓VEC: Na en orina >20 → pérdidas renales (diuréticos, insuficiencia suprarrenal, pérdida cerebral de sal); <20 → pérdidas extrarrenales (GI, 3er espacio).", "↑VEC: IC, cirrosis, síndrome nefrótico.", "VEC normal: SIADH, hipotiroidismo, insuficiencia suprarrenal, tiazidas, poca ingesta de solutos.", "SIADH (de exclusión): Na <135, Osm plasmática <280, Osm urinaria >100, euvolemia, sin diuréticos y con tiroides y suprarrenal normales. A favor: Na en orina >40, ácido úrico <4, urea <10."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Agudo: Na <120 y/o síntomas moderados-graves y/o <48 h"}, {"type": "list", "items": ["SALINO HIPERTÓNICO 3% (preparación: 250 mL de SF + 3 ampollas de NaCl 20% = 30 mL).", "Bolo de 100 mL en ~10 min (con dosificador).", "Objetivo: subir 4–6 mEq/L en 24 h. Máx. 8–10 mEq/L en 24 h.", "Iones a las 2 h:", "Subida <1 y Na <120 → otro bolo de 100 mL.", "Subida 1–6 y Na <120 o persisten los síntomas → bolo de 50 mL.", "Subida >6 → no más bolos; tratar según la causa.", "Nuevo control a las 2 h. Si Na >120 o ha subido >6 desde el inicio → parar los bolos."]}, {"type": "h", "text": "No agudo: Na >120, crónica, síntomas leves"}, {"type": "list", "items": ["Medidas generales: tratar la causa, retirar los fármacos (sobre todo los diuréticos), reducir el agua libre, quitar los sueros hipotónicos, más sal.", "Osm urinaria <200 (dilucional): restricción hídrica.", "Osm urinaria >200 y ↓VEC: SF 0,9% 500 mL cada 8–12 h + ajustar los diuréticos.", "Osm urinaria >200 y ↑VEC: restricción + diurético de asa ± sal.", "Osm urinaria >200 y VEC normal: hipotiroidismo → levotiroxina; insuficiencia suprarrenal → hidrocortisona; SIADH → restricción ± retirar el fármaco.", "Na cada 6–12 h."]}, {"type": "h", "text": "SIADH"}, {"type": "list", "items": ["Fürst = (Na orina + K orina) / Na plasma.", "<0,5: restricción a 1000 mL.", "0,5–1: restricción a 500 mL.", ">1: probablemente no responda a la restricción.", "Si no responde: sal en sellos, urea, diurético de asa o tolvaptán → interconsulta a Endocrinología. Nutrición en planta."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Bolos de SSH: la guía europea (ESE/ESICM/ERA 2014) usa 150 mL de SSH 3% en 20 min, repetible 2–3 veces (objetivo +5 mEq/L en la 1ª hora). El ensayo SALSA (JAMA Intern Med 2021) mostró que los bolos intermitentes son tan seguros como la perfusión lenta, con menos necesidad de reajustes. El protocolo del hospital usa bolos más pequeños (100 mL), compatibles con este enfoque.", "Límites de corrección (panel de expertos de EE. UU. 2013; nefrología 2023): mínimo 4–6 y máximo 10 mEq/L en 24 h, 8 mEq/L si hay riesgo de desmielinización.", "Si se corrige demasiado rápido: desmopresina 2–4 mcg IV + SG5% para volver a bajar el Na. No está en el protocolo.", "Urea oral (15–30 g/día): eficaz y segura en el SIADH (guía europea 2014; series de 2018–2023). Es una alternativa barata al tolvaptán.", "Tolvaptán: evitarlo si hay hepatopatía. Empezar con 7,5 mg y no restringir líquidos a la vez."]}]}], "sources": "Spasovski G et al. European clinical practice guideline on hyponatraemia (Eur J Endocrinol 2014); Baek SH et al. SALSA trial (JAMA Intern Med 2021); Verbalis JG et al. Expert panel recommendations on hyponatremia (Am J Med 2013).", "cats": ["metab"], "vital": false}, {"title": "Hipopotasemia", "page": 72, "protocol": "HIPOPOTASEMIA", "service": "Endocrinología", "date": "feb 2023", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["K <3,5 mmol/L. Grave <2,5.", "Clínica: debilidad ascendente, calambres, parálisis flácida, rabdomiólisis (K <2,5), íleo, poliuria.", "ECG: T aplanada o invertida, onda U, ↓ST, PR y QT largos, extrasístoles, arritmias. Más sensibilidad a la digoxina.", "Causas:", "GI (K en orina <15): vómitos, diarrea, laxantes, SNG, fístulas.", "Renales (K en orina >15): diuréticos, hiperaldosteronismo, Cushing, hipomagnesemia, Bartter o Gitelman, anfotericina, cisplatino.", "Redistribución: alcalosis, insulina (CAD), β-agonistas, catecolaminas (IAM, TCE, abstinencia), parálisis periódica (tirotóxica), hipotermia."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Pseudohipopotasemia (leucocitosis extrema).", "Redistribución (no hay déficit real → riesgo de hiperK al reponer).", "Hipomagnesemia asociada."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Glucosa, iones en plasma y en orina, función renal, GSV, hemograma. Mg (laboratorio central). ECG.", "Orientación: acidosis con AG normal + K en orina <15 → diarrea · alcalosis + Cl en orina <10 → vómitos o diuréticos previos · alcalosis + Cl en orina >10 → diuréticos actuales, hiperaldosteronismo o Cushing (con HTA), Bartter."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Asintomático + tolera VO + K >2,5"}, {"type": "list", "items": ["K oral 20–80 mEq/día repartidos (además de la dieta): Boi-K (ascorbato, 10 mEq), Boi-K aspártico (20 mEq), Potasion (cloruro, 8 mEq). Tomarlo tras las comidas. Máx. 10 mEq/h.", "Control a las 24 h."]}, {"type": "h", "text": "Sintomático, no tolera VO o K <2,5 (IV)"}, {"type": "list", "items": ["ClK (10 mEq/ampolla de 5 mL) diluido en SF (no en SG: baja el K al principio).", "Ritmo habitual: 20 mEq en 2–3 h. Máx. 10–20 mEq/h.", "Concentración máxima por vía periférica: 50 mEq/L (habitualmente 20–50). Si >60 mEq/L o >10 mEq/h → vía central (sin llegar a la aurícula).", "Monitorización ECG. K cada 4–6 h.", "Pérdidas renales masivas: añadir un ahorrador de K."]}, {"type": "h", "text": "Hipomagnesemia asociada (si no corrige o hay factores de riesgo)"}, {"type": "list", "items": ["Extraer el Mg y reponerlo de forma empírica.", "Mg 1–1,5 mEq/L + tolera VO: 20 mEq/día (Magnogene o MagnesioBOI 2 comprimidos/8 h).", "Mg <1 o síntomas o ECG alterado: IV (ver Hipomagnesemia). Reducir a la mitad si Cr >2."]}, {"type": "h", "text": "Otras consideraciones"}, {"type": "list", "items": ["Cada 1 mmol/L de descenso = déficit de 200–400 mEq (no aplicable si es por redistribución).", "Dieta absoluta: 1 mEq/kg/día (60–90 mEq) si la función renal es normal.", "IC o IAM reciente: mantener K ≥4. Vigilar el K al corregir una acidosis (lo desenmascara).", "CAD: ver su protocolo (no empezar insulina con K <3,3)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["K objetivo en la cardiopatía: el ensayo TIGHT-K (NEJM 2024), en posoperatorio de cirugía cardíaca, mostró que suplementar para K ≥4,5 no reduce la FA frente a ≥3,6. Revisa el clásico \"mantener K >4\".", "Parálisis periódica tirotóxica: reponer K con prudencia (hay hiperK de rebote) + propranolol.", "Velocidad IV (guías británicas y NHS): 10 mEq/h por vía periférica de forma habitual. Ritmos de hasta 20 mEq/h solo con monitor. Coincide."]}]}], "sources": "O'Brien B et al. TIGHT-K (N Engl J Med 2024); Kardalas E et al. Hypokalemia: a clinical update (Endocr Connect 2018); Society for Endocrinology / NHS IV potassium guidance.", "cats": ["metab"], "vital": false}, {"title": "Ictericia (y colangitis aguda)", "page": 73, "protocol": "ICTERÍCIA", "service": "Protocol d'actuació a Urgències, Digestivo", "date": "rev. may 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Coloración amarilla con bilirrubina >2,5 mg/dL. Coluria, acolia, prurito, síndrome tóxico.", "Indirecta: Gilbert, hemólisis, reabsorción de hematomas.", "Directa extrahepática: coledocolitiasis, neoplasia biliopancreática, pancreatitis crónica.", "Intrahepática o mixta: hepatitis aguda (virus, fármacos, setas, alcohol), cirrosis, metástasis, IC, trombosis portal o de suprahepáticas.", "Colangitis: fiebre + ictericia + dolor en HCD (tríada de Charcot)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Colangitis aguda (sepsis biliar), insuficiencia hepática aguda grave (transaminasas muy altas + ictericia + coagulopatía + encefalopatía en paciente sin hepatopatía), neoplasia (ictericia indolora + síndrome tóxico).", "Gilbert: bilirrubina indirecta aislada, sin anemia y con el resto normal → no hace falta estudiarlo más."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Historia: fármacos o herbolario en los últimos 3–6 meses, setas, alcohol o drogas, viajes, vacunas VHA/VHB, colecistectomía o coledocolitiasis previa.", "Exploración: asterixis (hepatopatía descompensada o IHAG), estigmas de hepatopatía.", "Hemograma (anemia normocítica → hemólisis; microcítica → pérdidas digestivas), perfil hepático (transaminasas >20 veces el LSN → hepatitis aguda; FA y GGT normales casi descartan obstrucción), coagulación (TP), función renal (bilirrubina >20 es nefrotóxica), PCR.", "Hemocultivos si se sospecha colangitis.", "Ecografía abdominal (de elección): dilatación de la vía biliar, colecistitis, cirrosis, LOE, suprahepáticas y porta.", "TC directo si se sospecha neoplasia (ictericia indolora o síndrome tóxico)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales"}, {"type": "list", "items": ["Sintomático (antiemético, antitérmico, analgesia). Sin AINE ni metamizol en la cirrosis.", "Prurito: colestiramina 4 g/8 h + antihistamínicos.", "Dieta absoluta + hidratación IV. Diuresis y constantes. Monitorizar si hay inestabilidad.", "Suspender temporalmente los anticoagulantes y antiagregantes de vida larga (no hace falta suspender el AAS 100 mg).", "Vitamina K (fitomenadiona): ictericia obstructiva con AVK (objetivo INR <1,5). Valorarla si el TP es bajo y hay desnutrición o alcohol."]}, {"type": "h", "text": "Colangitis aguda (ATB tras los hemocultivos)"}, {"type": "list", "items": ["Estable y comunitaria: amoxicilina-clavulánico 2 g/8 h (ajustar a la función renal) o ceftriaxona 1 g/24 h + metronidazol 500 mg/8 h.", "Inestable o nosocomial: piperacilina-tazobactam 4/0,5 g/8 h o carbapenem.", "Avisar a Digestivo para el drenaje biliar (CPRE)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Guías de Tokio 2018: gravedad I/II/III. Drenaje biliar urgente (CPRE) en el grado III (con disfunción orgánica) y precoz (<24–48 h) en el grado II. ATB 4–7 días tras controlar el foco (más si hay bacteriemia por cocos grampositivos).", "Piperacilina-tazobactam: la dosis habitual en la sepsis es 4/0,5 g/6 h (o en perfusión extendida). La pauta cada 8 h del protocolo es baja para el paciente grave (ver la ficha de dosis EUCAST).", "Coledocolitiasis (ESGE 2019, ASGE 2019): probabilidad alta (colangitis, bilirrubina >4 con colédoco dilatado, cálculo visto en la ecografía) → CPRE directa. Probabilidad intermedia → colangio-RM o ecoendoscopia antes.", "Hepatotoxicidad por fármacos: valorar con la escala RUCAM (EASL 2019)."]}]}], "sources": "Kiriyama S et al. Tokyo Guidelines 2018: diagnostic criteria and severity grading of acute cholangitis (J Hepatobiliary Pancreat Sci 2018); Manes G et al. ESGE guideline on endoscopic management of common bile duct stones (Endoscopy 2019); EASL Clinical Practice Guidelines: Drug-induced liver injury (J Hepatol 2019).", "cats": ["dig"], "vital": false}, {"title": "Incontinencia urinaria crónica (anciano)", "page": 74, "protocol": "INCONTINÈNCIA URINÀRIA CRÒNICA", "service": "Atenció Intermèdia, Geriatría", "date": "rev. nov 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Crónica: dura más de 1 mes, o es funcional de inicio reciente y persiste pese a aplicar su protocolo.", "Urgencia: deseo imperioso, polaquiuria, pérdidas moderadas o grandes, sin residuo. Causas: Parkinson, ictus, demencia, litiasis, ITU, HBP.", "Esfuerzo: pérdidas pequeñas con tos, Valsalva o cambios posturales. Mujer multípara, hipoestrogenismo, obesidad, cirugía pélvica o prostática.", "Rebosamiento: goteo continuo, chorro débil, residuo ≥100 mL. Obstrucción (HBP, estenosis uretral) o detrusor hipocontráctil (lesión medular, neuropatía diabética).", "Mixta: urgencia + esfuerzo. Funcional: el problema es de movilidad, no urogenital."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Causas reversibles: ITU, impactación fecal, retención aguda, delirium, poliuria (hiperglucemia, hipercalcemia).", "Fármacos: diuréticos, alfabloqueantes (esfuerzo en la mujer), IECA (tos), anticolinérgicos, opioides, calcioantagonistas, sedantes, antipsicóticos, ADT, ISRS, IACE, litio, gabapentina, glitazonas, AINE.", "Derivar a Urología o Ginecología si hay cirugía o radioterapia pélvica previa, prostatismo, hematuria persistente o prolapso.", "Vejiga flácida neurógena si hay residuo: explorar los reflejos anal y bulbocavernoso (S3-S4) y el tusígeno-anal (abolido con los anteriores conservados → lesión medular alta)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Residuo posmiccional (sondaje o ecografía vesical). Es la decisión clave: ≥100 mL o <100 mL.", "Sin residuo: maniobra de Valsalva (toser 3 veces con un absorbente sobre la uretra) o anamnesis de esfuerzo.", "Sedimento y urocultivo si procede, glucemia y calcio. Diario miccional.", "No estudiar si hay demencia grave, situación terminal o dependencia severa con mal pronóstico funcional: solo absorbentes."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales (todas)"}, {"type": "list", "items": ["Facilitar el acceso al WC, ropa fácil de quitar y absorbentes. Fibra (evitar la impactación). Evitar cafeína, alcohol, té, picantes y edulcorantes.", "Hidratación de predominio diurno. Reducir los líquidos 2–3 h antes de acostarse."]}, {"type": "h", "text": "Rebosamiento (residuo ≥100 mL)"}, {"type": "list", "items": ["Obstrucción por HBP: alfabloqueante y valorar corregir la causa (Urología).", "Detrusor hipocontráctil: sondaje intermitente de elección. Sonda permanente si no es factible."]}, {"type": "h", "text": "Esfuerzo"}, {"type": "list", "items": ["Ejercicios de suelo pélvico (fisioterapia). La cirugía es de elección según el riesgo.", "Duloxetina 60–90 mg/día (fuera de ficha técnica; respuesta 30–50 %; mala tolerancia)."]}, {"type": "h", "text": "Urgencia (vejiga hiperactiva)"}, {"type": "list", "items": ["Terapia conductual: micciones programadas cada 2 h o **micción estimulada (*prompted voiding*)** cada 2–3 h. Ampliar el intervalo 30–60 min tras 2 días seco.", "Mirabegrón 25–50 mg/24 h (25 mg si hay IR, IH o inhibidores del CYP3A4). Evitar con TA >180/110 o arritmias. Contraindicado si FG <15.", "Antimuscarínicos: – Solifenacina 5–10 mg/24 h (menor impacto cognitivo; 5 mg si FG <30). – Tolterodina 2 mg/12 h o 4 mg LP/24 h. – Fesoterodina 4–8 mg/24 h (máximo 4 mg si FG <30 o inhibidores del CYP3A4). – Evitar oxibutinina y propiverina en el anciano (criterios de Beers).", "Refractaria: toxina botulínica intravesical (repetir cada 6–9 meses; riesgo de retención e ITU)."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Errata del protocolo: la fesoterodina es 4–8 mg cada 24 h, no cada 8 h.", "Agonista β3 antes que antimuscarínico en el anciano o con deterioro cognitivo (AUA/SUFU 2024, EAU 2025, Beers 2023). La carga anticolinérgica acumulada se asocia a demencia.", "Vibegrón 75 mg/24 h: otro agonista β3, sin ajuste por CYP. Aprobado en la UE en 2024.", "Esfuerzo: la duloxetina ya no se recomienda de forma rutinaria (EAU, NICE NG123) por su mala tolerancia. Estrógenos vaginales en la mujer posmenopáusica con síntomas urinarios (síndrome genitourinario).", "Estimulación percutánea del nervio tibial posterior: alternativa de tercera línea a la toxina en la urgencia refractaria."]}]}], "sources": "Cameron AP et al. AUA/SUFU Guideline: Idiopathic Overactive Bladder (2024); EAU Guidelines on Non-neurogenic Female LUTS (2025); NICE NG123 Urinary incontinence and pelvic organ prolapse in women (actualizada 2019); American Geriatrics Society Beers Criteria (2023).", "cats": ["gineuro", "tec"], "vital": false}, {"title": "Infección del tracto urinario (cistitis, pielonefritis, prostatitis, orquiepididimitis)", "page": 75, "protocol": "PROTOCOLO DE MANEJO Y TRATAMIENTO DE ITU", "service": "PROA", "date": "v2, ene 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Cistitis no complicada: mujer sin alteraciones urológicas, sin ATB reciente y sin ITU recurrente.", "Cistitis complicada: embarazo, alteración anatómica o funcional, ITU recurrente, ATB en los últimos 3 meses, hospitalización reciente, sonda o nefrostomía, inmunodepresión, DM mal controlada.", "Varón: la cistitis aislada es excepcional. Asumir afectación prostática (ecografía con residuo).", "Pielonefritis o urosepsis: fiebre, dolor lumbar y puñopercusión positiva.", "Riesgo de multirresistentes (MR): sonda, manipulación urológica reciente, ATB previo, infección nosocomial o asociada a cuidados, colonización previa por MR (BLEE, *Pseudomonas*, enterococo resistente a ampicilina)."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["No tratar la bacteriuria asintomática. Solo se trata en la embarazada y antes de una manipulación urológica con rotura de mucosa (RTU, biopsia renal). Tampoco en el trasplantado renal pasado el primer mes.", "Candiduria asintomática: no tratar (solo en inmunodeprimidos o antes de cirugía urológica). Retirar o cambiar la sonda.", "Paciente sondado: orina turbia o maloliente y piuria no son infección. No pedir urocultivo de control si está asintomático.", "PNA obstructiva (litiasis): necesita drenaje. Absceso renal o prostático si no hay respuesta en 48–72 h. RAO concomitante en la prostatitis."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Urocultivo en todos los casos salvo en la cistitis no complicada. Siempre antes del ATB en el sondado.", "Hemocultivos en la PNA que ingresa o en la sepsis. Analítica con función renal y PCR o PCT.", "Imagen en la PNA (preferiblemente TC) si hay sepsis, litiasis previa, trasplante renal, Bricker u otros dispositivos, o fiebre persistente >72 h con un ATB adecuado.", "Orquiepididimitis: urocultivo y cultivo de exudado uretral. **PCR de gonococo y *Chlamydia*** si hay riesgo de ITS.", "Criterios de ingreso de la PNA: anciano, DM, inmunodepresión, cirrosis o IR, inestabilidad o sepsis, sospecha de complicación local o bacteriemia, FRA, obstrucción, imposibilidad de tratar en domicilio (vómitos), varón, riesgo de MR."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Cistitis"}, {"type": "list", "items": ["Empírico: fosfomicina-trometamol 3 g v.o. en dosis única (no complicada) o 2 dosis separadas 48 h (complicada), en ayunas y por la noche tras orinar. O nitrofurantoína 100 mg/8 h × 5 días (no si FG <45, ni en el varón, ni en la PNA; máximo 7 días).", "Dirigido, por orden: fosfomicina → nitrofurantoína → cotrimoxazol 800/160 mg/12 h × 3 días → amoxicilina 500 mg/8 h × 3–5 días → cefuroxima 500 mg/12 h × 3–5 días → cefixima 400 mg/24 h × 3–5 días.", "Sin quinolonas en la cistitis no complicada. Complicada: 5–7 días. Varón: ≥7 días, preferiblemente cotrimoxazol o quinolona.", "Embarazo: pautas cortas (no dosis única), sin nitrofurantoína."]}, {"type": "h", "text": "Pielonefritis o urosepsis (empírico)"}, {"type": "list", "items": ["1. Comunitaria sin ingreso: ceftriaxona 1 g IV o amikacina 15 mg/kg IV en dosis única → alta con cefuroxima 500 mg/12 h y control en el CAP a las 48 h.", "2. Comunitaria con ingreso: ceftriaxona 1 g/24 h IV (o amikacina 15 mg/kg/24 h). Alergia: aztreonam 1 g/8 h o amikacina.", "3. No grave con riesgo de MR: piperacilina-tazobactam 4/0,5 g/6 h. Alergia: teicoplanina 400 mg/12 h el primer día y luego 400 mg/24 h (o linezolid 600 mg/12 h) + aztreonam 2 g/8 h + amikacina. – BLEE previa: ertapenem 1 g/24 h (o imipenem 500 mg/6 h o meropenem 1–2 g/8 h). – *Pseudomonas* MDR o XDR:** meropenem 2 g/8 h + amikacina, o ceftolozano-tazobactam. Avisar a Infecciosa", "4. Shock séptico: teicoplanina (400 mg/12 h × 3 dosis, luego 400 mg/24 h) + imipenem 500 mg/6 h ± amikacina 15 mg/kg/24 h. Alergia: teicoplanina + aztreonam 2 g/8 h + amikacina.", "5. Obstructiva: drenaje urgente (catéter doble J o nefrostomía) + la pauta 2, 3 o 4.", "Amikacina: si FG <60, primera dosis de 10 mg/kg y la segunda según farmacocinética. Niveles antes de la segunda dosis. Evitar en el trasplantado renal."]}, {"type": "h", "text": "Paso a vía oral (según antibiograma) y duración"}, {"type": "list", "items": ["Orden: ciprofloxacino 500 mg/12 h (750 mg/12 h si *Pseudomonas*) o cotrimoxazol 800/160 mg/12 h → cefuroxima 500 mg/8–12 h → cefixima 400 mg/12–24 h → amoxicilina 1 g/8 h → amoxicilina-clavulánico 875/125 mg/8 h.", "Duración de la PNA: 7 días."]}, {"type": "h", "text": "Prostatitis aguda"}, {"type": "list", "items": ["Ambulatoria: ceftriaxona 2 g IV en dosis única → cefuroxima 500 mg/8 h. Con alergia no hay manejo ambulatorio: aztreonam 2 g/8 h e ingreso.", "Ingreso: ceftriaxona 1 g/24 h. Riesgo de MR: piperacilina-tazobactam 4/0,5 g/6 h (con alergia: aztreonam + linezolid + amikacina). Shock: la misma pauta que la PNA grave.", "Dirigido: ciprofloxacino 500–750 mg/12 h de elección, y si no, cotrimoxazol (por su penetración prostática).", "Duración: 14 días. 3–4 semanas si la respuesta es lenta (>7 días), hay bacteriemia, gravedad o complicaciones. Absceso → ecografía transrectal y Urología."]}, {"type": "h", "text": "Orquiepididimitis"}, {"type": "list", "items": ["Sin riesgo de ITS: ceftriaxona 2 g IV → cefuroxima 500 mg/8 h (ambulatorio) o ceftriaxona 1 g/24 h (ingreso). Después, quinolona o cotrimoxazol según antibiograma. 14 días. Alergia: aztreonam 2 g/8 h.", "Con riesgo de ITS: ceftriaxona 1 g IM + doxiciclina 100 mg/12 h × 10 días. Tratar a la pareja. Alergia: azitromicina 1 g en dosis única (o 500 mg y luego 250 mg/día hasta 4 días)."]}, {"type": "h", "text": "Sondado, candiduria y prostatitis crónica"}, {"type": "list", "items": ["Sondado: cambiar o retirar la sonda. La cistitis siempre es complicada (5–7 días, 10 si la respuesta es lenta). La PNA o prostatitis se trata como con riesgo de MR.", "Candiduria con indicación: fluconazol 200 mg/día × 7–10 días.", "Prostatitis crónica bacteriana: ciprofloxacino 750 mg/12 h 4–6 semanas (6–12 semanas si hay recidiva o calcificaciones). Derivar."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Duración: en la PNA con buena respuesta, 7 días de quinolona o betalactámico. En el varón febril, 7 días no son inferiores a 14 (ensayo de Yahav, CID 2019; IDSA 2025 sobre ITU complicada). El protocolo da 14 días por defecto en la prostatitis.", "IDSA 2025 (ITU complicada): acepta 5–7 días de quinolona o 7 días de otros fármacos si hay buena evolución, incluso con bacteriemia.", "Gonococo: la dosis actual es ceftriaxona 1 g IM (IUSTI Europa 2020). En EE. UU. (CDC 2021) es 500 mg (1 g si pesa ≥150 kg). Para *Chlamydia*, doxiciclina de elección. La azitromicina como alternativa al gonococo se desaconseja (resistencias).", "Pivmecilinam 400 mg/8 h × 3–5 días: de primera línea en la cistitis en las guías europeas (EAU 2025). Ya está disponible en EE. UU.", "Quinolonas: EMA 2018/2023, solo cuando no hay alternativa (efectos sobre tendones, aorta y SNC).", "Nuevos betalactámicos para MR: ceftazidima-avibactam, meropenem-vaborbactam, cefiderocol. Siempre con Infecciosas."]}]}], "sources": "EAU Guidelines on Urological Infections (2025); IDSA 2025 Guideline on Complicated UTI; Yahav D et al. Seven vs 14 days for Gram-negative bacteremia (CID 2019); Lafaurie M et al. Afebrile men UTI 7 vs 14 days (JAMA 2021); IUSTI European guideline on gonorrhoea (2020); CDC STI Treatment Guidelines (2021).", "cats": ["infec", "gineuro"], "vital": false}, {"title": "Infección intraabdominal: antibioterapia empírica", "page": 77, "protocol": "TRATAMIENTO ANTIBIÓTICO EMPÍRICO INFECCIÓN INTRAABDOMINAL", "service": "PROA", "date": "v1.0, dic 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Factores de riesgo (gravedad): inmunosupresión, neoplasia, cardiopatía o insuficiencia renal grave, hipoalbuminemia, >70 años, peritonitis generalizada, APACHE >10, sepsis o shock, control del foco tardío o insuficiente.", "Factores de riesgo de BLEE: ingreso en los últimos 3 meses, colonización o infección por BLEE en 6 meses, cefalosporinas o quinolonas en 3 meses, institucionalizado (en la nosocomial).", "Inestable: necesita vasopresores para TAM ≥65 + lactato >2 sin hipovolemia."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Hemocultivos si hay fiebre o inestabilidad.", "Cultivo intraoperatorio o del drenaje al colocarlo en toda IIA nosocomial o posquirúrgica y en la comunitaria con líquido libre. Frasco Portagerm (pinchar el tapón, no abrirlo) + tubo estéril para Gram y hongos.", "PBE: frascos de hemocultivo. No cultivar los drenajes ya colocados (no son representativos pasadas 12–24 h)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "IIA comunitaria · ESTABLE"}, {"type": "list", "items": ["Sin antibiótico: diverticulitis no complicada sin factores de riesgo.", "Amoxicilina-clavulánico 1 g/8 h IV: apendicitis no complicada o gangrenosa sin factores de riesgo; diverticulitis no complicada con factores de riesgo.", "Cefotaxima 2 g/6–8 h + metronidazol 500 mg/8 h IV: apendicitis gangrenosa con factores de riesgo, perforada o peritonitis apendicular; colecistitis aguda; diverticulitis complicada; úlcus perforado <12 h.", "Úlcus perforado ≥12 h: cefotaxima + metronidazol + fluconazol 400 mg/24 h IV.", "Si hay factores de riesgo de BLEE: ertapenem 1 g/24 h.", "Alergia a penicilina: aztreonam 1 g/8 h + metronidazol 500 mg/8 h (si no hay aztreonam: tigeciclina 100 mg de carga y después 50 mg/12 h).", "Diverticulitis ambulatoria: ciprofloxacino 500 mg/12 h + metronidazol 500 mg/8 h VO."]}, {"type": "h", "text": "Pancreatitis necrótica infectada (o no necrótica que necesita ATB)"}, {"type": "list", "items": ["Piperacilina-tazobactam 4 g/6 h IV. Alergia: tigeciclina 200 mg de carga y después 100 mg/12 h + aztreonam 2 g/8 h."]}, {"type": "h", "text": "IIA comunitaria · INESTABLE"}, {"type": "list", "items": ["Meropenem 2 g de carga y después 1–2 g/8 h en perfusión de 3 h (o imipenem 500 mg/6 h). Alergia: tigeciclina (dosis alta) + aztreonam 2 g/8 h."]}, {"type": "h", "text": "IIA nosocomial o posquirúrgica"}, {"type": "list", "items": ["Estable: piperacilina-tazobactam 4 g/6 h. Si hay BLEE: meropenem 2 g de carga y después 1 g/8 h en 3 h. Alergia: tigeciclina + aztreonam.", "Inestable: meropenem 2 g/8 h en 3 h + linezolid 600 mg/12 h + anidulafungina 200 mg de carga y después 100 mg/24 h. Alergia: tigeciclina (dosis alta) + aztreonam + anidulafungina."]}, {"type": "h", "text": "Coberturas añadidas"}, {"type": "list", "items": ["Antifúngico si la peritonitis es grave con perforación GI, shock, inmunosupresión o presión antibiótica previa.", "Fluconazol 400 mg/24 h en la comunitaria estable. Anidulafungina si hay shock, *Candida* resistente a azoles, azoles previos, NPT o inmunosupresión.", "E. faecium (betalactámicos previos o colonización): linezolid 600 mg/12 h, vancomicina 15–20 mg/kg/12 h o teicoplanina 400 mg/12 h el 1er día y después /24 h. Reajustar a las 48 h.", "Tigeciclina: dosis alta (200 mg de carga y después 100 mg/12 h) si IMC >25 o shock."]}, {"type": "h", "text": "Duración tras controlar el foco"}, {"type": "list", "items": ["Leve o no complicada: 3 días · complicada o grave: 5–7 días.", "Posoperatorio: apendicitis no complicada o colecistitis no complicada ≤24 h · apendicitis perforada o colecistitis perforada 24–48 h · peritonitis apendicular 72 h · diverticulitis no fecaloidea 48 h · isquemia mecánica ≤24 h · perforación GI ≤72 h."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Ensayo STOP-IT (NEJM 2015): con el foco controlado, 4 días fijos de antibiótico son tan eficaces como esperar a que se resuelva la fiebre o la leucocitosis. Lo respaldan SIS 2017 y WSES 2021. Coincide con el protocolo.", "Diverticulitis no complicada sin antibiótico (ensayos AVOD y DIABOLO; guías ESCP 2020, ASCRS 2020, AGA 2021, WSES 2020): de elección en inmunocompetentes estables. Coincide con el protocolo.", "Apendicitis no complicada: el tratamiento solo con antibiótico (ensayos CODA y APPAC) es una alternativa a la cirugía (WSES 2020), con ~30–40% de recurrencia a 5 años. No está en el protocolo.", "Pancreatitis: el ATB profiláctico no está indicado en la necrosis estéril (ACG 2024, IAP/APA). Solo si se confirma o se sospecha mucho la infección.", "Ceftriaxona 2 g/24 h es equivalente a cefotaxima en la mayoría de guías (IDSA/SIS) y se administra una vez al día."]}]}], "sources": "Sawyer RG et al. STOP-IT (N Engl J Med 2015); Mazuski JE et al. SIS guidelines (Surg Infect 2017); Sartelli M et al. WSES/GAIS/SIS-E guidelines (World J Emerg Surg 2021); Peery AF et al. AGA diverticulitis update (Gastroenterology 2021); Tenner S et al. ACG pancreatitis guideline (Am J Gastroenterol 2024).", "cats": ["dig", "infec"], "vital": false}, {"title": "Infección por Clostridioides difficile (ICD)", "page": 78, "protocol": "PROTOCOL DE DIAGNÒSTIC I TRACTAMENT DE LA INFECCIÓ PER C. DIFFICILE", "service": "PROA", "date": "v1.0, jun 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["≥3 deposiciones Bristol 6–7 al día de causa no aclarada. Riesgo: antibióticos, contacto sanitario, ≥65 años, IBP.", "Grave (cualquiera): Tª >37,8 °C, leucocitos >15.000 o creatinina >50% de la basal (>1,5 si no hay basal). Sugiere gravedad: dilatación colónica o engrosamiento de la pared.", "Fulminante: hipoTA, shock, lactato alto, íleo, megacolon tóxico, perforación.", "Recurrencia: nuevo episodio <8 semanas tras haber respondido al tratamiento. Refractaria: sin respuesta en 3–5 días."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Otras causas de diarrea si la evolución es atípica (larga duración, intermitente, estreñimiento previo, colon irritable postinfeccioso). Brote de EII.", "No pedir el test sin diarrea, ni para control durante o después del tratamiento."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Test escalonado: GDH + toxinas A/B → PCR de la toxina B.", "Positivo: GDH+ y toxina+. Negativo: GDH− y toxina−, o GDH+ / toxina− / PCR−. Probable (GDH+ / toxina− / PCR+): puede ser colonización → interconsulta a Infecciosas.", "Si ingresa: hemograma, función renal, lactato. Rx de abdomen (o TC si se sospecha fulminante).", "Criterios de ingreso: ICD grave o fulminante, sepsis, inmunodepresión, intolerancia oral. Si es fulminante → valorar UCI."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Medidas generales"}, {"type": "list", "items": ["Retirar los antibióticos innecesarios. Hidratación y electrolitos. No usar antiperistálticos. Retirar el IBP si no está indicado. Precauciones de contacto."]}, {"type": "h", "text": "Primer episodio (no fulminante)"}, {"type": "list", "items": ["FIDAXOMICINA 200 mg/12 h VO × 10 días o VANCOMICINA 125 mg/6 h VO × 10 días.", "Sin vía oral: enemas de vancomicina 500 mg/6 h en 100 mL de SF + valorar metronidazol 500 mg/8 h IV o tigeciclina 100 mg y después 50 mg/12 h IV. Interconsulta a Infecciosas.", "EII: fidaxomicina 10 días (mantener los inmunosupresores salvo si es fulminante). Embarazo: vancomicina VO (no usar presentaciones IV que lleven PEG 400 o NADA)."]}, {"type": "h", "text": "Fulminante"}, {"type": "list", "items": ["Interconsulta a Cirugía General + Infecciosas.", "Vancomicina 500 mg/6 h VO o por SNG (las primeras 72 h).", "Si hay íleo: + enemas de vancomicina 500 mg/6 h + metronidazol 500 mg/8 h IV (o tigeciclina)."]}, {"type": "h", "text": "Recurrencia"}, {"type": "list", "items": ["Vancomicina en pauta descendente: 125 mg/6 h × 2 semanas → /12 h × 1 semana → /24 h × 1 semana → /48 h × 1 semana → /72 h × 1 semana.", "O fidaxomicina en pauta extendida: 200 mg/12 h los días 1–5, y 200 mg/48 h del día 7 al 25.", "O vancomicina 14 días + bezlotoxumab 10 mg/kg IV (interconsulta a Infecciosas).", "± S. boulardii 500 mg/12 h × 28 días. Contraindicado en inmunodeprimidos, críticos o portadores de catéter central o midline."]}, {"type": "h", "text": "Refractaria (>72 h sin respuesta)"}, {"type": "list", "items": ["Descartar otras causas → interconsulta a Infecciosas. Si empeora o evoluciona a fulminante → Cirugía + Infecciosas, y añadir tigeciclina o metronidazol IV."]}, {"type": "h", "text": "Prevención secundaria"}, {"type": "list", "items": ["Si necesita antibiótico sistémico en los 3 meses siguientes y es >65 años, tuvo recurrencia o es inmunodeprimido con ICD grave reciente: vancomicina 125 mg/12–24 h VO hasta 5 días después de terminar el antibiótico."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Fidaxomicina de 1ª elección frente a vancomicina en el primer episodio y en las recurrencias (IDSA/SHEA 2021; ESCMID 2021, que la prefiere sobre todo si hay riesgo de recurrencia). El protocolo las equipara.", "Bezlotoxumab: MSD lo retiró del mercado en enero de 2025, así que la opción del protocolo ya no está disponible.", "TMF: de elección a partir de la 2ª recurrencia (IDSA y ESCMID). En EE. UU. hay productos de microbiota aprobados (Rebyota 2022, Vowst 2023). El protocolo dice que el hospital no tiene circuito propio: derivar.", "Metronidazol oral: ya no se recomienda en el adulto salvo si no hay otra opción (IDSA 2017/2021)."]}]}], "sources": "Johnson S et al. IDSA/SHEA 2021 focused update C. difficile (Clin Infect Dis 2021); van Prehn J et al. ESCMID 2021 update on CDI treatment (Clin Microbiol Infect 2021); comunicado MSD retirada de Zinplava (2025).", "cats": ["dig", "infec"], "vital": false}, {"title": "Infecciones de transmisión sexual (ITS) y estudio de contactos", "page": 79, "protocol": "ITS", "service": "Guia actuació a Urgències (may 2023) + Ruta assistencial ITS i contactes", "date": "ene 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Anamnesis: género, HSH o HSM, ITS previas, vacunas de VHA, VHB y mpox, número de parejas en el último año y en los últimos 3 meses, última relación, preservativo, *chemsex*, PrEP.", "Uretritis (≥1 de 3): exudado uretral; sedimento >10 leucocitos/campo; tira de orina positiva para leucocitos en la orina del primer chorro (≥1,5 h sin orinar).", "Proctitis: exudado mucopurulento, tenesmo, rectorragia, dolor anorrectal (gonococo, *Chlamydia*/LGV, VHS, sífilis, mpox).", "Úlcera genital: herpes (dolorosa, múltiple), sífilis (chancro indoloro), LGV, mpox, chancroide.", "Sífilis secundaria: exantema palmoplantar. Síndrome mononucleósico con exantema: VIH agudo, sífilis, VEB, CMV.", "Vulvovaginitis: – Candida: pH <4,5, KOH positivo. – Vaginosis: pH >4,5, *clue cells*, olor a pescado. – Tricomonas."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Coinfección (VIH, sífilis, VHB, VHC). Orquiepididimitis (ver ITU), EPI.", "Abuso sexual (circuito específico en menores y adultos).", "Proctitis no ITS (EII, infecciosa): sin tratamiento empírico si no hay sospecha epidemiológica."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Uretritis: tira y sedimento de la orina del primer chorro. PCR de ITS (*C. trachomatis*, gonococo, *M. genitalium*, *Ureaplasma*, *Trichomonas*) en el exudado o la orina. Cultivo del exudado (antibiograma del gonococo), si lo hay.", "Proctitis: PCR de ITS rectal (+ genotipo de LGV si *Chlamydia* es positiva), PCR de VHS, PCR de *T. pallidum*, PCR de mpox si es compatible, cultivo rectal.", "Úlcera: PCR de la úlcera (VHS-1 y 2, VVZ, *T. pallidum*, LGV, *H. ducreyi*, mpox). La serología de sífilis puede ser negativa la primera semana del chancro. Biopsia si hay dudas.", "Serologías a todos: VIH (Ag/Ac p24), *T. pallidum* (con RPR y TPHA si es positiva), VHC, HBsAg y anti-HBs (anti-HBc), VHA si hay prácticas oroanales.", "Cribado de gonococo y *Chlamydia* faríngeo y rectal** según las práctica", "Vaginitis: pH, microscopía o Gram y KOH, PCR vaginal (tapón rojo), cultivo."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Uretritis (empírico en urgencias)"}, {"type": "list", "items": ["Ceftriaxona IM (500 mg según la guía de urgencias de 2023; 1 g según la ruta de 2024) + doxiciclina 100 mg/12 h × 7 días.", "Alternativas: – IM contraindicada: cefixima 400 mg v.o. + azitromicina 2 g. – Alergia a betalactámicos: gentamicina 240 mg IM + azitromicina 2 g v.o. (1 g según la guía de urgencias).", "Sin relaciones sexuales 7 días."]}, {"type": "h", "text": "Proctitis con sospecha de ITS"}, {"type": "list", "items": ["Ceftriaxona 1 g IM + doxiciclina 100 mg/12 h × 7 días → 3 semanas si se confirma LGV."]}, {"type": "h", "text": "Sífilis"}, {"type": "list", "items": ["Primaria, secundaria o latente precoz (<1 año): penicilina G benzatina 2,4 MUI IM en dosis única. – Alergia: doxiciclina 100 mg/12 h × 14 días (contraindicada en el embarazo y la lactancia). – Avisar de la reacción de Jarisch-Herxheimer (en la secundaria, valorar prednisona 20–60 mg/día × 3 días). – Sin relaciones 15 días.", "Latente tardía o de duración desconocida: penicilina G benzatina 2,4 MUI IM semanal × 3 semanas. Alergia: doxiciclina × 28 días."]}, {"type": "h", "text": "Herpes genital"}, {"type": "list", "items": ["Valaciclovir 1 g/12 h en la primoinfección o el inmunodeprimido (7–10 días). 500 mg/12 h (3–5 días) en la recurrencia.", "Alternativa: aciclovir 400 mg/8 h × 5–10 días."]}, {"type": "h", "text": "Otros"}, {"type": "list", "items": ["LGV: doxiciclina 100 mg/12 h × 3 semanas.", "Vulvovaginitis: – Candida: fluconazol 150 mg v.o. en dosis única + tópico. – Vaginosis o tricomonas: metronidazol 500 mg/12 h × 7 días.", "Condilomas: imiquimod 5 % (3 noches por semana, ≤12 semanas), podofilotoxina 0,15 % (cada 12 h × 3 días + 4 de descanso, ≤4 semanas) o crioterapia.", "Escabiosis: permetrina 5 %, 2 aplicaciones separadas 8–10 días, o ivermectina 200 µg/kg v.o. en 2 dosis separadas 8 días. Tratar a los convivientes.", "Pediculosis pubis: rasurado + permetrina 1 %. Molusco: curetaje o crioterapia."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Cita a los 7 días (DER19 telefónica o UITS de referencia), acompañado de los contactos: – Resultados, declaración obligatoria (gonococo, *Chlamydia*, LGV, sífilis, VIH, VHB, VHC; a la ASPB). – Cribado del resto de ITS, vacunas de VHA y VHB (y mpox) y educación sexual.", "Estudio de contactos (parejas de los periodos previos): – 2 meses: *Chlamydia*, LGV, gonococo, tricomonas. – Sífilis: 3 meses (primaria), 6 meses (secundaria), 12 meses (latente precoz). – 6 meses: VHB y VHC. – VIH: desde la última prueba negativa.", "Derivación preferente (<48 h) a la UITS de referencia si no se resuelve, hay recidiva o es inmunodeprimido. VIH nuevo: Hospital de Día de Infecciosas (93 248 32 51). Valorar PrEP.", "Cribado semestral en la población de riesgo."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Gonococo: ceftriaxona 1 g IM en Europa (IUSTI 2020; ECDC 2024) y 500 mg IM en EE. UU. (CDC 2021; 1 g si pesa ≥150 kg). Sin azitromicina asociada si se ha descartado *Chlamydia* o se cubre con doxiciclina. Test de curación a las 2 semanas en la faríngea.", "Doxi-PEP (doxiciclina 200 mg en las 72 h siguientes a una relación sin preservativo): reduce la sífilis y la *Chlamydia* en HSH y mujeres trans (CDC 2024). Las guías europeas son más restrictivas por las resistencias.", "Vacuna 4CMenB (Bexsero®) frente al gonococo: recomendada en el Reino Unido (JCVI, 2023–2025) en HSH de alto riesgo.", "*M. genitalium doxiciclina 7 días y luego moxifloxacino 400 mg × 7 días** (tratamiento guiado por resistencias; IUSTI 2021).", "Sífilis latente tardía con alergia: la doxiciclina es de segunda línea. Desensibilizar en el embarazo. Existen dudas sobre la eficacia de la benzatina de importación (desabastecimiento 2023–2024)."]}]}], "sources": "Unemo M et al. 2020 European guideline (IUSTI) for gonorrhoea; Workowski KA et al. CDC STI Treatment Guidelines (MMWR 2021); CDC Doxy-PEP guidelines (MMWR 2024); Jensen JS et al. 2021 European guideline on Mycoplasma genitalium.", "cats": ["infec", "gineuro"], "vital": false}, {"title": "Infecciones del SNC: tratamiento antibiótico empírico (meningitis, encefalitis, absceso, neuroquirúrgicas)", "page": 81, "protocol": "Guía de Terapéutica Antimicrobiana", "service": "Infecciones del SNC, Comissió d'Infeccions", "date": "rev. ago 2017", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Meningitis purulenta: PMN, glucosa baja, proteínas altas, láctico en LCR ≥5 mmol/L.", "Líquido claro (linfocitario): – Glucosa normal + láctico >5 + ADA normal → *Listeria*. – Glucosa baja + láctico >5 + ADA alta o pendiente → TBC (o *Listeria*). – Glucosa normal + láctico <5 → vírica.", "Meningoencefalitis: fiebre + alteración de la conducta o la conciencia, crisis, focalidad → VHS, enterovirus, *Listeria*.", "Absceso cerebral: neumococo, *Streptococcus* spp., anaerobios.", "Neuroquirúrgico: derivación ventricular, meningitis posquirúrgica, empiema, herida quirúrgica → estafilococos (incluido SARM), BGN, *Pseudomonas*, enterococo, *C. acnes*."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Ver la ficha de meningitis bacteriana (TC antes de la PL solo con criterios).", "En el posoperatorio: colecciones (TC urgente)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["LCR: Gram, cultivo, bioquímica, lactato, ADA. Guardar LCR para pruebas específicas.", "Siempre LCR para cultivo y Gram antes del ATB en el posoperado.", "Niveles de vancomicina a las 24 h. Niveles de linezolid cada 48 h."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Meningitis purulenta"}, {"type": "list", "items": ["<50 años sano: cefotaxima 50 mg/kg/4 h (máximo 24 g/día). Alergia: meropenem 2 g/8 h.", "≥50 años o alcohólico: cefotaxima + ampicilina 2 g/4 h. Alergia: meropenem 2 g/8 h + cotrimoxazol 20 mg/kg/día cada 6 h (de TMP).", "Inmunodeprimido: meropenem 2 g/8 h + ampicilina 2 g/4 h.", "Medidas añadidas: – Dexametasona (8 mg/6 h en esta guía; 10–12 mg en la de meningitis de 2024) 10–15 min antes del ATB o a la vez, 2–4 días. – Levetiracetam 1.000 mg de carga + 500 mg/12 h.", "Sin vancomicina empírica (resistencia del neumococo baja)."]}, {"type": "h", "text": "Líquido claro"}, {"type": "list", "items": ["*Listeria ampicilina 2 g/4 h** (alergia: cotrimoxazol).", "Sospecha de TBC: ampicilina + tuberculostáticos + dexametasona 0,3 mg/kg/24 h.", "Vírica: sin tratamiento, salvo aciclovir 10 mg/kg/8 h si es por herpesvirus."]}, {"type": "h", "text": "Meningoencefalitis"}, {"type": "list", "items": ["Aciclovir 10 mg/kg/8 h IV + ampicilina 2 g/4 h hasta descartar *Listeria* (alergia: cotrimoxazol).", "Sin corticoides."]}, {"type": "h", "text": "Absceso cerebral"}, {"type": "list", "items": ["Cefotaxima 50 mg/kg/4 h + metronidazol 500 mg/6 h. Meropenem 2 g/8 h en monoterapia si hay alergia o se sospecha *Pseudomonas*.", "Levetiracetam. Dexametasona si hay edema. Neurocirugía."]}, {"type": "h", "text": "Paciente neuroquirúrgico"}, {"type": "list", "items": ["Derivación ventricular externa o meningitis posquirúrgica: – Vancomicina 1 g/8 h (niveles valle 20–25 µg/mL; linezolid si la CMI es ≥1,5) + ceftazidima o meropenem 2 g/8 h. – Valorar el recambio del dispositivo o ATB intratecal (Neurocirugía).", "Empiema posquirúrgico o traumático: linezolid 600 mg/12 h (cada 8 h si pesa >55 kg) + meropenem 2 g/8 h. Drenaje urgente (Neurocirugía).", "Herida sin afectación del órgano: vancomicina 1 g/8 h + ceftazidima 2 g/8 h (alergia: vancomicina + aztreonam)."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Ingreso siempre. UCI o semicríticos según el nivel de conciencia. Neurocirugía en el absceso, el empiema y las infecciones de dispositivos."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Guía de 2017, anterior al protocolo de meningitis de 2024. En el adulto inmunocompetente es preferible la ficha de meningitis bacteriana (2024): cefotaxima 300 mg/kg/día, dexametasona 12 mg y luego 4 mg/6 h, y lacosamida o levetiracetam según el caso.", "Vancomicina (ASHP/IDSA 2020): dosificación por AUC/CMI 400–600 en lugar de valles de 15–20. Los valles de 20–25 se asocian a nefrotoxicidad.", "Meningitis o ventriculitis asociada a dispositivos (IDSA 2017): vancomicina + cefepima, ceftazidima o meropenem. Retirar el dispositivo infectado.", "Encefalitis herpética: aciclovir 14–21 días. Repetir la PCR de VHS si el resultado inicial es negativo y la sospecha es alta (a las 24–72 h).", "Absceso cerebral (ESCMID 2024): cefotaxima o ceftriaxona a dosis altas + metronidazol. Pasar a vía oral tras 2 semanas IV en casos seleccionados."]}]}], "sources": "Tunkel AR et al. IDSA Guidelines for Healthcare-Associated Ventriculitis and Meningitis (CID 2017); Rybak MJ et al. Vancomycin therapeutic monitoring ASHP/IDSA consensus (2020); Bodilsen J et al. ESCMID guideline on brain abscess (Clin Microbiol Infect 2024).", "cats": ["neuro", "infec"], "vital": true}, {"title": "Infecciones en el paciente con cirrosis (incluida la PBE)", "page": 83, "protocol": "TRACTAMENT DE LES INFECCIONS EN EL PACIENT AMB CIRROSI HEPÀTICA", "service": "Digestivo, Urgencias", "date": "rev. may 2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Buscar una infección en todo cirrótico con fiebre, clínica infecciosa, encefalopatía, ascitis, IRA o HDA. Los signos pueden ser sutiles.", "Focos: urinario 38 %, bacteriemia 20 %, respiratorio 13 %, PBE 12 %, piel 6 %, diarrea 6 %.", "Mayor riesgo: cirrosis descompensada, HDA por hipertensión portal, proteínas en el líquido ascítico <1,5 g/dL, PBE previa.", "Nosocomial: ingreso reciente, o descompensado con visitas frecuentes al hospital de día. Multirresistentes ≈ 1/3."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Inestabilidad hemodinámica o encefalopatía III–IV → avisar al busca de Digestivo enseguida (¿UCI?).", "Revisar los cultivos previos por si hay multirresistentes (BLEE, SARM, ERV)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Analítica: función renal, hemograma, perfil hepático, gasometría venosa, coagulación.", "Hemocultivos SIEMPRE antes del ATB, aunque esté afebril y la clínica sea sutil.", "Sedimento de orina a todos. Urocultivo si hay bacteriuria, aunque no haya leucocituria. Pedir un Gram urgente (cocos grampositivos).", "Rx de tórax si hay clínica respiratoria. **Antígenos de neumococo y *Legionella*** en orina si hay neumonía.", "Paracentesis diagnóstica precoz a TODO paciente con ascitis, sea cual sea el TP o las plaquetas (salvo plaquetas <10.000).", "PBE: ≥250 PMN/mm³ en el líquido ascítico. Bacteriemia espontánea: hemocultivo positivo sin foco."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Leve o grave"}, {"type": "list", "items": ["Leve (afebril, función renal habitual, sin descompensación, controlado) → ATB oral y valorar el alta.", "Grave (todo lo demás, y siempre la PBE) → ATB IV e ingreso.", "Contactar siempre con el busca de Digestivo (25414), también si se va de alta."]}, {"type": "h", "text": "ATB empírico según foco (comunitaria / nosocomial)"}, {"type": "list", "items": ["Urinaria, comunitaria: cistitis → fosfomicina v.o.; no complicada → cefixima o cefuroxima v.o.; alergia → ciprofloxacino o cotrimoxazol v.o.; grave → ceftriaxona IV.", "Urinaria, nosocomial: piperacilina-tazobactam IV. Alergia: ciprofloxacino + teicoplanina. Cocos grampositivos en el Gram: piperacilina-tazobactam o meropenem + teicoplanina.", "Respiratoria, comunitaria: leve → amoxicilina-clavulánico o levofloxacino v.o. (alergia: levofloxacino); neumococo grave → ceftriaxona + azitromicina IV; atípica grave → levofloxacino IV.", "Respiratoria, nosocomial: meropenem ± teicoplanina IV. Alergia: ciprofloxacino + teicoplanina.", "Piel, comunitaria: leve → amoxicilina-clavulánico v.o. (alergia: ciprofloxacino + clindamicina v.o.); grave → amoxicilina- clavulánico IV.", "Piel, nosocomial: meropenem ± teicoplanina. Alergia: tigeciclina ± ciprofloxacino.", "PBE o bacteriemia espontánea, comunitaria: ceftriaxona IV o amoxicilina-clavulánico IV. Alergia: aztreonam.", "PBE o bacteriemia espontánea, nosocomial: meropenem ± teicoplanina IV. Alergia: aztreonam + metronidazol."]}, {"type": "h", "text": "PBE: albúmina"}, {"type": "list", "items": ["Albúmina 1,5 g/kg el día 1 (60 kg → 90 g: 9 viales de 10 g, cada uno en 20–30 min). Según las guías, 1 g/kg el día 3."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["El protocolo solo menciona la dosis de albúmina del día 1. EASL 2018, AASLD 2021 y Baveno VII: 1,5 g/kg el día 1 y 1 g/kg el día 3 (reduce el síndrome hepatorrenal y la mortalidad). Máximo beneficio si la creatinina es >1 mg/dL o la bilirrubina >4 mg/dL.", "Paracentesis de control a las 48 h: si los PMN no bajan ≥25 %, sospechar resistencia o peritonitis secundaria y ampliar el espectro.", "Profilaxis tras la PBE: norfloxacino 400 mg/24 h (o ciprofloxacino 500 mg/24 h, o cotrimoxazol) de forma indefinida.", "Profilaxis en la HDA del cirrótico: ceftriaxona 1 g/24 h × ≤7 días.", "ATB empírico en la PBE nosocomial: debe cubrir BLEE y grampositivos según la epidemiología local (meropenem ± glucopéptido o daptomicina; EASL 2018). Coincide con el protocolo.", "Albúmina en infecciones distintas de la PBE: no indicada (ensayos INFECIR-2 y ATTIRE).", "Tigeciclina: la FDA advierte de un aumento de mortalidad (2010/2013). Reservarla."]}]}], "sources": "EASL Clinical Practice Guidelines for decompensated cirrhosis (J Hepatol 2018); Biggins SW et al. AASLD Guidance on ascites, SBP and HRS (Hepatology 2021); de Franchis R et al. Baveno VII (J Hepatol 2022); China L et al. ATTIRE trial (NEJM 2021).", "cats": ["dig", "infec"], "vital": false}, {"title": "Infecciones osteoarticulares (artritis séptica, fracturas abiertas, prótesis) y profilaxis quirúrgica", "page": 84, "protocol": "Tratamiento antibiótico y profilaxis de las infecciones osteoarticulares", "service": "COT, Infecciosas, Microbiología y Farmacia, PROA", "date": "nov 2018", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Artritis séptica: monoartritis aguda, caliente, con dolor a la movilización y fiebre. – Sin antecedentes: *S. aureus*, estreptococos. – Joven con actividad sexual: gonococo (poliartralgias, tenosinovitis, pústulas). – ADVP: *S. aureus* (incluido SARM), *Pseudomonas*. – Inmunodeprimido: BGN.", "Infección de prótesis o de material de osteosíntesis: dolor, fístula, aflojamiento, fiebre. Precoz o tardía.", "Fractura abierta: grados I–III de Gustilo."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Microcristalina (gota o condrocalcinosis), que puede coexistir.", "Bacteriemia o endocarditis (ADVP, *S. aureus*)."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["Artrocentesis antes del ATB: células (>50.000 leucocitos con PMN sugiere infección), Gram, cultivo, cristales. Inocular en frascos de hemocultivo.", "2 hemocultivos, PCR o VSG, función renal. Rx.", "Gonococo: PCR o cultivo uretral, cervical, rectal y faríngeo.", "Prótesis: cultivos intraoperatorios (sin ATB empírico previo si el paciente está estable)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Profilaxis quirúrgica"}, {"type": "list", "items": ["Indicaciones: artroplastia, osteosíntesis, plastias, raquis instrumentado, fijadores.", "Pauta: cefazolina 2 g IV 30 min antes + 1 g/8 h × 24 h.", "Alergia: teicoplanina 800 mg IV + gentamicina 240 mg IV.", "Raquis con desgarro dural: añadir cefotaxima 2 g intraoperatoria y mantener 24 h (alergia: aztreonam 2 g/8 h × 24 h)."]}, {"type": "h", "text": "Fractura abierta (grados I–III)"}, {"type": "list", "items": ["Amoxicilina-clavulánico 2 g/8 h IV × 1 día.", "Alergia: clindamicina 600 mg/6 h + gentamicina 240 mg/24 h × 1 día."]}, {"type": "h", "text": "Artritis séptica (empírico)"}, {"type": "list", "items": ["Sin antecedentes: ceftriaxona 2 g/24 h + cloxacilina 2 g/4 h IV. Alergia: vancomicina (o daptomicina o linezolid) + ciprofloxacino.", "Postraumática o por inoculación: amoxicilina-clavulánico 2 g/8 h. Alergia: clindamicina + ciprofloxacino.", "Gonocócica: ceftriaxona 1 g/24 h → cefixima 200 mg/12 h o quinolona según el antibiograma. 1 semana desde el drenaje.", "Inmunodeprimido: meropenem 2 g/8 h + vancomicina (o daptomicina 10 mg/kg/día si hay IR).", "ADVP: cloxacilina + vancomicina (o daptomicina).", "Drenaje articular (artrocentesis repetidas o artroscopia o artrotomía) en todos.", "Duración desde el desbridamiento: estreptococos 2 semanas; estafilococos o BGN 4 semanas."]}, {"type": "h", "text": "Infección protésica o de osteosíntesis (empírico hasta los cultivos)"}, {"type": "list", "items": ["DAIR o recambio en 2 tiempos: vancomicina + ceftazidima (alergia: vancomicina + aztreonam).", "Recambio en 1 tiempo: meropenem + linezolid (alergia: linezolid + aztreonam)."]}, {"type": "h", "text": "Dirigido"}, {"type": "list", "items": ["SASM: cloxacilina 7–10 días + rifampicina (cuando la herida ya no drene) → levofloxacino 750 mg/24 h + rifampicina 600 mg/24 h.", "SARM: vancomicina + rifampicina → según el antibiograma + rifampicina.", "Estreptococo: penicilina o ceftriaxona 8–10 días → amoxicilina + rifampicina.", "*E. faecalis ampicilina + ceftriaxona + rifampicina** → amoxicilina + rifampicina.", "*E. faecium*:** vancomicina o linezolid + rifampicin", "Enterobacterias o *Pseudomonas* sensibles a quinolona ceftazidima + ciprofloxacino IV → ciprofloxacino 750 mg/12 h v.o.** Si son resistentes: con Infecciosas.", "Microorganismo desconocido: levofloxacino + rifampicina."]}, {"type": "h", "text": "Dosis de referencia"}, {"type": "list", "items": ["Cloxacilina 2 g/4 h; ceftriaxona 2 g/24 h; ceftazidima, meropenem o aztreonam 2 g/8 h.", "Vancomicina 1 g/8 h el primer día y luego por niveles; daptomicina 10 mg/kg/día; linezolid 600 mg/12 h (con niveles si se combina con rifampicina).", "Clindamicina 600 mg/8 h IV o 450 mg/6 h v.o.; ciprofloxacino 400 mg/12 h IV o 750 mg/12 h v.o.; rifampicina 600 mg/24 h."]}]}, {"key": "destino", "label": "INGRESO / ALTA / DESTINO", "blocks": [{"type": "list", "items": ["Ingreso con COT (drenaje o cirugía) e Infecciosas."]}]}, {"key": "actualizacion", "label": "▲ ACTUALIZACIÓN Y DIFERENCIAS CON GUÍAS", "blocks": [{"type": "list", "items": ["Fractura abierta (EAST 2022, guía BOA/BAPRAS 2020):", "Grados I y II: cefazolina 2 g (3 g si pesa ≥120 kg) en <1 h. Añadir cobertura de gramnegativos solo en el grado III.", "Duración: 24 h tras el cierre en I y II, y 72 h o hasta 24 h tras el cierre en el III.", "El protocolo usa amoxicilina-clavulánico 1 día en todos los grados.", "OVIVA (NEJM 2019): el paso precoz a vía oral (a partir del día 7) no es inferior.", "DATIPO (NEJM 2021): en la infección protésica, 12 semanas de tratamiento son mejores que 6.", "Artritis séptica nativa: 2 semanas de ATB tras el drenaje, si se drena bien, son suficientes (ensayo de Gjika, Ann Rheum Dis 2019)."]}]}], "sources": "Li HK et al. OVIVA (NEJM 2019); Bernard L et al. DATIPO (NEJM 2021); Gjika E et al. 2 vs 4 weeks septic arthritis (Ann Rheum Dis 2019); EAST Practice Management Guideline: Open fractures antibiotic prophylaxis (2022).", "cats": ["infec"], "vital": false}, {"title": "Insuficiencia cardiaca aguda (ICA) y edema agudo de pulmón", "page": 86, "protocol": "PROTOCOLO INSUFICIENCIA CARDIACA AGUDA EN URGENCIAS", "service": "Urgencias y Cardiología", "date": "v. 10/01/2024", "sections": [{"key": "sospechar", "label": "SOSPECHAR", "blocks": [{"type": "list", "items": ["Disnea, ortopnea, DPN, edemas bilaterales, confusión en el anciano, aumento de peso.", "Signos: crepitantes, sibilancias, 3.er ruido, IY >4 cm, reflujo hepatoyugular, ascitis.", "Hipoperfusión: frialdad, relleno capilar >2 s, oliguria, cianosis.", "Escenarios: – 1. ICA descompensada (gradual, días): la más frecuente. – 2. IC derecha aislada. – 3. EAP: brusco, SatO₂ <90 % y FR >25. – 4. Shock cardiogénico: hipoperfusión, lactato, IRA, TA baja o pinzada."]}]}, {"key": "descartar", "label": "DESCARTAR", "blocks": [{"type": "list", "items": ["Precipitantes: infección, FA rápida, anemia, HTA mal controlada, incumplimiento de dieta o fármacos, SCA, TEP, miocarditis, valvulopatía aguda (rotura de cuerdas), fármacos (AINE, calcioantagonistas no DHP, glitazonas, antraciclinas), hipotiroidismo, IR, embarazo, taponamiento.", "IC derecha aislada: infarto de VD o TEP.", "Shock: IAM, complicación mecánica, taponamiento → Cardiología emergente."]}]}, {"key": "pedir", "label": "PEDIR", "blocks": [{"type": "list", "items": ["ECG (si es estrictamente normal, la IC es casi imposible; VPN 98 %), pulsioximetría o gasometría arterial.", "Analítica: creatinina, urea, iones en sangre y orina, troponina US, hemograma, coagulación, NT-proBNP.", "Según el caso: lactato (shock), perfil hepático (congestión), dímero D (TEP), TSH (arritmias o IC de novo), PCT (infección).", "NT-proBNP: <300 pg/mL → IC poco probable. Muy probable si >450 (<50 años), >900 (50–75 años) o >1.800 (>75 años).", "Rx de tórax (si es normal no descarta la IC). Ecografía pulmonar: ≥3 líneas B en ≥2 zonas de cada hemitórax (S 94–97 %, E 96–97 %). Ecocardiograma.", "Recoger: TA, FC, FR, SatO₂, peso, diuresis. Sonda vesical si hay hipotensión, shock o anuria >1 h pese al diurético.", "Iones en orina a las 2–6 h del diurético (respuesta natriurética)."]}]}, {"key": "tratamiento", "label": "TRATAMIENTO", "blocks": [{"type": "h", "text": "Oxígeno y VMNI"}, {"type": "list", "items": ["Sentado a 45°. Ventimask al 50 % (12 L/min) o reservorio a 15 L si SatO₂ <90 %.", "VMNI (BiPAP) si FR >25 con tiraje y SatO₂ <90 %, o PaO₂/FiO₂ <250. – Hipoxémico: EPAP 8–10, IPAP 0–4 por encima de la EPAP (p. ej., 12/10). – Hipercápnico: EPAP 6–10, IPAP 6–10 por encima (p. ej., 14/8 o 16/6), con Vt de 6 mL/kg.", "Objetivo de SatO₂: 92–96 % (88–92 % si hay hipercapnia).", "Contraindicaciones: GCS <13, shock o TAS <90, disfunción grave del VD, arritmias ventriculares, vómitos, neumotórax.", "Retirar si SatO₂ >94 %, FR <24–25, FC <100 y diuresis de 600–900 mL en 6 h."]}, {"type": "h", "text": "Diuréticos (congestión)"}, {"type": "list", "items": ["Furosemida IV. Valorar la respuesta a las 2–6 h. – Sin diurético previo: 20–40 mg en bolo, luego 20–40 mg/6–8 h. – Con diurético en casa: 1–2 veces la dosis oral diaria en bolo IV. Mantenimiento: el doble de la dosis diaria repartida cada 6–8 h.", "Respuesta
